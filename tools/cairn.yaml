id: cairn
name: Cairn
type: agentic-offensive-framework
github_url: https://github.com/oritera/Cairn
project_url: null
description: Open-source AI harness that loops coding agents (Claude Code, DeepSeek) toward intrusion goals such as unauthenticated RCE and uploader shells. Panels ship with no authentication and bind to 0.0.0.0:8000, exposing task text, tooling, and secrets. Observed achieving roughly 10% success rate with ~23 hours to goal against e-commerce and payment sites. On 16 November 2026 GTIG reported Cairn used in intrusion activity against targets including a US aerospace organization. GTIG did not name a cluster or publish indicators for that observation. On 20 November 2026 Amazon Threat Intelligence reported that a Chinese-nexus operator's exposed Cairn instance let agents find and exploit a MONAI Label path-traversal zero-day against universities in East Asia.
