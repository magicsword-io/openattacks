description: "AI-powered penetration testing framework that leverages language models to automate security testing and vulnerability discovery. Represents the emerging class of agentic offensive security tools. The public repository https://github.com/vxcontrol/pentagi returned HTTP 200 on 16 November 2026. GTIG did not publish a repository URL. On 16 November 2026 GTIG reported a customized orchestration platform built on the open-source version, used from late August to early October 2026 for reconnaissance and vulnerability scanning against organizations in Asia. On 24 November 2026 the UK NCSC named PentAGI among the agentic offensive frameworks in a rise in AI-assisted attacks it has seen across sectors since September 2026, and said that activity has become synonymous with ARTEX. NCSC says cheap open models or illegal API resellers plus these frameworks give speed and persistence, not new capability. The attacks it describes identify and exploit internet-facing services in quick succession and cause downtime or a foothold. Prevention from that blog: forgotten websites and legacy equipment, over-privileged credentials, flat or interconnected networks, default credentials or missing authentication, weak passwords, and fast account sign-ups. Detection from that blog: bursts of requests followed by short thinking phases, a wide variety of endpoints and parameters including garbage or example values, increased error rates, and agents rotating through proxies and VPNs."
