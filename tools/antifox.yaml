description: "Chinese-language agentic pentest platform forked from ARTEX. It runs multi-agent workflows on TCP 8787 and requires an Anthropic or OpenAI key. Arctic Wolf Labs tied self-hosted consoles on Alibaba Cloud to IIS web-shell activity and AWS secret reads. On 25 November 2026 Shadowserver said AntiFox, forked from ARTEX, was the fastest-growing exposed agentic framework in its scans, from a handful of instances to about 200. Wiz Research the same day said AntiFox, forked from ARTEX v0.1.1, keeps the ARTEX Intent ID and tells the agent to save outputs under an i<id> directory. Those IDs are a harness leak, not an operator name. Shadowserver's honeypot fingerprints named ARTEX Gateway, CyberStrikeAI, Cairn, PentAGI, and RedAmon. AntiFox is an exposure finding in that report, not one of those attacker fingerprints."
