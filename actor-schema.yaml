$schema: https://json-schema.org/draft/2020-12/schema
title: ActorEntry
type: object
required:
  - id
  - name
  - description
  - sources
additionalProperties: false
properties:
  id:
    type: string
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
  name:
    type: string
    minLength: 1
  aliases:
    type: array
    items:
      type: string
  country:
    type:
      - string
      - "null"
  motivation:
    type:
      - string
      - "null"
    enum:
      - nation-state
      - cybercrime
      - financially-motivated
      - hacktivism
      - unknown
      - null
  description:
    type: string
    minLength: 1
  sources:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - url
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
        publisher:
          type: string
  linked_attacks:
    type: array
    items:
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
