id: linux-fileless-execution
title: Linux fileless or anonymous-file execution
hypothesis:
  A Linux process executes from a memfd or /proc file-descriptor path, or stages an executable in a
  transient directory, consistent with fileless payload or miner execution.
telemetry:
  - Linux process creation with executable paths and command lines
  - Audit or EDR telemetry for memfd_create and execve where available
  - Network and persistence activity from the resulting process
investigate:
  - Capture the process memory or recovered executable, parent tree, user, container, and destination.
  - Correlate the execution with downloads, persistence changes, mining traffic, or reverse shells.
limitation:
  Updaters, runtimes, and security tools can legitimately execute anonymous files. Process collectors
  differ in how they represent memfd paths, so absence of a match is not proof of absence.
search:
  - '"memfd_create"'
  - '"/proc/self/fd"'
  - '"fileless" AND "Linux"'
visibility: Linux process and audit telemetry where collected
reviewed: 2026-11-06
origin: catalog_authored
query_kind: native
query_scope:
  Linux process candidates whose image or command line exposes a memfd or procfs descriptor. Tune
  known runtimes and require supporting behavior before alerting.
upstream_matches:
  - name: Potential Fileless Execution via Unusual memfd Create Call
    id: 42663c0e-572e-4459-bf61-476a81d6aab1
    source: Elastic detection-rules
    url: https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_fileless_execution_via_unusual_memfd_create.toml
queries:
  sigma: |
    title: Hunt - Linux Anonymous File Execution
    id: afc1e20b-3eae-46fd-b736-e14b639f3a66
    status: experimental
    description: Detects process paths or command lines associated with memfd and procfs file-descriptor execution.
    author: MagicSword OpenAttacks catalog
    date: 2026-11-06
    references:
      - https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_fileless_execution_via_unusual_memfd_create.toml
    falsepositives:
      - Legitimate runtimes, updaters, and security software using anonymous files
    level: medium
    logsource:
      category: process_creation
      product: linux
    detection:
      selection_image:
        Image|contains:
          - /memfd:
          - /proc/self/fd/
          - /proc/thread-self/fd/
      selection_command:
        CommandLine|contains:
          - memfd:
          - /proc/self/fd/
          - /proc/thread-self/fd/
      condition: 1 of selection_*
  kql: |-
    DeviceProcessEvents
    | where Timestamp > ago(7d)
    | where OSPlatform =~ "Linux"
    | where FolderPath has_any ("/memfd:", "/proc/self/fd/", "/proc/thread-self/fd/")
        or ProcessCommandLine has_any ("memfd:", "/proc/self/fd/", "/proc/thread-self/fd/")
    | project Timestamp, DeviceName, AccountName, FolderPath, FileName, ProcessCommandLine,
        InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1
    | order by Timestamp desc
  spl: |-
    | tstats count min(_time) as firstTime max(_time) as lastTime
      from datamodel=Endpoint.Processes
      where Processes.process IN ("*memfd:*", "*/proc/self/fd/*", "*/proc/thread-self/fd/*")
      by Processes.dest Processes.user Processes.process_name Processes.process
         Processes.parent_process_name Processes.parent_process
    | `drop_dm_object_name(Processes)`
    | sort - lastTime
