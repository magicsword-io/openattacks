id: credentials
title: Sensitive store access → credential use
hypothesis:
  An unexpected process or tool accesses credential stores and is followed by token use or
  outbound transfer inconsistent with the owner.
telemetry:
  - File-read / API access telemetry for relevant secret stores
  - Process identity and command lines
  - Identity, token and outbound-network audit logs
investigate:
  - Identify the actor, process and exact store touched, then pivot to token use from new devices or
    infrastructure.
  - Correlate reads with egress and rotate affected credentials after confirming exposure.
limitation:
  Defender DeviceFileEvents is not a general file-read audit trail. Collect suitable
  object-access, EDR or application logs; legitimate developer tools also read secrets.
search:
  - '"credential" AND "stealer"'
  - '"browser" AND "cookie"'
  - '"SSH" AND "private key"'
visibility: Defender-side logs where collected
reviewed: 2026-10-23
origin: catalog_authored
query_kind: custom_schema
query_scope:
  Custom-schema candidates, not out-of-box detectors. Map your application / cloud /
  platform logs to EventType, Actor, Asset, Action, Target and CorrelationId. KQL uses a custom
  OpenAttacksAudit_CL table; SPL uses openattacks:audit. EventType values are proposed normalization
  names, not native vendor event names. Correlation and environment-specific alert logic remain to
  be built.
queries:
  sigma: |
    title: Hunt - Sensitive store access → credential use
    id: 46c46c62-2d83-4198-a8bf-d6637094527b
    status: experimental
    description: An unexpected process or tool accesses credential stores and is
      followed by token use or outbound transfer inconsistent with the owner.
    author: MagicSword OpenAttacks catalog
    date: 2026-10-23
    references:
      - https://github.com/MHaggis/Security-Detections-MCP
    falsepositives:
      - Authorized activity matching this broad hunt; baseline and investigate
        before alerting.
    level: low
    logsource:
      category: application
      product: openattacks_audit
      definition: Custom normalized audit schema; map EventType, Actor, Asset, Action,
        Target and CorrelationId from the required source logs first.
    detection:
      selection:
        EventType:
          - secret.read
          - credential.store.read
      condition: selection
  kql: >-
    // SCHEMA TEMPLATE: create/map this custom table before use; not a built-in Sentinel table.

    // OpenAttacksAudit_CL: TimeGenerated(datetime),
    EventType/Actor/Asset/Action/Target/CorrelationId(string).

    // Selects candidates only. Apply the stage hypothesis and correlation steps before alerting.

    OpenAttacksAudit_CL

    | where TimeGenerated > ago(7d)

    | where EventType in ("secret.read", "credential.store.read")

    | project TimeGenerated, EventType, Actor, Asset, Action, Target, CorrelationId

    | order by TimeGenerated desc
  spl: |-
    sourcetype="openattacks:audit"
    EventType IN ("secret.read", "credential.store.read")
    | table _time EventType Actor Asset Action Target CorrelationId
    | sort - _time
