id: analysis-review
title: Independent malware-analysis validation
visibility: Review / research workflow
hypothesis:
  Instructions inside a sample influence an LLM analysis result, or obfuscation changes a
  model's classification without changing malicious behavior.
telemetry:
  - Sample hashes and static / dynamic analysis results
  - Model verdicts with prompt provenance
  - Independent analyst and deterministic scanner verdicts
investigate:
  - Compare model conclusions with independent behavioral evidence and a controlled evaluation set.
  - Treat sample comments as data; measure disagreement and false negatives without following
    embedded instructions.
limitation:
  This evaluates analysis robustness, not victim endpoint compromise. Side behaviors
  mentioned elsewhere in a report do not establish edges in this flow.
search:
  - '"prompt injection"'
  - '"obfuscation" AND "javascript"'
reviewed: 2026-10-23
origin: catalog_authored
query_kind: custom_schema
query_scope:
  Custom-schema candidates, not out-of-box detectors. Map your application / cloud /
  platform logs to EventType, Actor, Asset, Action, Target and CorrelationId. KQL uses a custom
  OpenAttacksAudit_CL table; SPL uses openattacks:audit. EventType values are proposed normalization
  names, not native vendor event names. Correlation and environment-specific alert logic remain to
  be built.
queries:
  sigma: |
    title: Hunt - Independent malware-analysis validation
    id: aa44bd2e-f46c-4884-a6db-e6b370a12c50
    status: experimental
    description: Instructions inside a sample influence an LLM analysis result, or
      obfuscation changes a model's classification without changing malicious
      behavior.
    author: MagicSword OpenAttacks catalog
    date: 2026-10-23
    references:
      - https://github.com/MHaggis/Security-Detections-MCP
    falsepositives:
      - Authorized activity matching this broad hunt; baseline and investigate
        before alerting.
    level: low
    logsource:
      category: application
      product: openattacks_audit
      definition: Custom normalized audit schema; map EventType, Actor, Asset, Action,
        Target and CorrelationId from the required source logs first.
    detection:
      selection:
        EventType:
          - analysis.verdict
      condition: selection
  kql: >-
    // SCHEMA TEMPLATE: create/map this custom table before use; not a built-in Sentinel table.

    // OpenAttacksAudit_CL: TimeGenerated(datetime),
    EventType/Actor/Asset/Action/Target/CorrelationId(string).

    // Selects candidates only. Apply the stage hypothesis and correlation steps before alerting.

    OpenAttacksAudit_CL

    | where TimeGenerated > ago(7d)

    | where EventType in ("analysis.verdict")

    | project TimeGenerated, EventType, Actor, Asset, Action, Target, CorrelationId

    | order by TimeGenerated desc
  spl: |-
    sourcetype="openattacks:audit"
    EventType IN ("analysis.verdict")
    | table _time EventType Actor Asset Action Target CorrelationId
    | sort - _time
