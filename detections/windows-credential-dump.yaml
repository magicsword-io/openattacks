id: windows-credential-dump
title: Windows credential dumping with system utilities
hypothesis:
  A Windows utility accesses or dumps LSASS memory using comsvcs.dll or a similar system-binary
  technique, followed by credential use or lateral movement.
telemetry:
  - Windows process creation with complete command lines
  - Process-access telemetry for LSASS
  - Authentication and lateral-movement logs
investigate:
  - Recover the dump path, process ancestry, account, and initiating remote session or scheduled task.
  - Correlate the event with new logons, DCSync, ticket creation, and credential use from other hosts.
limitation:
  Diagnostic and security tools can dump processes. The command-line hunt covers the common comsvcs
  pattern and does not detect every in-memory or kernel-assisted credential-dumping method.
search:
  - '"comsvcs.dll" AND "MiniDump"'
  - '"LSASS" AND "dump"'
visibility: Windows process and process-access telemetry where collected
reviewed: 2026-11-06
origin: catalog_authored
query_kind: native
query_scope:
  Windows rundll32/comsvcs MiniDump command candidates. Correlate with process-access telemetry and
  confirm the target PID belongs to LSASS.
upstream_matches:
  - name: Process Memory Dump Via Comsvcs.DLL
    id: 646ea171-dded-4578-8a4d-65e9822892e3
    source: SigmaHQ
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_rundll32_process_dump_via_comsvcs.yml
  - name: Dump LSASS via comsvcs DLL
    id: 8943b567-f14d-4ee8-a0bb-2121d4ce3184
    source: Splunk Security Content
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/dump_lsass_via_comsvcs_dll.yml
queries:
  sigma: |
    title: Hunt - Process Dump Via Comsvcs DLL
    id: 1c658574-7d21-4fc8-b272-d6b1508d0aad
    status: experimental
    description: Detects rundll32 invoking the comsvcs MiniDump export.
    author: MagicSword OpenAttacks catalog
    date: 2026-11-06
    references:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_rundll32_process_dump_via_comsvcs.yml
    falsepositives:
      - Authorized diagnostics or incident-response collection
    level: high
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
        Image|endswith: \rundll32.exe
      selection_command:
        CommandLine|contains|all:
          - comsvcs.dll
          - MiniDump
      condition: all of selection_*
  kql: |-
    DeviceProcessEvents
    | where Timestamp > ago(7d)
    | where FileName =~ "rundll32.exe"
    | where ProcessCommandLine contains "comsvcs.dll" and ProcessCommandLine contains "MiniDump"
    | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine,
        InitiatingProcessFileName, InitiatingProcessCommandLine, SHA1
    | order by Timestamp desc
  spl: |-
    sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1
    Image="*\\rundll32.exe" CommandLine="*comsvcs.dll*" CommandLine="*MiniDump*"
    | table _time host User Image CommandLine ParentImage ParentCommandLine ProcessGuid
    | sort - _time
