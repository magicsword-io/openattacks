id: mcp-config
title: Agent trust / configuration changes
hypothesis:
  A repository, dependency or agent changes MCP commands, automatic-task settings, tool
  approval or model-routing configuration before new execution.
telemetry:
  - File changes and before/after content for MCP / IDE configuration
  - Repository audit / pull-request history
  - Agent startup and tool-invocation logs
investigate:
  - Diff command, args, environment, origin, autoApprove and task settings against the previously
    approved version.
  - Correlate the author and change with the next agent launch; inspect path canonicalization and
    trailing-dot variants where relevant.
limitation:
  A file-write event alone cannot establish what changed. Legitimate setup also changes
  these files; obtain a diff and authorization context.
search:
  - '"mcp.json"'
  - '"tasks.json"'
  - '"autoApprove"'
visibility: Defender-side logs where collected
reviewed: 2026-10-23
origin: catalog_authored
query_kind: custom_schema
query_scope:
  Custom-schema candidates, not out-of-box detectors. Map your application / cloud /
  platform logs to EventType, Actor, Asset, Action, Target and CorrelationId. KQL uses a custom
  OpenAttacksAudit_CL table; SPL uses openattacks:audit. EventType values are proposed normalization
  names, not native vendor event names. Correlation and environment-specific alert logic remain to
  be built.
queries:
  sigma: |
    title: Hunt - Agent trust / configuration changes
    id: 2dfc8034-d66b-42a7-a699-a76b2ef872ac
    status: experimental
    description: A repository, dependency or agent changes MCP commands,
      automatic-task settings, tool approval or model-routing configuration before
      new execution.
    author: MagicSword OpenAttacks catalog
    date: 2026-10-23
    falsepositives:
      - Authorized activity matching this broad hunt; baseline and investigate
        before alerting.
    level: low
    logsource:
      category: application
      product: openattacks_audit
      definition: Custom normalized audit schema; map EventType, Actor, Asset, Action,
        Target and CorrelationId from the required source logs first.
    detection:
      selection:
        EventType:
          - agent.config.write
          - agent.approval.change
      condition: selection
  kql: >-
    // SCHEMA TEMPLATE: create/map this custom table before use; not a built-in Sentinel table.

    // OpenAttacksAudit_CL: TimeGenerated(datetime),
    EventType/Actor/Asset/Action/Target/CorrelationId(string).

    // Selects candidates only. Apply the stage hypothesis and correlation steps before alerting.

    OpenAttacksAudit_CL

    | where TimeGenerated > ago(7d)

    | where EventType in ("agent.config.write", "agent.approval.change")

    | project TimeGenerated, EventType, Actor, Asset, Action, Target, CorrelationId

    | order by TimeGenerated desc
  spl: |-
    sourcetype="openattacks:audit"
    EventType IN ("agent.config.write", "agent.approval.change")
    | table _time EventType Actor Asset Action Target CorrelationId
    | sort - _time
