id: windows-dcsync
title: Active Directory replication from an unexpected account
hypothesis:
  A non-domain-controller or non-machine account requests directory replication rights consistent
  with DCSync, enabling extraction of domain credential material.
telemetry:
  - Domain-controller Security Event 4662 with Directory Service Access auditing
  - Identity and endpoint telemetry for the requesting account and source host
  - Kerberos ticket and subsequent authentication activity
investigate:
  - Confirm the subject account, source workstation, object, and replication-right GUIDs.
  - Compare with approved directory synchronization, then rotate exposed credentials and inspect ticket use.
limitation:
  Event 4662 is high-volume and requires appropriate SACL/audit configuration. Backup, identity,
  migration, and synchronization products can legitimately use replication rights.
search:
  - '"DCSync"'
  - '"Directory Replication Service"'
visibility: Domain-controller Security logs where configured
reviewed: 2026-11-06
origin: catalog_authored
query_kind: native
query_scope:
  Security Event 4662 candidates containing directory-replication extended-right GUIDs and a
  non-machine subject account. Tune approved synchronization identities.
upstream_matches:
  - name: Active Directory Replication from Non Machine Account - DcSync Indicator
    id: 17d619c1-e020-4347-957e-1d1207455c93
    source: SigmaHQ
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_ad_replication_non_machine_account.yml
  - name: First Time Seen Account Performing DCSync
    id: 5c6f4c58-b381-452a-8976-f1b1c6aa0def
    source: Elastic detection-rules
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/credential_access_dcsync_newterm_subjectuser.toml
queries:
  sigma: |
    title: Hunt - Directory Replication From Non-Machine Account
    id: cc0c6803-2f24-420f-b206-f0b081bb6f9d
    status: experimental
    description: Detects Directory Service Access events with replication-right GUIDs from a non-machine account.
    author: MagicSword OpenAttacks catalog
    date: 2026-11-06
    references:
      - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_ad_replication_non_machine_account.yml
    falsepositives:
      - Approved directory synchronization, backup, migration, and identity services
    level: high
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4662
        Properties|contains:
          - 1131f6aa-9c07-11d1-f79f-00c04fc2dcd2
          - 1131f6ad-9c07-11d1-f79f-00c04fc2dcd2
          - 89e95b76-444d-4c62-991a-0facbeda640c
      filter_machine:
        SubjectUserName|endswith: $
      condition: selection and not filter_machine
  kql: |-
    SecurityEvent
    | where TimeGenerated > ago(7d)
    | where EventID == 4662
    | where Properties has_any ("1131f6aa-9c07-11d1-f79f-00c04fc2dcd2",
        "1131f6ad-9c07-11d1-f79f-00c04fc2dcd2", "89e95b76-444d-4c62-991a-0facbeda640c")
    | where Account !endswith "$"
    | project TimeGenerated, Computer, Account, SubjectAccount, ObjectName, Properties, Activity
    | order by TimeGenerated desc
  spl: |-
    sourcetype="WinEventLog:Security" EventCode=4662
    (Properties="*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*"
      OR Properties="*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*"
      OR Properties="*89e95b76-444d-4c62-991a-0facbeda640c*")
    NOT SubjectUserName="*$"
    | table _time host SubjectDomainName SubjectUserName ObjectName Properties
    | sort - _time
