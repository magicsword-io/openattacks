description: Iranian state-sponsored threat actor, also known as MuddyWater. Observed using Gemini with student project pretexts to develop custom malware including web shells and Python C2 frameworks. OPSEC failure led to exposure of hard-coded C2 domains and encryption keys pasted into AI prompts, aiding disruption efforts.
