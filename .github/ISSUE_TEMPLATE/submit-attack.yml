name: Submit an attack
description: Add an AI attack observed in the wild or a concrete case documented in public reporting.
title: 'New entry: '
labels: [new-entry]
body:
  - type: input
    id: name
    attributes:
      label: Attack or campaign name
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Source URLs and researcher credit
      description: Link reporting of a concrete case. Prefer original research, vendor advisories, or news coverage. No conceptual scenarios or hypothetical attack chains.
    validations:
      required: true
  - type: textarea
    id: ai-role
    attributes:
      label: What role did AI play?
      description: Explain the evidence that AI mattered. Mark uncertainty and research demonstrations.
    validations:
      required: true
  - type: textarea
    id: entry
    attributes:
      label: Proposed entry or additional details
      description: Use unknown rather than guessing. Include no live victim data or unredacted victim IP addresses.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and sourcing
      options:
        - label: This entry documents an attack observed in the wild or a concrete publicly reported case, not a conceptual scenario or general threat framework.
          required: true
        - label: I included source URLs and no live victim data or unredacted victim IPs.
          required: true
