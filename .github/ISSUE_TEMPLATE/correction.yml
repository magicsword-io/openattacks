name: Correct an entry
description: Suggest a source-backed correction or clarification.
title: 'Correction: '
labels: [correction]
body:
  - type: input
    id: entry
    attributes:
      label: Entry ID or URL
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction and supporting source URLs
      description: Explain what should change and cite the evidence. Do not include private victim information.
    validations:
      required: true
