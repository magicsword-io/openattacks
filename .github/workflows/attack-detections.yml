name: Attack detections
# Untrusted pull request code runs here and must not receive secrets.
# Fork pull requests do not receive DETECTIONs_PUSH_TOKEN.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: attack-detections-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  attack-detections:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Find changed attack entries
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE"
          node scripts/lib/changed-attacks.mjs --base "$BASE"

      - uses: actions/setup-node@v4
        if: success() && steps.changed.outputs.count != '0'
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        if: success() && steps.changed.outputs.count != '0'
        run: npm ci

      - name: Detection index week
        if: success() && steps.changed.outputs.count != '0'
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Entries that need rules
        if: success() && steps.changed.outputs.count != '0'
        id: enrich-plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/enrich-detections.mjs --base "$BASE" --dry-run

      - name: Restore detection index
        if: success() && steps.changed.outputs.count != '0' && steps.enrich-plan.outputs.needs == 'true'
        id: detection-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/security-detections-mcp
            .cache/detection-sources
          key: security-detections-${{ steps.week.outputs.week }}-${{ hashFiles('scripts/build-detection-index.mjs', 'scripts/lib/detection-mcp.mjs') }}

      - name: Build detection index
        if: success() && steps.changed.outputs.count != '0' && steps.enrich-plan.outputs.needs == 'true' && steps.detection-cache.outputs.cache-hit != 'true'
        run: node scripts/build-detection-index.mjs

      - name: Add matching detection rules
        if: success() && steps.changed.outputs.count != '0' && steps.enrich-plan.outputs.needs == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          DETECTION_SUGGESTIONS_PATH: ${{ runner.temp }}/detection-suggestions.md
        run: node scripts/enrich-detections.mjs --base "$BASE"

      - name: Validate changed attack entries
        if: steps.changed.outputs.count != '0' && (steps.enrich-plan.outcome == 'success' || steps.enrich-plan.outcome == 'failure')
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/validate-pr-entries.mjs --base "$BASE"

      - name: Commit detection rules
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          DETECTIONS_PUSH_TOKEN: ${{ secrets.DETECTIONS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git add -- attacks
          if git diff --cached --quiet; then
            echo "No detection updates to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add matched detection rules for changed attack entries"
          if [ -n "${DETECTIONS_PUSH_TOKEN:-}" ]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${DETECTIONS_PUSH_TOKEN}" push origin "HEAD:${HEAD_REF}"
          else
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Comment on fork pull request
        if: success() && github.event_name == 'pull_request' && steps.enrich-plan.outputs.needs == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DETECTION_SUGGESTIONS_PATH: ${{ runner.temp }}/detection-suggestions.md
        with:
          script: |
            const fs = require('fs');
            const suggestionPath = process.env.DETECTION_SUGGESTIONS_PATH;
            if (!fs.existsSync(suggestionPath)) {
              core.notice('No detection suggestions file to post.');
              return;
            }
            const body = fs.readFileSync(suggestionPath, 'utf8').trim();
            if (!body) {
              core.notice('No detection rules to suggest.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
