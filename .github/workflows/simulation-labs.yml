name: Portable simulation labs
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  runner:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      # The executable lab package needs Node only: no npm install lifecycle.
      - run: node --test tests/lab-checkout.test.mjs tests/simulations.test.mjs
      - run: npm run simulate -- list
