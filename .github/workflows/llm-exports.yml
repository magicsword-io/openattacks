name: Refresh LLM exports
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: llm-exports-main
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Use the latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - run: npm ci
      - run: npm run llm:build
      - name: Commit regenerated exports
        run: |
          set -euo pipefail
          git add -A -- llms.txt llms-full.txt data/attacks.json data/attacks.schema.json llms
          if git diff --cached --quiet; then
            echo "LLM exports already match attacks/*.yaml."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate LLM catalog exports [skip ci]"
          git push origin HEAD:main
