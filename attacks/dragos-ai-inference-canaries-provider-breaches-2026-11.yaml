detections:
  - name: Potential Bucket Enumeration on AWS
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_enum_buckets.yml
    notes: "AWS CloudTrail. ListBuckets, excluding AssumedRole. Matches the S3 bucket listing Dragos saw on the stolen IAM user keys. It does not cover Secrets Manager, Parameter Store, or Bedrock."
  - name: AWS STS GetCallerIdentity API Called for the First Time
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_new_terms_sts_getcalleridentity.toml
    notes: "AWS CloudTrail. First GetCallerIdentity for an IAM user or account identity. Fits a bait key that had never been used. AssumedRole callers are excluded by the rule."
  - name: AWS IAM Long-Term Access Key First Seen from Source IP
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/credential_access_iam_long_term_access_key_first_seen_from_source_ip.toml
    notes: "AWS CloudTrail. First successful use of an AKIA key from a source IP in the rule history window. Matches Dragos's description of a new source using a key that had been sent once in a prompt. It does not require GetCallerIdentity."
  - name: AWS Bedrock Foundation Model Access Enabled or Entitlement Granted
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/persistence_bedrock_foundation_model_access_enabled_or_entitlement_granted.toml
    notes: "AWS CloudTrail. Successful PutFoundationModelEntitlement, PutUseCaseForModelAccess, or CreateFoundationModelAgreement. Dragos says the callers tried to enable Bedrock hosted models and does not say the calls succeeded. A denied call does not match this rule."
  - name: AWS Bedrock Unauthorized Foundation Model Access Attempt
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/persistence_bedrock_foundation_model_access_denied_attempt.toml
    notes: "AWS CloudTrail. The same three model-access actions when the outcome is failure with AccessDenied. Pairs with the success rule because Dragos describes an attempt, not a completed enablement. Empty bait accounts would often be denied."
  - name: AWS Discovery API Calls via CLI from a Single Resource
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_multiple_discovery_api_calls_via_cli.toml
    notes: "AWS CloudTrail. More than five distinct List, Get, or Describe calls in ten seconds from user_agent.name aws-cli, including S3 and STS. Matches only the later AWS CLI phase. It does not match artex-agent, artex-judge-r121, Boto3, or the Chrome script, and its provider list does not include Secrets Manager, Systems Manager, or Bedrock."
  - name: ARTEX and Kali user agents, CreateUser, ListSecrets, DescribeParameters
    format: guidance
    notes: "No cited Sigma, Splunk, or Elastic rule names artex-agent or artex-judge-r121. Hunt CloudTrail user_agent.original for those two strings and for Kali. Dragos says both ARTEX and Kali appeared in the user agent, and only in a small fraction of traffic. The public CreateUser rule AWS IAM Create User via Assumed Role on EC2 Instance requires an AssumedRole on an EC2 instance (user.id *:i-*). Dragos describes IAM users added with the stolen long-term keys, so that rule is not cited. No cited rule is limited to secretsmanager:ListSecrets or ssm:DescribeParameters. Hunt those two actions after GetCallerIdentity from a new source, then Bedrock model-access calls and iam:CreateUser. The rapid GetSecretValue rule is not cited. Dragos describes searches of Secrets Manager on empty accounts, not retrieval of twenty secret values."
  - name: Provider agents opening URLs logged from inference requests
    format: guidance
    notes: "A security-detections-mcp search for honeytoken, canary, and provider URL access returned no Sigma, Splunk, or Elastic rule for a vendor security process that extracts URLs from inference API requests, logs them, and opens them later. The AWS rules above cover stolen-key use on the bait accounts. They do not cover MiniMax's URL access, OpenRouter removing 125 endpoints from Zero Data Retention eligibility, or Atlas Cloud stopping traffic to MiniMax's official API. Those are provider-side changes. A customer-side check is a canary URL in a prompt that is fetched after the request, including a request marked zero data retention."
