ai_role_detail: "The measured event is theft of AI inference prompts, including requests copied at a hosting provider before a model ran. Dragos also recorded ARTEX user agents artex-agent and artex-judge-r121 making a handful of live-key checks on Nov 1, 2026."
technique_summary: "HD Moore (Dragos, Nov 19, 2026) describes about two million prompts sent from July through November 2026 to widely used AI services and routers. Each prompt carried a unique canary URL, a DNS name, and a real AWS key tied to an empty, fully logged account. Dragos reports three findings and does not name the breached providers. First, attackers stole data from at least three AI hosting providers. The earliest incident was mid-July 2026, and none of the three knew until Dragos told them. The largest breach was a couple hundred AWS keys, each sent once to one provider in a few windows in late October. Every request in those windows was stolen, including requests the provider rejected before a model ran, which Dragos reads as a copy at the provider's front door. In the other two breaches, some stolen requests were marked zero data retention. After theft, keys were tested for validity, sometimes within hours, then used to list S3 buckets and search Secrets Manager and Parameter Store, and then to try to enable Bedrock hosted models, create Bedrock API keys, and add IAM users. The bait keys drew tens of thousands of AWS API calls. One key seeded on Oct 21 was first used the next day and was still in use three weeks later. Dragos says one adversary compromised two of the providers at the same time, because secrets from both were used together, almost immediately, from one rented server. Over those three weeks the tooling changed from a script posing as Chrome on Windows, to Boto3 inside OrbStack, to the AWS CLI on Kali Linux. On Nov 1 the same attacker added ARTEX (https://github.com/RuoJi6/ARTEX), which made only a handful of calls to confirm keys were still live. CloudTrail recorded user agents artex-agent and artex-judge-r121, which Dragos says were not in any public indicator list it could find. Kali also appeared in the user agent, and only in a small fraction of the traffic. Second, marketplace resellers listed a model at the lowest price, turned on request logging, and read customer prompts. Individuals on home broadband opened the secret URLs and tried logins. One person in France, on a Mac, typed prompt passwords as root over SSH by hand and later tested several AWS keys in one session. One of those keys had gone to a different router that was quietly forwarding some traffic to the marketplace. Third, a Chinese AI lab fetched secret URLs from more than half of the prompts sent to its models from July through October, including about two-thirds of the requests marked no data collection or zero data retention. The scraper usually appeared two or three days later. U.S. resellers of that lab's models triggered the same scraper. A git client on another cloud tried to clone private repositories named in prompts, and only for that lab's models. Twenty-four days after a zero-data-retention prompt to one U.S. provider, the secret link was posted in a Feishu chat (Lark outside China) and opened within two minutes from three desktops and three phones in Beijing and Shanghai. Dragos says its notice to that provider contained only the first eight characters of the link. Dragos has notified providers, one of the late-October providers has published a preliminary notice, and Dragos says it is working with about a dozen providers. Seeding started with Thinkst Canarytokens. The AWS keys are real keys on empty accounts. Ars Technica (Dan Goodin, Nov 20, 2026, updated Nov 21) reports an OpenRouter customer email saying some prompts may have been read, that the planted URLs were accessed for prompts sent to MiniMax directly or through AtlasCloud, Novita, and StreamLake, and that OpenRouter removed a zero data retention label from MiniMax-model endpoints. That email is not Dragos naming the three hosting-provider breaches. OpenRouter's own post on 22 November 2026 says the testing did not show a breach or unauthorized access of OpenRouter. OpenRouter offboarded three providers, removed 125 endpoints from Zero Data Retention eligibility, and notified potentially affected customers. MiniMax's post on 24 November 2026 says its own security monitoring extracted URLs from forwarded API requests, logged them, and later had automated programs and agents open them. Those requests reached MiniMax directly from OpenRouter or through Novita, Streamlake, and Atlas Cloud, and the activity included requests marked zero data retention or no data collection. MiniMax says the process logged only the extracted IP addresses and URLs, not full request or response bodies, that it is disabled, and that the logged URLs from the affected requests were deleted. MiniMax says it found no evidence that prompt content or model responses were disclosed to third parties beyond that URL activity. Atlas Cloud's 24 November 2026 update says it stopped sending requests to MiniMax's official API and that no Atlas Cloud request goes there until Atlas Cloud is confident in that API. These provider statements name the URL-opening path. They do not name Dragos's three hosting-provider breaches."
initial_access: "Theft of inference requests from at least three unnamed AI hosting providers, including requests rejected before a model ran. Separate paths were marketplace sellers who logged prompts, and a Chinese AI lab that fetched URLs from prompts, including zero-data-retention requests."
ai_tooling_and_models:
  - "ARTEX (https://github.com/RuoJi6/ARTEX), user agents artex-agent and artex-judge-r121"
  - "Thinkst Canarytokens, then a Dragos seeding service that derived a URL, a DNS name, and an AWS key per prompt"
  - "Widely used AI inference services, routers, and marketplace resellers. Dragos does not name the three breached hosting providers."
frameworks:
  - artex
other_tooling:
  - "A script posing as Chrome on Windows, then Boto3 inside OrbStack, then the AWS CLI on Kali Linux"
  - "AWS APIs used on the bait keys included key validation, S3 bucket listing, Secrets Manager and Parameter Store searches, Bedrock hosted-model enablement, Bedrock API key creation, and IAM user creation"
victims_and_sectors: "Customers of unnamed AI hosting providers and of inference routers and marketplace sellers, plus the providers themselves. Dragos says real customer requests were processed alongside the bait and were almost certainly copied in the provider breaches. No provider or customer is named by Dragos."
regions:
  - unknown
region_notes: "Dragos does not name the countries of the three breached providers or of affected customers. France is where one person tried the stolen SSH passwords and AWS keys. Beijing and Shanghai are where a Feishu link was opened. Those are places the stolen material was used, not victim countries. MiniMax, OpenRouter, Atlas Cloud, Novita, and Streamlake are named in their own notices or in MiniMax's notice. Those company locations are not victim regions."
attribution_or_cluster: "Unknown actors. Dragos attributes the provider theft, the later AWS use, and the Nov 1 ARTEX user agents to activity it observed on its own canaries. One adversary appears to have compromised two providers, because secrets from both were used together from one rented server. Dragos does not name that adversary."
scale_and_metrics: "About two million prompts from July through November 2026. At least three hosting providers breached, the earliest in mid-July, none aware until notified. Largest breach a couple hundred AWS keys in a few late-October windows, every request in those windows stolen. Tens of thousands of AWS API calls on the bait keys. One Oct 21 key still in use three weeks later. ARTEX made a handful of live-key checks on Nov 1. A Chinese lab fetched URLs from more than half of prompts to its models, including about two-thirds of zero-data-retention requests. About a dozen providers in the follow-up. Dragos does not give a customer count."
prevention_angle: "Self-host sensitive inference when nobody else should read the prompts. Otherwise go directly to a first-tier provider, one company and one privacy policy. On a router, pick the upstream providers yourself and check that privacy settings change where the request goes. Avoid reseller marketplaces. Seed canaries, such as a Thinkst Canarytoken, in context that agents and pipelines already send, and treat any use as an incident. Turn on provider secret filtering. Do not put live credentials in prompts. A privacy flag only binds the first hop, and it does not help if the provider is already compromised."
related_magicsword_projects: []
source_notes: "Prompt counts, the three unnamed provider breaches, the late-October key windows, the AWS follow-on, the Chrome, OrbStack, and Kali Linux tooling, the Nov 1 ARTEX user agents artex-agent and artex-judge-r121, the marketplace and France SSH cases, the Chinese lab scraper, the Feishu chat, and the prevention steps are from the Dragos post. Dragos does not name the three breached providers, and this entry does not assign those breaches to any company. The Nov 21 OpenRouter email in the Ars Technica update is not a name for the three breaches. OpenRouter's 22 November post, MiniMax's 24 November post, and Atlas Cloud's 24 November post are those companies speaking for themselves about URL access and Zero Data Retention. They still do not name the three hosting-provider breaches. Link together-ai-coding-agent-hf-credential-prompt-leak-2026-11, where Together AI says five tested credentials were canaries from this experiment. The ARTEX user agents also sit next to datadog-artex-aws-cognito-2026-11, barracuda-artex-cloud-key-intrusion-2026-11, microsoft-artex-github-secrets-keyvault-2026-11, unit42-artex-api-recon-2026-10, checkpoint-artex-operator-consoles-2026-11, srm-artex-ir-host-artifacts-2026-11, and storm-3358-artex-bank-intrusions-2026-11. Figure addresses in the Dragos post are partly masked and are not copied here."
