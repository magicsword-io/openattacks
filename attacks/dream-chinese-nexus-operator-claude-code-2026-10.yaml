source_notes: "Imported from the AI Threat Watch Notion feed (an automated daily scan); not yet editorially reviewed. Feed severity: Medium. Feed novelty: Evolution. This is a different operator from socradar-oh-my-pi-php2shell-2026-11. Dream describes a Chinese-nexus operator, Claude Code, and a DeepSeek/Kimi aiscan setup using PHP2Shell against firewalls. SOCRadar describes an unnamed operator, patched Oh My Pi workers, and a self-hosted DeepSeek V4.1 lab. The two reports do not share infrastructure."
