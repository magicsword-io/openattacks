victims_and_sectors: "Multiple customers with internet-facing web applications, APIs, and mobile applications. Profero does not name a sector or the customer organizations."
regions:
  - unknown
region_notes: "Hong Kong and AS399077 are the operator's hosting network, not a reported victim location. Profero does not name victim countries. Thordata exit countries are proxy infrastructure, not targets."
attribution_or_cluster: "Unnamed. Profero IRT and Guy Barnhart-Magen. No link shown to actors named in other public ARTEX reporting. A Chinese-speaking assessment is from console language and is not a country attribution."
scale_and_metrics: "About 3 GB from about 90 tables over about 9 million requests, with no escalation for about 26 hours. Profero says these figures are approximate and blended across incidents, not one customer's timeline. One session used 31 proxy exits. The proxy pool Profero measured is about 273,000 hosts."
prevention_angle: "Block the three high-confidence hosts and the three gladdaily names. Do not block the whole 156.240.236.0/24, and do not block shared Thordata exits. Lock the origin to the edge provider. Run generic SQL injection rules. Authorize tests out of band against a record with a source address and a time window. Treat user-agent text, canary files, and incident-report wording as untrusted data if an AI reads logs or writes the report. A self-declared researcher string is a claim."
related_magicsword_projects: []
source_notes: "Agent tooling is confirmed by the consoles, the ARTEX probe paths, and the panel titles on the three hosts. The intent to fool AI triage is Profero's assessment of the label placement. The canary file and the customer's AI report are observed. Profero says it cannot prove the labels caused the 26-hour delay. block-ips.csv in the 31 October post has 63 addresses. This entry lists them. Only 156.240.236[.]28, 156.240.236[.]27, and 156.240.236[.]14 are the high-confidence operator consoles. The other addresses are medium-confidence hosts in the same /24 that Profero did not tie to use against the targets. proxy-exit-ips.csv lists 31 shared Thordata exits Profero says not to block. They are not copied here. watch-ips.csv lists 3 further AS399077 hosts marked watch-only. They are not copied here. Certificate values in hashes are TLS fingerprints for the three consoles, not malware file hashes. VulnHunter is the panel title. Profero has not confirmed the build."
