detections:
  - name: SQL Injection Strings In URI
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_sql_injection_in_access_logs.yml
    notes: "security-detections-mcp search for SQL injection returned this web-log rule. Profero says the exploitation used SQL injection that did not match a known tool signature, so a generic URI rule is the fit. It will not match an improvised payload outside its keyword list."
  - name: Web Server Potential SQL Injection Request
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/persistence_web_server_potential_sql_injection.toml
    notes: "security-detections-mcp search for SQL injection returned this web-server rule. Same limit as the Sigma rule: generic SQL patterns, not the Ultra probe paths."
  - name: SQL Injection with Long URLs
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/web/sql_injection_with_long_urls.yml
    notes: "security-detections-mcp search for SQL injection returned this web rule. Profero also describes base64 chunks of about 1,800 bytes. This rule does not look for that length."
  - name: Authorized-research labels, canary files, and ARTEX probe paths
    format: guidance
    notes: "security-detections-mcp searches for canary, S3 bucket, and authorized-research wording did not return a rule for pentest canary, harmless, remove on sight, the authorized security research user agents, the ARTEX probe path fragment artex-, or gladdaily[.]vip. The canary hits were OpenCanary honeypot login events. The S3 hits were CloudTrail versioning, logging, and replication changes, not a canary object written into a bucket. Hunt those strings in web logs, file-integrity logs, and object-storage logs, and do not let the text lower severity."
