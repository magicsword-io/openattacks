atlas_techniques:
  - id: AML.T0016
    rationale: "The operator obtained ARTEX, VulnHunter, Hermes Agent, and, earlier, CyberStrikeAI, and exposed them from the Ultra hosts."
    source_urls:
      - https://profero.io/blog/ultra-suite-artex-ai-attack-agents/
  - id: AML.T0103
    rationale: "Profero observed ARTEX probe traffic from the attacking host and agent consoles for VulnHunter, Hermes Agent, and Ultra Reverse on the operator's hosts."
    source_urls:
      - https://profero.io/blog/ultra-suite-artex-ai-attack-agents/
  - id: AML.T0049
    rationale: "The activity Profero saw against customers was exploitation of public-facing web applications, including SQL injection that did not match a known tool."
    source_urls:
      - https://profero.io/blog/ultra-suite-artex-ai-attack-agents/
  - id: AML.T0051.001
    rationale: "Canary files and authorized-research user agents were planted where a defender's log review and incident report would read them. Profero assesses this as indirect prompt injection aimed at AI triage. The customer's AI-written report then classed the host as an authorized test."
    source_urls:
      - https://profero.io/blog/ai-attack-cluster-tells/
  - id: AML.T0067
    rationale: "The customer's AI-written incident report repeated the canary's claim and classified the host as an authorized penetration test, which is manipulation of trusted model output used in the response."
    source_urls:
      - https://profero.io/blog/ai-attack-cluster-tells/
  - id: AML.T0025
    rationale: "About 3 GB left from application data over ordinary web responses. Profero says the extraction clients were unlabeled curl and Go HTTP clients."
    source_urls:
      - https://profero.io/blog/ai-attack-cluster-tells/
