ai_role: attacker_uses_ai_as_operator
ai_role_secondary: ai_agent_or_mcp_as_target
ai_role_detail: "The operator ran ARTEX and a private Ultra console that wrapped VulnHunter and Hermes Agent, with CyberStrikeAI on the same host earlier. Profero assesses that user-agent claims of authorized research and pentest-canary files were written so a defender's AI triage would class the activity as an authorized test. That intent is Profero's assessment. The tooling on the hosts is evidenced directly."
technique_summary: "Profero IRT (31 October 2026) and Guy Barnhart-Magen (19 November 2026) describe one unnamed operator using several AI attack agents against internet-facing web applications, APIs, and mobile applications. Profero says the targeting looked opportunistic and does not name a sector or a victim country. Three hosts in Hong Kong network AS399077 share an Ultra brand on the same Ubuntu 22.04, nginx, and OpenSSH 8.9p1 build. 156.240.236[.]28 requested ARTEX probe paths and served an ARTEX-style console on port 8787. 156.240.236[.]27 is the origin for gladdaily[.]vip, with www and wiki names, which moved behind Cloudflare on 21 September 2026. That host served a panel titled Ultra - VulnHunter and a Hermes Agent dashboard. In August and September 2026 it ran CyberStrikeAI on port 8080. 156.240.236[.]14 runs Ultra Reverse, an LLM-driven static reverse-engineering console. Attack traffic left through Thordata residential proxies. Profero counted about 273,000 hosts with the provider's proxy header and 31 exits in one session. Profero saw exploitation against customers. The other agent components were observed on the operator's hosts. Payloads did not match a known tool signature. Profero assesses an agent improvising with a generic HTTP client. Default ARTEX user agents were not seen. The 19 November post blends several incidents, says the figures are approximate, and says customer identifiers are scrambled. The operator sent user agents claiming authorized security research and planted files whose content was pentest canary followed by harmless, remove on sight, on a host and in writable S3 buckets. A customer's AI-written incident report classified the host as an authorized penetration test. Profero says the labeled user agents were common on blocked requests and rare on successful ones, and that extraction used unlabeled curl and Go HTTP clients. Profero assesses the labels were written for a model that triages logs. That is prompt injection through attacker-controlled log fields and files. Profero cannot prove the labels caused the delay. Nobody escalated for about 26 hours, by which time about 3 GB had left from about 90 tables over about 9 million requests. Profero found no link to actors named in other public ARTEX reporting. Console language is the basis for a Chinese-speaking assessment. That is not a country attribution."
initial_access: "Exploitation of internet-facing web applications after reconnaissance. Profero describes SQL injection and ARTEX probe paths. The vulnerable products are not named."
ai_tooling_and_models:
  - "ARTEX (https://github.com/Hinln/ARTEX)"
  - "Hermes Agent (https://github.com/NousResearch/hermes-agent)"
  - "VulnHunter (https://github.com/Clouditera/VulnHunter)"
  - "CyberStrikeAI (https://github.com/AIPentest/CyberStrikeAI), on the domain host in August and September 2026"
  - Ultra Reverse, an operator console with no public project identified
frameworks:
