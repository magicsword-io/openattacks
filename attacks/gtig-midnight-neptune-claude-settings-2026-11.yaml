detections:
  - name: Suspicious ClickFix/FileFix Execution Pattern
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_clickfix_filefix_execution.yml
    notes: "Matched ClickFix with security-detections-mcp. Windows process creation under explorer.exe for the Run-dialog or File Explorer paste pattern, often mshta.exe or powershell.exe. GTIG named ClickFix and diagnostic fix scripts. It did not publish the command or the operating system, so this rule applies only where that Windows paste path was used."
  - name: Unusual Process Modifying GenAI Configuration File
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/defense_evasion_genai_config_modification.toml
    notes: "Matched settings.json and .claude with security-detections-mcp. A file modification under .claude/, which includes .claude/settings.json, by an unusual process. GTIG describes that file being changed in internal repositories. The rule sees a host file write, not the git commit by itself."
  - name: New GitHub Personal Access Token (PAT) Added
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/github/persistence_new_pat_created.toml
    notes: "Matched personal access token with security-detections-mcp. GitHub audit creation of a PAT. GTIG says the tokens were named after Microsoft Copilot. The rule does not match on that name."
  - name: No rule names SOMBERMEME or SynthID
    format: guidance
    notes: "security-detections-mcp searches for SOMBERMEME, SynthID, and deepfake returned no Sigma, Splunk, or Elastic rule. SynthID is a watermark on the published profile images, not a host event. SOMBERMEME has no published hash or domain in this report to attach to a malware rule."
