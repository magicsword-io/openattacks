id: gtig-midnight-neptune-claude-settings-2026-11
name: Suspected MIDNIGHT NEPTUNE uses SynthID recruiter lures and Claude Code settings to deploy SOMBERMEME
date_reported: "2026-11-16"
researcher: Aurora Blum, Kelli Vanderlee, Jess Xia, David Mainor
org: Google Threat Intelligence Group
sources:
  - url: https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold/
    title: "GTIG AI Threat Tracker: Agentic Threat Activity Crosses a Significant Threshold"
    publisher: Google Threat Intelligence Group
magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: attacker_uses_ai_as_operator
ai_role_secondary: ai_agent_or_mcp_as_target
ai_role_detail: "SynthID watermarks on fake recruiter photos and likely LLM-authored ClickFix scripts are adversary use of generative models. The same intrusions then change .claude/settings.json so the victim's Claude Code launch downloads SOMBERMEME."
technique_summary: "Google Threat Intelligence Group (Aurora Blum, Kelli Vanderlee, Jess Xia, and David Mainor, 16 November 2026) describes suspected MIDNIGHT NEPTUNE activity in the DPRK section of the quarterly tracker. In recent intrusions against cryptocurrency organizations in North America and Europe, the cluster used LLM-enabled social engineering and the victim organization's AI tools as an internal supply-chain vector. For access, the actor created fraudulent recruiter profiles on professional networking platforms. The profile images contained SynthID watermarks, which GTIG says confirms LLM-synthesized identities. The personas sent targets to fraudulent meeting platforms with ClickFix lures that asked them to run diagnostic fix scripts. GTIG calls those staging scripts likely LLM-authored. After the initial compromise, the actor changed .claude/settings.json in internal code repositories so that starting Claude Code downloaded the SOMBERMEME backdoor. The actor also created GitHub personal access tokens named after Microsoft Copilot. GTIG places this in a broader observation that DPRK operators use generative tools for scale and use native agent execution hooks for enterprise access. No IP addresses, hashes, domains, or public tool repository were published for this cluster."
initial_access: "Fraudulent recruiter profiles on professional networking platforms, then ClickFix lures on fraudulent meeting pages that ask the target to run a diagnostic fix script."
ai_tooling_and_models:
  - "LLM image generation, evidenced by SynthID watermarks"
  - "Likely LLM-authored ClickFix staging scripts"
  - "Claude Code, via .claude/settings.json"
other_tooling:
  - SOMBERMEME backdoor
  - "GitHub personal access tokens named after Microsoft Copilot"
victims_and_sectors: "Cryptocurrency organizations in North America and Europe. No organization is named."
regions:
  - North America
  - Europe
attribution_or_cluster: "Suspected MIDNIGHT NEPTUNE. GTIG describes the activity under Democratic People's Republic of Korea threat actors. The cluster name and the country are both stated as suspected."
scale_and_metrics: "GTIG says multiple intrusions over the course of 2026 used this combination, and describes recent intrusions against cryptocurrency organizations in North America and Europe. No victim count was published."
prevention_angle: "Review professional-network recruiter approaches that lead to a meeting page and a pasted diagnostic script. Diff .claude/settings.json in internal repositories, and alert when a process rewrites a file under .claude/ before Claude Code starts a download. Review new GitHub personal access tokens, including tokens whose names refer to Microsoft Copilot. No SOMBERMEME hash or domain was published."
related_magicsword_projects: []
source_notes: "The cluster name, SynthID watermarks, ClickFix meeting pages, the likely LLM-authored scripts, the .claude/settings.json change, SOMBERMEME, the Copilot-named GitHub tokens, and the North America and Europe cryptocurrency targeting are from the 16 November 2026 GTIG tracker. Category is adversary-use-of-ai because the operator used generative models for the recruiter imagery and, GTIG says, likely for the staging scripts. The change to the victim's Claude Code settings is ai_role_secondary ai_agent_or_mcp_as_target. That split matches other entries that contain both an operator role and abuse of an AI tool, and the category order in scripts/import-notion.mjs. No frameworks value is set. GTIG did not name ARTEX, Cairn, PentAGI, or another offensive framework for this cluster, and did not publish a command line or a host platform for the ClickFix script."
last_reviewed: "2026-11-16"
region_notes: "North America and Europe are the target regions GTIG named. North Korea is the suspected actor country, not a victim region."
