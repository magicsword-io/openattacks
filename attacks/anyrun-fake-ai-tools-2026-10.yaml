technique_summary: "1,258 public sandbox runs (Apr 15–Oct 5 2026) tied to lures as Claude, ChatGPT,
  Copilot, Gemini, Ollama, OpenClaw, Manus. Patterns: InstallFix one-liner domain swap; ClickFix
  Download Claude via mshta; shared claude.ai/chatgpt.com chats; trojanized Claude_x64-setup.exe
  with mseupdate headless Edge cookie grab; BiTB fake AI ads for marketers."
initial_access: Search/malvertising/shared AI chats → paste command or run installer
ai_tooling_and_models:
  - Impersonated Claude, ChatGPT, Copilot, Gemini, Ollama, OpenClaw, Manus, Codex, Perplexity
other_tooling:
  - mshta
  - PowerShell irm|iex
  - msiexec
  - msedge --remote-debugging-port=9222
  - MacSync / Aura Stealer / HijackLoader
victims_and_sectors: Developers, marketers, general users; US second-largest submitter country
  (16%), first in Download Claude and ChatGPT chains; tech/telecom/education heavy
regions:
  - Multiple regions
attribution_or_cluster: Multiple overlapping kits (InstallFix, ClickFix Claude, trojanized installer, AI Ads BiTB)
scale_and_metrics: 1,258 analyses; Claude 48%; ≥45% end in paste-and-run
prevention_angle: Approved AI catalog; take paste-and-run from standard users; prevent mshta/wscript/unsigned scripts
