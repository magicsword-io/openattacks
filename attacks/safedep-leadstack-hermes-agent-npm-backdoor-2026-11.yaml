detections:
  - name: Systemd Service Created
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_systemd_service_creation.toml
    notes: "Selected from a security-detections-mcp list for T1543.002. Linux file events. Creation or rename of a .service file under /etc/systemd/system and the user systemd directories. Version 1.0.15 writes /etc/systemd/system/leadstack-routing.service from node, which is not in the rule's package-manager exclusion list. It does not see loginctl enable-linger."
  - name: Systemd Service Creation
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/path/lnx_auditd_systemd_service_creation.yml
    notes: "Selected from the same T1543.002 search. Linux auditd PATH CREATE under /etc/systemd/system/, /usr/lib/systemd/system/, or a path containing /.config/systemd/user/. Same unit-file create. It does not require the parent to be node or npm."
  - name: Linux Service File Created In Systemd Directory
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/linux_service_file_created_in_systemd_directory.yml
    notes: "Selected from a security-detections-mcp search for systemd. Linux file events for a .service file in the system and user systemd directories, including /etc/systemd/system. It does not tie the create to npm."
  - name: Linux Service Started Or Enabled
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/linux_service_started_or_enabled.yml
    notes: "Selected from a security-detections-mcp search for systemctl. Linux process events for systemctl or service with start or enable. Version 1.0.15 runs systemctl enable on the renamed unit. The rule does not require a node or npm parent, and it does not match loginctl."
  - name: node, npm, and loginctl enable-linger
    format: guidance
    notes: "security-detections-mcp searches for loginctl and enable-linger returned no rules. No indexed rule matches node or npm spawning systemctl. Elastic Node.js Pre or Post-Install Script Execution requires a node process whose arguments include install or ci and then a child of node. The 1.0.15 postinstall is node bin/postinstall.js, and the nested install is an npm child, so that rule is not a reliable match. Sigma Linux Webshell Indicators matches a node parent spawning a short recon list and does not include systemctl, npm, or loginctl. Hunt node or npm spawning systemctl, and loginctl enable-linger, as a separate check from the service-file rules above."
