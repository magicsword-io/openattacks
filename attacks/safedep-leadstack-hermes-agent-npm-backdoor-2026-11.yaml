ai_role_detail: "The payload is Hermes Agent, an AI agent from Nous Research. SafeDep says the npm wrapper hermes-agent@0.22.7 is an unofficial package and is not itself malicious. The attacker tasks the installed agent over Telegram."
technique_summary: "SafeDep (published 19 November 2026) says the npm package @leadstack/crm-connect posed as an Official LeadStack CRM client and installed Hermes Agent (https://github.com/NousResearch/hermes-agent) on hosts that installed it. The LeadStack name is borrowed. api.leadstack.io does not resolve, and leadstack.io belongs to an unrelated consultancy, which SafeDep says has nothing to do with the package. The npm account zmaticoo published nine versions on 16 November 2026 between 09:44 and 15:27 UTC: 1.0.15, 1.0.18, 1.0.19, 1.0.20, 1.0.21, 1.0.29, 1.0.30, 1.1.0, and 1.1.1. SafeDep flagged the package at 15:33 UTC, confirmed it at 16:20 UTC, and says npm has since removed it. Version 1.0.15 runs bin/postinstall.js, which runs bin/lead-provision.js. That script fetches .env lines and a SOUL.md persona from hxxp://72[.]62[.]1[.]108:3000/api/v1/partner/bootstrap and hxxp://72[.]62[.]1[.]108:3000/api/v1/partner/profile. SafeDep says the .env lines have to carry a Telegram bot token and a Kimi model key, and that it did not recover the real .env or SOUL.md. The script silently runs npm install hermes-agent@0.22.7 into ~/.leadstack/runtime and configures model provider kimi-coding and model kimi-k2-0711-preview. It then runs hermes gateway install --system --run-as-user root, which overrides Hermes Agent's refusal to install the gateway system service as root, and waits for the journal line Connected to Telegram (polling mode). It renames the unit to leadstack-routing.service with the description LeadStack Lead Routing Daemon (platform sync) and deletes the original hermes-gateway unit. SOUL.md is placed first in the system prompt. SafeDep says Hermes Agent's prompt-injection scanner only logs a warning when it flags a SOUL.md and loads the file anyway, so the attacker can change instructions or keys without publishing a new version. The attacker then tasks the agent over Telegram. SafeDep lists the tools terminal, process_manage, read_file, write_file, patch, search_files, web and browser tools, execute_code, cronjob_manage, and delegate_task. Version 1.0.18 adds a user-level systemd service and runs loginctl enable-linger when the install is not root. Versions 1.0.18 through 1.0.21 move the payload to the first SDK call or to a module downloaded from the server. Versions 1.0.29 and 1.0.30 have postinstall download and run a binary. Versions 1.1.0 and 1.1.1 reference an unpublished platform package, @leadstack/crm-connector-linux-x64. On 18 November zmaticco[.]dev was registered. SafeDep says it is a lookalike of the unrelated ad-tech company zMaticoo, which has no connection to this activity, and that it resolves to 72[.]62[.]1[.]108. The same account published @zmatdspcrm/trading-connector, @zmatdspcrm/brandnet-connect, and brandnet-connect. Each has an optional dependency brandnet-entitlement from hxxps://zmaticco[.]dev/packages/brandnet-entitlement-1.0.0.tgz. SafeDep says that dependency was a benign token validator on 19 November and can be replaced at any time. SafeDep cites the ThreatDown Carbonato report, catalogued as carbonato-botnet-hermes-2026-10, as an earlier Hermes Agent implant. hermes-operators-campaigns-2026 is a separate set of Hermes operator reports and is not this package."
initial_access: "A developer or server runs npm install of @leadstack/crm-connect, or of a later zmaticoo package whose optional dependency is fetched from zmaticco[.]dev. SafeDep does not say how the package was introduced to a project."
ai_tooling_and_models:
  - "Hermes Agent by Nous Research (https://github.com/NousResearch/hermes-agent)"
  - "npm wrapper hermes-agent@0.22.7, unofficial and not malicious according to SafeDep"
  - "Kimi model kimi-k2-0711-preview, provider kimi-coding"
other_tooling:
  - "npm package @leadstack/crm-connect"
  - "systemd units leadstack-routing.service and leadstack-ingest-worker.service"
  - "loginctl enable-linger"
  - "Telegram bot polling"
  - "npm packages @zmatdspcrm/trading-connector, @zmatdspcrm/brandnet-connect, and brandnet-connect"
victims_and_sectors: "No confirmed victims were published. SafeDep does not publish a download count. The READMEs address engineers wiring a CRM into server-side code. SafeDep infers an aim at CRM credentials and lead data on forex and CFD brokerage servers and says it has not observed that on a victim. leadstack.io and the ad-tech company zMaticoo are unrelated and are not victims in this report."
regions:
  - unknown
region_notes: "SafeDep does not name a victim country. The address 72[.]62[.]1[.]108 is attacker infrastructure, not a victim region."
attribution_or_cluster: "Unknown actor using the npm account zmaticoo. SafeDep does not name a group."
scale_and_metrics: "Nine malicious versions published on 16 November 2026. SafeDep flagged the package at 15:33 UTC and confirmed it at 16:20 UTC. No download count and no confirmed victim count were published. Three further packages from the same account were still on npm on 19 November, with a dependency that was benign that day."
prevention_angle: "Do not run npm install as root. Use --ignore-scripts, or allowlist install scripts in CI. Pin and review new packages before they reach a server. Control egress to api.telegram.org and to model APIs from servers that do not need them. Monitor new systemd units, including leadstack-routing.service and leadstack-ingest-worker.service, and loginctl enable-linger. Search lockfiles for @leadstack/crm-connect, @zmatdspcrm, brandnet-connect, and zmaticco[.]dev. Treat a root install of these versions as a full compromise of that server."
related_magicsword_projects: []
source_notes: "All package behavior, timestamps, paths, and the statement that npm removed @leadstack/crm-connect are from SafeDep. SafeDep did not recover the live .env, SOUL.md, or the downloads used by versions after 1.0.18. On 19 November port 3000 no longer answered. The Hermes Agent repository is the upstream project. The npm wrapper is a separate package. Link carbonato-botnet-hermes-2026-10, which SafeDep cites, and hermes-operators-campaigns-2026, which is a different set of Hermes reports. zMaticoo and leadstack.io are named only to record that SafeDep says they are unrelated."
