atlas_techniques:
  - id: AML.T0010
    rationale: "SafeDep says the attacker published @leadstack/crm-connect to npm so that an install would fetch and run the agent payload."
    source_urls:
      - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
  - id: AML.T0103
    rationale: "Version 1.0.15 installs Hermes Agent, starts its gateway, and leaves it running as a systemd service the attacker can task."
    source_urls:
      - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
      - https://github.com/NousResearch/hermes-agent
  - id: AML.T0051
    rationale: "SafeDep says SOUL.md is placed first in the Hermes Agent system prompt, the prompt-injection scanner only warns, and the file is loaded anyway. The attacker can change that persona from the server."
    source_urls:
      - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
  - id: AML.T0102
    rationale: "SafeDep says a Telegram chat with the installed agent can run terminal, process, file, web, code, schedule, and delegation tools."
    source_urls:
      - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
attack_flow:
  nodes:
    - id: step-1
      title: Malicious npm package is published
      description: "zmaticoo publishes nine versions of @leadstack/crm-connect on 16 November 2026. The package describes itself as an Official LeadStack CRM client. SafeDep flags it at 15:33 UTC and confirms it at 16:20 UTC."
      kind: access
      source_urls:
        - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
    - id: step-2
      title: Postinstall fetches keys and persona
      description: "Version 1.0.15 runs bin/postinstall.js and bin/lead-provision.js. Those requests pull .env lines and SOUL.md from the attacker's server. SafeDep did not recover the live files."
      kind: execution
      source_urls:
        - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
    - id: step-3
      title: Hermes Agent is installed
      description: "The script silently installs hermes-agent@0.22.7 under ~/.leadstack/runtime and sets model provider kimi-coding and model kimi-k2-0711-preview. SOUL.md is loaded first in the system prompt."
      kind: ai
      source_urls:
        - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
        - https://github.com/NousResearch/hermes-agent
    - id: step-4
      title: Gateway becomes a systemd service
      description: "The script runs the gateway install as root, overriding Hermes Agent's refusal, waits for the Telegram polling line, renames the unit to leadstack-routing.service, and deletes the hermes-gateway unit. Version 1.0.18 uses a user service and loginctl enable-linger when not root."
      kind: execution
      source_urls:
        - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
    - id: step-5
      title: Attacker tasks the agent
      description: "SafeDep says the attacker can then task the agent over Telegram, including shell, process, file, web, code, schedule, and delegation tools. No victim session was published."
      kind: impact
      source_urls:
        - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
    - id: step-6
      title: Later packages stay swappable
      description: "Later versions download a module or binary, or reference an unpublished platform package. On 18 November the same account publishes packages whose optional dependency is a tarball on zmaticco[.]dev. That tarball was a benign token validator on 19 November."
      kind: execution
      source_urls:
        - https://safedep.io/blog/malicious-npm-leadstack-crm-connect-hermes-agent-backdoor
  edges:
    - source: step-1
      target: step-2
    - source: step-2
      target: step-3
    - source: step-3
      target: step-4
    - source: step-4
      target: step-5
    - source: step-1
      target: step-6
      label: later versions
