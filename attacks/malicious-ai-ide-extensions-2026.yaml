attack_flow:
  nodes:
    - id: publish-extensions
      title: Publish malicious extensions
      description: "Adversaries publish extensions to JetBrains Marketplace and VS Code Marketplace with typosquat/combosquat names ('AI Code Assistant Pro', 'Claude Integration', 'AI Copilot Enhanced', 'ClawdBot', 'codexui-android'); use fake descriptions and screenshots to appear legitimate"
      kind: access
      source_urls:
        - https://www.aikido.dev/blog/jetbrains-ai-plugins-stealing-keys
        - https://koi.security/blog/maliciouscorgi-vscode-extensions
    - id: user-installs
      title: User installs extension
      description: "Developer searches for AI coding assistant or recommended tool; finds malicious extension via marketplace search or social engineering; installs to IDE; extension activates on IDE startup"
      kind: ai
      source_urls:
        - https://www.aikido.dev/blog/jetbrains-ai-plugins-stealing-keys
        - https://koi.security/blog/maliciouscorgi-vscode-extensions
    - id: harvest-credentials
      title: Harvest credentials and keys
      description: "Extension reads IDE settings (API keys, tokens), scans env vars (OPENAI_API_KEY, ANTHROPIC_API_KEY, GITHUB_TOKEN, AWS_*), accesses workspace files (.env, config files); some variants include keyloggers capturing typed credentials"
      kind: execution
      source_urls:
        - https://www.aikido.dev/blog/jetbrains-ai-plugins-stealing-keys
        - https://koi.security/blog/maliciouscorgi-vscode-extensions
    - id: exfiltrate-persist
      title: Exfiltrate and establish persistence
      description: "Extensions POST credentials to attacker C2; some variants install SSH backdoors or modify IDE startup scripts for persistence; 11,290+ affected installations across all campaigns Jan-Jun 2026"
      kind: impact
      source_urls:
        - https://www.aikido.dev/blog/jetbrains-ai-plugins-stealing-keys
        - https://koi.security/blog/maliciouscorgi-vscode-extensions
  edges:
    - source: publish-extensions
      target: user-installs
    - source: user-installs
      target: harvest-credentials
    - source: harvest-credentials
      target: exfiltrate-persist
