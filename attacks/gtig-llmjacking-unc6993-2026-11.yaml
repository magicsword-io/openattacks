attack_flow:
  nodes:
    - id: initial-access
      title: Compromised cloud identity and LLM API keys
      description: "Misconfigured Service Account keys; session hijacking page for LLM portal JSON payloads; stolen GitHub PATs + web app vuln; compromised IAM with federation tokens; exposed LLM API keys harvested from public GitHub; stealthy validation sweeps with max_tokens=1"
      kind: access
      source_urls:
        - https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models
    - id: lateral-persistence
      title: Privilege escalation and persistence
      description: "Enumerated cloud services/repos/data stores; cloned codebases for secrets; queried data warehouse metadata; exploited LiteLLM CVE-2026-40217 (/key/regenerate rebind) to elevate Virtual Keys to PROXY_ADMIN; created unauthorized IAM/service accounts; injected SSH keys; attached admin policies; created backdoor accounts disguised as billing utilities"
      kind: execution
      source_urls:
        - https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models
    - id: llm-abuse
      title: LLM resource hijacking
      description: "Enabled managed generative platforms; created additional API keys; subscribed Pay-As-You-Go; selected premium models; launched high-volume inference; 'burn and rotate' short-lived service accounts; provisioned GPU instances; requested quota increases; deployed LiteLLM gateways; hosted Manus agent framework with SearXNG metasearch and sandbox execution"
      kind: ai
      source_urls:
        - https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models
    - id: monetization
      title: LLM Mixer resale
      description: "UNC6993 deployed new-api and gcli2api to aggregate stolen keys and balance loads; Jet Night (jet-night.com) $60/month unlimited token plan powered by stolen keys, passed ~$1M costs to victim; ai-relay on lookalike domains siphons access to newapi.pro resale ecosystem; D1337-KAIROS persona with Node.js proxy bundles; division of labor between access and monetization operators"
      kind: impact
      source_urls:
        - https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models
    - id: charges
      title: Fraudulent billing
      description: "UNC6993 accumulated $100K+ charges quickly; cumulative charges at orgs reaching $1M; one actor 800K Bedrock calls over 30 hours (Opus 75% of calls), another 1.7M calls over 13 hours; token usage profile resembles resold coding-agent traffic with prompt caching; $100K+ estimated usage at list price for two documented cases"
      kind: impact
      source_urls:
        - https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models
