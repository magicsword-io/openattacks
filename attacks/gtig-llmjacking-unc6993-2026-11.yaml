detections:
  - name: Cloud LLM resource abuse monitoring
    format: guidance
    notes: "Implement budget alerts and API quotas; monitor for validation sweeps (max_tokens=1); detect rapid GPU provisioning; alert on Pay-As-You-Go subscriptions from service accounts; monitor LiteLLM/new-api/gcli2api gateway deployments; detect Manus agent framework and SearXNG installations; flag burn-and-rotate service account patterns; monitor Jet Night, ai-relay, newapi.pro resale infrastructure connections"
  - name: Third-party cloud provider security
    format: guidance
    notes: "For Fireworks AI incident: audit third-party cloud provider access; implement least-privilege for R&D environments; monitor unauthorized workload execution; detect account/billing data access anomalies; alert on secrets, datasets, model weight access; implement cloud provider security controls. Notion downstream notice has no endpoint or CloudTrail pattern: the exposed objects are Notion AI Insights chat transcripts held by the vendor. Affected customers should treat those transcripts as exposed and rotate secrets pasted into Notion AI."
