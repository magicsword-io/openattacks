ai_role_detail: "Threat actors hijack enterprise LLM access, generate $100K-$1M USD fraudulent charges, monetize via LLM Mixers (illicit routing gateways), deploy agentic workloads with Manus framework"
technique_summary: "Multiple threat clusters (UNC6993, Jet Night operators, D1337-KAIROS) hijack enterprise access to LLMs across AWS Bedrock, Azure, GCP. Initial access via exposed cloud identity tokens (IAM, Service Account keys, GitHub PATs, session tokens), stolen LLM API keys from public GitHub, exploited web app vulnerabilities, LiteLLM CVE-2026-40217 (/key/regenerate endpoint rebind). UNC6993 used session hijacking page masquerading as app portal to steal JSON payloads with active access tokens. Threat actors enable LLM services, create API keys, provision GPUs, subscribe Pay-As-You-Go, deploy LiteLLM/new-api/gcli2api gateways, host Manus agent framework with SearXNG metasearch. Monetize via LLM Mixers (Jet Night at jet-night.com $60/month unlimited, ai-relay on lookalike domains, newapi.pro). Stealthy credential validation sweeps with max_tokens=1. Fraudulent charges $100K in single day, cumulative $1M per org. Division of labor between initial access and downstream monetization. Fireworks AI (Nov 9, 2026) reports Oct 23 third-party cloud provider hosting Fireworks R&D breached; Oct 24 attacker entered via provider, ran unauthorized workload; reached account/billing data and, for some customers, secrets, datasets, partly trained model weights. Fireworks attributes to financially motivated LLMjacking group selling access to illicit routing gateways; GTIG/Mandiant report referenced; Unit 42 forensics. Notion, a Fireworks customer, published a downstream notice: Fireworks told Notion on Nov 2 that a small dataset of Notion AI synthetic test data was accessed; Notion disconnected and deleted Fireworks data by the morning of Nov 3; on Nov 6 Fireworks said customer data may have been accessed; on Nov 8 Fireworks confirmed the final dataset; on Nov 9 Notion contacted affected customers. The exposed data is Notion AI Insights chat transcripts for under 1 percent of workspaces, mostly unattributable (no user or workspace labels, and no tool-call results). No other Notion features were affected. Notion told affected customers to treat the transcripts as exposed and to rotate secrets pasted into Notion AI. On Nov 11 Notion revoked exposed Notion API keys found in affected user messages."
initial_access: "Misconfigured Service Account keys; session hijacking page masquerading as LLM portal; stolen GitHub PATs + web app vulnerability exploitation; compromised IAM credentials with cloud federation tokens; harvested exposed LLM API keys from public GitHub; LiteLLM CVE-2026-40217 (user ID rebind vulnerability in /key/regenerate endpoint)"
ai_tooling_and_models:
  - AWS Bedrock
  - Azure Cognitive Services
  - GCP Gemini Enterprise Agent Platform
  - LiteLLM gateway
  - new-api (centralized model hub and gateway)
  - gcli2api (API proxy tool)
  - Manus agent framework
  - SearXNG metasearch
  - agent-infra/sandbox execution environments
other_tooling:
  - Jet Night reseller (jet-night.com)
  - D1337-KAIROS persona
  - ai-relay custom proxy infrastructure
  - newapi.pro resale ecosystem
  - Node.js proxy bundles
  - Burn and rotate service account strategy
victims_and_sectors: "Organizations in North America, South America, Asia Pacific across financial services, retail, technology, transportation sectors; Fireworks AI customers (account/billing data, secrets, datasets, partly trained model weights for some customers); Notion workspaces using Fireworks for Notion AI Insights (under 1 percent, chat transcripts)"
regions:
  - North America
  - South America
  - Asia
attribution_or_cluster: "UNC6993 (Mandiant); Jet Night operators; D1337-KAIROS persona; multiple financially motivated threat clusters operating globally; division of labor between initial access operators and LLM Mixer monetization operators"
scale_and_metrics: "Multiple incidents in 2026; fraudulent charges exceeding $100K USD in single day; cumulative charges at some orgs reaching $1M USD; Jet Night passed nearly $1M in token costs to victim org; one actor made ~800K Bedrock calls over 30 hours (90% success), another 1.7M calls over 13 hours (1M+ success); 500K+ LLM API calls in <8 hours; Jet Night offers unlimited tokens $60/month (typical market $100-$250/month)"
prevention_angle: "IAM least privilege; centralized secrets management; code monitoring for API keys; routine config audits; rate limiting via Cloud Armor; network allow listing; budget alerts and API quotas; phishing-resistant MFA; shadow LLM discovery; granular API key scopes; validation sweep monitoring (max_tokens=1); vulnerability/ML supply chain patching; gateway patch management (LiteLLM CVE-2026-40217); sandboxed execution; vetted model repositories; graph-based exposure modeling"
related_magicsword_projects: []
source_notes: "GTIG (Google Threat Intelligence Group) responded to multiple 2026 incidents; building on previous underground LLM credential market reporting; observed division of labor between access and monetization; LLM Mixers as illicit routing gateways; 'burn and rotate' service account strategy; Jet Night advertised outages on Telegram likely due to revoked stolen keys"
