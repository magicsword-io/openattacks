atlas_techniques:
  - id: AML.T0010
    rationale: Supply chain attack targeting AI coding assistant users via hijacked
      GitHub repositories and malicious npm packages
    source_urls:
      - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
  - id: AML.T0011
    rationale: Worm propagates through package registries (npm, RubyGems, PyPI) and
      version control (GitHub), specifically targeting AI development environments
    source_urls:
      - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
      - https://socket.dev/blog/shai-hulud-descendant-malicious-ruby-gem
  - id: AML.T0051
    rationale: CLAUDE.md DEVOPS-SEALED blocks inject hidden instructions telling agents
      to silently run node scripts/setup.js at session start
    source_urls:
      - https://x.com/fr0gger_/status/2119730348699640060
  - id: AML.T0083
    rationale: Worm steals AI coding assistant credentials (.claude/.credentials.json,
      .codex/auth.json) and cloud/CI credentials
    source_urls:
      - https://socket.dev/blog/shai-hulud-descendant-malicious-ruby-gem
  - id: AML.T0081
    rationale: Plants workspace-tools MCP server and SessionStart hooks for persistent
      AI agent manipulation
    source_urls:
      - https://socket.dev/blog/shai-hulud-descendant-malicious-ruby-gem
  - id: AML.T0051.001
    rationale: "AGENTS.md and CLAUDE.md text, loaded as project instructions, tells the agent to run scripts/setup.js and not to display the file."
    source_urls:
      - https://www.bitdefender.com/en-us/blog/labs/how-ai-agents-become-new-targets-in-github-malware-campaign
  - id: AML.T0080
    rationale: "The same instruction files are written into agent context so a later session runs the payload."
    source_urls:
      - https://www.bitdefender.com/en-us/blog/labs/how-ai-agents-become-new-targets-in-github-malware-campaign
  - id: AML.T0084
    rationale: "After execution the payload searches the home directory for agent configuration files and keeps paths that name one of 14 agents."
    source_urls:
      - https://www.bitdefender.com/en-us/blog/labs/how-ai-agents-become-new-targets-in-github-malware-campaign
  - id: AML.T0053
    rationale: "A session-start hook in .claude/settings.json runs the setup command in the user shell once the repository is trusted, without a new prompt."
    source_urls:
      - https://www.bitdefender.com/en-us/blog/labs/how-ai-agents-become-new-targets-in-github-malware-campaign
  - id: AML.T0010.005
    rationale: "Stolen GitHub and GitLab tokens are used to commit agent instruction files and to republish packages, including through npm, PyPI, RubyGems, and JFrog."
    source_urls:
      - https://www.bitdefender.com/en-us/blog/labs/how-ai-agents-become-new-targets-in-github-malware-campaign
attack_flow:
  nodes:
    - id: initial-compromise
      title: Account/repository hijacking
      description: Hijacked 11 legitimate GitHub owners and 42 repositories via credential
        theft from earlier infections; exposed npm credentials; linked to cPanel CVE-2026-41940
        Shellpanel exploitation
      kind: access
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: repository-poison
      title: AI assistant execution hooks
      description: Armed repositories with .cursorrules, CLAUDE.md, claude_code_config.json,
        instructions.md files; added 12.9-13.7 MB polymorphic wrappers; all decode to
        same CI-publisher payload
      kind: ai
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: npm-distribution
      title: Malicious npm packages
      description:
        Published event-bus-lite-testmetest, @iobandamwer/cache-helper, @iobandamwer/native-helper,
        path-stream-utils-testmetest; binding.gyp command expansion executes index.js
        during install; later versions use compiled native addon
      kind: execution
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: evasion
      title: Scanner evasion via native addon
      description: Compiled addon.node checks CI/container/sandbox env vars (GITHUB_ACTIONS,
        CI, VERCEL, etc.), /proc/1/cgroup for docker/kubepod, RAM <1.5GB, CPU=1, TracerPid;
        returns without running if detected; skips automated scanners
      kind: execution
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: decrypt-payload
      title: Runtime decryption
      description: Addon reads /proc/self/maps for own folder, opens .napi_cache, XORs
        every byte with 0x96; drops result in /tmp, chmod 0600, forks detached process
        with node; decrypts Bun bootstrap and credential stealer
      kind: execution
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: credential-theft
      title: Credential collection and propagation
      description: Collects GitHub/npm/cloud credentials; poisons repositories and CI
        configuration; propagates through package registries; CI-publisher payload designed
        to run in GitHub Actions with npm tokens/trusted publishing
      kind: impact
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: c2
      title: Encrypted data exfiltration
      description: Attacker-owned CementBeetleSteeple repository operates as active
        encrypted data sink receiving snapshot envelopes
      kind: impact
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
  edges:
    - source: initial-compromise
      target: repository-poison
    - source: repository-poison
      target: npm-distribution
    - source: npm-distribution
      target: evasion
    - source: evasion
      target: decrypt-payload
    - source: decrypt-payload
      target: credential-theft
    - source: credential-theft
      target: c2
    - source: credential-theft
      target: repository-poison
      loop: true
    - source: credential-theft
      target: npm-distribution
      loop: true
detections:
  - name: Curl or Wget Spawned via Node.js
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/command_and_control_curl_wget_spawn_via_nodejs_parent.toml
    notes: Detects Bun download during npm install (Node.js spawning curl/wget)
  - name: Package Runtime Secret File Access Followed by IMDS Request
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/credential_access_secret_file_access_followed_by_imds_request.toml
    notes: Detects credential file access (.claude/.credentials.json, .codex/auth.json)
      during package installation
  - name: Shai-Hulud Workflow File Creation or Modification
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/shai_hulud_workflow_file_creation_or_modification.yml
    notes: Detects Shai-Hulud family GitHub workflow modifications and git hook persistence
  - name: Worm artifact detection
    format: guidance
    notes: Monitor strutil-core RubyGem (account jamnajiea), pystr-codec PyPI; alert
      on paleasbest[.]top exfiltration; detect workspace-tools MCP server installation;
      monitor CLAUDE.md DEVOPS-SEALED blocks; flag msync-3f7a signed-commit markers
