attribution_or_cluster: GitHub account CementBeetleSteeple; SafeDep identifies as
  Miasma-family, Shai-Hulud-descendant payload; not established that original Miasma
  operators responsible; linked to Shellpanel cPanel exploitation (CVE-2026-41940)
scale_and_metrics: 42 armed repositories; 11 hijacked legitimate owners; multiple
  malicious npm packages (event-bus-lite-testmetest, @iobandamwer/cache-helper, @iobandamwer/native-helper,
  path-stream-utils-testmetest); polymorphic wrappers 12.9-13.7 MB; discovered Oct
  21-26, 2026
prevention_angle: "Monitor GitHub repositories for unexpected .cursorrules/CLAUDE.md/instructions.md
  files; native addon scrutiny; large dotfiles in packages; npm install hook abuse;
  GitHub Actions secret access; CI environment variable monitoring. Bitdefender's
  additions: reject instruction files that call setup.js a sealed artifact and tell the
  agent not to read it, and review .claude/settings.json session-start hooks before trusting
  a repository. The Bun runtime used by the inner bundle is https://github.com/oven-sh/bun."
