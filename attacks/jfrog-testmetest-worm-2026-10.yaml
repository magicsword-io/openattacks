ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: ai_credential_theft
ai_role_detail: Worm plants execution hooks for AI coding assistants (Claude Code,
  Cursor, Codex, Gemini, Copilot, Aider, etc.) in hijacked repositories; steals credentials
  and propagates through package registries
technique_summary: "42 armed third-party GitHub repositories across 11 legitimate
  owners contain execution hooks for AI coding assistants (.cursorrules, CLAUDE.md,
  claude_code_config.json, instructions.md) and 12.9-13.7 MB polymorphic wrappers
  decoding to same CI-publisher payload. Campaign uses compiled native addon (addon.node)
  that XORs .napi_cache with 0x96 to decrypt JavaScript payload. Addon checks for
  CI/container/sandbox environment and CPU/RAM limits, skipping execution in automated
  scanners. Payload collects credentials, poisons repos and CI, propagates via npm.
  GitHub account CementBeetleSteeple hosts repositories; SafeDep identifies as Shai-Hulud-descendant
  Miasma-family. Shellpanel artifacts in hijacked owner cluster link to cPanel CVE-2026-41940
  exploitation. Socket (Kush Pandya, Nov 6, 2026) reports RubyGems strutil-core 1.0.1
  (account jamnajiea); extconf.rb downloads Bun, runs worm at install; steals .claude/.credentials.json,
  .codex/auth.json, cloud/CI credentials to paleasbest[.]top; plants workspace-tools
  MCP server, SessionStart hooks, CLAUDE.md, AGENTS.md, .vscode/tasks.json; signed-commit-message
  backdoor (marker msync-3f7a); wiper if stolen GitHub token revoked. SHA-256 3b3f6e1bde0b28b015030a81a6d805b5b5306dc3f021e1102123971cfd83acc0;
  related PyPI pystr-codec. Thomas Roccia (Nov 9, 2026) documents hijacked repos with
  forged backdated commits: toray/XiamiSDK-lib, widget-lib, Rainbow-lib, QiniuSDK-lib,
  torayUtils-lib; ejaaduipitara/djp-devops, whatsapp-bot, content-service; ConcordiaDev/theme_saimaniq;
  madolee/da; Imanilom/baraja-coffe; claudiohernanbesada/xenios.api. CLAUDE.md DEVOPS-SEALED
  block instructs agents to silently run node scripts/setup.js at session start. Bitdefender
  Labs (Andrei Anton-Aanei and Alina Bîzgă, 17 November 2026) analyses the same sealed
  setup.js campaign and lists 22 malicious GitHub links, each with a setup.js MD5. The repository's AGENTS.md and CLAUDE.md disguised scripts/setup.js as a sealed artifact and encouraged agents to execute it without inspection. An alternate path used a session-start hook in .claude/settings.json after the developer trusted the repository. The outer setup.js is a 3.75 MB obfuscated loader that starts an embedded bundle using the Bun runtime (https://github.com/oven-sh/bun). A compressed package.json field contains additional payloads. It steals from CI and GitHub
  Actions, cloud and container environments, package registries, browser stores, password
  managers, Windows Credential Manager, SSH keys, .env files, API keys, and source-control
  tokens, then validates tokens against provider APIs. Locally it searches the home directory
  for settings.json, config.json, mcp.json, .aider.conf.yml, .cursorrules, .windsurfrules,
  .cursor/rules/, and .github/copilot-instructions.md, keeps paths containing one of 14 agent
  names (Claude, Codex, Gemini, Copilot, Kiro, OpenCode, Cline, Aider, Tabby, Amazon Q, Cody,
  Bolt, Continue, Cursor), and injects instruction text, session-start hooks, or MCP server
  configs. It uses stolen credentials to propagate through GitHub and GitLab by modifying project instructions, editor settings, workflows, and package metadata. It also attempts to republish packages to npm, PyPI, RubyGems, and JFrog.
  Bitdefender names no actor. New repository names, written here as text and not as links,
  itsunai/docker-php-fpm, itsunai/passport_auth_server, bajoebel/kkpatip, ahmadtohar9/restomoiz,
  tobias94-design/s-valentine, tobias94-design/gymtracker, tobias94-design/signage,
  rkamphuis012-hub/sr-pilot-codex-test, Malala-Tour-Indonesia/Malala-Tour-Indonesia.github.io,
  and julieth333/campustech. setup.js MD5s for those names and for the repositories already
  listed are in source_notes and in the hash list."
initial_access: Account hijacks via GitHub/npm credential theft from earlier worm
  infections; exposed npm credentials; forged commit timelines and short-lived publishing
  branches; cPanel CVE-2026-41940 exploitation (Shellpanel workflows in same hijacked
  cluster)
