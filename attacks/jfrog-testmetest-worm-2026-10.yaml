id: jfrog-testmetest-worm-2026-10
name: testmetest worm hijacks 42 GitHub repos with Claude/Gemini startup hooks
date_reported: 2026-10-26
researcher: Guy Korolevski, Yair Benamou
org: JFrog Security Research
sources:
  - url: https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    title: "Beyond testmetest: Native Addon Camouflage and 42 Armed GitHub Repositories"
borderline: false
borderline_note: null
ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: ai_credential_theft
ai_role_detail: "Worm plants execution hooks for AI coding assistants (Claude Code, Cursor, Codex, Gemini, Copilot, Aider, etc.) in hijacked repositories; steals credentials and propagates through package registries"
technique_summary: "42 armed third-party GitHub repositories across 11 legitimate owners contain execution hooks for AI coding assistants (.cursorrules, CLAUDE.md, claude_code_config.json, instructions.md) and 12.9-13.7 MB polymorphic wrappers decoding to same CI-publisher payload. Campaign uses compiled native addon (addon.node) that XORs .napi_cache with 0x96 to decrypt JavaScript payload. Addon checks for CI/container/sandbox environment and CPU/RAM limits, skipping execution in automated scanners. Payload collects credentials, poisons repos and CI, propagates via npm. GitHub account CementBeetleSteeple hosts repositories; SafeDep identifies as Shai-Hulud-descendant Miasma-family. Shellpanel artifacts in hijacked owner cluster link to cPanel CVE-2026-41940 exploitation."
initial_access: "Account hijacks via GitHub/npm credential theft from earlier worm infections; exposed npm credentials; forged commit timelines and short-lived publishing branches; cPanel CVE-2026-41940 exploitation (Shellpanel workflows in same hijacked cluster)"
ai_tooling_and_models:
  - Claude Code
  - Cursor
  - Codex
  - Gemini
  - GitHub Copilot
  - Aider
  - Continue
  - Windsurf
  - Cline
other_tooling:
  - npm binding.gyp command expansion
  - Bun 1.2.18 runtime
  - Native Node addon with XOR 0x96 encryption
  - Caesar transformation and AES-128-GCM
  - GitHub Actions for CI publishing
  - npm trusted publishing
victims_and_sectors: "42 GitHub repositories from 11 legitimate owners; AI development, npm package consumers"
regions:
  - unknown
attribution_or_cluster: "GitHub account CementBeetleSteeple; SafeDep identifies as Miasma-family, Shai-Hulud-descendant payload; not established that original Miasma operators responsible; linked to Shellpanel cPanel exploitation (CVE-2026-41940)"
scale_and_metrics: "42 armed repositories; 11 hijacked legitimate owners; multiple malicious npm packages (event-bus-lite-testmetest, @iobandamwer/cache-helper, @iobandamwer/native-helper, path-stream-utils-testmetest); polymorphic wrappers 12.9-13.7 MB; discovered Oct 21-26, 2026"
prevention_angle: "Monitor GitHub repositories for unexpected .cursorrules/CLAUDE.md/instructions.md files; native addon scrutiny; large dotfiles in packages; npm install hook abuse; GitHub Actions secret access; CI environment variable monitoring"
related_magicsword_projects: []
source_notes: "SafeDep first documented npm package side Oct 22; JFrog complementary GitHub infrastructure investigation; campaign shifted to native addon camouflage to evade scanners; addon environment checks skip CI/containers/sandboxes with <1.5GB RAM or 1 CPU"
last_reviewed: 2026-11-04
iocs:
  domains: []
  ips: []
  hashes: []
  urls:
    - https://github.com/CementBeetleSteeple
atlas_techniques:
  - id: AML.T0010
    rationale: "Supply chain attack targeting AI coding assistant users via hijacked GitHub repositories and malicious npm packages"
    source_urls:
      - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
  - id: AML.T0011
    rationale: "Worm propagates through package registries (npm) and version control (GitHub), specifically targeting AI development environments"
    source_urls:
      - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
attack_flow:
  nodes:
    - id: initial-compromise
      title: Account/repository hijacking
      description: "Hijacked 11 legitimate GitHub owners and 42 repositories via credential theft from earlier infections; exposed npm credentials; linked to cPanel CVE-2026-41940 Shellpanel exploitation"
      kind: access
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: repository-poison
      title: AI assistant execution hooks
      description: "Armed repositories with .cursorrules, CLAUDE.md, claude_code_config.json, instructions.md files; added 12.9-13.7 MB polymorphic wrappers; all decode to same CI-publisher payload"
      kind: ai
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: npm-distribution
      title: Malicious npm packages
      description: "Published event-bus-lite-testmetest, @iobandamwer/cache-helper, @iobandamwer/native-helper, path-stream-utils-testmetest; binding.gyp command expansion executes index.js during install; later versions use compiled native addon"
      kind: execution
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: evasion
      title: Scanner evasion via native addon
      description: "Compiled addon.node checks CI/container/sandbox env vars (GITHUB_ACTIONS, CI, VERCEL, etc.), /proc/1/cgroup for docker/kubepod, RAM <1.5GB, CPU=1, TracerPid; returns without running if detected; skips automated scanners"
      kind: execution
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: decrypt-payload
      title: Runtime decryption
      description: "Addon reads /proc/self/maps for own folder, opens .napi_cache, XORs every byte with 0x96; drops result in /tmp, chmod 0600, forks detached process with node; decrypts Bun bootstrap and credential stealer"
      kind: execution
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: credential-theft
      title: Credential collection and propagation
      description: "Collects GitHub/npm/cloud credentials; poisons repositories and CI configuration; propagates through package registries; CI-publisher payload designed to run in GitHub Actions with npm tokens/trusted publishing"
      kind: impact
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
    - id: c2
      title: Encrypted data exfiltration
      description: "Attacker-owned CementBeetleSteeple repository operates as active encrypted data sink receiving snapshot envelopes"
      kind: impact
      source_urls:
        - https://research.jfrog.com/post/beyond-testmetest-42-hijacked-github-repos/
  edges:
    - source: initial-compromise
      target: repository-poison
    - source: repository-poison
      target: npm-distribution
    - source: npm-distribution
      target: evasion
    - source: evasion
      target: decrypt-payload
    - source: decrypt-payload
      target: credential-theft
    - source: credential-theft
      target: c2
    - source: credential-theft
      target: repository-poison
      loop: true
    - source: credential-theft
      target: npm-distribution
      loop: true
