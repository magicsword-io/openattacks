  - Card skimmer malware
  - Tor network
  - VPS infrastructure
victims_and_sectors: "Multiple organizations across sectors including e-commerce, MSPs; S-RM IR engagements 2026"
regions:
  - Multiple regions
attribution_or_cluster: "Unnamed actors; attributed by S-RM incident response teams; multiple distinct but tactically similar ARTEX deployments"
scale_and_metrics: "Multiple IR engagements 2026; identity/cloud/code/firewall compromise in under 24 hours; MSP supply-chain pivot in one case; card skimmer deployment in another; persistent re-entry after containment"
prevention_angle: "Patch vulnerable web plugins promptly; restrict and validate file uploads; implement strict authentication for admin interfaces; monitor for ARTEX forensic indicators (/opt/artex/ directories, i<id> file/account tagging, SQL markers, norma/0.4 UA, self-signed ARTEX certs); block Tor egress where not required; implement network segmentation to limit lateral movement; rotate credentials after suspected compromise; monitor for artex-wtest- GitHub branch patterns; scrutinize @example.invalid emails in logs; deploy EDR to detect autonomous pivot behaviors; implement MSP supply-chain security controls"
related_magicsword_projects: []
source_notes: "S-RM blog (Nov 6, 2026) primary source documenting IR artifacts from multiple ARTEX engagements; all forensic indicators (file paths, SQL markers, UA strings, certificate details, GitHub patterns) verified from S-RM analysis; unnamed adversaries due to ongoing investigations. Sophos X-Ops (Nov 10, 2026) adds Windows host markers and the listed IPS IDs. 2313260 and 2313262 are not in the published signature table, so they are omitted. Sophos describes the customer activity as consistent with ARTEX or other AI-assisted tooling, which is vendor-asserted and does not replace the S-RM task-log evidence. Storm-0940 is Microsoft's attribution for ConnectWise, cited by Sophos, and is not used as the actor for the S-RM cases."
