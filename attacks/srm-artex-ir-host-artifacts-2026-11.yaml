detections:
  - name: Potential IIS Web Shell File Creation
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_web_shell_aspx_write.toml"
    notes: "Windows. ASPX web shell writes under IIS paths. Matches the Sophos report of webshell execution on customer hosts."
  - name: Suspicious Process By Web Server Process
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_webshell_susp_process_spawned_from_webserver.yml"
    notes: "Windows. Shells spawned by w3wp.exe and other web server processes."
  - name: Windows Sqlservr Spawning Shell
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_sqlservr_spawning_shell.yml"
    notes: "Windows. sqlservr.exe spawning cmd.exe or PowerShell, matching Sophos SQL Server command execution."
  - name: SQL Injection with Long URLs
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/web/sql_injection_with_long_urls.yml"
    notes: "Detects SQL injection patterns including ARTEX UNION SELECT and comment-based injection markers"
  - name: Suspicious C2 Activities
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_susp_c2_commands.yml"
    notes: "Detects Tor usage, curl/wget C2 patterns, and credential reuse behaviors"
  - name: ARTEX forensic artifact detection
    format: guidance
    notes: "Linux: monitor for /opt/artex/data/task/<task>/i<id>/ directory structures; alert on files and accounts tagged with i<id> patterns; flag HTTP User-Agent norma/0.4; scan for self-signed certificates with O=ARTEX, C=CN; monitor for Autonomous pentest console branding; detect GitHub branches named artex-wtest-*; alert on @example.invalid emails. Windows (Sophos): files named i[variant]_. such as i12345_b2.ps1, paths beginning artx under C:\\Windows\\Temp, and command markers MARKER123 or ARTX123. Cloud: service principal credential or role added by an application, and application sign-ins with a scripted user agent. Sophos file names Troj/Bckdr-SDA, Troj/Loader-TU, Linux/Agent-KD, ATK/Artex-A/B/C and IPS 2313266, 2313265, 2313264, 2313263, 2313261, 2313259, 2313258, 2313257 are vendor signatures, not public Sigma or Elastic rules."
  - name: Rapid lateral movement detection
    format: guidance
    notes: "Detect identity system pivots within 24-hour window; alert on cloud resource access from newly compromised credentials; monitor code repository access anomalies; flag firewall configuration changes from suspicious sources; detect MSP credential usage across multiple customer tenants; implement EDR behavioral detection for autonomous pivot patterns"
  - name: Card skimmer and payment fraud detection
    format: guidance
    notes: "Scan e-commerce sites for injected JavaScript card skimmers; monitor payment form modifications; detect exfiltration of payment data; alert on suspicious checkout flow changes"
