ai_role_detail: "Adversaries deploy ARTEX autonomous agents for full intrusion lifecycle automation, from initial compromise through identity/cloud/code/firewall pivots in under 24 hours, with documented MSP supply-chain pivots and persistent re-entry after containment"
technique_summary: "S-RM incident response analysis (Nov 6, 2026) documents real-world ARTEX deployment artifacts and TTPs from multiple IR engagements. Initial access via vulnerable web plugins and misconfigured upload endpoints; rapid credential harvesting and reuse; autonomous agents pivot through identity systems, cloud resources, code repositories, and firewall configurations within a single day. One case featured MSP supply-chain pivot; another deployed card skimmers on compromised e-commerce sites. Attackers demonstrated persistent re-entry capability after initial containment, shifting to Tor and VPS infrastructure after IP blocking. Forensic artifacts: /opt/artex/data/task/<task>/i<id>/ directory structure; compromised files and accounts tagged with i<id> markers; SQL injection signatures ARTEX' UNION SELECT 1-- and ARTEX'/**/AND/**/2>1--; HTTP User-Agent norma/0.4; ARTEX web console self-signed certificate (O=ARTEX, C=CN) displaying Autonomous pentest console branding; GitHub branches named artex-wtest-*; fake emails @example.invalid. Actor unnamed; attributed by S-RM incident response; confirmed AI involvement from recovered agent task logs and autonomous pivot patterns."
initial_access: "Vulnerable web plugins, misconfigured file upload endpoints"
ai_tooling_and_models:
  - ARTEX autonomous offensive agent (https://github.com/RuoJi6/ARTEX)
  - LLM backends for agent decision-making
other_tooling:
  - SQL injection tools
  - Credential harvesting utilities
  - Card skimmer malware
  - Tor network
  - VPS infrastructure
victims_and_sectors: "Multiple organizations across sectors including e-commerce, MSPs; S-RM IR engagements 2026"
regions:
  - Multiple regions
attribution_or_cluster: "Unnamed actors; attributed by S-RM incident response teams; multiple distinct but tactically similar ARTEX deployments"
scale_and_metrics: "Multiple IR engagements 2026; identity/cloud/code/firewall compromise in under 24 hours; MSP supply-chain pivot in one case; card skimmer deployment in another; persistent re-entry after containment"
prevention_angle: "Patch vulnerable web plugins promptly; restrict and validate file uploads; implement strict authentication for admin interfaces; monitor for ARTEX forensic indicators (/opt/artex/ directories, i<id> file/account tagging, SQL markers, norma/0.4 UA, self-signed ARTEX certs); block Tor egress where not required; implement network segmentation to limit lateral movement; rotate credentials after suspected compromise; monitor for artex-wtest- GitHub branch patterns; scrutinize @example.invalid emails in logs; deploy EDR to detect autonomous pivot behaviors; implement MSP supply-chain security controls"
related_magicsword_projects: []
source_notes: "S-RM blog (Nov 6, 2026) primary source documenting IR artifacts from multiple ARTEX engagements; all forensic indicators (file paths, SQL markers, UA strings, certificate details, GitHub patterns) verified from S-RM analysis; unnamed adversaries due to ongoing investigations"
