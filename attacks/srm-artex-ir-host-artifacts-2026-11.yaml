ai_role_detail: "Adversaries deploy ARTEX autonomous agents for full intrusion lifecycle automation, from initial compromise through identity/cloud/code/firewall pivots in under 24 hours, with documented MSP supply-chain pivots and persistent re-entry after containment"
technique_summary: "S-RM incident response analysis (Nov 6, 2026) documents real-world ARTEX deployment artifacts and TTPs from multiple IR engagements. Initial access via vulnerable web plugins and misconfigured upload endpoints; rapid credential harvesting and reuse; autonomous agents pivot through identity systems, cloud resources, code repositories, and firewall configurations within a single day. One case featured MSP supply-chain pivot; another deployed card skimmers on compromised e-commerce sites. Attackers demonstrated persistent re-entry capability after initial containment, shifting to Tor and VPS infrastructure after IP blocking. Forensic artifacts: /opt/artex/data/task/<task>/i<id>/ directory structure; compromised files and accounts tagged with i<id> markers; SQL injection signatures ARTEX' UNION SELECT 1-- and ARTEX'/**/AND/**/2>1--; HTTP User-Agent norma/0.4; ARTEX web console self-signed certificate (O=ARTEX, C=CN) displaying Autonomous pentest console branding; GitHub branches named artex-wtest-*; fake emails @example.invalid. Actor unnamed; attributed by S-RM incident response; confirmed AI involvement from recovered agent task logs and autonomous pivot patterns. Sophos X-Ops (Nov 10, 2026) separately reports activity at a small number of customers consistent with ARTEX or other AI-assisted tooling: webshell and SQL Server command execution, credential theft, lateral movement, rapid command bursts, and structured markers. Windows host markers are temporary files named i[variant]_. such as i12345_b2.ps1, paths beginning artx especially under C:\\Windows\\Temp, and command markers MARKER123 or ARTX123. Cloud markers are a service principal credential or role added by an application, and application sign-ins with a scripted user agent. Sophos file detections are Troj/Bckdr-SDA for a trojanized ARTEX Docker image (see badbyte-artex-backdoor-docker-2026-11), Troj/Loader-TU, Linux/Agent-KD, and ATK/Artex-A, ATK/Artex-B, and ATK/Artex-C. Published firewall and endpoint IPS signatures are 2313266, 2313265, 2313264, 2313263, 2313261, 2313259, 2313258, and 2313257. Sophos cites Microsoft's Storm-0940 attribution for the ConnectWise Cloud Backup case only; that name is not applied to the S-RM engagements."
initial_access: "Vulnerable web plugins, misconfigured file upload endpoints"
ai_tooling_and_models:
  - ARTEX autonomous offensive agent (https://github.com/RuoJi6/ARTEX)
  - LLM backends for agent decision-making
other_tooling:
