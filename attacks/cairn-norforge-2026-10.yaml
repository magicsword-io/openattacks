technique_summary: "Operators run open-source Cairn harnesses that loop AI coding agents toward intrusion goals (unauthenticated RCE, uploader shells). Panels ship with no login and Compose binds 0.0.0.0:8000, so NorForge and scanners could read task text, tooling, and secrets. AI did not invent new exploits; it made patient web exploitation cheap (~10% success, ~23h to goal). Oct 26 update: NorForge discovered threat actors AIA0009/AIA0010 hijacking exposed Cairn panels themselves, harvesting SSH keys and operator secrets from compromised panels, deploying Poseidon RAT to take over panel infrastructure and pivot to operators' own systems."
initial_access: Unauthenticated web RCE / upload / deserialization / SQLi-to-RCE chains against
  e-commerce and payment sites (task-driven); CVE-2026-75650 Magento lab tooling observed on workers
ai_tooling_and_models:
  - Cairn (open source AI harness)
  - Claude Code CLI via ANTHROPIC_BASE_URL to DeepSeek
  - Worker label claudecode_deepseek-v4.1-flash (AIA0001)
  - pi_openrouter_deepseek (AIA0002)
  - --dangerously-skip-permissions
  - Agent skill .agents/skills/tsec-actions/SKILL.md (CTF leftover)
other_tooling:
  - Playwright
  - PHPGGC
  - Nmap
  - ffuf
  - Amass
  - dnsrecon
  - StyleSmuggler PoC
  - Magento Open Source 2.4.9 lab
  - Docker
  - PHP
  - Python
  - OpenSSL
victims_and_sectors: E-commerce / payment / merchant sites; AIA0001 mostly US, Japan, Australia;
  AIA0002 merchant/gray-market/pharma and some African commerce; Reuters-reported one operator into
  100+ sites
