detections:
  - name: Detect unexpected binaries on web servers
    format: guidance
    notes: Monitor execution of nmap, python, php, openssl, and other recon/development
      tools on web servers that typically serve HTTP/HTTPS only. Default-deny or application
      control policies are recommended.
  - name: Detect agent harness panel exposure
    format: guidance
    notes: Scan for exposed Cairn or similar AI agent harness panels (default port 8000, no auth).
      Look for /api/*, /tasks, or panel-specific endpoints accessible without authentication.
