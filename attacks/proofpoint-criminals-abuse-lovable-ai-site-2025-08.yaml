region_notes: "Confiant names those countries as PseudoCamo or trading-bot targets. Actor origin is not used as a victim location. PseudoCamo is described as a sibling of the Eastern European BabaCamo cluster, and the TeamsAPK operator's status strings are Chinese. Neither statement is a country attribution."
attribution_or_cluster: "PseudoCamo; TeamsAPK operator; Tycoon PhaaS users; Cookie Reloaded redirect operators"
scale_and_metrics: "Proofpoint: tens of thousands of Lovable-hosted URLs a month. Confiant: PseudoCamo passed roughly 650 blocked domains by late August."
prevention_angle: "Treat lovable.app and base44.app subdomains as untrusted until the publisher is verified. Block the listed scam and command-and-control domains. Warn users who are asked to deploy and fund a wallet contract from an ad. Do not install Teams from teamsapk.cyou."
