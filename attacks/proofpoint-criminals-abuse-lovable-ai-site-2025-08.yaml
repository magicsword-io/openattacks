    notes: "security-detections-mcp searches for wallet drainer, MetaMask, and malvertising returned no rule that matches this activity. PseudoCamo is cloaked malvertising on a hosted website, and the trading-bot theft is three transactions the victim signs in MetaMask. TeamsAPK is an Android package. None of those are a Windows, Linux, macOS, or CloudTrail pattern in the Sigma, Splunk, or Elastic corpora. Block the domains above and review ad-landing hosts on lovable.app and base44.app."
