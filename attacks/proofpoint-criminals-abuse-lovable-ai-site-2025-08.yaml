ai_role_detail: "Proofpoint documented Lovable-hosted phishing, drainers, and malware delivery. Confiant confirms PseudoCamo hosts its white pages on lovable.app and base44.app. Confiant does not claim those sites were generated by a model. The UK trading-bot page and the TeamsAPK command-and-control domain use Claude branding as a lure."
technique_summary: "Proofpoint reported that tens of thousands of Lovable-hosted URLs a month were used for credential phishing, crypto drainers, and malware delivery, including activity tied to Tycoon phishing-as-a-service and Cookie Reloaded redirects. Confiant (Nov 11, 2026) describes PseudoCamo, a cloaked investment-scam cluster tracked since April that passed roughly 650 blocked domains in late August. Ads land on a localized 18+ age gate hosted on AI app-builder subdomains, then redirect to a second-hop money page. Observed hosts include befideapro.lovable.app uncloaking to befidea.pro, arveniop.lovable.app, newsireland-2.base44.app, and istanbul-space.base44.app. Targets included Poland, Romania, Czechia, Spain, Canada, and South Africa, then Ireland and Turkey. PseudoCamo is a sibling of BabaCamo. A UK money page on lofim.shop, reached through a black.php gate and also linked from compile-code-online.pages.dev, has victims deploy a MetaMask contract, fund it, and click Start. The third transaction sends the balance to the scammer. A fake Microsoft Teams APK at teamsapk.cyou is a remote-access trojan whose operator status strings are Chinese. It uses a WebSocket command-and-control channel at abc.claude-go.com and abc.visapath-vp.com."
initial_access: "Malvertising and phishing pages hosted on AI website builders, plus a fake Microsoft Teams download page"
ai_tooling_and_models:
  - Lovable AI website builder
  - Base44 AI app builder
  - Claude branding used as a lure on the trading-bot page and the TeamsAPK command-and-control domain
other_tooling:
  - MetaMask contract deployment used by the trading-bot drainer
  - black.php cloaking gate
  - TeamsAPK Android remote-access trojan
victims_and_sectors: "Consumers targeted by investment scams, wallet drainers, and a fake Microsoft Teams app. Proofpoint also reported finance-sector phishing."
