ai_role_detail: "The incident is a substitution of the weights behind a model-serving endpoint. Prime Intellect does not describe the unauthorised party using an AI agent. The affected system is Prime Inference's deepseek/deepseek-v4.1-flash deployment."
technique_summary: "Prime Intellect security advisory PI-SA-2026-001, published 19 November 2026, says that from 8 November 2026 at 01:24 UTC to 10 November 2026 at 06:35 UTC an unauthorised party replaced a deployment behind the deepseek/deepseek-v4.1-flash endpoint on Prime Inference with publicly available abliterated weights. The advisory defines abliterated as modified to reduce or remove refusal behavior. The chat template, tokenizer, and serving configuration were not changed. The advisory does not name which public abliterated copy was used. The upstream model card is https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash. Prime Intellect's own tests found capability benchmarks unchanged on GPQA Diamond and tau-bench. Refusals fell from 98 of 100 to 1 on JailbreakBench, from 304 of 313 to 2 on StrongREJECT, and from 198 of 240 to 0 on HarmBench. Prime Intellect says it recovered every version of the attacker's proxy and found none that reads or transfers request content. It says it found no evidence that prompts or completions left the serving cluster, that no other models or clusters were reached, and that no keys or customer credentials were affected. It does not say how access was gained or how many customers were affected. Customers whose use depended on refusals were told to review outputs from the window. Audit Commons, published 21 November 2026, counts the window at about 53 hours and says every finding is Prime Intellect's own and is not externally verified. ctxsec repeats the advisory and says traffic through routers that list Prime Intellect as a provider, including OpenRouter, was in scope for anyone served by that endpoint."
initial_access: "Unknown. Prime Intellect does not say how the unauthorised party reached the deployment."
ai_tooling_and_models:
  - "deepseek/deepseek-v4.1-flash on Prime Inference"
  - "DeepSeek-V4.1-Flash (https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash)"
  - "Publicly available abliterated weights. The advisory does not name the copy."
other_tooling: []
victims_and_sectors: "Prime Intellect says all customers affected by the incident were contacted and does not say how many. Customers that relied on refusals were told to review their outputs. No keys or customer credentials were affected. ctxsec says the affected traffic is whatever that endpoint served during the window, including through routers that list Prime Intellect as a provider."
regions:
  - unknown
region_notes: "The advisory does not name customer countries. Prime Intellect's location is not a victim region."
attribution_or_cluster: "Unknown unauthorised party. Prime Intellect does not name an actor. Audit Commons notes that the account is self-reported and not externally verified."
scale_and_metrics: "One deployment, from 8 November 2026 01:24 UTC to 10 November 2026 06:35 UTC. Audit Commons counts about 53 hours. Customer count was not published. Refusal counts are the vendor's benchmark tests, not a count of customer prompts."
prevention_angle: "Verify model identity and weight hashes for a served deployment, separate from capability benchmarks. Prime Intellect's own tests showed GPQA Diamond and tau-bench unchanged while refusals collapsed. Monitor refusal-rate canaries on production endpoints. Do not treat model refusals as the only control for customers of a third-party inference endpoint. Review outputs from this window when the workload depended on refusals."
related_magicsword_projects: []
source_notes: "The window, the weight swap, the unchanged serving config, the benchmark and refusal counts, the proxy review, and the statements about prompts, keys, and credentials are from Prime Intellect advisory PI-SA-2026-001. Audit Commons says it has not verified any of those findings and that the advisory does not say how access was gained or how many customers were affected. ctxsec's OpenRouter sentence is ctxsec's scope note, not a Prime Intellect finding. The Hugging Face page is the model card for the named upstream model. The advisory does not name the abliterated copy."
