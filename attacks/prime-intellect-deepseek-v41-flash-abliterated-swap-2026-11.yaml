detections:
  - name: Model integrity and refusal-rate canaries
    format: guidance
    notes: "security-detections-mcp searches for safetensors and model weight did not return a rule for a provider replacing weights behind an inference API. The one safetensors hit, Splunk LLM Model File Creation, alerts on Windows Sysmon file creates of .gguf, .safetensors, ggml, and Modelfiles. That is local endpoint file creation, not this serving swap, and the advisory does not describe a customer endpoint writing those files. No indexed Sigma, Splunk, or Elastic rule covers weight-hash verification or a refusal-rate canary. Compare served weight hashes with the pinned model, and alert when a refusal canary collapses while capability benchmarks stay flat."
