attribution_or_cluster: Operator "JPD" (CrowdStrike, Sep 2026)
scale_and_metrics: 126 packages cited in related reporting
prevention_angle: Block remote HTTP deps; lockfiles; SCA; never trust
  AI-suggested package names blindly
related_magicsword_projects: []
source_notes: "CrowdStrike identified LLM-generated stealer patterns: characteristic variable naming, comments explaining basic operations, structured code organization typical of AI-generated malware"
