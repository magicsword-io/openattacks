technique_summary: Flood of malicious npm packages used remote dynamic HTTP
  dependencies invisible to many scanners and included AI-hallucination-friendly
  names such as unused-imports. Delivered credential stealers targeting
  npm/Git/CI tokens. Sep 15, 2026 update: CrowdStrike analysis confirmed stealer
  code is LLM-generated (characteristic patterns, comments, structure) and attributed
  operator to "JPD" based on code artifacts and infrastructure links.
