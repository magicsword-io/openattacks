technique_summary: "Arctic Wolf Labs (pack alert committed Nov 10, 2026) describes AntiFox, an open-source Chinese-language agentic pentest platform forked from ARTEX, running multi-agent workflows on TCP 8787 and requiring an Anthropic or OpenAI key. Self-hosted consoles on Alibaba Cloud were tied to real intrusions. On an internet-facing IIS app, w3wp.exe wrote an ASPX web shell (pwn*.aspx in upload directories) and then ran whoami, icacls, and write tests into the web root. PowerShell used System.Web.Configuration.WebConfigurationManager and WebConfigurationFileMap to parse web.config connection strings and app settings, then copied config and log files into web-reachable cfg*.txt, wc*.txt, and el*.txt, and tried an internal production database with the extracted credential. The initial exploit was not identified. In AWS, valid IAM users and in one case an assumed EC2 role ran GetCallerIdentity, ListUsers, ListRoles, ListPolicies, ListKeys, and an attempted ECR GetAuthorizationToken. One intrusion cycled multiple identities through hundreds of List, Get, and Describe calls across IAM, EC2, S3, Lambda, Secrets Manager, KMS, RDS, ECS, EKS, Redshift, Athena, Glue, Systems Manager, API Gateway, CloudWatch, CloudFormation, DynamoDB, and Bedrock in about 30 minutes. Most calls were denied. Some succeeded, ending in ListSecrets then GetSecretValue on a production secret. Another case ran S3 GetObject, CopyObject, and DeleteObject. User agents were Boto3/1.43.125 and Botocore/1.43.125. Source IPs 47.79.4.33 and 8.208.101.210. Console title AntiFox autonomous pentest console. Banner hash c370d03542ed2ec696f7337940b14652e98e9bab. AntiFox source https://github.com/AntiFox-AI/antifox. Upstream fork https://github.com/RuoJi6/ARTEX. IOC file https://github.com/rtkwlf/wolf-tools."
initial_access: "Unknown exploit of an internet-facing IIS application; separate activity started from already-valid AWS credentials"
ai_tooling_and_models:
  - "AntiFox (https://github.com/AntiFox-AI/antifox), forked from ARTEX"
  - "Anthropic or OpenAI API key required for the agent loop"
frameworks:
