detections:
  - name: Potential IIS Web Shell File Creation
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_web_shell_aspx_write.toml"
    notes: "Windows endpoint. Creation of ASPX files in IIS content directories. Matches w3wp.exe writing pwn*.aspx."
  - name: Suspicious Process By Web Server Process
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_webshell_susp_process_spawned_from_webserver.yml"
    notes: "Windows process creation. w3wp.exe spawning cmd.exe or powershell.exe, which Arctic Wolf saw running whoami and icacls."
  - name: AWS Secrets Manager Rapid Secrets Retrieval
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/credential_access_rapid_secret_retrieval_attempts_from_secretsmanager.toml"
    notes: "AWS CloudTrail. Repeated GetSecretValue. The intrusion that succeeded used ListSecrets then GetSecretValue."
  - name: First Time Seen AWS Secret Value Accessed in Secrets Manager
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/credential_access_new_terms_secretsmanager_getsecretvalue.toml"
    notes: "AWS CloudTrail. First GetSecretValue for an identity. Useful when the production-secret read is new for that IAM user or role."
  - name: AntiFox console and file-name hunting
    format: guidance
    notes: "Also hunt TCP 8787 with the AntiFox console title, banner hash c370d03542ed2ec696f7337940b14652e98e9bab, user agents Boto3/1.43.125 and Botocore/1.43.125, and files cfg*.txt, wc*.txt, and el*.txt dropped in web-reachable directories. Source IPs 47.79.4.33 and 8.208.101.210."
