victims_and_sectors: "Internet-facing IIS applications and associated AWS accounts, including a production secret"
regions:
  - Multiple regions
attribution_or_cluster: "Unnamed operators. Arctic Wolf gives no country. The platform is Chinese-language and the consoles were on Alibaba Cloud. Arctic Wolf links the activity to AntiFox through the hosting consoles."
scale_and_metrics: "Several intrusions. One AWS burst of hundreds of API calls in about 30 minutes, ending in GetSecretValue."
prevention_angle: "Alert when w3wp.exe writes .aspx files or spawns cmd.exe, powershell.exe, whoami.exe, or icacls.exe. Hunt web roots for pwn*.aspx, cfg*.txt, wc*.txt, and el*.txt. Alert on GetSecretValue from 47.79.4.33 and 8.208.101.210 and on Boto3/1.43.125 after a burst of AccessDenied. Block TCP 8787 consoles titled AntiFox."
