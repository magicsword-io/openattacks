technique_summary: Malicious MCP tool schemas use suggestive unused parameter names (system_prompt,
  conversation_history, chain_of_thought, tools_list) so the model fills them with sensitive
  context; tool then exfiltrates via HTTP. Also showed fake function schemas in user prompts leaking
  system prompts/tools.
