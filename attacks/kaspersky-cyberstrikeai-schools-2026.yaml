detections:
  - name: Suspicious Child Process Of SQL Server
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mssql_susp_child_process.yml
    notes: "Matched sqlservr with security-detections-mcp. Kaspersky says the first commands in these incidents ran as children of sqlservr.exe."
  - name: Scheduled Task Creation Via Schtasks.EXE
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml
    notes: "Matched schtasks with security-detections-mcp. The implant's first persistence step was a scheduled task named SystemUpdate."
  - name: File Decoded From Base64/Hex Via Certutil.EXE
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_decode.yml
    notes: "Matched certutil decode with security-detections-mcp. Kaspersky says certutil decoded the assembled payload. The direct-IP download rule previously noted on this entry does not match that command."
  - name: Process Memory Dump Via Comsvcs.DLL
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_rundll32_process_dump_via_comsvcs.yml
    notes: "Matched comsvcs with security-detections-mcp. The agent dumped lsass with comsvcs.dll MiniDump, passing the PID rather than the process name."
  - name: First Time Seen Account Performing DCSync
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/credential_access_dcsync_newterm_subjectuser.toml
    notes: "Matched DCSync with security-detections-mcp. After the domain administrator account was taken, the agent ran DCSync."
  - name: Renamed Mimikatz and the implant token
    format: guidance
    notes: "security-detections-mcp's Mimikatz hits key on the binary name or command line. Kaspersky says this activity used a renamed Mimikatz for DCSync and a Golden Ticket, so those name-based rules do not fit. No Sigma, Splunk, or Elastic rule encodes the X-Implant-Token header or the CyberStrikeAI certificate issuer."
