  - South America
attribution_or_cluster: Financially motivated; attribution otherwise unknown
scale_and_metrics: Domain admin achieved in 3-4 days; multiple schools targeted
prevention_angle: Harden SQL Server; monitor for CyberStrikeAI indicators; detect SystemUpdate scheduled task creation; alert on certutil downloads; monitor comsvcs.dll LSASS dumps; detect DCSync activity; hunt for Golden Ticket use; block C2 infrastructure; review LOLBAS execution (certutil, comsvcs)
