technique_summary: Financially motivated attacks against schools in Africa and Latin America using open-source CyberStrikeAI implant. Initial access via compromised SQL Server. C2-side LLM using MCP tools autonomously selected attack commands and achieved domain admin privileges in 3-4 days. Techniques include SystemUpdate scheduled task, certutil downloads, comsvcs.dll LSASS memory dump, DCSync, and Golden Ticket generation. C2 infrastructure at fastcdn.bar and 185.186.245.144. CyberStrikeAI available at https://github.com/CyberStrikeAI/CyberStrikeAI.
initial_access: Compromised SQL Server
ai_tooling_and_models:
  - CyberStrikeAI (https://github.com/CyberStrikeAI/CyberStrikeAI)
  - LLM-driven C2 with MCP tools
other_tooling:
  - SystemUpdate scheduled task
  - certutil (LOLBAS)
  - comsvcs.dll LSASS dump (LOLBAS)
  - DCSync
  - Golden Ticket
  - Compromised SQL Server
