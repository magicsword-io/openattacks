id: kaspersky-cyberstrikeai-schools-2026
name: CyberStrikeAI attacks against schools in Africa and Latin America
date_reported: 2026-11-04
researcher: Kirill Antonov, Vladislav Vlasov, Dmitry Chizhmak
org: Kaspersky
sources:
  - url: https://securelist.com/cyberstrikeai-attacks/121715/
    title: CyberStrikeAI attacks
    publisher: Kaspersky (Securelist)
magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: attacker_uses_ai_as_operator
ai_role_secondary: null
ai_role_detail: null
technique_summary: "Financially motivated attacks against schools in Africa and Latin America used the open-source CyberStrikeAI implant. Initial access was through a compromised SQL Server. A C2-side LLM using MCP tools selected attack commands and achieved domain administrator privileges in three to four days. Techniques included a SystemUpdate scheduled task, certutil downloads, comsvcs.dll LSASS memory dumping, DCSync, and Golden Ticket generation."
initial_access: Compromised SQL Server
ai_tooling_and_models:
  - CyberStrikeAI (https://github.com/CyberStrikeAI/CyberStrikeAI)
  - LLM-driven C2 with MCP tools
frameworks:
  - cyberstrikeai
other_tooling:
  - SystemUpdate scheduled task
  - certutil (LOLBAS)
  - comsvcs.dll LSASS dump (LOLBAS)
  - DCSync
  - Golden Ticket
  - Compromised SQL Server
victims_and_sectors: Schools in Africa and Latin America
regions:
  - Africa
  - South America
attribution_or_cluster: Unnamed. Kaspersky could not link the activity to a known group. Chinese-language script comments and UTC+8 control-server restarts suggest a Chinese-speaking operator.
scale_and_metrics: Domain admin achieved in 3-4 days; multiple schools targeted
prevention_angle: Harden SQL Server; monitor for CyberStrikeAI indicators; detect SystemUpdate scheduled task creation; alert on certutil downloads; monitor comsvcs.dll LSASS dumps; detect DCSync activity; hunt for Golden Ticket use; block C2 infrastructure; review LOLBAS execution (certutil, comsvcs)
related_magicsword_projects:
  - LOLBAS
source_notes: |
  Relevant detection rules:
  - Sigma: Scheduled Task Creation Via Schtasks (https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml)
  - Sigma: Suspicious File Downloaded From Direct IP Via Certutil (https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_download_direct_ip.yml)
  - Sigma: Process Memory Dump Via Comsvcs.DLL (LSASS dump) (https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_rundll32_process_dump_via_comsvcs.yml)
  - Sigma: Suspicious LSASS Process Access (https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_sysinternals_procdump_lsass.yml)
  - Sigma: Powerview Add-DomainObjectAcl DCSync AD Extend Right (https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_account_backdoor_dcsync_rights.yml)
  - Sigma: DCSync Attack Detection via RPC Firewall (https://github.com/SigmaHQ/sigma/blob/master/rules/application/rpc_firewall/rpc_firewall_dcsync_attack.yml)
  - Sigma: PowerShell Malicious Cmdlets (covers Mimikatz/DCSync) (https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_malicious_cmdlets.yml)
  - LOLBAS references: certutil (https://lolbas-project.github.io/lolbas/Binaries/Certutil/), comsvcs.dll (https://lolbas-project.github.io/lolbas/Libraries/Comsvcs/), schtasks (https://lolbas-project.github.io/lolbas/Binaries/Schtasks/)
