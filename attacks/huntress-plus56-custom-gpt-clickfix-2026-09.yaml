victims_and_sectors: "40 or more Huntress incidents, two of them confirmed through the Custom GPT, and ongoing as of 14 October 2026 in the original entry. Forescout and Blackpoint do not publish a victim count or sector list. Blackpoint says the activity raises the risk of persistent access for business and MSP environments."
regions:
