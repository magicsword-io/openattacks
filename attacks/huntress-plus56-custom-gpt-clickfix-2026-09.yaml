technique_summary: "A Custom GPT named Plus 5.6 sends users to ClickFix. Forescout names the panel ROMULUS. PowerShell starts msiexec and a sideloaded DLL starts CNCMachineRMS."
initial_access: "Custom GPT social engineering to a ClickFix paste, then PowerShell. The Stardock route runs msiexec on IconEdit2Turb.msi. A separate ROMULUS route downloads a nested 7z from orbitflownetwork[.]lol."
