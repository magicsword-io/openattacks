        - https://www.forescout.com/blog/romulus-analysis-of-a-new-multi-payload-clickfix-delivery-platform/
    - id: step-3
      title: PowerShell launches the payload chain
      description: "On the Stardock route, PowerShell downloads IconEdit2Turb.msi, posing as the Stardock Smart DeElevation Tool, and starts msiexec.exe with /i, /qn, and /norestart. Forescout's sample installs from %TEMP% after the download. DeElevate64.exe then loads a patched DeElevator64.dll that depends on I++u.dll. The Hacker News, citing Blackpoint, says that DLL decodes shellcode that starts CNCMachineRMS. A separate ROMULUS route, not the Custom GPT lure, fetches a LegionLoader archive from orbitflownetwork[.]lol."
      kind: execution
      source_urls:
