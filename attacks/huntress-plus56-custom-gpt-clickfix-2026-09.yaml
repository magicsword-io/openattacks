detections:
  - name: Potential Remote Install via MsiExec
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_msiexec_remote_payload.toml
    notes: "Selected from a security-detections-mcp search for msiexec. Windows. msiexec.exe with /i or -i, a quiet switch, http or https on its command line, and a parent that includes powershell.exe. This is the remote-URL form. Forescout's published Route A sample downloads the MSI in PowerShell and then runs msiexec against the local %TEMP% copy, so that sample does not put the URL on the msiexec command line and this rule does not cover it."
  - name: Suspicious Msiexec Quiet Install From Remote Location
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_msiexec_install_remote.yml
    notes: "Selected from the same search, MITRE T1218.007. Windows process creation. msiexec.exe with an install switch, a quiet switch, and http or a UNC path on the command line. It does not require PowerShell as the parent. The same local-path gap as the Elastic rule applies to Forescout's Route A sample."
  - name: Windows Run Key Self Registration From User Writable Path
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_run_key_self_registration_from_user_writable_path.yml
    notes: "Selected from a security-detections-mcp search. Windows Sysmon registry events. A process under C:\\Users, C:\\ProgramData, or C:\\PerfLogs writes its own path into a CurrentVersion Run key. The rule text names ClickFix remote MSI installs and DeElevate64.exe. It detects that Run-key persistence. It does not detect the I++u.dll load."
  - name: DLL sideload of I++u.dll
    format: guidance
    notes: "No Sigma, Splunk, or Elastic rule in the security-detections-mcp index names I++u.dll, DeElevator64.dll, or DeElevate64.exe image loads. Product-specific sideload rules target other DLLs. Unsigned DLL Side-Loading from a Suspicious Folder does not list %LOCALAPPDATA%\\Programs. Hijacklibs hunts match known Windows library names, and I++u.dll is not one of those names. Hunt image loads of DeElevator64.dll and I++u.dll from %LOCALAPPDATA%\\Programs\\Stardock Smart DeElevation Tool\\, and compare them with the published hashes. Also hunt PowerShell that starts msiexec /i /qn against a file in %TEMP% when the URL was only in the script."
