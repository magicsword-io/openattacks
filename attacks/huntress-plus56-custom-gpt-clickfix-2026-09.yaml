region_notes: "Huntress, Forescout, and Blackpoint do not name victim countries. A ROMULUS statistics page had a country breakdown, and Forescout does not publish those countries. Panel hosting locations are not victim regions."
attribution_or_cluster: "Unknown. Forescout says ROMULUS may be a privately operated panel, a commercial delivery service, an affiliate framework, or software copied between operators. It found no evidence tying the panel to the RomulusLoader Proofpoint reported with Silver Fox. Blackpoint says the CNCMachineRMS overlap with the BabaDeda chain does not establish a shared operator."
scale_and_metrics: "Huntress: 40 or more related incidents and two confirmed through the Custom GPT. OpenAI took down the first GPT around 25 September 2026, and a replacement appeared on 27 September. Forescout: six ROMULUS panel addresses. No victim total is published for the platform. The LegionLoader carrier is 882,716,672 bytes, about 842 MiB, most of it padding."
prevention_angle: "Treat Custom GPT links and pasted commands as untrusted. Block PowerShell that downloads an installer and then starts msiexec. Alert on msiexec /i /qn launched by PowerShell, including when the MSI URL is a raw or decimal IP. Prevent signed binaries in user-writable folders from loading unexpected DLLs. Hunt DeElevate64.exe, DeElevator64.dll, and I++u.dll under %LOCALAPPDATA%\\Programs\\Stardock Smart DeElevation Tool\\, and the Run key and scheduled task named Stardock DeElevation Tool. HijackLibs entries for ceiinfolog and DeElevator64 still apply to the Huntress sideload names. Block the published panel addresses and the LegionLoader domains."
related_magicsword_projects:
  - HijackLibs
source_notes: "Mark O'Halloran, Jonathan Semon, and others (Huntress, 28 September 2026) describe Plus 5.6 on chatgpt.com, promoted with Google Ads, sending users to a Google Sites ClickFix page. The paste runs PowerShell, which retrieves an MSI and starts a DLL sideload. Huntress reported Canon COTFileReadApp.exe with ceiinfolog.dll and rdCore.dll, and later Stardock DeElevate64, plus a Run key and a scheduled task. Sai Molige and Forescout Research - Vedere Labs (15 October 2026) name the panel ROMULUS. The Huntress server 96.62.224[.]81 showed the same login page as five other hosts. ROMULUS serves a PowerShell stager at /s/<token> and a trojanized MSI at /app/<token>. On the Stardock route, PowerShell downloads IconEdit2Turb.msi, posing as the Stardock Smart DeElevation Tool, writes it under %TEMP%, and starts msiexec.exe with /i, /qn, and /norestart. DeElevate64.exe loads a patched DeElevator64.dll that depends on I++u.dll. The published URL is hxxp://86.109.75[.]7/app/19481b28bd67/IconEdit2Turb.msi. Forescout also records the decimal form 1450003207 for 86.109.75[.]7. A separate route, not the Custom GPT lure, reaches orbitflownetwork[.]lol for a nested encrypted 7z holding an inflated executable of about 842 MiB. Forescout identifies that payload as LegionLoader, with C2 smashshape[.]com at /nfront.php and /nback.php. Forescout says the operator is unknown and that ROMULUS may be a private panel, a commercial delivery service, an affiliate framework, or copied software, and that it is not the RomulusLoader Proofpoint reported with Silver Fox. Sam Decker, Nevan Beal, and Andi Ursry (Blackpoint Cyber) assess with high confidence that the RAT is CNCMachineRMS. It supports remote desktop, screen, microphone, and camera capture, file management, reconnaissance, and further payloads, and it resolves its gate over DNS-over-HTTPS. Persistence is a Run key and a scheduled task named Stardock DeElevation Tool. The Hacker News (Ravie Lakshmanan, 20 November 2026) says I++u.dll decodes shellcode that starts CNCMachineRMS and that this is the same RAT the Custom GPT lure delivered. The Custom GPT, ClickFix page, Canon and Stardock sideload names, persistence, the 40 or more incidents, and the two Custom GPT confirmations are from Huntress. The ROMULUS panel, the six addresses, the MSI URL, the Stardock installer metadata, the DeElevator64.dll dependency on I++u.dll, the LegionLoader route, and the operator hypotheses are from Forescout (15 October 2026). The CNCMachineRMS family name, the high-confidence assessment, DNS-over-HTTPS, and the statement that no post-exploitation activity was observed are from Blackpoint. The Hacker News (Ravie Lakshmanan, 20 November 2026) summarizes Blackpoint and says I++u.dll decodes shellcode that starts CNCMachineRMS, and that this is the same RAT the Custom GPT lure delivered. Huntress is the source for AI involvement. The later reports do not describe AI in the payloads. Forescout's Route A sample downloads the MSI and then runs msiexec against the local %TEMP% copy, so a rule that requires the URL to be on the msiexec.exe command line does not cover that sample. No catalog entry is the Proofpoint RomulusLoader report."
