detections:
  - name: Remote Access Tool - ScreenConnect Installation Execution
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_remote_access_tools_screenconnect_installation_cli_param.yml"
    notes: "Windows process creation. ScreenConnect client install command line. Matches msiexec of sc.msi and the Nov 13 UpdateConnect.ClientSetup.msi."
  - name: Remote Access Tool - ScreenConnect Remote Command Execution
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_remote_access_tools_screenconnect_remote_execution.yml"
    notes: "Windows process creation. Commands launched from a ScreenConnect session. Matches the Run Command that deployed SCKit as SYSTEM."
  - name: Suspicious ScreenConnect Client Child Process
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/command_and_control_screenconnect_childproc.toml"
    notes: "Windows endpoint. A ScreenConnect client spawning a suspicious child, including the installer and script chain."
  - name: Newly Observed ScreenConnect Host Server
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/command_and_control_newly_observed_screenconnect_host_server.toml"
    notes: "Windows endpoint. A ScreenConnect client calling a host not seen before. Useful for 185.99.255.28 and 185.241.211.197."
  - name: Local Scheduled Task Creation
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_local_scheduled_task_creation.toml"
    notes: "Windows. New scheduled task. The kit creates TrapWatch, which runs every 10 seconds as SYSTEM."
  - name: SCKit paths and the blank RMM+ key
    format: guidance
    notes: "No cited rule names RMM+ 1.0.31, TrapWatch, C:\\ProgramData\\RelayTrap, or sckit-run.bat. Sigma csc.exe rules key on Temp, Public, or PerfLogs paths, or on an encoded PowerShell parent, so they miss TrapWatch.ps1 compiling under C:\\ProgramData\\RelayTrap. The Splunk on-the-fly csc rule also requires /noconfig, /fullpaths, and a response file, which the write-up does not show. ScreenConnect path-traversal rules describe CVE-class bugs, not the blank access key, so they are not cited. Also hunt sqlite3.exe reading ScreenConnect cookies and c=Exploited in the installer URL."
