attack_flow:
  nodes:
    - id: blank-key
      title: Blank RMM+ access key
      description: "RMM+ 1.0.31 and 1.0.32 accept an empty access key when none was configured, so Run Command arrives without a ScreenConnect login."
      kind: access
      source_urls: &a1
        - https://www.huntress.com/blog/sckit-worm-rogue-screenconnect
    - id: install
      title: SYSTEM installs sc.msi and SCKit
      description: "The command writes C:\\Windows\\TEMP\\sc.msi and sckit-run.bat, then downloads a UUID-keyed kit into C:\\ProgramData\\RelayTrap."
      kind: execution
      source_urls: *a1
    - id: relaytrap
      title: LLM-commented RelayTrap
      description: "TrapWatch.ps1 compiles RelayTrap.cs, which Huntress says looks LLM-written, and schedules TrapWatch every 10 seconds."
      kind: ai
      source_urls: *a1
    - id: spread
      title: Cookie theft path not seen succeeding
      description: "The kit can read a technician .aspxauth cookie with sqlite3.exe and upload a Shared Toolbox item. Huntress had not seen that jump succeed."
      kind: impact
      source_urls: *a1
  edges:
    - source: blank-key
      target: install
    - source: install
      target: relaytrap
    - source: relaytrap
      target: spread
