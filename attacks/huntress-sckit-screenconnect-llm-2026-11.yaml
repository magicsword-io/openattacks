attribution_or_cluster: "Unnamed. Huntress and ConnectWise describe the activity. No country is stated. Participant name Addmin and client IDs 2588ef5c15954b10 and ed630cc2c873b091 were published."
scale_and_metrics: "Nov 11: at least 288 endpoints across 48 organizations in about 90 minutes. Nov 13: 205 hosts across 41 organizations. ConnectWise disabled the listed extensions across more than 400 partner environments. One panel parameter reached Exploited809 (190 downstream clients on one panel)."
prevention_angle: "Disable RMM+ 1.0.31 and 1.0.32 where the access key was left blank, including on-premises ScreenConnect. Do not triage a suspect host over ScreenConnect. Remove the rogue client service, the TrapWatch task, C:\\ProgramData\\RelayTrap, and sckit files under %TEMP%. Hunt msiexec installs of ScreenConnect.ClientSetup.msi or UpdateConnect.ClientSetup.msi with c=Exploited. Block 185.99.255.28 and 185.241.211.197."
related_magicsword_projects:
  - LOLRMM
source_notes: "Counts, the blank-key behavior, Figure 6's LLM comment, paths, and IOCs are from the Huntress article, including the Nov 13 update. BleepingComputer reports the same LLM-looking comments. The console-takeover and Shared Toolbox spread were recovered from the kit and were not seen succeeding. Blackpoint's patched-host test is the source for the 2.5 second TransferFilesMessage and the result that a current Host did not fetch the payload. Additional acknowledged contributors include John Hammond, Tanner Filip, Tyler Marzen, Austin Worline, Ethan Williams, Sharon Martin, Ben Bernstein, Andrew Brandt, Jamie Levy, Max Rogers, Aaron Deal, and Mendy Green. File hashes are weak because scripts are rebuilt per host. ScreenConnect is tracked by LOLRMM at https://lolrmm.io/tools/screenconnect."
