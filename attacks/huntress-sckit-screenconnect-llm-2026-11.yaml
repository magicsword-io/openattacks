ai_role_detail: "Huntress Figure 6 says the RelayTrap C# source appears to have been generated by an LLM, based on detailed comments that explain what the code is intended to do. BleepingComputer reports the same inference. No prompts were published. The schema has no inferred value, so this is recorded as vendor-asserted."
technique_summary: "Huntress (Ben Nahorney, Susannah Matt, Lindsey O'Donnell-Welch; published Nov 11, 2026, updated Nov 13) observed Run commands on cloud-hosted ScreenConnect panels installing rogue ScreenConnect clients. On Nov 11, from about 17:47 UTC, at least 288 managed endpoints across 48 organizations were hit in about 90 minutes. ScreenConnect 26.6.6.9747 and 26.7.6.9783 were affected. Huntress ties the activity to the third-party RMM+ extension, versions 1.0.31 and 1.0.32: if the access key was never set, the extension accepted a blank key, bypassing ScreenConnect user accounts, roles, and MFA. Commands showed up as RMM+ with no matching login. ConnectWise said it had disabled five extensions (Labtech Plus, RMM Plus, RMM+, RMM Plus Password Link, and RMM+ Password Link) across more than 400 partner environments and had not yet identified an initial access vector when the Nov 11 advisory posted. The Run command, as SYSTEM, downloaded an attacker ScreenConnect installer to C:\\Windows\\TEMP\\sc.msi, installed it silently, and wrote C:\\Windows\\Temp\\sckit-run.bat. The dropper fetches sckit-decoder.ps1 and a kit keyed by the Windows UUID. Components extract to C:\\ProgramData\\RelayTrap. TrapWatch.ps1 runs as SYSTEM, compiles RelayTrap.cs into a host-specific RelayTrap.exe, and creates a scheduled task named TrapWatch that runs every 10 seconds. The legitimate ScreenConnect client is stopped and set to manual start. Huntress Figure 6 says the RelayTrap C# source appears to have been generated by an LLM because of detailed source comments explaining intent. A separate path, seen in the kit and not observed succeeding, steals the technician .aspxauth cookie with sqlite3.exe and tries to push WithUninstall.ps1 through the Shared Toolbox. On Nov 13 at 16:12 UTC Huntress saw another spike, 205 hosts across 41 organizations, with the client hosted at 185.241.211.197 and an installer URL ending in c=ExploitedNOTUSA. Huntress also saw c=Exploited529 and c=Exploited809. One incident used a self-hosted RMM+ plugin, a netsh portproxy from 127.0.0.1:88 to 185.241.211.197:80, and a service named Windows Update Agent running UpdateConnect.ClientService.exe from C:\\ProgramData\\Windows Update Agent (de362a425905bcc4)\\. ConnectWise also pointed on-premises partners at ScreenConnect 26.6.5 or later for CVE-2026-84869, a separate client file-transfer flaw. Huntress does not say this wave exploited that flaw. Blackpoint Cyber (Sam Decker, Nevan Beal) says RelayTrap.cs is compiled on the endpoint by TrapWatch.ps1, not shipped as a precompiled binary. When a technician connects, the replacement Guest sends TransferFilesMessage FileAction.Run after a 2.5 second delay, which is the CVE-2026-84869 file-transfer-back path. Blackpoint's test against a current ScreenConnect Host queued the transfer on the Guest, and the Host did not request or run the payload. They report no successful technician compromise. Primary panel indicators include sc.payproofkit.com (155.94.150.39) and 185.99.255.28."
initial_access: "Blank access key on RMM+ 1.0.31 or 1.0.32, then ScreenConnect Run Command as SYSTEM. ConnectWise had not identified a single initial-access vector in the Nov 11 advisory."
