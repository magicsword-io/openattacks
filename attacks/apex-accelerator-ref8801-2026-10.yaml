source_notes: "Package behavior for @apexacc/cli and @apexacc/audit, the Oh My Pi comparison, the yolo approvals, the fabricated audit tools, and the Windows and macOS payload branches are from Elastic. The version counts, the 10 November and 24 November placeholder times, the GHSA ids, the 412 verify_required path, the @apexscore/cli sandbox check, the tarball hashes, and the statement that Russian-language comments are not attribution are from Corgea. GitHub's malware advisories confirm the package names and say any installed copy should be treated as a compromise. They list affected versions as >= 0 and no patched version. The version ranges in this entry are Corgea's. Hashes, in the order named in the prose: 7ca5e3908dd8721d0cf6af2488f0825c0d91a5e0b7c8529ef830141a4a3ba31f is the @apexacc/cli 1.6.2 tarball. 4029192a44ee738deba9aa53b57550075cb8fd170a63f0636dea5452256f2175 is apex.cjs from that tarball. 3fce1efd911a008e4cf71d95dc4a63ceeb206d5bfaf6e75020b6b2e03b508d28 is the @apexscore/cli 1.1.1 tarball. 985829083f3937df6c82419216f7697afae0caac8efca6257a756066fe2c0abb is apex-windows-x64.exe. 42a760b15fea7c9af718ee45386c1c3ea1bec9e30c95d16c287bcc8b2efdc72e is apex-darwin-arm64. 127ae4cad80b6605157ca2a1feada8a235e16aacc5d2119337a98115a4e13274 is apex-verify-darwin. 5ee7145061f05779f7f6f9b72e216713d17d53e183a92f408bfbbc44f2bfb95d is apex-audit-windows-x64.exe. 20f0a401676292d4ae34932e61f34afa97bcfc47ee517cda2afeb7222264a193 is apex-audit-darwin-arm64. a50cdb508d13884630945a98eea0615b866d938eb0a16c5d958e6c8c181a6df8 is apex-audit-verify-darwin. 68f5a00eafa8ecebf5d93328e0fec23b24d6f91808c8384db002946a13656c71 is the CloudSyncD installer. ee8cd9aba420f1b26b5d43e5bcdd6025a277b4946bb5daf76ab45c0e5f7ecd0b is exegis.exe. ed5cb4af1d2cb067b8d23783ebf05d70278728462ba4f1bf29da0a3a41efc35e is enc_loader.exe. The binary hashes are the ones Elastic published and Corgea reprinted."
