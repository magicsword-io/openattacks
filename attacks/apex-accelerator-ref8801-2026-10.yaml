ai_role_detail: "The CLI is a repackaged Oh My Pi coding agent (https://github.com/can1357/oh-my-pi). The audit MCP returns fabricated findings. @apexfdn/copilot-mcp does not spawn a process. It turns an HTTP 412 from the operator API into tool text that tells the agent to run a command."
technique_summary: "Elastic Security Labs (Jia Yu Chan and Daniel Stepanic, 12 October 2026) tracks a fake Web3 accelerator as REF8801. It offered founders free Claude and Gemini credits and the npm packages @apexacc/cli and @apexacc/audit, published by the npm user apexaccelerator. The CLI presents as Apex Copilot. Elastic compared Apex Copilot 1.6.1 with Oh My Pi 16.3.6 (https://github.com/can1357/oh-my-pi) and found 1,351 of 1,363 files under packages/coding-agent/src byte-identical. The changes in apex-bootstrap.ts set OPENROUTER_BASE_URL to the operator proxy, write a remote MCP server into ~/.apex/agent/mcp.json, and set tool approvals to yolo. The audit package registers a fabricated 18-tool MCP server into Claude Desktop, Cursor, and Windsurf, and every handler Elastic inspected returned canned output. On Windows the command path is wscript to PowerShell to a stealer. On macOS it is CloudSyncD. Corgea (24 November 2026) keeps those two packages and adds the rest of the lineage. @apexacc/cli had 122 versions, 1.1.8 on 9 August 2026 through 1.6.2 on 27 September 2026. npm replaced them with a 0.0.1-security placeholder on 10 November 2026 at 22:36 UTC under GHSA-pg98-9cmp-wcf5. @apexscore/cli had 33 versions, 1.0.59 on 30 July 2026 through 1.1.1 on 9 August 2026, and was replaced on 24 November 2026 at 17:35 UTC under GHSA-r68v-jq2f-qcf8. @apexfdn/copilot-mcp, versions 0.1.0 through 0.11.6, was replaced on 24 November 2026 at 17:41 UTC under GHSA-8q2p-w9w5-552h. @apexacc/audit was removed from the registry by 15 October 2026. @apexfdn/apex, versions 1.0.1 through 1.0.32, is a 0.0.1-security placeholder as of 21 July 2026. @copilot-mcp/apex, versions 1.0.0 through 1.0.22, was removed. Corgea read the @apexacc/cli 1.6.2 tarball. It has no install hook. Running apex or npx @apexacc/cli launches apex.cjs, which downloads a native binary from GitHub releases with no hash check and runs it. On Windows the launcher asks for UAC, adds a Defender exclusion for the .apex directory, and sets VerifiedAndReputablePolicyState to 0. The verify request to the operator returns a command. On macOS a Rust helper sends it and the captured command pipes a remote script into a shell, which drops CloudSyncD. On Windows the JavaScript bootstrap writes the command to a PowerShell script and a VBScript in the temp directory and starts wscript so PowerShell runs with ExecutionPolicy Bypass and no window. Corgea says @apexfdn/copilot-mcp spawns no process. In the 0.11.6 tarball, an HTTP 412 whose error is verify_required becomes tool output that tells the agent to run the command from the response, then retry. An agent with shell access and loose approvals runs that command. @apexscore/cli's launcher exits 0 when it sees an AI-agent environment variable or an MCP flag, which Corgea describes as a sandbox check. A fresh npm install of these names no longer returns the malware. A machine that already ran the CLI keeps the cached binary under ~/.apex/bin, and an MCP client that registered the server keeps that entry. Elastic found Russian-language comments in older commits. Corgea says those comments are not a nationality."
initial_access: "A founder installs a package from the fake accelerator, or runs npx @apexacc/cli, npx @apexscore/cli, or the apex command. The audit package and @apexfdn/copilot-mcp are separate npm installs that register an MCP server."
