detections:
  - name: Windows Script Executing PowerShell
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/initial_access_script_executing_powershell.toml
    notes: "Selected with security-detections-mcp. Windows process events. powershell.exe whose parent is wscript.exe or cscript.exe, with one Intune drive-mapping script excluded. Corgea says the Windows launcher writes a VBScript and starts wscript so PowerShell runs hidden with ExecutionPolicy Bypass. This does not see the macOS branch or the MCP 412 path, which spawns no process."
  - name: Suspicious PowerShell Invocation From Script Engines
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_script_engine_parent.yml
    notes: "Selected with security-detections-mcp. Windows process creation. Parent image ends with wscript.exe or cscript.exe and the image ends with powershell.exe or pwsh.exe. Same wscript-to-PowerShell step as the Elastic rule. A Health Service State directory is filtered."
  - name: Vbscript Execution Using Wscript App
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/vbscript_execution_using_wscript_app.yml
    notes: "Selected with security-detections-mcp. Endpoint process events for wscript.exe whose command line contains .vbs, outside Program Files and System32. Corgea says the launcher writes _apex_run.vbs or _audit_run.vbs in the temp directory and starts wscript on it. A script under Program Files does not match."
  - name: Change PowerShell Policies to an Insecure Level
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_set_policies_to_unsecure_level.yml
    notes: "Selected with security-detections-mcp. Windows process creation. powershell.exe with -ExecutionPolicy, -ep, or -exec, and Bypass or Unrestricted. Corgea says the wscript-launched PowerShell uses -NoProfile -ExecutionPolicy Bypass. The separate Set-ExecutionPolicy RemoteSigned call in the launcher is RemoteSigned, not Bypass, so this rule does not cover that call."
  - name: Powershell Base64 Encoded MpPreference Cmdlet
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_base64_mppreference.yml
    notes: "Selected with security-detections-mcp. Windows process creation. The command line's base64 decodes to Add-MpPreference or Set-MpPreference, or the UTF-16LE fragments of those cmdlets are present. Corgea says the elevated PowerShell is an encoded command that adds a Defender exclusion for the .apex directory. The plaintext Add-MpPreference rule does not see that encoded command, so it is not cited."
  - name: macOS curl pipe, dscl, package names, and the 412 tool text
    format: guidance
    notes: "security-detections-mcp searches for osascript, dscl, macOS curl, npm, and Add-MpPreference did not return a rule that matches the branches this note lists. Shell Evaluated Curl Downloaded Content requires a shell -c line that evals $(curl) or backticks. Corgea describes the macOS verify command as curl piped into sh, which is a different shape, so that rule is not cited. Suspicious Curl from macOS Application requires a parent under /Applications and a raw IP. The verify host is a domain and the parent Corgea names is the Rust helper, not an application bundle. Prompt for Credentials with Osascript requires osascript -e and a display dialog password string. Corgea says @copilot-mcp/apex had an osascript password prompt and does not publish the command line. CloudSyncD checks the password with dscl -authonly. A search for dscl authonly returned no rule. Curl Download Activity from npm Package Install and Suspicious PowerShell from npm Package Install require an npx-cli.js ancestor and, for PowerShell, an encoded command or a download cradle in that tree. The cached apex binary and the Rust helper are not that tree, so those two rules are not cited as coverage. No indexed rule names @apexacc, @apexscore, @apexfdn, or verify_required. Hunt lockfiles and the npm cache for those package names. Hunt ~/.apex, ~/.apex/bin/apex, ~/.apex/agent/mcp.json, ~/.apex-audit, ~/.config/cloudsync, and ~/.local/share/cloudsync. On Windows hunt %TEMP%\\_apex_run.ps1, _apex_run.vbs, _audit_run.ps1, _audit_run.vbs, exegis.exe, updater_loader.exe, and %APPDATA%\\.cobra, plus a Defender exclusion for .apex and VerifiedAndReputablePolicyState set to 0. The 412 path is tool text, not a process spawn. Hunt agent transcripts for verify_required and for a tool result that says to run a command and retry."
