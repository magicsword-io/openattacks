attribution_or_cluster: "Elastic REF8801, a fake Web3 accelerator. Corgea extends the package list and the 24 November 2026 takedown. Nationality is not established. Russian-language comments in old commits are not a nationality."
scale_and_metrics: "@apexacc/cli had 122 versions and was replaced on 10 November 2026. @apexscore/cli had 33 versions and @apexfdn/copilot-mcp versions 0.1.0 through 0.11.6 were replaced on 24 November 2026. @apexacc/audit was already removed by 15 October 2026. No victim count was published."
prevention_angle: "Block apexaccs[.]org, apexfdn[.]xyz, ccmihr[.]com, 0auth-chromium[.]com, ehegisnightmare[.]icu, arenapex[.]cloud, cloudmain365duo[.]top, fdn4apex[.]com, router-apex[.]com, and apex-arena-router[.]com, including the arena, vrf, token, and verify hostnames named below. Search lockfiles, the npm cache, and global installs for @apexacc/cli, @apexacc/audit, @apexscore/cli, @apexfdn/apex, @apexfdn/copilot-mcp, and @copilot-mcp/apex. Remove ~/.apex, ~/.apex-audit, cached binaries under ~/.apex/bin, and Apex MCP entries from Claude, Cursor, and Windsurf configs. On macOS remove ~/.local/share/cloudsync and ~/.config/cloudsync and change the account password. On Windows remove a Defender exclusion for .apex, restore Smart App Control, and rebuild the host if exegis.exe or updater_loader.exe ran. Rotate LLM keys, browser sessions, wallet seeds, SSH keys, and cloud credentials the agent could have read. A registry placeholder does not clean a machine that already ran the CLI. The Windows stealer chain depends on wscript."
