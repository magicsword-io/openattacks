id: apex-accelerator-ref8801-2026-10
name: Apex Accelerator / REF8801
date_reported: 2026-10-12
researcher: Jia Yu Chan, Daniel Stepanic
org: Elastic Security Labs
sources:
  - url: https://www.elastic.co/security-labs/threat-command/apex-accelerator-malicious-npm-packages
magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: ai_tool_as_lure
ai_role_secondary: ai_infra_as_c2
ai_role_detail: null
technique_summary: "Fake Web3 accelerator hands founders free Claude/Gemini
  credits and npm packages (@apexacc/cli, @apexacc/audit). CLI is Oh My Pi with
  backdoored bootstrap: OPENROUTER_BASE_URL to attacker LLM proxy, rogue MCP in
  ~/.apex/agent/mcp.json, yolo approvals. Audit MCP returns fabricated findings
  and registers into Claude Desktop/Cursor/Windsurf. Windows chain:
  wscript→PowerShell→stealer; macOS CloudSyncD."
initial_access: Social engineering via fake accelerator / free AI credits; npm
  install of @apexacc/cli or @apexacc/audit
ai_tooling_and_models:
  - Oh My Pi (repackaged as Apex Copilot)
  - Attacker LLM proxy arena.apexaccs.org/api/llm/v1
  - Attacker MCP arena.apexaccs.org/api/copilot/mcp
  - Fabricated 18-tool Apex Audit MCP
  - Targets Claude Desktop, Cursor, Windsurf configs
other_tooling:
  - wscript.exe
  - PowerShell
  - UACME ComputerDefaults bypass
  - Go AMSI/ETW patcher
  - CloudSyncD (macOS)
  - Telegram exfil
  - bludness.exe / exegis.exe
victims_and_sectors: Cryptocurrency / Web3 founders and startups
regions:
  - Multiple regions
attribution_or_cluster: Elastic REF8801; Russian comments in history but nationality not established
scale_and_metrics: unknown
prevention_angle: Block apexaccs.org / apexfdn.xyz / payload domains; audit MCP
  configs and OPENROUTER_BASE_URL; rotate AI keys; prevent wscript (Windows
  stealer chain depends on it)
related_magicsword_projects:
  - LOLSkills
source_notes: null
last_reviewed: 2026-10-20
attack_flow:
  nodes:
    - id: step-1
      title: Fake accelerator recruits founders
      description: Free AI credits entice Web3 founders to install npm packages.
      kind: access
      source_urls: &a1
        - https://www.elastic.co/security-labs/threat-command/apex-accelerator-malicious-npm-packages
    - id: step-2
      title: Bootstrap changes agent settings
      description: The packages introduce an attacker LLM proxy, rogue MCP
        configuration and permissive approvals.
      kind: execution
      source_urls: *a1
    - id: step-3
      title: Rogue tools influence the agent
      description: The audit MCP fabricates findings and registers with desktop coding
        agents.
      kind: ai
      source_urls: *a1
    - id: step-4
      title: Platform-specific malware
      description: Reported Windows and macOS branches deliver a stealer or CloudSyncD.
      kind: impact
      source_urls: *a1
  edges:
    - source: step-1
      target: step-2
    - source: step-2
      target: step-3
    - source: step-3
      target: step-4
region_notes: Global Web3 targeting is described. A claimed presence at
  TOKEN2049 in Singapore is not evidence of a victim in Singapore.
atlas_techniques:
  - id: AML.T0081
    rationale: The packages rewrite model-proxy and MCP settings.
    source_urls: *a1
  - id: AML.T0104
    rationale: The accelerator distributes a rogue audit MCP tool.
    source_urls: *a1
category: adversary-use-of-ai
attribution:
