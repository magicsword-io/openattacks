victims_and_sectors: "Cryptocurrency and Web3 founders and startups who installed the accelerator's npm packages or registered its MCP servers, and the developer machines where those packages ran. Corgea says a fresh install no longer pulls the malware. Hosts that already ran it are still in scope."
regions:
