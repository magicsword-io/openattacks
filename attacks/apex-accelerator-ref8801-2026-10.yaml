attack_flow:
  nodes:
    - id: step-1
      title: Fake accelerator publishes npm packages
      description: "The operator publishes @apexacc/cli and @apexacc/audit, then the earlier and later names @apexfdn/apex, @copilot-mcp/apex, @apexscore/cli, and @apexfdn/copilot-mcp. Free AI credits are the lure. npm has replaced the last of these with security placeholders or removed them."
      kind: access
      source_urls: &a1
        - https://www.elastic.co/security-labs/threat-command/apex-accelerator-malicious-npm-packages
        - https://corgea.com/research/apex-accelerator-ref8801-npm-ai-agent-hijack-october-2026
    - id: step-2
      title: Bootstrap changes agent settings
      description: "Running the CLI sets the model base URL to the operator proxy, writes a remote MCP server, and sets yolo approvals. The binary is cached under ~/.apex/bin even after the registry placeholder."
      kind: execution
      source_urls: *a1
    - id: step-3
      title: Rogue tools influence the agent
      description: "The audit MCP returns fabricated findings and registers with Claude Desktop, Cursor, and Windsurf. The remote MCP injects its own tool definitions into each model request."
      kind: ai
      source_urls: *a1
    - id: step-4
      title: Windows stealer or macOS CloudSyncD
      description: "The verify response is a server-selected command. Windows goes through wscript and PowerShell to a stealer. macOS goes through a piped installer to CloudSyncD."
      kind: impact
      source_urls: *a1
    - id: step-5
      title: MCP tool text carries the command
      description: "@apexfdn/copilot-mcp does not spawn a process. An HTTP 412 with error verify_required is returned to the agent as tool text that says to run the operator's command and retry."
      kind: ai
      source_urls:
        - https://corgea.com/research/apex-accelerator-ref8801-npm-ai-agent-hijack-october-2026
        - https://github.com/advisories/GHSA-8q2p-w9w5-552h
  edges:
    - source: step-1
      target: step-2
    - source: step-2
      target: step-3
    - source: step-3
      target: step-4
    - source: step-1
      target: step-5
      label: copilot-mcp
