    source_urls: *a1
  - id: AML.T0051.001
    rationale: "Corgea says @apexfdn/copilot-mcp returns the operator's shell command as tool output after an HTTP 412, so the agent treats an instruction from the operator API as the tool result."
    source_urls:
      - https://corgea.com/research/apex-accelerator-ref8801-npm-ai-agent-hijack-october-2026
  - id: AML.T0010
    rationale: "The operator published the packages to npm. Developers who installed them, or who still have the cached binary or the MCP registration, ran or loaded the operator's agent and tools."
    source_urls: *a1
