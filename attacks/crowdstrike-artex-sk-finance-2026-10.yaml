attribution_or_cluster: "CrowdStrike did not attribute the activity to a named adversary. It assessed with moderate confidence that the actor was likely a Chinese speaker and financially motivated. Hunt.io uses the jump-host config to tie 23.248.226[.]250 to the console CrowdStrike and the FBI published."
scale_and_metrics: "Active late September through early October 2026. The number of organizations was not confirmed in the 7 October CrowdStrike report. FBI FLASH-20261113-001 says this South Korean financial campaign exfiltrated personal information of approximately 67,000 individuals, citing CrowdStrike, Zscaler, and CERT-EU. Hunt.io says seven institutions and about 66,000 to 67,000 individuals, citing CrowdStrike and Genians, and that Claude Code on the jump server recorded 510 startups since 4 August 2026 and 147 skill invocations."
prevention_angle: "Monitor for agentic pentest suites and exposed Claude session dirs. Hunt.io's link is the jump server's files, not a new victim-side procedure. The key values in .secrets are not repeated here. Hunt.io says the cryptocurrency, Linux exploitation, and mobile-device artifacts on that host are not confirmed as part of the Korean breaches."
related_magicsword_projects: []
source_notes: "CrowdStrike's report ties the South Korean finance activity to an unnamed actor. Separate reports of ARTEX use by other clusters should not be treated as attribution for this campaign. The approximately 67,000-person figure is from FBI FLASH-20261113-001, which cites the CrowdStrike report, a Zscaler ThreatLabz report, and a CERT-EU report. This entry's 7 October CrowdStrike source did not state that count. The FLASH table, and the same values in the CSV, list 38.244.50[.]120 as an ARTEX host and open directory for this campaign, sourced to CrowdStrike and Censys, and 101.53.80[.]20, 205.214.59[.]31, 124.155.252[.]63, 154.201.79[.]246, 23.248.249[.]90, 23.158.220[.]98, 103.248.148[.]84, 203.160.133[.]172, and 209.209.85[.]38 as proxy addresses sourced to CrowdStrike. The CSV says these artifacts are not standalone indicators of ARTEX, and the FLASH says addresses can later be reassigned. Hunt.io (4 November 2026, no individual byline) adds 23.248.226[.]250 and says it notified a national CERT before publication. It says no personal records from the affected systems appear in its report. The .secrets file is described only. Key values, passwords, and JWTs are not copied. Hunt.io says cryptocurrency, Linux exploitation, and mobile-device artifacts on that host are not confirmed as linked to the Korean breaches. The 19 skill names Hunt.io lists are code-audit, recon, web-inject, hae, cloud-phone, xingjie-cloudphone, hemax-adb, js-api-mining, waf-bypass, web-auth, tg-miniapp, apk-download, oversea-cloudphone, b2-archive, decompile, apk-internal-hunting, attack-variants, file-ssrf, and payment-logic. They are operator-written skills on the attacker's host, not a LOLSkills entry."
