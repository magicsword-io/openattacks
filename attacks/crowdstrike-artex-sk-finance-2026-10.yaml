technique_summary: Likely Chinese-speaking financially motivated actor used open-source Chinese
  agentic pentest suite ARTEX plus Claude Code against South Korean financial orgs. Open directories
  held Claude session histories, ARTEX configs, Claude memory. ARTEX used DeepSeek v4.1-flash via
  xcai.pro; also GLM-5.3 and Grok 4.6. Actor asked Claude where to sell Korean breach data. ARTEX
  later went closed-source.
initial_access: "unknown (industry reports: loan inquiry service; employee mobile work-support system)"
ai_tooling_and_models:
  - ARTEX
  - Claude Code
  - DeepSeek v4.1-flash via xcai.pro
  - GLM-5.3
  - Grok 4.6
other_tooling:
  - Proxy IPs listed in CrowdStrike IOC table
victims_and_sectors: South Korean financial organizations (multiple banks per industry reports)
regions:
  - South Korea
attribution_or_cluster: "CrowdStrike: unnamed actor, likely Chinese speaker, financially motivated. CrowdStrike Oct 29: VAPOR PANDA (China) overlaps Earth Estries. GTIG/Mandiant Oct 30: UNC7228 overlaps Storm-0940. Microsoft Oct 21-29: Storm-0940 (ConnectWise supply chain, Okta/Entra/Cognito attacks). Microsoft Oct 29: DPRK actors Onyx Sleet and Pearl Sleet also use ARTEX."
scale_and_metrics: Active late Sep–early Oct 2026; number of orgs unconfirmed
prevention_angle: Monitor for agentic pentest suites and exposed Claude session dirs; Jose Censys notes on IOCs
related_magicsword_projects: []
source_notes: "Multiple overlapping threat clusters use ARTEX: CrowdStrike VAPOR PANDA (overlaps Earth Estries), GTIG/Mandiant UNC7228 (overlaps Storm-0940 per PentAGI use), Microsoft Storm-0940 (ConnectWise supply chain Oct 21, Okta/Entra/Cognito Oct 22), Microsoft DPRK actors Onyx Sleet and Pearl Sleet. ARTEX went closed-source after public disclosure. Related entry: unit42-artex-api-recon-2026-10 documents separate API reconnaissance incident."
