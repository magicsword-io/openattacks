  motivation: financially-motivated
  attributed_by: CrowdStrike Intelligence
  confidence: medium
ai_involvement_confidence: confirmed
detections:
  - name: ARTEX operator infrastructure is not a victim-side rule
    format: guidance
    notes: "security-detections-mcp searches for password spray, web shells, and the report's ATT&CK techniques (T1583.003, T1588.007, T1090) returned infrastructure, proxy, and identity rules. A 16 November 2026 search of the new proxy addresses and of personal-information exfiltration also returned no Sigma, Splunk, or Elastic rule that encodes those IPs or the 67,000-person transfer. CrowdStrike describes the actor's own ARTEX and Claude Code servers, not a command, webshell, or cloud API on the South Korean financial organizations. Hunt exposed Claude session directories and ARTEX consoles, and review the loan-inquiry and mobile work-support services named in the industry reporting CrowdStrike cites."
