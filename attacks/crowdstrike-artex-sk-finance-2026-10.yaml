technique_summary: "Likely Chinese-speaking financially motivated actor used open-source Chinese agentic pentest suite ARTEX plus Claude Code against South Korean financial orgs. Open directories held Claude session histories, ARTEX configs, Claude memory. ARTEX used DeepSeek v4.1-flash via xcai.pro; also GLM-5.3 and Grok 4.6. Actor asked Claude where to sell Korean breach data. ARTEX later went closed-source."
initial_access: "unknown (industry reports: loan inquiry service; employee mobile work-support system)"
ai_tooling_and_models:
  - ARTEX
  - Claude Code
  - DeepSeek v4.1-flash via xcai.pro
  - GLM-5.3
  - Grok 4.6
frameworks:
  - artex
other_tooling:
  - Proxy IPs listed in CrowdStrike IOC table
victims_and_sectors: South Korean financial organizations (multiple banks per industry reports)
regions:
  - South Korea
attribution_or_cluster: "CrowdStrike did not attribute the activity to a named adversary. It assessed with moderate confidence that the actor was likely a Chinese speaker and financially motivated."
scale_and_metrics: "Active late September through early October 2026. The number of organizations was not confirmed in the 7 October CrowdStrike report. FBI FLASH-20261113-001 says this South Korean financial campaign exfiltrated personal information of approximately 67,000 individuals, citing CrowdStrike, Zscaler, and CERT-EU."
prevention_angle: Monitor for agentic pentest suites and exposed Claude session dirs; Jose Censys notes on IOCs
related_magicsword_projects: []
source_notes: "CrowdStrike's report ties the South Korean finance activity to an unnamed actor. Separate reports of ARTEX use by other clusters should not be treated as attribution for this campaign. The approximately 67,000-person figure is from FBI FLASH-20261113-001, which cites the CrowdStrike report, a Zscaler ThreatLabz report, and a CERT-EU report. This entry's 7 October CrowdStrike source did not state that count. The FLASH table, and the same values in the CSV, list 38.244.50.120 as an ARTEX host and open directory for this campaign, sourced to CrowdStrike and Censys, and 101.53.80.20, 205.214.59.31, 124.155.252.63, 154.201.79.246, 23.248.249.90, 23.158.220.98, 103.248.148.84, 203.160.133.172, and 209.209.85.38 as proxy addresses sourced to CrowdStrike. The CSV says these artifacts are not standalone indicators of ARTEX, and the FLASH says addresses can later be reassigned."
category: adversary-use-of-ai
attribution:
  actor_name: Unknown threat actor
