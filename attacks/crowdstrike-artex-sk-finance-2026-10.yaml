detections:
  - name: ARTEX operator infrastructure is not a victim-side rule
    format: guidance
    notes: "security-detections-mcp searches on 26 November 2026 for sshpass, Claude Code, pentest intent strings, and the report's earlier ATT&CK techniques returned no Sigma, Splunk, or Elastic rule that encodes this jump server, the skill names, or the proxy addresses. Rules that mention Claude Code are about unsafe permission flags or an instruction file written to a Downloads folder, which is not the recovered .claude.json on the attacker's server. Reverse-SSH rules in the index target a monitored endpoint. Hunt.io found the tunnel scripts on the attacker's jump server, and it does not publish them as a victim procedure, so they are not cited. CrowdStrike describes the actor's own ARTEX and Claude Code servers, not a command or cloud API on the South Korean financial organizations."
