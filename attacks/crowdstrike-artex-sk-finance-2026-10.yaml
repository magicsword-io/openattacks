ai_role_detail: "Hunt.io recovered Claude Code 2.1.221 state on the jump server, routed through Claude Code Router and two local shims, plus 19 operator-written skills."
technique_summary: "Likely Chinese-speaking financially motivated actor used open-source Chinese agentic pentest suite ARTEX plus Claude Code against South Korean financial orgs. Open directories held Claude session histories, ARTEX configs, Claude memory. ARTEX used DeepSeek v4.1-flash via xcai[.]pro; also GLM-5.3 and Grok 4.6. Actor asked Claude where to sell Korean breach data. ARTEX later went closed-source. Hunt.io (4 November 2026) found a second open directory at 23.248.226[.]250:18099, a Hong Kong jump server it ties to the published ARTEX console 38.244.50[.]120. A .secrets file and .secrets.bak-20260911 set JUMPHOST to that console and hold a Zhipu GLM key, an OpenAI-compatible relay key, and Webshare proxy credentials. Hunt.io does not publish the key values. Three sshpass scripts, local-boot.sh, tunnel-watchdog.sh, and sync-memory.sh, keep reverse SSH tunnels to the console. A .claude.json shows Claude Code 2.1.221 with 510 startups since 4 August 2026. Requests go through Claude Code Router on port 3456 and two local shims. ds-models-shim.py answers /v1/models. xcai-effort-shim.py adds a reasoning_effort field and forwards to direct[.]xcai[.]pro. The same state file lists 19 operator-written Claude Code skills and 147 invocations, covering recon, web-inject, waf-bypass, web-auth, js-api-mining, file-ssrf, payment-logic, attack-variants, apk-internal-hunting, cloud-phone, and others. The payment-logic skill sits next to .secrets-cashin-test-accounts, three JWT accounts Hunt.io says were for IDOR testing. A comment in that file calls them an authorized self-built test dated 12 September 2026. FOFA queries go through a third-party API, and a proxy at 154.201.79[.]246:443 showed 79 exit addresses in a 100-identity sample. These skills are on the attacker's host. They are not a published skill."
initial_access: "unknown (industry reports: loan inquiry service; employee mobile work-support system)"
