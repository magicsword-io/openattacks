id: agentcorruption-bedrock-2026-10
name: AgentCorruption (AWS Bedrock AgentCore IMDS)
date_reported: 2026-10-08
researcher: Tamir Ishay Sharbat, Lana Salameh, Dmitry Lozovoy
org: Zenity Labs
sources:
  - url: https://labs.zenity.io/post/agentcorruption-how-a-single-prompt-collapsed-the-entire-cloud-security-model
magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: null
ai_role_detail: null
technique_summary: "Chat prompt to public AgentCore agent abused tools that
  could HTTP/shell to IMDS 169.254.169.254, stealing execution-role credentials.
  Default role was region-wide across AgentCore: invoke other agents, read
  conversations/memories, pull images, Secrets Manager / AgentCore Identity,
  plant persistent memory hijacks. AWS tightened IMDSv2 defaults and narrowed
  default role."
initial_access: Prompt injection / SSRF via agent tools against exposed AgentCore agent
ai_tooling_and_models:
  - AWS Bedrock AgentCore
other_tooling:
  - IMDS / IMDSv2
  - AWS Secrets Manager
  - ECR
victims_and_sectors: Organizations deploying AgentCore agents (research disclosure; patched)
regions:
  - unknown
attribution_or_cluster: Vulnerability research (Zenity at SecTor)
scale_and_metrics: Single prompt to one agent → account/region AgentCore blast radius (pre-fix)
prevention_angle: Least-privilege agent IAM; IMDSv2; agent's role is its blast radius
related_magicsword_projects: []
source_notes: null
last_reviewed: 2026-10-20
