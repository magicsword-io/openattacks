technique_summary: "n0n ransomware operator exposed staging server at 185.157.161.148 with 1,719 files including 829 scripts, 5 C++ encryptor sources, and OpenCode AI coding agent environment. OpenCode configured with 154 model entries across 7 providers (Gemini, Mistral, Nemotron, Llama, Claude, GPT-5.x, Grok, Kimi, GLM, DeepSeek, MiniMax, Qwen) including uncensored and abliterated models (safety training removed) plus self-hosted model. Agent wrote and debugged hundreds of attack scripts; gateway spending $7,216 by Oct 22, 2026. Entry via credential stuffing (305 FortiGate SSL-VPN), exposed AWS keys, weak RDP/WinRM, compromised hosting portals. Hijacked Cisco Firepower Management Center to switch all policies to BLOCK. Human-directed operation supported by AI; no fully autonomous attack system. 93 listed victims, $283.7M total ransom demands."
initial_access: "Credential-only access: credential stuffing campaign against 305 FortiGate SSL-VPN devices, exposed AWS keys, weak RDP/WinRM credentials, compromised hosting management portals; no vulnerability exploitation found"
