attack_flow:
  nodes:
    - id: auth
      title: Obtain authentication
      description: "Default LANGFLOW_AUTO_LOGIN=true provides token without credentials via GET /api/v1/auto_login; or brute-force credentials if auto-login disabled"
      kind: access
      source_urls:
        - https://github.com/langflow-ai/langflow/security/advisories/GHSA-w794-rj3p-xv45
    - id: inject-command
      title: Add malicious MCP server
      description: "POST/PATCH /api/v2/mcp/servers/{server_name} with Stdio transport; command field contains arbitrary OS command (reverse shell, file operations, etc.); env field can inject LD_PRELOAD, PATH override"
      kind: ai
      source_urls:
        - https://github.com/langflow-ai/langflow/security/advisories/GHSA-7w94-79vh-5mr2
    - id: trigger
      title: Trigger execution
      description: "Command executes automatically when GET /api/v2/mcp/servers?action_count=true (happens when anyone navigates to MCP settings page); re-executes every time list loaded; persistent backdoor"
      kind: execution
      source_urls:
        - https://github.com/langflow-ai/langflow/security/advisories/GHSA-7w94-79vh-5mr2
    - id: rce
      title: Remote code execution
      description: "User-supplied command wrapped in bash -c 'exec {command}' and executed; no validation, allowlisting, or sandboxing; runs with Langflow process privileges; full server compromise possible"
      kind: impact
      source_urls:
        - https://github.com/langflow-ai/langflow/security/advisories/GHSA-7w94-79vh-5mr2
  edges:
    - source: auth
      target: inject-command
    - source: inject-command
      target: trigger
    - source: trigger
