ai_role_detail: "Authenticated RCE via MCP Stdio server configuration allows arbitrary OS command execution on Langflow AI workflow platform"
technique_summary: "GHSA-7w94-79vh-5mr2 (CVE-2026-105697) and GHSA-w794-rj3p-xv45: Authenticated Langflow users can achieve RCE by adding MCP server with Stdio transport. User-supplied command field passed directly to bash -c 'exec {command}' with zero validation, no allowlisting, no sandboxing. Env field allows arbitrary environment variable injection (LD_PRELOAD, PATH override). Command executes when server list fetched with action_count=true - happens automatically in UI MCP settings page. Affects <1.9.0 (GHSA-7w94-79vh-5mr2) and <1.10.3 (GHSA-w794-rj3p-xv45). Default LANGFLOW_AUTO_LOGIN=true hands out token without credentials. Previdian honeypots recorded 1,423 exploitation attempts from 27 IPs (Belgium, China, Germany, Hong Kong, Japan, Nigeria, Philippines, Russia, Seychelles, Singapore, South Korea, Taiwan, Tanzania, US, Vietnam) beginning Sep 19, 2026. Attackers first checked auto-login, then brute-forced credentials. Fixed in 1.9.0 (command allowlist) and 1.10.3 (full policy enforcement, removed bash wrapper). GitHub: github.com/langflow-ai/langflow."
initial_access: "Authenticated user access (or LANGFLOW_AUTO_LOGIN=true provides token without credentials); exploitation via POST/PATCH /api/v2/mcp/servers/{server_name} or embedded flow configs"
ai_tooling_and_models:
  - Langflow AI workflow platform
  - Model Context Protocol (MCP) Stdio transport
other_tooling:
  - bash command execution
  - Environment variable injection (LD_PRELOAD, NODE_OPTIONS, PYTHONPATH, BASH_ENV)
victims_and_sectors: "Langflow installations; multiple internet-facing vulnerable instances found; 1,423 exploitation attempts against Previdian honeypots from 27 countries"
regions:
  - Multiple regions
attribution_or_cluster: "Multiple attackers from 27 countries; financially motivated/opportunistic exploitation"
scale_and_metrics: "1,423 exploitation attempts against Previdian honeypots from 27 IPs (Sep 19-Oct 2026); 333 attempts on Oct 11 alone; first attempts Sep 19 (2+ weeks before CVE publication Oct 5); dramatic increase post-CVE"
prevention_angle: "Upgrade to Langflow 1.10.3+; disable LANGFLOW_AUTO_LOGIN; enforce strong unique passwords; review MCP server configurations; monitor /api/v2/mcp/servers/ API access; check for unexpected command/env entries; network segmentation; principle of least privilege"
related_magicsword_projects: []
source_notes: "Two GitHub Security Advisories (GHSA-7w94-79vh-5mr2 for <1.9.0, GHSA-w794-rj3p-xv45 for <1.10.3); Previdian observed exploitation 2+ weeks before public CVE; VulnCheck analysis of AI stack vulnerabilities. Detection: monitor Langflow API /api/v2/mcp/servers/ for suspicious commands, review MCP Stdio configs, check for bash -c execution, monitor env var injection patterns (LD_PRELOAD, PATH), alert on auto-login token requests from unexpected IPs."
category: attacks-on-ai
