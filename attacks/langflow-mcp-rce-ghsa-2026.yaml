    format: guidance
    notes: "Monitor POST/PATCH requests to /api/v2/mcp/servers/ endpoints for suspicious command parameters; alert on bash -c execution patterns, environment variable injection (LD_PRELOAD, PATH overrides), and auto-login token generation from unexpected IPs"
  - name: File system monitoring
    format: guidance
    notes: "Monitor Langflow process for execution of child processes via bash; alert on unexpected shell command execution from Langflow worker processes"
