technique_summary: Malicious GitHub issue content can indirectly prompt-inject
  an agent using the official GitHub MCP server. When a user asks the agent to
  inspect public issues, the agent can be coerced to read private repositories
  and leak contents via public PR/issue. Architectural trust issue (broad agent
  permissions + untrusted GitHub content), not a simple GitHub MCP code bug.
initial_access: User asks agent with GitHub MCP to process attacker-controlled public issue
