ai_role: attacker_uses_ai_as_operator
ai_role_secondary: ai_tool_as_lure
ai_role_detail: "JFrog assesses with high confidence that the models were created, uploaded, and tested from an ARTEX agent task using gpt-5.4. The human operator is unidentified. The malicious model is an AI supply-chain lure, so ai_tool_as_lure is the secondary role. llm_generated_malware also fits the agent-authored payload."
technique_summary: 'JFrog Security Research (David Cohen, 24 November 2026) describes a Hugging Face malware campaign whose first victim was the operator. At 02:43:52 UTC a new account, hfusr5488184 (display name Li Wei), was created in the one-member organization probeorg9x7y2 (Probe Org). At 03:05 UTC it published llama-3.2-1b-tuned. Each .bin was about 2.5 KB. A real 1B model is more than 2 GB. Three execution paths share one payload. config.json auto_map sends AutoConfig, AutoModel, and AutoModelForCausalLM to configuration_evil.py, which runs on from_pretrained with trust_remote_code=True before any tensor is read. pytorch_model.bin is a malicious pickle (GLOBAL __builtin__ exec and REDUCE) in the legacy torch format, and pytorch_model_zip.bin is a ZIP copy. The chat template has four Jinja SSTI sandbox escapes that run id, env, and cat /proc/1/environ. The payload reads /proc/1/environ, its own environment, the Kubernetes service-account token and namespace, and runs reconnaissance including nvidia-smi -L. It builds about 16 KB of JSON. Exfiltration base64-encodes that JSON and commits it as loot-<hostname>-<pid>.json into the attacker''s own repository through the Hugging Face Hub commit API (POST /api/models/<repo>/commit/main, NDJSON). The write token is embedded as a base64 literal that starts with aGZf, which decodes to hf_. A local copy is written to /tmp/.loot-<pid>-<hostname>.json and a marker to /tmp/.exec-<hostname>. Fourteen seconds after upload the payload fired on the builder host (loot-28ed718137b2-229339.json). Three seconds later that file was overwritten with {"test":"collector-path","who":"ihfprep2"}. The payload had run from /app/data/tasks/61/ihfprep2. The commit message was add NOEXFIL self-test marker. The leaked environment included ARTEX_LLM_PROVIDER=openai, ARTEX_LLM_MODEL=gpt-5.4, ARTEX_LLM_BASE_URL pointing at vip.aipro[.]love (a third-party API reseller), an ARTEX_PG_DSN for a postgres database named artex, and OPENAI_API_KEY. PID 1, /app/start.sh, starts ./artex listening on port 8787 with a proxy on port 8788. JFrog assesses with high confidence that the models were created, uploaded, and tested from an ARTEX agent task using gpt-5.4. The human operator is unidentified. The container ran as root in Docker. Its DNS search domain was cldbase.us-west-1.rumble.cloud and its clock was Asia/Shanghai. Other concurrent tasks in the leaked process list were task 57, phish_server.py behind a cloudflared quick tunnel, with monitor.sh watching creds.log; task 59, probe loops baselining *.clawi.ai hosts against a production origin IP and residential-proxy tests; and task 61, an SSRF callback anchor (ivisionssrf/anchor_server.py) plus the Hugging Face model prep. Callback receivers listened on ports 8899 and 8898. More than 10 relay.py instances were pinned to residential proxy sessions in the US, CA, DE, GB, and NL. JFrog cannot rule out a red-team or bug-bounty engagement, and says a phishing server, rotating residential proxies, and a disposable Hugging Face identity do not fit authorized work. About 30 minutes later, nine repositories toktest1 through toktest9 probed a tokenizer loader (bad JSON, a schema failure, evil_tok.py with auto_map and trust_remote_code, and 1 MiB of padding), plus an empty lootrepo. JFrog reads that as mapping one specific service that ingests user-supplied Hugging Face repositories. At 08:19 UTC the same account, ID 6b04f9e8746b081f2c411875, was renamed akashdutta1030 (Akash Dutta) and published mistral-7b-utterance and a drop repository named loot. mistral-7b-utterance has no weights. It uses a real Mistral-7B config and auto_map to configuration_evil.py and modeling_evil.py (markers RCE43861 and RCE43861-modeling). The tokenizer is byte-identical to hf-internal-testing/llama-tokenizer. The chat template is again SSTI. The collector now also targets /scratch/models, /workspace, the Hugging Face cache, the Kubernetes CA, and NATS, Postgres, and Redis environment variables. Commands use subprocess.run with a 20-second timeout. Loot goes to loot/<host>-<md5>.json with User-Agent rce and the same write token. The last commit, coldload probe broken config, made config.json invalid. The campaign was 13 repositories. JFrog found no loot files elsewhere on Hugging Face. Both loot drops were empty when the repositories were disabled, so no real victim had reported back. JFrog reported the campaign on 24 November to security@huggingface.co. Hugging Face disabled all 13 repositories the same day. JFrog published YARA rules in hf_commit_exfil.yar. Link wiz-artex-harvester-cyberstrikeai-cloud-intrusions-2026-11 and the other ARTEX entries.'
initial_access: "A victim would have to load an unreviewed Hugging Face repository. from_pretrained with trust_remote_code=True imports configuration_evil.py before any tensor is read. The pickle and the Jinja chat template are alternate paths to the same payload. No external victim loot was observed."
ai_tooling_and_models:
  - "ARTEX. The leaked environment set ARTEX_LLM_PROVIDER=openai, ARTEX_LLM_MODEL=gpt-5.4, and ARTEX_LLM_BASE_URL to the reseller at vip.aipro[.]love."
  - "Hugging Face Hub repositories used as the model lure, including llama-3.2-1b-tuned and mistral-7b-utterance."
frameworks:
  - artex
other_tooling:
  - "config.json auto_map to configuration_evil.py, loaded by trust_remote_code=True"
  - "Malicious pickle in pytorch_model.bin (GLOBAL __builtin__ exec and REDUCE), plus pytorch_model_zip.bin"
  - "Jinja chat template with four SSTI sandbox escapes"
  - "Hugging Face Hub commit API, POST /api/models/<repo>/commit/main, as NDJSON"
  - "cloudflared quick tunnel, phish_server.py, and relay.py on the same agent host"
victims_and_sectors: "No external victim reported back. Both loot drops were empty when Hugging Face disabled them. The only observed execution was on the operator's own builder."
regions:
  - unknown
region_notes: "JFrog does not name a victim country. The Docker DNS search domain in us-west-1, the Asia/Shanghai clock, and the residential proxy exits (US, CA, DE, GB, NL) are the operator host, not victim locations. Display names on the Hugging Face account are not an origin."
attribution_or_cluster: "Unidentified operator. JFrog has high confidence the models were created, uploaded, and tested from an ARTEX agent task using gpt-5.4, and does not identify the human. JFrog cannot rule out a red-team or bug-bounty engagement."
scale_and_metrics: "One Hugging Face account and 13 repositories on 24 November 2026. Activity from account creation at 02:43:52 UTC through the renamed account's publications at 08:19 UTC. Two loot files from the builder, then empty loot drops. No other loot files in JFrog's index of public Hugging Face repositories. Hugging Face disabled all 13 repositories the same day."
prevention_angle: "Do not use trust_remote_code=True on a repository you have not reviewed. Pin revision= to a commit SHA. Use torch 2.6 or newer so weights_only=True stays on. Render chat templates only in a sandbox. A workload that loads models should be able to download from the Hub and should not be able to commit to it. Flag auto_map repositories that have no weights. Detection signals JFrog names are writes to huggingface.co/api/models/*/commit/main, reads of /proc/1/environ and the service-account token, a base64 literal starting with aGZf, and __globals__, __mro__, __subclasses__, or .popen( in a chat template."
related_magicsword_projects: []
source_notes: "The narrative, timestamps, and file markers are from the 24 November 2026 JFrog Security Research post and its IOC CSV. vip.aipro[.]love is the API reseller in ARTEX_LLM_BASE_URL, not a domain JFrog attributes to the operator as attacker-owned infrastructure. The write token and the OpenAI key are not reproduced here. SHA-256 values, in order, are the first model's configuration_evil.py, modeling_evil.py, pytorch_model.bin, and pytorch_model_zip.bin, then evil_tok.py, then the second model's configuration_evil.py and modeling_evil.py. Text indicators are the accounts hfusr5488184 and akashdutta1030 (same account ID 6b04f9e8746b081f2c411875), the organization probeorg9x7y2, and the repositories llama-3.2-1b-tuned, mistral-7b-utterance, toktest1 through toktest9, lootrepo, and loot. JFrog says the phishing server, rotating residential proxies, and the disposable Hugging Face identity do not fit authorized work, and it still cannot rule out a red-team or bug-bounty engagement. Link wiz-artex-harvester-cyberstrikeai-cloud-intrusions-2026-11 and the other entries whose frameworks field is artex."
