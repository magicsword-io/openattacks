attack_flow:
  nodes:
    - id: publish
      title: Fake model on a new Hub account
      description: "At 02:43:52 UTC the account hfusr5488184 (Li Wei) is created in probeorg9x7y2. At 03:05 UTC it publishes llama-3.2-1b-tuned. Each .bin is about 2.5 KB."
      kind: access
      source_urls: &jfrog
        - https://research.jfrog.com/post/the-agent-that-robbed-itself-an-ai-driven-hugging-face-malware-campaign-leaks-its-own-operator/
    - id: loaders
      title: Remote code, pickle, and Jinja SSTI
      description: "auto_map loads configuration_evil.py when trust_remote_code=True, before any tensor is read. pytorch_model.bin is a malicious pickle and pytorch_model_zip.bin is a ZIP copy. Four Jinja SSTI escapes in the chat template run id, env, and cat /proc/1/environ."
      kind: execution
      source_urls: *jfrog
    - id: collect
      title: Environment, token, and GPU recon
      description: "The payload reads /proc/1/environ, its own environment, the Kubernetes service-account token and namespace, and runs reconnaissance including nvidia-smi -L. The collected JSON is about 16 KB."
      kind: execution
      source_urls: *jfrog
    - id: commit
      title: Commit the loot to the same repo
      description: "Base64 JSON is committed as loot-<hostname>-<pid>.json through POST /api/models/<repo>/commit/main. The write token is a base64 literal starting with aGZf. Local copies go to /tmp/.loot-<pid>-<hostname>.json and /tmp/.exec-<hostname>."
      kind: impact
      source_urls: *jfrog
    - id: selftest
      title: ARTEX runs the payload on itself
      description: "Fourteen seconds after upload, loot-28ed718137b2-229339.json appears from the builder. Three seconds later it is overwritten with a collector-path self-test from /app/data/tasks/61/ihfprep2. The commit is add NOEXFIL self-test marker. The environment shows ARTEX listening on port 8787, gpt-5.4, and the reseller at vip.aipro[.]love."
      kind: ai
      source_urls: *jfrog
    - id: retune
      title: Tokenizer probes, then no weights
      description: "About 30 minutes later, toktest1 through toktest9 and an empty lootrepo probe a tokenizer loader. At 08:19 UTC the same account is renamed akashdutta1030 and publishes mistral-7b-utterance, which has no weights, plus a loot repository. The last commit makes config.json invalid."
      kind: execution
      source_urls: *jfrog
  edges:
    - source: publish
      target: loaders
    - source: loaders
      target: collect
    - source: collect
      target: commit
    - source: commit
      target: selftest
    - source: selftest
      target: retune
