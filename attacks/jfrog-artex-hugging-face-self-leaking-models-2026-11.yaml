detections:
  - name: Kubernetes Service Account Secret Access
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/credential_access_kubernetes_service_account_secret_access.toml"
    notes: "Linux process start whose command line contains the Kubernetes serviceaccount path. JFrog says the payload reads that token. A read inside configuration_evil.py that never places the path in argv does not match this rule."
  - name: JFrog YARA hf_commit_exfil.yar
    format: guidance
    url: "https://research.jfrog.com/hf-agent-self-exfil-hf_commit_exfil.yar"
    notes: "JFrog publishes this file with the report. It is YARA, not a Sigma, Splunk, or Elastic rule. The file defines HF_Model_Loot_Exfil_via_Commit_API and HF_ChatTemplate_Jinja_SSTI. Also hunt Hub commit API writes, reads of /proc/1/environ, a base64 literal starting with aGZf, and __globals__, __mro__, __subclasses__, or .popen( in a chat template. No public Sigma, Splunk, or Elastic rule checked for this entry keys on those Hub or Jinja signals."
