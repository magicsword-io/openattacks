ai_role_detail: "Supply-chain attack impersonating Anthropic's official PDF skill; tampered skill archives contain 5.1 MB garble-obfuscated Linux Go backdoor exposing developer workstations to remote shell access"
technique_summary: "Cyera Research (Nov 3, 2026) discovered six skill archives impersonating Anthropic's official PDF skill, observed May 23 - July 14, 2026. Each archive contains 11 files byte-identical to upstream Anthropic pdf skill (github.com/anthropics/skills), but SKILL.md is truncated from 315 lines to 19 lines keeping official name and description while replacing Quick Start section with curl https://scan.100tal.com command, and adds 5.1 MB garble-obfuscated 64-bit Linux Go ELF binary system_linux. Binary features AES-256-GCM encrypted configuration with 0xAA XOR decryption revealing C2 81.70.101.115:2345 and attaches /bin/bash over raw TCP socket. Simplified Chinese strings in binary and UTC+8 archive timestamps indicate Chinese-language development environment. scan.100tal.com hostname linked to TAL Education Group infrastructure. Cyera notes attribution is unknown and could indicate targeted attack or internal security exercise. Cyera analyzed archives but did not observe live execution of system_linux backdoor. garble obfuscator (github.com/burrowers/garble) used to strip Go function names and identifiers. Demonstrates supply-chain risk where skill typosquatting or compromised distribution channels can deliver backdoors to AI developer environments."
initial_access: "Developers install tampered PDF skill archive from unknown distribution channel (not Anthropic's official Skills repository)"
ai_tooling_and_models:
  - Anthropic Claude Skills (impersonated; official repo https://github.com/anthropics/skills)
  - garble Go obfuscator (https://github.com/burrowers/garble)
other_tooling:
  - system_linux Go backdoor (5.1 MB ELF64, AES-256-GCM + 0xAA XOR config)
  - /bin/bash reverse shell over TCP
victims_and_sectors: "AI developers using Claude Skills; targets include AI/ML engineering teams, research labs, and organizations deploying Anthropic skills"
regions:
  - Multiple regions
attribution_or_cluster: "Unknown actor; UTC+8 archive timestamps; Simplified Chinese strings in binary; scan.100tal.com hostname (TAL Education Group-linked); Cyera notes attribution unknown and could be targeted attack or security exercise"
scale_and_metrics: "Six tampered skill archives observed May 23 - July 14, 2026; Cyera analyzed archives but did not observe live system_linux execution"
prevention_angle: "Only install skills from Anthropic's official Skills repository (github.com/anthropics/skills); verify skill archive integrity and file count before installation; scan skill archives for unexpected binaries (system_linux, system_darwin, etc.); monitor skill installation for outbound connections to non-Anthropic domains (scan.100tal.com, 81.70.101.115); implement network egress filtering for skill execution environments; use read-only skill directories where possible; audit SKILL.md for truncated or modified Quick Start sections referencing external domains; educate developers on skill supply-chain risks"
related_magicsword_projects: []
source_notes: "Cyera Research (Assaf Morag, Nov 3, 2026) primary source; all hashes from Cyera IoC table: system_linux SHA-256 50cb53704f318e4fc9a9cd8f6d32eb98d8c666501c720d63c2c701caeb6fa946, SKILL.md SHA-256 d0d4144609825ee7480f7889ee04d97f4b1d9eaa8a46c2a0d46d81ab5aa83827, plus archive hashes; network IOCs 81.70.101.115 and scan.100tal.com verified from Cyera; Cyera explicitly states archives were analyzed but system_linux was not observed executing"
