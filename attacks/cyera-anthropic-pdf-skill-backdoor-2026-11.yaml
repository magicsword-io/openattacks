  - name: Skill supply-chain integrity monitoring
    format: guidance
    notes: "Verify skill archives against official Anthropic Skills repository (github.com/anthropics/skills); alert on unexpected binaries in skill directories (system_linux, system_darwin); scan SKILL.md for modified Quick Start sections referencing external domains (scan.100tal.com); monitor skill installation for outbound TCP connections to non-Anthropic infrastructure (81.70.101.115:2345); detect garble-obfuscated Go binaries via string entropy analysis; flag skill archives with UTC+8 timestamps and Simplified Chinese strings when organization is not China-based"
  - name: Network egress filtering
