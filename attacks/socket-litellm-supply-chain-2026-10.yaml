attack_flow:
  nodes:
    - id: supply-chain
      title: Compromised release workflow
      description: "Project release workflow used lookalike repository Berri-AI/litellm (hyphenated) instead of legitimate BerriAI/litellm; malicious commit added Maturin data directory; build provenance recorded source-owner override"
      kind: access
      source_urls:
        - https://socket.dev/blog/litellm-compromise
    - id: distribution
      title: Malicious package distribution
      description: "Published litellm 1.107.0 to PyPI (7 wheels across macOS/Linux/Windows) and Docker images to GHCR with floating tags (latest, main-latest, main-stable)"
      kind: execution
      source_urls:
        - https://socket.dev/blog/litellm-compromise
    - id: installation
      title: Python startup hook installation
      description: "Wheels install cook.pth, cook.py, sitecustomize.py to environment's Python library directory; triggered automatically on any Python startup"
      kind: execution
      source_urls:
        - https://socket.dev/blog/litellm-compromise
    - id: collection
      title: Credential collection
      description: "Collects AWS/Azure/GCP/K8s, AI tools (Codex/Claude/Gemini/Cursor/Copilot/Windsurf), SSH/GPG keys, browser data, LiteLLM proxy DB credentials, environment variables; 16 collection modules with individual error handling"
      kind: ai
      source_urls:
        - https://socket.dev/blog/litellm-compromise
    - id: exfiltration
      title: Encrypted exfiltration
      description: "Data encrypted with AES-256-CBC, key wrapped with RSA-4096 public key, packaged in gzip tar; POSTed to www.litellm.dev/healthcheck with X-Token header; up to 4 retry attempts"
      kind: impact
      source_urls:
        - https://socket.dev/blog/litellm-compromise
    - id: persistence
      title: Remote code loader
      description: "sitecustomize.py forks detached process; downloads domain.txt from GitHub repo letters9813/pythonclient-test; if domain resolves, downloads and executes Python from /codepy endpoint; 1-hour loop"
      kind: execution
      source_urls:
        - https://socket.dev/blog/litellm-compromise
  edges:
    - source: supply-chain
      target: distribution
    - source: distribution
      target: installation
    - source: installation
      target: collection
    - source: collection
      target: exfiltration
    - source: installation
      target: persistence
    - source: persistence
      target: collection
      loop: true
