id: socket-litellm-supply-chain-2026-10
name: LiteLLM 1.107.0 backdoor steals cloud and AI credentials
date_reported: 2026-10-21
researcher: Socket Research Team
org: Socket
sources:
  - url: https://socket.dev/blog/litellm-compromise
    title: LiteLLM PyPI Package and Docker Images Compromised to Steal Cloud and AI Credentials
borderline: false
borderline_note: null
ai_role: ai_credential_theft
ai_role_secondary: ai_agent_or_mcp_as_target
ai_role_detail: Supply chain attack targeting AI gateway, steals cloud/AI-tool/gateway credentials via Python startup hooks
technique_summary: "LiteLLM version 1.107.0 on PyPI and GHCR delivered malware through Python startup hooks (cook.pth, cook.py, sitecustomize.py). The payload collects: AWS/Azure/GCP/K8s credentials, GitHub CLI tokens, SSH/GPG keys, AI tool credentials (Codex, Claude, Gemini, Cursor MCP, Copilot, etc.), browser data, LiteLLM proxy database credentials, and environment variables. Collector encrypts data with AES-256-CBC and exfiltrates to www.litellm.dev/healthcheck. A second loader downloads Python from GitHub-controlled domain for remote execution. Docker provenance showed lookalike repository Berri-AI/litellm (hyphenated) instead of legitimate BerriAI/litellm."
initial_access: "Supply chain compromise: malicious wheels published to PyPI and Docker images to GHCR; project release workflow used lookalike source repository (Berri-AI/litellm with hyphen)"
ai_tooling_and_models:
  - LiteLLM (legitimate proxy for LLM providers, compromised version)
other_tooling:
  - Python startup hooks (cook.pth for import cook, sitecustomize.py)
  - Base64-encoded zlib-compressed credential collector
  - Maturin build with data directory
  - RSA-4096 encryption for exfiltration
  - GitHub domain.txt pointer for remote code loader
victims_and_sectors: "LiteLLM users across ~23M weekly downloads; affects AI development, cloud deployments, CI/CD pipelines"
regions:
  - unknown
attribution_or_cluster: "unknown; lookalike repository and release workflow compromise suggest targeted supply chain operation"
scale_and_metrics: "LiteLLM receives ~23M weekly downloads; 7 platform-specific wheels published Oct 21, 2026 11:39:51 UTC, flagged by Socket AI scanner at 11:46:30 UTC; multiple GHCR/Docker Hub image tags affected"
prevention_angle: "Block litellm==1.107.0 and affected image digests; Python startup hook monitoring; dependency pinning and artifact verification; registry tag floating risks; separate release credentials from installation environments; audit cloud/AI credentials"
related_magicsword_projects: []
source_notes: "Socket Research Team detected via AI scanner 7 minutes after publication; Upwind provided independent container investigation; Docker provenance recorded malicious source-owner override; loader GitHub pointer returned empty response at 13:01:44 UTC Oct 21"
last_reviewed: 2026-11-04
