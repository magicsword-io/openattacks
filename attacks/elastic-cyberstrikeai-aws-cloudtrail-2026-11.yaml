attack_flow:
  nodes:
    - id: validate
      title: GetCallerIdentity sweeps
      description: "On Sep 30 the server validates four IAM users across three accounts, with three GetCallerIdentity calls in one second, and requests GetSessionToken."
      kind: access
      source_urls: &a1
        - https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    - id: userdata
      title: 56 userData reads in 141 ms
      description: "app-role calls DescribeInstanceAttribute for userData 56 times in 141 milliseconds after an earlier GetSecretValue."
      kind: ai
      source_urls: *a1
    - id: ssm
      title: Decrypt a parameter, then SendCommand
      description: "On Oct 2 container-role reads an SSM SecureString and issues SendCommand 29 seconds later. The command text is not in the audit log."
      kind: execution
      source_urls: *a1
    - id: return
      title: Recheck after 14 days
      description: "On Oct 16 the same server calls GetSessionToken in a fourth account and revalidates two earlier users."
      kind: impact
      source_urls: *a1
  edges:
    - source: validate
      target: userdata
    - source: userdata
      target: ssm
    - source: ssm
      target: return
category: adversary-use-of-ai
attribution:
  actor_name: "Unnamed CyberStrikeAI operator"
