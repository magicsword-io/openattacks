  confidence: medium
ai_involvement_confidence: vendor-asserted
detections:
  - name: AWS EC2 User Data Retrieval for EC2 Instance
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_ec2_userdata_request_for_ec2_instance.toml"
    notes: "AWS CloudTrail. DescribeInstanceAttribute for userData. Elastic says this rule fired 58 times."
  - name: AWS EC2 Bulk User Data Enumeration
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_ec2_bulk_user_data_enumeration.toml"
    notes: "AWS CloudTrail. Elastic added this high-severity rule for more than 20 distinct userData reads by one principal and source IP in 10 minutes. The intrusion had 56 calls in 141 milliseconds."
  - name: AWS STS GetCallerIdentity API Called for the First Time
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_new_terms_sts_getcalleridentity.toml"
    notes: "AWS CloudTrail. First GetCallerIdentity for an identity. Elastic says this rule fired 11 times."
  - name: AWS STS GetCallerIdentity Bulk Account Enumeration
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_sts_getcalleridentity_bulk_account_enumeration.toml"
    notes: "AWS CloudTrail. Elastic added this high-severity rule for three or more distinct non-role identities calling GetCallerIdentity from the same external IP and ASN in 10 minutes."
  - name: First Time Seen AWS Secret Value Accessed in Secrets Manager
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/credential_access_new_terms_secretsmanager_getsecretvalue.toml"
    notes: "AWS CloudTrail. First GetSecretValue. Elastic says this rule fired 4 times, including app-role and nonprod-role."
  - name: AWS Systems Manager SecureString Parameter Request with Decryption Flag
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/credential_access_retrieve_secure_string_parameters_via_ssm.toml"
    notes: "AWS CloudTrail. GetParameter with decryption. Matches the Oct 2 container-role read."
  - name: "AWS SSM `SendCommand` Execution by Rare User"
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/execution_ssm_sendcommand_by_rare_user.toml"
    notes: "AWS CloudTrail. Rare SendCommand. Matches the command issued 29 seconds after the SecureString read. The article's low-severity rule name is AWS SSM SendCommand Execution by Rare User."
  - name: GetSessionToken and off-instance role use
    format: guidance
    notes: "The article also names AWS STS GetSessionToken Usage (3 low alerts). The public rule titled AWS IAM API Calls via Temporary Session Tokens describes later IAM calls that use a temporary token, not the GetSessionToken API itself, so it is not cited. Also hunt instance-role credentials whose source IP is not the instance or the organization's NAT, and the certificate serial 3356730520974368630."
