id: elastic-cyberstrikeai-aws-cloudtrail-2026-11
name: Elastic CyberStrikeAI server reads AWS user data, secrets, and sends an SSM command
date_reported: 2026-11-13
date_activity_start: "2026-09-30"
date_activity_end: "2026-10-16"
researcher: Samir Bousseaden, Bryan Porras Blanch, Terrance DeJesus
org: Elastic Security Labs
sources:
  - url: https://www.elastic.co/security-labs/threat-command/cyberstrikeai-aws-cloudtrail-intrusion
    title: "56 AWS API calls in 141 milliseconds: Inside an AI-run intrusion"
    publisher: Elastic Security Labs
  - url: https://github.com/AIPentest/CyberStrikeAI
    title: CyberStrikeAI
    publisher: AIPentest
magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: attacker_uses_ai_as_operator
ai_role_secondary: ai_credential_theft
ai_role_detail: "Elastic attributes the AWS calls to a CyberStrikeAI server from scan data and machine-speed CloudTrail. Elastic says it cannot prove an LLM agent made the decisions and does not know how the credentials were stolen."
technique_summary: "Elastic Security Labs (Samir Bousseaden, Bryan Porras Blanch, Terrance DeJesus; Nov 13, 2026) describes one CyberStrikeAI server, 43.240.29.11 (AS133199, SonderCloud Limited, Hong Kong), using stolen credentials for eight identities across four AWS accounts from Sep 30 to Oct 16, 2026. Five were IAM users and three were EC2 instance roles. The role sessions were named after instance IDs, and using them from an outside IP means the credentials were taken off the instances. Activity fell on four days and produced 78 alerts, all medium or low, which Elastic says only cohered once correlated by source IP. On Sep 30 the server called GetCallerIdentity on four IAM users across three accounts within 51 minutes, three of those calls in the same second, plus GetSessionToken. The same day app-role read Secrets Manager and then issued 56 DescribeInstanceAttribute userData calls in 141 milliseconds (about 2.5 ms per call), part of 57 user-data reads from one assumed-role session that day and 58 user-data alerts overall. On Oct 1 it revalidated credentials, read more secrets with app-role, and used nonprod-role for two GetSecretValue calls. On Oct 2 container-role called GetParameter with decryption on an SSM SecureString and SendCommand 29 seconds later. CloudTrail does not show the command text or whether it succeeded. After 14 quiet days, on Oct 16 the server called GetSessionToken for a previously unseen user in a fourth account and rechecked two earlier users. Internet scan data showed 43.240.29.11 serving a CyberStrikeAI page on port 8080, with a self-signed certificate (CN CyberStrikeAI, serial 3356730520974368630, issued 2026-09-15), one day before the first alert. 43.240.29.28 and 43.240.29.33 served the same page, FOFA fid, and certificate but were not in this AWS telemetry. Elastic says none of the three was still serving that interface as of November 2026. Six Elastic rules fired: AWS EC2 User Data Retrieval for EC2 Instance (58, medium), AWS STS GetCallerIdentity API Called for the First Time (11, medium), First Time Seen AWS Secret Value Accessed in Secrets Manager (4, medium), AWS STS GetSessionToken Usage (3, low), AWS SSM SendCommand Execution by Rare User (1, low), and AWS Systems Manager SecureString Parameter Request with Decryption Flag (1, medium). Elastic added two high-severity rules: AWS EC2 Bulk User Data Enumeration (more than 20 distinct instances in 10 minutes) and AWS STS GetCallerIdentity Bulk Account Enumeration (three or more distinct non-role identities from the same external IP and ASN in 10 minutes). Elastic, citing Will Thomas at Team Cymru, says 21 CyberStrikeAI IPs were counted in early 2026, aimed at Fortinet edge devices, and that this is the first Elastic case of the same tooling turned on AWS. The repository contains 24 SKILL.md files, including skills/unlimited-attack-scope/SKILL.md and skills/cloud-attack-methods/SKILL.md. Elastic cites https://github.com/Ed1s0nZ/CyberStrikeAI, which redirects to https://github.com/AIPentest/CyberStrikeAI. Link kaspersky-cyberstrikeai-schools-2026 and trendai-chinese-language-operators-used-cyberstrikeais-2026-10."
initial_access: "Stolen AWS credentials for five IAM users and three EC2 instance roles, used from an external IP. Elastic does not know how the credentials were obtained."
ai_tooling_and_models:
  - "CyberStrikeAI (https://github.com/AIPentest/CyberStrikeAI), web interface on TCP 8080"
  - "24 SKILL.md files in the repository, including unlimited-attack-scope and cloud-attack-methods"
other_tooling:
  - "AWS APIs GetCallerIdentity, GetSessionToken, GetSecretValue, DescribeInstanceAttribute, GetParameter, SendCommand"
victims_and_sectors: "Four AWS accounts. Account and identity names were replaced with aliases. No sector was named."
regions:
  - unknown
attribution_or_cluster: "Unnamed operator. Elastic confirms the source IP served CyberStrikeAI. No country or motivation is stated. Hong Kong is the hosting location."
scale_and_metrics: "One server, eight identities, four accounts, 78 alerts, four active days from Sep 30 to Oct 16, 2026. Fifty-six userData calls in 141 milliseconds. Sixty-five of 78 alerts fell on Sep 30."
prevention_angle: "Rotate every identity that touched 43.240.29.11 and revoke active sessions. Replace instance profiles whose role credentials were used off-instance. Treat secrets in EC2 user data as exposed. Review SSM command history for the Oct 2 SendCommand. Restrict ec2:DescribeInstanceAttribute for userData. Correlate medium and low CloudTrail alerts by source IP across multi-day gaps."
related_magicsword_projects:
  - LOLSkills
source_notes: "API sequence, alert counts, rule names, certificate serial 3356730520974368630, and the three IPs are from the Elastic article. Only 43.240.29.11 appeared in the AWS alerts. The 24 SKILL.md count was checked on the repository default branch on 2026-11-15. Elastic cites https://github.com/Ed1s0nZ/CyberStrikeAI; that URL redirected to https://github.com/AIPentest/CyberStrikeAI. Link kaspersky-cyberstrikeai-schools-2026 and trendai-chinese-language-operators-used-cyberstrikeais-2026-10."
last_reviewed: 2026-11-15
region_notes: "No victim country is stated. Hong Kong and AS133199 are the server's hosting location and are not recorded as a target region."
