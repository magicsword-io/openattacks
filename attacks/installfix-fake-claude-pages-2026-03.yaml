ai_role_detail: "InstallFix campaign creates fake Claude Code installation pages via SEO poisoning to distribute trojanized installers and credential stealers"
technique_summary: "Mar 6, 2026: Push Security identified 'InstallFix' campaign: 120+ fake websites impersonating official Claude Code installation pages (claude-code-download[.]com, get-claude-code[.]net, etc.). Sites rank highly in search results via SEO poisoning (typosquat domains, keyword stuffing, fake reviews). Offer trojanized Claude Code installers for Windows/macOS/Linux. Windows: NSIS installer bundles Claude Code with AMOS infostealer. macOS: DMG contains Claude Code.app + hidden LaunchAgent installing Atomic Stealer. Linux: .deb/.rpm with postinstall script deploying XMRig miner + credential harvester. All variants harvest: Anthropic API keys, OpenAI keys, GitHub tokens, AWS credentials, crypto wallets, browser cookies, SSH keys. Push Security tracked 8,900+ downloads Mar-May 2026. Average user dwell time before detection: 23 days. Detection: verify Claude Code install source (official anthropic.com only); check installer signatures; monitor for unexpected LaunchAgents (macOS) or startup tasks (Windows); scan for AMOS/Atomic Stealer/XMRig indicators."
initial_access: "User searches 'download Claude Code', finds fake site via SEO poisoning, downloads trojanized installer"
ai_tooling_and_models:
  - Claude Code (impersonated)
  - Anthropic Claude API
  - OpenAI API
other_tooling:
  - AMOS infostealer (Windows)
  - Atomic Stealer (macOS)
  - XMRig cryptocurrency miner (Linux)
  - Credential harvesters
  - SEO poisoning and typosquat domains
victims_and_sectors: "8,900+ downloads Mar-May 2026; AI developers, data scientists, software engineers seeking Claude Code"
regions:
  - Multiple regions
attribution_or_cluster: "Unknown actor; 'InstallFix' campaign; sophisticated SEO manipulation and multi-platform malware development"
scale_and_metrics: "120+ fake installation websites, 8,900+ downloads Mar-May 2026; avg 23-day dwell time before detection"
prevention_angle: "Only download Claude Code from official anthropic.com; verify installer signatures; check domain spelling before download; use bookmark for official site; educate users on SEO poisoning risks; implement endpoint security detecting AMOS/Atomic/XMRig; monitor for unexpected startup persistence mechanisms"
related_magicsword_projects: []
source_notes: "Push Security analysis. InstallFix represents evolution of software supply chain attacks: instead of compromising legitimate distribution, adversary creates parallel fake distribution network optimized for search discovery. Detection: alert on Claude Code installs from domains other than anthropic.com, scan for AMOS/Atomic Stealer/XMRig, monitor LaunchAgents and startup tasks created during install, check installer code signing (unsigned/wrong signature = malicious)."
