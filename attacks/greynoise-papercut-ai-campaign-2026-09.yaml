ai_role: attacker_uses_ai_as_operator
ai_role_secondary: null
ai_role_detail: "GreyNoise describes hundreds of agents on the OpenAI Codex harness with a DeepSeek model. Hunt.io recovered the AGENTS.md that instructed that agent, including a jailbreak section and a cap of 25 concurrent subagents."
technique_summary: "GreyNoise (9 September 2026) says that on 31 August 2026 a likely Russian-speaking actor used 45.142.193[.]132 and AI to develop and run exploits for PaperCut NG/MF CVE-2026-81578 and CVE-2026-82078. PaperCut had disclosed those flaws on 27 August 2026. CVE-2026-81578 is an unauthenticated request that can reach an admin-only Tapestry component. CVE-2026-82078 is unsafe reflection in the JDBC driver loading path. GreyNoise had already been tracking that address since early July 2026 for attacks on other internet-facing products. The actor used the OpenAI Codex harness with a DeepSeek model, not an OpenAI model, plus public offensive tools. GreyNoise reports at least 440 compromised PaperCut instances at 395 organizations in 48 countries, with other victims it could not tie to a named organization. Education was the largest sector in its table. Domain admin was achieved at 12 organizations. The actor went from an empty workspace to first remote code execution on a real victim in under four hours, to first domain admin two hours after that, and then to 11 organizations in 26 seconds once the campaign was running. One United States high school went from initial access to domain admin in seven minutes. Where domain admin was reached, the fastest time was five minutes and the longest was 144 minutes. GreyNoise describes three paths: harvesting LSASS and registry secrets when the PaperCut host was a domain member, noPac where CVE-2021-42278 and CVE-2021-42287 were unpatched, and adding a new account to Domain Admins when PaperCut already ran with that privilege. In all three, the actor used DCSync. The actor tried to skip 28 countries and the agents did not stick to that list. GreyNoise says it is unclear whether the actor was packaging access for others or would steal data or deploy ransomware itself, and that other PaperCut intrusions in the past have led to extortion. Cloudflare's WAF stopped one attempt. Hunt.io (15 October 2026) recovered three open directories on the same host, ports 8000, 18080, and 18081. pupercut/poc/CVE-2026-81578-82078/AGENTS.md is a 19 KB Russian and English system prompt for a Codex agent paired with a DeepSeek model. It tells the agent to assume the bug exists, to switch approach after two failures, and to write a state file about every ten minutes. An underground-mode section frames the work as an authorized training exercise, which Hunt.io describes as a jailbreak, and the file allows up to 25 concurrent subagents. Hunt.io says that cap is the mechanism behind GreyNoise's description of hundreds of agents. Hunt.io also documents a second remote-code path through PaperCut's XML-RPC API, using api.setConfigValue and api.lookUpUserNameByCardNo when the API allowlist is too open or no API token is set. On the host, Hunt.io found chisel with cron persistence for a reverse SOCKS5 tunnel, 2,165 logged exploit attempts of which 13 succeeded and 5 were interactive sessions, 1,005 hosts in the actor's reconnaissance pool across at least 45 countries, and 46 packaged Active Directory domains. A self-signed certificate issued by a PentAGI CA, DNS name pentagi.local, on port 33333, observed from 7 April to 6 July 2026, is what Hunt.io uses to tie the server to PentAGI. Hunt.io says that issuer appears on many unrelated hosts and does not by itself identify this operator's other servers."
initial_access: "Exploitation of PaperCut NG/MF CVE-2026-81578 and CVE-2026-82078. Hunt.io also documents a second path through the XML-RPC methods api.setConfigValue and api.lookUpUserNameByCardNo when API access controls are weak."
ai_tooling_and_models:
  - "OpenAI Codex harness"
  - DeepSeek
  - PentAGI
frameworks:
