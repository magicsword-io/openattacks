detections:
  - name: Suspicious Java Class File Created in PaperCut Server Library
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/initial_access_papercut_java_class_file.toml
    notes: "File events. A Java .class file created under the PaperCut server library path. Elastic wrote this rule for CVE-2026-82078 chained with CVE-2026-81578, which are the flaws GreyNoise and Hunt.io describe. Legitimate upgrades also write class files there."
  - name: Suspicious Child Process of PaperCut Server Component
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/initial_access_papercut_suspicious_child_process.toml
    notes: "Windows process creation. A suspicious child of pc-app.exe or pc-printjob-spooler.exe. Elastic ties the pc-app.exe case to CVE-2026-81578 and CVE-2026-82078. PaperCut Hive's spooler is named in the rule and is not the NG/MF campaign GreyNoise describes."
  - name: Dumping of Sensitive Hives Via Reg.EXE
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_reg_dumping_sensitive_hives.yml
    notes: "Windows process creation. reg.exe saving or exporting SAM, SYSTEM, or SECURITY. GreyNoise published hive-save commands for SYSTEM and SECURITY. Hunt.io recovered SECURITY and SYSTEM hives and a collector that calls the backup privileges used for that export."
  - name: Windows Sensitive Registry Hive Dump Via CommandLine
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_sensitive_registry_hive_dump_via_commandline.yml
    notes: "Windows process creation. reg.exe save or export of sam, system, or security. Same hive-export behavior as the Sigma rule, for Splunk CIM process data."
  - name: Windows AD Replication Request Initiated by User Account
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_ad_replication_request_initiated_by_user_account.yml
    notes: "Windows Security 4662. A user account, not a machine account, requesting directory replication. GreyNoise says DCSync was used on every path where domain admin was achieved. It does not say the requesting account failed the machine-account exclusion in this rule."
  - name: Active Directory Replication from Non Machine Account - DcSync Indicator
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_ad_replication_non_machine_account.yml
    notes: "Windows Security 4662. Replication rights requested by an account whose name does not end in $. Same DCSync behavior as the Splunk rule."
  - name: Potential Protocol Tunneling via Chisel Client
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/linux/command_and_control_linux_chisel_client_activity.toml
    notes: "Linux process creation. Chisel client flags plus a connection. Hunt.io recovered a chisel binary and scripts that keep a reverse SOCKS5 client running. The rule does not know the campaign's directory or port."
  - name: Suspicious Cron File Creation
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/linux/file_event/file_event_lnx_susp_cron_file_created.yml
    notes: "Linux file events. A new file under cron directories. Hunt.io says the chisel deploy script adds cron entries. A crontab line edit that does not create a file in those directories will not match. Administrators create cron files too."
  - name: Rules that do not match this campaign's published behavior
    format: guidance
    notes: "security-detections-mcp on 26 November 2026 returned Splunk's PaperCut NG Remote Web Access Attempt and Windows PaperCut NG Spawn Shell. Both cite the 2023 PaperCut advisory and URI paths or a generic pc-app.exe shell. They are not cited, because GreyNoise and Hunt.io describe CVE-2026-81578 and CVE-2026-82078, and Elastic's 2026 rules name those CVEs. No public rule encodes AGENTS.md, the underground-mode jailbreak, the XML-RPC method names, or the PentAGI certificate. chisel is not in LOLBAS or LOLRMM."
