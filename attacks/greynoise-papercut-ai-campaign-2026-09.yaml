  - "Public offensive tools GreyNoise lists, including Mimikatz, Rubeus, Impacket, NetExec, Certipy, and ligolo-ng. GreyNoise says not all of them were observed in use."
victims_and_sectors: "GreyNoise: at least 440 PaperCut NG/MF instances at 395 organizations in 48 countries, with education the largest sector in its table, and domain admin at 12 organizations. Hunt.io: the actor's reconnaissance pool listed 1,005 hosts across at least 45 countries, and packaged data covered 46 Active Directory domains. The 1,005 figure is the actor's target list, not a count of compromises."
regions:
  - Multiple regions
region_notes: "GreyNoise publishes a victim table across 48 countries and says the actor tried to avoid 28 countries, including some that still appear in the victim table. Hunt.io places the orchestration host in Amsterdam. That is hosting, not a victim country. The actor's country is not stated. GreyNoise describes the actor as likely Russian-speaking."
attribution_or_cluster: "GreyNoise: a likely Russian-speaking actor, motive not settled. Hunt.io cites that assessment and adds host artifacts. Hunt.io also cites a Blackpoint Cyber follow-up that this entry does not use, because that write-up was not located."
scale_and_metrics: "GreyNoise: 440 instances, 395 organizations, 48 countries, domain admin at 12, first real remote code execution in under four hours, 11 organizations in 26 seconds. Hunt.io logs: 2,165 attempts, 13 marked ok, 5 interactive sessions, 1,005 hosts in the recon pool, 46 packaged Active Directory domains, 45 targets with a live reverse SOCKS5 pivot at capture."
prevention_angle: "Patch PaperCut NG/MF for CVE-2026-81578 and CVE-2026-82078, and restrict the XML-RPC API so it is not reachable with a default or empty token. GreyNoise says a Cloudflare WAF stopped one attempt and that domain admin was not uniform. Hunt.io says detection should follow behavior, including unexpected child processes of the PaperCut server, registry-hive collection, DCSync, and chisel with cron, rather than blocking the PentAGI issuer or this one address. The issuer is shared by many PentAGI installs."
related_magicsword_projects: []
source_notes: "The campaign dates, victim table, and the three domain-admin paths are from the 9 September 2026 GreyNoise article. That article says it summarizes a longer GreyNoise Labs version. CVE-2026-81578 and CVE-2026-82078 are the flaws GreyNoise names. An earlier catalog text cited CVE-2023-27350 and CVE-2023-27351 and stated ransomware deployment. Those claims are not in the GreyNoise article and are withdrawn here. GreyNoise says follow-on theft or ransomware is unclear. Hunt.io's 15 October 2026 post is the source for the open directories, AGENTS.md, the XML-RPC path, the chisel cron setup, the log counts, and the PentAGI certificate. Hunt.io cites Blackpoint Cyber for a tooling follow-up. That follow-up was not found, so it is not a source here. Hunt.io says the PentAGI issuer is common and that filename pivots stayed on 45.142.193[.]132. The address 45.158.196[.]75 is GreyNoise's second execution host. File hashes below are the MD5 values GreyNoise published for collector and ADCS binaries, plus the PentAGI certificate SHA-256 from Hunt.io. No victim addresses are included. chisel is not in LOLBAS or LOLRMM, so it is not listed under related projects. The operator-written AGENTS.md is not a published skill."
