attack_flow:
  nodes:
    - id: install
      title: Malicious MCP server is installed
      description: "The user adds a server the attacker published. It is registered next to a legitimate server that can read files and call http_post."
      kind: access
      source_urls: &a1
        - https://arxiv.org/abs/2611.03555
    - id: describe
      title: Poisoned description enters the prompt
      description: "Frameworks copy tool descriptions, schema text, and tool responses into the model context. The paper says none of the 12 checks that text on purpose."
      kind: ai
      source_urls: *a1
    - id: post
      title: http_post carries the secret
      description: "A typical payload tells the model to read /workspace/.env and send it with the legitimate http_post tool."
      kind: execution
      source_urls: *a1
    - id: canary
      title: Canary confirms exfiltration
      description: "255 of the vulnerable cells put the planted secret on the canary at port 18080. The full vulnerable set is 2,113 of 9,720 cells."
      kind: impact
      source_urls: *a1
  edges:
    - source: install
      target: describe
    - source: describe
      target: post
    - source: post
      target: canary
