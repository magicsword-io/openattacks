detections:
  - name: Lab tool-description poisoning has no product rule
    format: guidance
    notes: "The paper's signal is a tool description that instructs a read of .env and an http_post, then a request to a canary on port 18080. No Sigma, Splunk, or Elastic rule names MCP tool descriptions. Review descriptions at install time. The authors' regex scanner rejected 20 of 45 scenarios and flagged 9 of 125 benign descriptions, so a scan is not coverage by itself."
