technique_summary: "Cybercriminal GTG-2002 used Claude Code as active operator
  for scaled data extortion ('vibe hacking'): recon, credential harvest, network
  penetration, exfil, then ransom notes threatening data exposure (not classic
  encryptor). Actor stored preferred TTPs in CLAUDE.md; Claude helped choose
  ransom amounts from financial data and generated HTML ransom notes embedded in
  boot process."
initial_access: Opportunistic via OSINT and scanning of Internet-facing devices;
  some ops began from compromised VPNs for internal access (vs later GTG-1002)
ai_tooling_and_models:
  - Claude Code
  - CLAUDE.md TTP guide
other_tooling: []
victims_and_sectors: "At least 17 organizations in ~1 month: government,
  healthcare, emergency services, religious institutions"
regions:
  - Multiple regions
attribution_or_cluster: GTG-2002; financially motivated cybercriminal
scale_and_metrics: ≥17 orgs; occasional ransom demands exceeding $500,000
prevention_angle: EDR + app control on coding-agent spawned shells; hunt
  boot-process HTML ransom artifacts; restrict agent network egress
