ai_role_detail: "The AI product names are the lure. Cato does not describe the operator using a model. Confirmed for the Claude Code and Codex ads and the shared loader. The attacker does not use AI."
technique_summary: "Cato CTRL (Dr. Guy Waizel and Jakub Osmani, 19 November 2026) followed sponsored Google results for Claude Code, Codex, and Homebrew. The ads ran under identities tied to real businesses whose products were unrelated to the advertised tools, which Cato reads as suspected compromise or misuse of advertiser accounts. Cato redacts the advertiser names. A separate breach-investigation notice for one company does not establish that its Google Ads account was compromised. A sponsored result for claude code mac download went through a Google /url redirect to parentpreneurx[.]com. The page showed a one-line Terminal install under some conditions and benign content under others, which Cato calls traffic cloaking. The command prints an Apple App Store URL, Base64-decodes a second URL, and pipes a script from vine-96[.]com into zsh. The App Store URL does not authenticate that script. The loader presents itself as update and cache work, rebuilds command names from variables, derives an AES key, decrypts an AES-128-CTR blob, gunzips it, and evals the shell. The decoded stage POSTs in the background to grove-satin[.]com/api/metrics/run?event=pasted with user and BuildID headers, then, without waiting, downloads a payload from vine-96[.]com, writes /tmp/helper, strips extended attributes, marks it executable, and launches it. Cato treats that loader and the event=pasted telemetry as AMOS delivery, citing a SANS chain with the same shape, and does not claim the POST is the final payload's C2. grove-satin[.]com is the telemetry host from Cato's 24 August 2026 Codex ClickFix report (Infrastructure Set 3, recorded in the 17 August notes). The 19 November report adds cross-brand reuse: codex-notes[.]com, cli-desktop[.]com, and claud-tips[.]com share basequill9[.]com; claud-tips[.]com and cli-codex[.]com share stride25[.]com; codex-craft[.]com and codex-desk[.]com share plume-compass[.]com. Cato says those overlaps can be one operator, shared tooling, or a distribution service. Shared Cloudflare addresses, including 188.114.96[.]9 and 188.114.97[.]9, are hosting context only and are not listed here as blocking indicators. Two other chains in the same report are not tied to that cluster. claude-tools[.]com served a DMG and, in a 14 September analysis, a JXA loader that profiled the host, pulled a native payload from kmtxyn[.]com/agent, and launched a counterfeit Finder.app. Homebrew lookalikes homebrexwin[.]com and storageprofiler[.]com share the Google /url pattern and have no recovered payload. nomeibrew[.]com and pirloz[.]com lead to a disk image whose arm64 app is named DayNote. Cato says the shared AES-128-CTR and gzip techniques do not establish a common operator with the Claude and Codex cluster, and the DayNote payload's family is unidentified. The actor is unnamed. The lure brands and the AMOS-associated stealer are financial."
initial_access: "Sponsored Google results for Claude Code, Codex, and Homebrew, with Google /url redirects and traffic cloaking, then a Terminal command the visitor pastes."
