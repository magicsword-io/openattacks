detections:
  - name: File Download or Read to Pipe Execution
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/file_download_or_read_to_pipe_execution.yml
    notes: "Selected from a security-detections-mcp search for curl piped to a shell. The search covers curl, wget, and other downloaders piped to zsh, bash, or sh. That matches the Claude command piping a vine-96[.]com script into zsh. It does not see the AES decrypt inside the retrieved script."
  - name: Decode Base64 Encoded Text -MacOs
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/macos/process_creation/proc_creation_macos_base64_decode.yml
    notes: "Selected from a security-detections-mcp search for base64 shell decode. It requires /usr/bin/base64 and the command line to contain -d. macOS base64 often uses -D, which would not match. Cato says the command Base64-decodes a second URL and does not publish the flag."
  - name: xattr -c and eval of curl do not match the indexed rules
    format: guidance
    notes: "security-detections-mcp searches for xattr, curl zsh, and macos curl did not return a rule for this loader's xattr -c. Sigma Gatekeeper Bypass via Xattr and Splunk MacOS Gatekeeper Bypass require com.apple.quarantine. Elastic Quarantine Attrib Removed by Unsigned or Untrusted Process excludes /usr/bin/xattr. Elastic Shell Evaluated Curl Downloaded Content requires eval of a $(curl) substitution, not a pipe into zsh. Sigma JXA In-memory Execution Via OSAScript requires osascript -e, eval, and NSData.dataWithContentsOfURL, which Cato does not publish for the separate claude-tools chain. Also hunt /tmp/helper and hxxps://grove-satin[.]com/api/metrics/run?event=pasted."
