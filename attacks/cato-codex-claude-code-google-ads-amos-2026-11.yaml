source_notes: "Domains, hashes, the loader sequence, and the cluster split are from the 19 November Cato article. The 24 August article is the Codex ClickFix report that first documents grove-satin[.]com/api/metrics/run?event=pasted, quill-flint[.]com, and the earlier Google Sites sets. Its Mach-O hashes for Infrastructure Sets 1 and 2 are left in that article. Set 3 hashes are repeated below because grove-satin is the link. Advertiser names are redacted in the source and are not reconstructed here. 193.187.151[.]195 and 172.236.51[.]169 are historical DNS associations for nomeibrew[.]com and storageprofiler[.]com, not confirmed payload C2. Cloudflare edge addresses are omitted."
