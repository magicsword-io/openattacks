attack_flow:
  nodes:
    - id: ads
      title: Sponsored result under another identity
      description: "A Google ad for Claude Code, Codex, or Homebrew is shown under an unrelated business identity. The Claude path uses a Google /url redirect and serves the install page only to some visitors."
      kind: access
      source_urls:
        - https://www.catonetworks.com/blog/threat-actors-abuse-suspected-compromised-google-ads-accounts-to-target-developers-with-fake-tools/
    - id: paste
      title: Terminal command pulls vine-96
      description: "parentpreneurx[.]com shows one Terminal line. It prints an App Store URL, Base64-decodes another URL, and pipes a script from vine-96[.]com into zsh."
      kind: execution
      source_urls:
        - https://www.catonetworks.com/blog/threat-actors-abuse-suspected-compromised-google-ads-accounts-to-target-developers-with-fake-tools/
    - id: loader
      title: AES loader and grove-satin telemetry
      description: "The script decrypts AES-128-CTR, gunzips, and evals. It POSTs event=pasted to grove-satin[.]com, writes /tmp/helper, runs xattr -c, and executes the file. grove-satin is the 24 August Codex telemetry host."
      kind: execution
      source_urls:
        - https://www.catonetworks.com/blog/threat-actors-abuse-suspected-compromised-google-ads-accounts-to-target-developers-with-fake-tools/
        - https://www.catonetworks.com/blog/cato-ctrl-when-trust-becomes-payload-in-fake-codex-clickfix-campaign/
    - id: amos
      title: AMOS-associated delivery
      description: "Cato assesses the loader as AMOS delivery because of the event=pasted request, the update-themed URL, and /tmp/helper. It does not identify the operator or claim every payload in the report is AMOS."
      kind: impact
      source_urls:
        - https://www.catonetworks.com/blog/threat-actors-abuse-suspected-compromised-google-ads-accounts-to-target-developers-with-fake-tools/
    - id: other
      title: JXA and DayNote stay separate
      description: "claude-tools[.]com leads to a JXA loader and a fake Finder.app from kmtxyn[.]com/agent. nomeibrew[.]com and pirloz[.]com lead to a DayNote disk image. Cato does not link either chain to the Claude and Codex cluster."
      kind: unknown
      source_urls:
        - https://www.catonetworks.com/blog/threat-actors-abuse-suspected-compromised-google-ads-accounts-to-target-developers-with-fake-tools/
