region_notes: "Cato does not name a victim country. Advertiser geography and CDN locations are not victim regions."
attribution_or_cluster: "Unnamed. Cato links part of the Claude and Codex activity by shared domains and the AMOS-style loader. It does not tie the claude-tools JXA chain or the Homebrew and DayNote chains to that cluster."
scale_and_metrics: "Cato does not publish a victim count. The 19 November post maps multiple lure domains onto shared downstream hosts and retains the 24 August Codex sets."
prevention_angle: "Install Claude Code, Codex, and Homebrew from the vendor, not from a sponsored result. Alert when Terminal or zsh pipes curl into a shell, when a shell Base64-decodes a URL, and when a new executable appears at /tmp/helper after xattr -c. Treat grove-satin[.]com/api/metrics/run?event=pasted as loader telemetry. Do not block Cloudflare anycast addresses from the historical DNS table."
