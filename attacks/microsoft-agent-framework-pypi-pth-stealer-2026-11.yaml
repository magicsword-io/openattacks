attack_flow:
  nodes:
    - id: upload
      title: Malicious wheels published
      description: "An AWS publish was rejected by ESRP IP filtering. A later publish from Microsoft-owned IP space landed 1.26.1 at 20:35 UTC and 1.26.2 at about 21:08 UTC. Both were off PyPI by about 21:30 UTC. The dependency stayed agent-framework-core 1.26.0. The tooling called itself Cairn."
      kind: access
      source_urls:
        - https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
    - id: pth-hook
      title: .pth runs on Python start
      description: "1.26.1 uses agent_framework_meta.pth and _telemetry.py. 1.26.2 uses af_runtime_diag.pth and af_runtime_diag.py. _AF_TEL=1 limits it to once per process tree."
      kind: execution
      source_urls:
        - https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
        - https://socket.dev/blog/agent-framework-pypi-package-compromised-with-credential-stealer
    - id: collect
      title: Cloud, CI, and model tokens
      description: "Environment and file secrets, Azure DevOps and managed-identity tokens, and in 1.26.2 GitHub Actions OIDC tokens. Patterns include OPENAI, HF_, and FOUNDRY."
      kind: ai
      source_urls:
        - https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
    - id: webhook
      title: One POST to webhook.site
      description: "A single compressed JSON POST to the hardcoded webhook.site URL. The free-tier store held 50 requests: 4 from the attacker, 29 from sandboxes or tests, and 17 from three victims."
      kind: impact
      source_urls:
        - https://www.wiz.io/blog/malicious-version-of-microsofts-agent-framework-published-to-pypi
  edges:
    - source: upload
      target: pth-hook
    - source: pth-hook
      target: collect
    - source: collect
      target: webhook
