detections:
  - name: Python Path File (pth) Creation
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_pth_file_creation.toml"
    notes: "Selected from a security-detections-mcp search for pth. Linux endpoint file events. Creation of a .pth file under system or user site-packages or dist-packages. pip is not in the general exclusion list. It does not match Windows or macOS, and it does not look for agent_framework_meta.pth or af_runtime_diag.pth by name."
  - name: Python PTH File Creation During Package Installation
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/python_pth_file_creation_during_package_installation.yml"
    notes: "Selected from a security-detections-mcp search for pth. Sysmon process and file events. python.exe plus a created .pth file during an install, requiring both event types. A Linux python binary does not match process_name python.exe. It does not look for the wheel file names."
  - name: Cloud Instance Metadata Credential Path HTTP Request
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/network/credential_access_cloud_imds_credential_http_request.toml"
    notes: "Selected from a security-detections-mcp search for instance metadata. Network packet capture. HTTP GET to 169.254.169.254 for AWS, GCP, or Azure token paths, including python and node. Fits the managed-identity token request. It does not include 100.100.100.200, and it does not see a token request that never leaves a decoded HTTP GET."
  - name: Package Runtime Secret File Access Followed by IMDS Request
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/credential_access_secret_file_access_followed_by_imds_request.toml"
    notes: "Selected from a security-detections-mcp search for IMDS. Windows and macOS endpoint. A package runtime opens a listed secret, including .npmrc, .git-credentials, or a Hugging Face token, then connects to 169.254.169.254 or 100.100.100.200 within one minute. Linux file-open events are outside this rule. A Linux /proc read does not match."
  - name: Connection to Commonly Abused Web Services
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/command_and_control_common_webservices.toml"
    notes: "Selected from a security-detections-mcp search for webhook.site. Windows process network connection to webhook.site, which is on the rule's domain list. It does not match the URL path, the User-Agent, or a Linux interpreter."
  - name: File names, User-Agent, and Sigma .pth gap
    format: guidance
    notes: "security-detections-mcp searches for pth and site-packages returned pass-the-hash and sitecustomize.py rules. Those are not cited. These wheels do not drop sitecustomize.py. Also hunt agent_framework_meta.pth, agent_framework_meta/_telemetry.py, af_runtime_diag.pth, af_runtime_diag.py, and _AF_TEL=1, plus the webhook path d381fd80-ec62-42ad-8f5c-d1b15103c9bb and User-Agents af-runtime-diagnostics/1 and runtime-diagnostics/1."
