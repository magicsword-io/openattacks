ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: attacker_uses_ai_as_operator
ai_role_detail: "The package is the target: Microsoft's Python SDK for building AI agents, with a .pth hook that collects OPENAI, HF_, and FOUNDRY material plus Azure, Azure DevOps, and GitHub Actions tokens. The secondary role is adversary use of AI. Wiz's 18 November 2026 update says the operator's tooling calls itself Cairn, and a pre-publish run on the operator's own machine captured a Pi coding agent configuration on a GLM-family model (pi_glm53) behind a local proxy. That config is evidence the operator was using the agent. It is not a claim that a model wrote the stealer."
technique_summary: "On 17 November 2026, PyPI package agent-framework (Microsoft Agent Framework) received two releases nobody at Microsoft has claimed. Wiz (Rami McCarthy, Scott Piper, Benjamin Read) times version 1.26.1 at 20:35 UTC and 1.26.2 at about 21:08 UTC, and says both were gone from PyPI by about 21:30 UTC. The last safe release is 1.26.0, published 12 November 2026 at 18:25 UTC as a wheel and an sdist together with agent-framework-core 1.26.0. Wiz says there is no python-1.26.1 tag or release in the project repository, main does not contain the malicious code, and 1.26.1 was a wheel only while still depending on agent-framework-core[all]==1.26.0, so the framework kept working. Wiz updated the post on 18 November 2026 at 14:00 UTC. The attacker's tooling reported its own progress to the same webhook.site URL, which is how Wiz saw part of the operation. Wiz writes that the attacker appears to have stolen a client certificate and private key for Microsoft ESRP (Engineering System Release Pipeline), the internal service Microsoft uses to sign and publish the package. The first publish attempt came from AWS and was rejected by ESRP IP filtering. The second came from Microsoft-owned IP space and was accepted. How the certificate was obtained is not known. The tooling calls itself Cairn: it staged the package at /tmp/cairn_pkg and sent a connectivity probe named CAIRN_ESRP_PROBE2. Before publishing, the attacker ran the stealer on their own machine. That run captured an agent configuration Wiz reads as the open-source Pi coding agent, backed by a GLM-family model labeled pi_glm53, behind a local proxy. Wiz does not link this publish to the May 2026 durabletask compromise or to Unit 42 cluster CL-STA-1238. OX Security (Moshe Siman Tov Bustan) had earlier said the attacker appeared to have hijacked the wheel build flow. That line predates the ESRP finding. The Hacker News (Ravie Lakshmanan, 18 November 2026) describes that earlier durabletask incident as TeamPCP distributing Mini Shai-Hulud, and treats agent-framework as a separate later compromise of a second Microsoft PyPI package. Any pip install agent-framework or unpinned upgrade during the window installed the wheel. Python executes import lines in .pth files on every interpreter start, including pip, even when agent_framework is never imported. Version 1.26.1 drops agent_framework_meta.pth, whose single line is import agent_framework_meta. agent_framework_meta/__init__.py then calls _telemetry._start() inside a silent try block, under the comment Lightweight runtime diagnostics hook. _start sets _AF_TEL=1 so the same process tree runs it once, then forks and calls os.setsid, or starts a daemon thread where fork is unavailable. Version 1.26.2 restores the clean __init__.py and moves the trigger to a new top-level af_runtime_diag.pth that imports af_runtime_diag.py, which starts collection on import, so a hunt for the 1.26.1 names misses it. Collection covers environment names containing TOKEN, SECRET, PASSWORD, KEY, AZURE, AWS, GITHUB, OPENAI, HF_, FOUNDRY, NPM, PIP, NUGET, SYSTEM, BUILD, and AGENT, plus up to 300 /proc/*/environ files and up to 60 credential files (~/.azure/, .npmrc, pip.conf, .netrc, .git-credentials, .docker/config.json, Hugging Face tokens, Foundry config, Azure DevOps agent .credentials, and .env or JSON under /app and /workspace). It also requests an Azure DevOps OIDC token for api://AzureADTokenExchange when SYSTEM_ACCESSTOKEN and SYSTEM_OIDCREQUESTURI are set, and managed-identity tokens from IMDS (169.254.169.254) or the App Service identity endpoint. Wiz describes 12 resource audiences, naming ARM, Graph, Key Vault, Storage, Cognitive Services, Azure AI/ML, Search, Container Registry, Azure DevOps, and AzureADTokenExchange, plus instance metadata. One JSON document is zlib-compressed, base64-encoded, and POSTed once to hxxps://webhook[.]site/d381fd80-ec62-42ad-8f5c-d1b15103c9bb?t=telemetry with User-Agent af-runtime-diagnostics/1. There is no fallback channel. Version 1.26.2 uses User-Agent runtime-diagnostics/1, adds GitHub Actions OIDC theft for api://AzureADTokenExchange and https://management.azure.com/ when a workflow has id-token: write, adds ACTIONS, OIDC, RUNNER, and ARM_ name patterns, adds /home/runner/work/_temp/* and /home/runner/.azure/, and raises the file cap from 60 to 80. Wiz says the webhook token was on the free tier, which caps a URL at 100 requests, and that 50 requests were stored. Of those 50, Wiz counts 4 from the attacker, 29 from sandboxes, scanners, or tests, and 17 from three real victims. Wiz cites about 41,000 downloads a week and, in the same post's headline, almost 200,000 a month. OX cites 192,534 monthly downloads. OSV MAL-2026-20101 (published 17 November 2026 at 22:12 UTC; finders Amazon Inspector and OX Security; analyst Kamil Mańkowski / kam193) and GHSA-764m-3ppc-5m73 (published 18 November 2026 at 00:31 UTC) match this description. SafeDep and StepSecurity name the PyPI maintainer account vibiret, created on 17 November 2026. StepSecurity reports the uploader user agent RestSharp/106.13.0.0 on both wheels. PYSEC-2026-4388 says both versions were uploaded without authorization, and that PyPI Security worked with Microsoft on the account review. The Register (Brandon Vigliarolo, evening of 18 November 2026) quotes a Microsoft spokesperson: the company made some repositories private while it investigates malicious content. github.com/microsoft/agent-framework returned HTTP 404 on 18 November 2026, so it is not linked here."
initial_access: "A stolen Microsoft ESRP client certificate. The first publish, from AWS, was rejected by IP filtering. The second, from Microsoft-owned IP space, published the wheels. How the certificate was obtained is unknown. A pip install or unpinned upgrade during the window installed them."
ai_tooling_and_models:
  - "Microsoft Agent Framework Python package agent-framework (PyPI), last safe release 1.26.0"
  - "Stealer targets OPENAI, HF_, and FOUNDRY names and Azure AI, ML, and Cognitive Services tokens"
  - "Cairn, the operator tooling that staged the package and sent CAIRN_ESRP_PROBE2"
  - "Pi coding agent, the harness Wiz read in the operator's own stealer run (pi_glm53, local proxy)"
frameworks:
  - cairn
other_tooling:
  - "Python .pth startup hook (agent_framework_meta.pth, then af_runtime_diag.pth)"
  - "webhook.site as the single exfiltration endpoint"
victims_and_sectors: "Developers, CI runners, and containers that installed agent-framework 1.26.1 or 1.26.2. No named victim organization was published."
regions:
  - Multiple regions
region_notes: "No victim country was published. Multiple regions reflects a public PyPI package rather than a named geography. Actor location is not a victim region."
attribution_or_cluster: "Unnamed. No country. Wiz describes theft of Azure, Azure DevOps, and GitHub Actions credentials, and does not link this publish to the May 2026 durabletask compromise or to Unit 42 cluster CL-STA-1238."
scale_and_metrics: "Window about 20:35 to 21:30 UTC on 17 November 2026. Wiz: about 41,000 downloads a week, and almost 200,000 a month in the headline. OX: 192,534 monthly downloads. The free-tier webhook stored 50 requests: 4 from the attacker, 29 from sandboxes, scanners, or tests, and 17 from three victims. No organization is named."
prevention_angle: "Pin agent-framework to 1.26.0 or another release verified against Microsoft, and install with a hash. Search lockfiles, CI logs, virtualenvs, and images for 1.26.1 and 1.26.2. On disk, look for agent_framework_meta.pth, agent_framework_meta/_telemetry.py, af_runtime_diag.pth, and af_runtime_diag.py, and for _AF_TEL=1. Search proxy and DNS logs for webhook.site and the path d381fd80-ec62-42ad-8f5c-d1b15103c9bb. If Python started in that environment, rotate secrets that were reachable, including Azure CLI sessions, Azure DevOps PATs, managed-identity and federated credentials, and GitHub Actions OIDC for workflows that installed 1.26.2 with id-token: write. A 200 from the webhook means the request was accepted. A 410 or 429 means the free-tier URL rejected it."
related_magicsword_projects: []
source_notes: "The 14:00 UTC 18 November 2026 root cause, the ESRP certificate, the AWS rejection and Microsoft-IP publish, /tmp/cairn_pkg, CAIRN_ESRP_PROBE2, the Pi coding agent config (pi_glm53), and the 4/29/17 split of 50 stored requests are from Wiz. sysnote restates that update and the non-link to Unit 42 cluster CL-STA-1238. SafeDep and StepSecurity name maintainer vibiret (created 17 November 2026). StepSecurity reports uploader user agent RestSharp/106.13.0.0. PYSEC-2026-4388 says the wheels were uploaded without authorization. The Register's Microsoft quotation is from the evening of 18 November 2026. OX's wheel-build-flow line is the earlier hypothesis, not the ESRP finding. The Hacker News TeamPCP / Mini Shai-Hulud sentence is about the May durabletask incident, which Wiz says is not linked. Hashes: wheel 1.26.1 SHA256 d27fa34414e6201d5e03e559ef634f020057554d7b3f4898dd5d7cd3e989e110; wheel 1.26.2 SHA256 3d20a8bc91351a9a16b6db243b848ceca0206b7a8623b02d2af553a9c9f7e0a9; af_runtime_diag.py SHA256 54d885b7d7161c9ed96489c66364c4bfbf635929166843bba10d97d46b5a2e1f; af_runtime_diag.pth SHA256 325e7e9f0ec94e41ad1a1b7a3f18a6b8b5bffece2e2b97b8d3369eb967452f93; _telemetry.py SHA1 0a013e4724c4437cf9b177def1d988113e167539 (Wiz) and SHA256 39fa329f2a93f734b0bb8f5adb203ea3331d1ae479832a5015a54cb17aabd663 (Socket and OSV); agent_framework_meta.pth SHA256 21f28e8517a10ffe431f8d68f5875c85eca4001ae6d118322b0a41873998eb5e (Socket); agent_framework_meta/__init__.py SHA256 c275ccbe520ef3c0f02dc6a35389e427f9f1b4e0b12e140cd7bf7179ce143f02 (Socket). Cairn is https://github.com/oritera/Cairn. Pi coding agent is https://github.com/earendil-works/pi. The project repository returned HTTP 404 on 18 November 2026 and is omitted."
