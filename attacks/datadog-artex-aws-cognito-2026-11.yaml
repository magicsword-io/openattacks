ai_role_detail: "Datadog attributes October 2026 AWS financial-data hunting to ARTEX through user agents and IP addresses that also hosted ARTEX-family consoles"
technique_summary: "Datadog Security Labs (Julie Agnes Sparks, Nov 9, 2026) saw ARTEX activity against several AWS environments in October 2026, focused on financial data. Every session opened with unauthenticated S3 reads (userIdentity.type AWSAccount, accountId anonymous, GetObject and ListObjects). The agent read front-end build manifests and runtime configs from S3-hosted web apps. Before each guessing burst it requested a placeholder key that should not exist (zzz_nonexistent_abc.txt, Notexist-xyz), the same habit Wiz described with /zzz-nonexistent-xyz123. With leaked long-term IAM keys, ARTEX ran repeated FilterLogEvents over CloudWatch, always with limit 1000, searching for crypto firms, hedge funds, and names like Fund, Invoice, Billing, and LLC. On October 20 a later session from 103.54.154.40 (zeofast.cn) searched for s3://, presigned, .pdf, .xlsx, .csv, rawData_, transformedData_, and the terms mongo, password, and AKIA. On October 26-27, from 154.64.252.77, ARTEX called Cognito SignUp with user agents such as Mozilla/5.0 ARTeX, iterated against a PreSignUp Lambda tenant-domain check (errors include artex-hqheizfk.invalid and custom:isAdmin), then ran InitiateAuth, RespondToAuthChallenge, GetUser, and GetTokensFromRefreshToken, swapped tokens for CognitoIdentityCredentials, and tried ListBuckets, ListSecrets, DescribeParameters, ListTopics, DescribeLogGroups, GetRestApis, DescribeRepositories, and ListFunctions20150331. Exposed consoles used titles ARTEX autonomous pentest console, ScopeWeaver Autonomous Penetration Testing Console, LUCK autonomous asset console, and Guanlan SEC pentest platform, with API routes including /tasks, /exploration, /llm/pool, /intercept, /mcp, /skills, and /agents, and a default blocklist of .gov, .gov.cn, .edu, and .edu.cn. 154.64.252.77 is also listed in the WorkOS bulletin. Hunting references named by Datadog: Stratus Red Team https://github.com/DataDog/stratus-red-team and TrailDiscover https://github.com/adanalvarez/TrailDiscover. ARTEX fork https://github.com/RuoJi6/ARTEX."
initial_access: "Unauthenticated S3 reads, leaked long-term IAM keys, and public Cognito user pools that allow SignUp"
ai_tooling_and_models:
  - "ARTEX autonomous pentest console (https://github.com/RuoJi6/ARTEX)"
  - "Related console titles ScopeWeaver, LUCK, and Guanlan SEC"
other_tooling:
  - "AWS CloudTrail APIs: FilterLogEvents, Cognito SignUp, InitiateAuth, ListBuckets, ListSecrets"
  - "Stratus Red Team (https://github.com/DataDog/stratus-red-team)"
  - "TrailDiscover (https://github.com/adanalvarez/TrailDiscover)"
victims_and_sectors: "AWS environments holding financial data, including names consistent with funds, invoices, and billing"
regions:
  - Multiple regions
attribution_or_cluster: "Unattributed ARTEX operators. Consoles are mostly in Mandarin and hosted with providers including locations in Singapore and Hong Kong. Datadog attributes the activity to ARTEX usage."
scale_and_metrics: "Several AWS environments in October 2026. Hundreds of exposed consoles under several titles."
prevention_angle: "Block public access on S3 buckets that hold front-end configs. Alert on anonymous GetObject and on placeholder keys such as zzz_nonexistent_abc.txt. Alert on high-volume FilterLogEvents with limit 1000. Disable self-sign-up on Cognito user pools that are not meant to be public, and review PreSignUp Lambda failures for artex and .invalid tenant domains. Tie the listed user agents and source IPs to CloudTrail."
related_magicsword_projects: []
source_notes: "IPs, user agents, API names, placeholder keys, and console titles are from the Datadog article. GetSecretValue is not claimed here; the Cognito path tried ListSecrets and other List/Describe calls. 154.64.252.77 also appears in the WorkOS bulletin covered by workos-artex-unintended-agent-escape-2026-10. Link microsoft-artex-github-secrets-keyvault-2026-11, unit42-artex-api-recon-2026-10, crowdstrike-artex-sk-finance-2026-10, and the Check Point, S-RM, and Storm-3358 ARTEX entries."
