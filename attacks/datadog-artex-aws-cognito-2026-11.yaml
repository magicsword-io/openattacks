attack_flow:
  nodes:
    - id: anon-s3
      title: Anonymous S3 reads
      description: "Sessions start with unauthenticated GetObject and ListObjects, including placeholder keys zzz_nonexistent_abc.txt and Notexist-xyz."
      kind: access
      source_urls:
        - https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/
    - id: cloudwatch
      title: CloudWatch log trawl
      description: "Leaked IAM keys run FilterLogEvents with limit 1000, searching for funds, invoices, file extensions, and AKIA."
      kind: execution
      source_urls:
        - https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/
    - id: cognito
      title: Cognito self-sign-up
      description: "From 154.64.252.77 the agent calls SignUp, fights a PreSignUp Lambda, then exchanges tokens and lists AWS resources."
      kind: ai
      source_urls:
        - https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/
    - id: enumerate
      title: Cross-service enumeration
      description: "Cognito identity credentials are used for ListBuckets, ListSecrets, DescribeParameters, and related discovery calls."
      kind: impact
      source_urls:
        - https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/
  edges:
    - source: anon-s3
      target: cloudwatch
    - source: anon-s3
      target: cognito
    - source: cognito
      target: enumerate
