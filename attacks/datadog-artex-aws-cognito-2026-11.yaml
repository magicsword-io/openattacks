detections:
  - name: AWS S3 Unauthenticated Bucket Access by Rare Source
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/collection_s3_unauthenticated_bucket_access_by_rare_source.toml"
    notes: "AWS CloudTrail. Matches anonymous GetObject and ListObjects, which opened every Datadog session (userIdentity accountId anonymous)."
  - name: AWS Repeated CloudWatch Logs Read Operations
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/cloud/aws_repeated_cloudwatch_logs_read_operations.yml"
    notes: "AWS CloudTrail. Matches high-volume FilterLogEvents, GetLogEvents, and related reads. Datadog saw FilterLogEvents with limit 1000."
  - name: AWS S3 Bucket Enumeration or Brute Force
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/impact_aws_s3_bucket_enumeration_or_brute_force.toml"
    notes: "AWS CloudTrail. High-rate S3 discovery. Use alongside the placeholder object names zzz_nonexistent_abc.txt and Notexist-xyz, which this rule does not name."
  - name: Cognito SignUp and ARTEX user agents
    format: guidance
    notes: "The indexed rules do not alert on Cognito SignUp or PreSignUp Lambda errors. Hunt CloudTrail for SignUp, InitiateAuth, RespondToAuthChallenge, and GetTokensFromRefreshToken from 154.64.252.77, and for user agents artex-readonly/1.0, artex-pentest/1.0, artex-audit/1.0, Mozilla/5.0 ARTeX, artex-spawn/1, artex-verify/1.0, ARTeX-authorized-pentest, artex-i21861-canary, and ARTEX-worker/1.0. The Cognito unauthenticated-identity-pool rule does not match this user-pool SignUp path, so it is not cited."
