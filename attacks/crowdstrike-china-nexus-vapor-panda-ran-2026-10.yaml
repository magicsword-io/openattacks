detections:
  - name: Detect Password Spray Attempts
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/application/detect_password_spray_attempts.yml
    notes: "Matched password spray with security-detections-mcp. The Hacker News account of CrowdStrike's report says VAPOR PANDA password-sprayed credentials, including against at least 12 further organizations."
  - name: Antivirus - Web Shell Detection Signature
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/category/antivirus/av_webshell.yml
    notes: "Matched web shell with security-detections-mcp. The same account says the operators wrote web shells. It does not name IIS or a file extension, so this is the generic antivirus signature rather than an IIS-only rule."
  - name: Suspicious Instance Metadata Service (IMDS) API Command Line Execution
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/credential_access_suspicious_instance_metadata_service_api_cli.toml
    notes: "Matched Instance Metadata with security-detections-mcp. CrowdStrike, via The Hacker News, describes a SAML assertion chained with XXE to query the cloud instance metadata service."
  - name: BLOODALCHEMY and the container-root path
    format: guidance
    notes: "security-detections-mcp searches for web shell, password spray, and IMDS did not return a rule for BLOODALCHEMY, its ShadowPad lineage, or root access through an unauthenticated orchestration service. Those are named in the CrowdStrike account and need a campaign hunt rather than a generic host rule."
