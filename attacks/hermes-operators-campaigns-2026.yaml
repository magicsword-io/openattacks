source_notes: "Unit 42 analysis of knaithe/KnYuan; Hunt.io vendor assertion for Thailand campaign. The Hermes URL previously stored here, github.com/Hermes-Autonomous-Intelligence/hermes, returned HTTP 404 on 2026-11-18. It is replaced with https://github.com/NousResearch/hermes-agent, the live Hermes Agent project (Telegram gateway, cron, and model routing). Unit 42 and Hunt.io did not publish that URL. Detection: monitor for Hermes Python processes, autonomous reconnaissance patterns, DeepSeek API calls from infrastructure hosts."
