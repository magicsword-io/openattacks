ai_role_detail: "Multiple threat actors deploying the Hermes autonomous agent framework (https://github.com/NousResearch/hermes-agent) for post-compromise operations. The previously cited github.com/Hermes-Autonomous-Intelligence/hermes returned HTTP 404 on 2026-11-18."
technique_summary: "Multiple 2026 campaigns using Hermes agent: (1) knaithe/KnYuan '1DayNews' campaign (Unit 42, Jul 30): Exploits public 1-day vulnerabilities; deploys Hermes with DeepSeek for autonomous exploitation and lateral movement; targets technology companies. (2) Hunt.io Thailand Ministry of Finance (Jul 23, vendor-asserted): Hermes agent used in government intrusion; autonomous reconnaissance and data exfiltration. Both demonstrate Hermes becoming commodity tool for various threat actors."
