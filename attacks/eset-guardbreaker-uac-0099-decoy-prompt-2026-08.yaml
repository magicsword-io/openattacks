atlas_techniques:
  - id: AML.T0051.001
    rationale: "The refusal bait is indirect prompt injection: untrusted text inside a file being analyzed is meant to reach the model and cut the analysis short."
    source_urls:
      - https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/
  - id: AML.T0015
    rationale: "The intended effect is evasion of an AI model used as a code scanner, by provoking a safety refusal before the payload logic is read."
    source_urls:
      - https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/
attack_flow:
  nodes:
    - id: vbs-stage
      title: VBScript in an early stage
      description: "UAC-0099 uses a VBScript early in an intrusion against a target in Ukraine. The script's runtime job is to download and install MATCHBOIL."
      kind: access
      source_urls:
        - https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/
    - id: decoy-comment
      title: Inert refusal-bait comment
      description: "REM comments request help with a nuclear weapon and then add enrichment text. They do not execute. ESET says they are meant to make an LLM scanner refuse before it reaches the loader logic."
      kind: ai
      source_urls:
        - https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/
        - https://www.helpnetsecurity.com/2026/08/31/russian-hackers-ai-safety-filters-manipulation/
    - id: loader
      title: MATCHBOIL still installs
      description: "If the script is run, it still downloads MATCHBOIL, the group's loader. CERT-UA's July chain uses a double-extension VBS, Notepad++ components, LUNCHPOKE, BURNYBEAR, and MATCHBOIL.V2."
      kind: execution
      source_urls:
        - https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/
        - https://cert.gov.ua/article/6318634
    - id: scanner-gap
      title: A refusal is the gap
      description: "ESET did not measure the effect. DugganUSA's separate one-day test saw one of three models return an empty refusal and the other two flag the decoy and continue."
      kind: impact
      source_urls:
        - https://www.welivesecurity.com/en/business-security/guardbreaker-derailing-ai-assisted-malware-analysis-code-comment/
        - https://www.dugganusa.com/post/we-tested-the-russian-anti-analysis-trick-on-three-models-two-analyzed-the-sample-and-flagged-the-d
  edges:
    - source: vbs-stage
      target: decoy-comment
    - source: vbs-stage
      target: loader
    - source: decoy-comment
      target: scanner-gap
