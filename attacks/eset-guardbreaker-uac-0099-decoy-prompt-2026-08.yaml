detections:
  - name: Cscript/Wscript Uncommon Script Extension Execution
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_wscript_cscript_uncommon_extension_exec.yml"
    notes: "Selected from a security-detections-mcp search for wscript. Windows process creation. wscript.exe or cscript.exe whose command line contains a non-script extension such as .pdf, .doc, or .txt. CERT-UA described UAC-0099 VBS names with a fake document extension, spaces, and then .vbs. A command line that still contains .pdf matches. A plain .vbs path with no fake extension does not."
  - name: Suspicious Double Extension Files
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_event/file_event_win_susp_double_extension.yml"
    notes: "Selected from a security-detections-mcp search for double extension. Windows file event. A created file whose name ends in a document extension immediately followed by .vbs, .exe, or another listed payload extension, including .pdf.vbs. The spaced form described by CERT-UA, with characters between pdf and .vbs, does not match this regex."
  - name: Vbscript Execution Using Wscript App
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/vbscript_execution_using_wscript_app.yml"
    notes: "Selected from a security-detections-mcp search for VBScript. Endpoint process data for wscript.exe executing VBScript. This is the generic script-host path for the GuardBreaker file. It does not know that the comment is a refusal bait."
  - name: Refusal-bait comments and MATCHBOIL
    format: guidance
    notes: "security-detections-mcp searches for VBScript, wscript, and double extension did not return a rule that looks for refusal-bait wording or for MATCHBOIL. A YARA or Sigma hunt for inert comments that request help building a weapon, sitting above a downloader, is still a written hunt rather than a published rule. Do not treat a scanner refusal as a benign verdict. CERT-UA's July chain also drops Notepad++ components and LUNCHPOKE, BURNYBEAR, and MATCHBOIL.V2; those names are not in the indexed rules."
