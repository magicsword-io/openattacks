ai_role_detail: "The target is an LLM-powered code scanner. An inert comment is meant to trip safety guardrails so the model refuses and stops before the payload logic. ESET did not name a product or test the effect."
technique_summary: "ESET Research described GuardBreaker in posts on X on Aug 27, 2026. Tomáš Foltýn's WeLiveSecurity article followed on Sep 10, 2026. In a VBScript used early in an attack on a target in Ukraine, UAC-0099 left inert REM comments. Help Net Security quotes the opening as a request to make a nuclear weapon and to help, followed by uranium-enrichment text. The comment has no runtime effect. ESET says it is there so an LLM-powered code scanner's safety guardrails refuse the file and stop reading before the payload logic. ESET names this a reverse jailbreak: the point is to cause a refusal, not to talk a model into complying. The script's job is to download and install MATCHBOIL, a loader ESET says is used only by UAC-0099. The same group has checked for IDA and Wireshark processes in other attacks. ESET did not test whether the comment works and did not name a targeted model. DugganUSA, in an independent write-up dated Sep 1, 2026, ran one A/B pass on a synthetic inert script: GPT-4o and Mistral analyzed the treatment and flagged the decoy, and Claude Sonnet 4.5 returned an empty refusal. That test is not ESET's, and DugganUSA says it is a single sample on one day. UAC-0099 is Russia-aligned, active since at least 2022, and has targeted Ukrainian transportation and energy. Reporting says the group has handed validated access to Sandworm. On Jul 21, 2026 CERT-UA documented an updated chain: a VBS script with a fake extension and a long run of spaces before .vbs, Notepad++ 8.8.3 components, and the tools LUNCHPOKE, BURNYBEAR, and MATCHBOIL.V2. That advisory is about the group and the loader, not about the GuardBreaker comment. ATT&CK does not have a technique for a refusal bait in a comment. The script execution itself is T1059.005."
initial_access: "A VBScript used in the early stage of an intrusion at a Ukrainian organization. ESET does not describe how the script arrived. CERT-UA's July chain for the same group starts from a phishing ZIP that contains a VBS file disguised with a fake extension."
ai_tooling_and_models:
  - "Unnamed LLM-powered code scanner. ESET did not name a model."
  - "DugganUSA's independent test used Claude Sonnet 4.5, GPT-4o, and Mistral. That test is not the incident."
other_tooling:
  - "MATCHBOIL loader, delivered by the script"
  - "Windows Script Host (wscript.exe or cscript.exe)"
victims_and_sectors: "An unnamed organization in Ukraine. UAC-0099's usual targets include transportation and energy."
regions:
  - Ukraine
region_notes: "Ukraine is the victim location ESET gives for this script. Russia is the actor alignment, not a victim region."
attribution_or_cluster: "UAC-0099, Russia-aligned, espionage. ESET attributes the script and the GuardBreaker comment. CERT-UA attributes the group's MATCHBOIL, LUNCHPOKE, and BURNYBEAR tooling. ESET does not claim this sample was handed to Sandworm."
scale_and_metrics: "One documented script in one early-stage intrusion. ESET did not report how often the comment has been used or whether a scanner refused this sample."
prevention_angle: "Keep the scanner's instructions separate from the file under analysis, and treat text inside the sample as data. A refusal, an empty completion, or a safety block on a malware sample should raise a review, not end it. Fall back to analysis that does not depend on a model, and do not give one model the only vote on whether a file is safe. The comment does not change what the script does when Windows runs it, so script-host and loader detections still apply."
related_magicsword_projects: []
source_notes: "The comment's role, the MATCHBOIL purpose, the Ukraine victim, and the IDA and Wireshark checks are from the WeLiveSecurity article (Sep 10, 2026) and the Aug 31 Help Net Security recap of the X posts. The enrichment procedure is not repeated here. DugganUSA is independent research on a synthetic sample; it is not a test of the incident file. CERT-UA article 6318634 (Jul 21, 2026) is the government write-up of the group's VBS, Notepad++, LUNCHPOKE, BURNYBEAR, and MATCHBOIL.V2 chain. https://cybernews.com/security/russian-hackers-nuclear-prompt-ai-guardrails/ returned HTTP 403 during link checks and is omitted. No YARA or Sigma rule in the detection index matches the refusal-bait wording or the name MATCHBOIL."
