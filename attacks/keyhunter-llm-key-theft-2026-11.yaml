ai_role_detail: "leepsmarts harvests LLM API keys from misconfigured cloud infrastructure while using AI agents (Hermes, OpenClaw) to manage operations and conduct parallel academic fraud campaign"
technique_summary: "Nov 4, 2026: SOCRadar STRU discovered KeyHunter operation by leepsmarts (Chinese-speaking, UTC+8), active since Jan 2026. Two parallel tracks: (1) LLM API key theft: 2,233 API keys harvested (Anthropic, OpenAI, Google, DeepSeek), 12 marked valid (0.54% yield), targeting 247 exposed LLM gateways on PaaS platforms (Vercel, Netlify, Railway, Render, Replit, Streamlit, Fly.io, Cloudflare Pages). Tools scan .env files, GitHub repos, and cloud metadata. (2) Academic fraud: 195 Harvard alumni records from Nov 2025 ShinyHunters torrent, application payment links for Stanford/UChicago/Wake Forest/Case Western/Central Michigan, accounts at NYU/UC Berkeley/Oregon State/UIUC/Colorado State. (3) Financial fraud: Harmony ONE crypto drainer, stolen Stripe merchant keys for card validation, CVVs from Chinese underground market. Infrastructure: 6 servers + Malaysia OpenClaw host, tied by PentAGI CA certificate. AI agents manage operations: Hermes Agent node runs AI_radar cron (every 240min) monitoring X/Twitter, HuggingFace, GitHub, arXiv for new LLM releases/quotas via grok-4.6 + Tavily proxy. Four-phase pipeline: Phase 0 (AI monitoring), Phase 1 (FOFA/Shodan reconnaissance), Phase 2 (env_hunter scans 50+ paths, fadidevv/keyhunter + bigzooooz/KeyHunter GitHub scrapers), Phase 3 (validation), Phase 4 (unified dashboard). OPSEC failure: directory listing on 209.112.91.74 exposed 110 files/37 directories including Telegram bot tokens, operational logs, stolen credentials. CVE-2026-41940 (CVSS 9.8, CISA KEV) exploit staged against UTN Argentina, Arizona Christian University, University of Utah. Real victim seed phrases captured by Harmony ONE drainer."
initial_access: "Exposed .env files on PaaS platforms, GitHub leaked credentials, cloud metadata endpoints (IMDS)"
