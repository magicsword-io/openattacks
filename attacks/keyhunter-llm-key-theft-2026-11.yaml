victims_and_sectors: "Developers and organizations with exposed LLM API keys on PaaS platforms; 20 universities (19 US): Harvard alumni data, Stanford/UChicago/Wake Forest/Case Western/Central Michigan applications, NYU/UC Berkeley/Oregon State/UIUC/Colorado State/CSU accounts; cryptocurrency wallet users (Harmony ONE drainer); credit card fraud victims"
