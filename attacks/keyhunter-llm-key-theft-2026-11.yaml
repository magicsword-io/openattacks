scale_and_metrics: "2,233 API keys harvested, 12 valid (0.54% yield); 247 exposed LLM gateways catalogued, 223 usable; 195 Harvard alumni records; 20 universities targeted (19 US); active since Jan 15, 2026, last activity Oct 13, 2026; 110 files exposed (37 directories, 9GB); AI_radar: 20 runs Aug-Sep, $6.13/run, $37/day est.; URL survival rate 1.9%; 41 keys in 24h; env_hunter v4.0: +257% path expansion (14→50)"
prevention_angle: "Secure .env files and cloud configurations; never expose API keys in GitHub repos or PaaS platforms; monitor cloud metadata endpoints (169.254.169.254); rotate API keys regularly; implement API key usage monitoring; restrict .env access; use secret management solutions (Vault, AWS Secrets Manager); monitor FOFA/Shodan reconnaissance; detect HFS server scanning; alert on Wayback Machine queries for .env files; implement PaaS security best practices"
