technique_summary: "Feb 19, 2026: ESET discovered PromptSpy Android spyware using Gemini 1.5 Pro for C2 decision-making. After collecting surveillance data (location, photos, contacts, messages, call logs), malware sends summary to Gemini with prompt asking what additional data to collect or which contacts to target. Gemini response directs next collection phase. Enables adaptive targeting of high-value contacts and data. Attribution unknown."
