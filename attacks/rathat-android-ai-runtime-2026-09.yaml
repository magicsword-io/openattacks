ai_role_detail: "RatHat Android trojan calls AI models at runtime to dynamically adapt malicious behavior based on device state"
technique_summary: "Sep 16, 2026: Zimperium discovered RatHat, Android banking trojan making real-time API calls to Chinese LLM providers (DeepSeek, Qwen) during execution to adapt behavior. Trojan collects device state (installed apps, security tools, screen content) and sends to LLM with prompt requesting optimal attack strategy. LLM responds with commands for credential harvesting, screen overlay injection, or SMS interception based on context. China-linked based on LLM provider selection and C2 infrastructure. Observed targeting banking apps across multiple regions."
