ai_role_detail: "Recent Aoki/Aokigahara infostealer builds steal AI coding assistant credentials, session files, and tokens"
technique_summary: "Aoki (aka Aokigahara) infostealer added AI credential theft in 2026. Targets: .claude.json, Claude desktop cookies, ChatGPT cookies, Codex config.toml/.env (github.com/openai/codex-cli), GitHub Copilot tokens (github.com/features/copilot), Cursor state.vscdb/storage.json (github.com/getcursor/cursor), Gemini CLI, JetBrains AI Assistant, Kiro, Windsurf, Codeium (github.com/Exafunction/codeium.vim), AWS credentials/SSO, Amazon Q, Git credentials, SSH keys. Cursor local state caches chat/code. Stolen keys allow acting under developer identity/quota, expose repos/cloud/CI-CD, bypass safeguards. Capable of LLMjacking. Earlier 2026 versions didn't target AI; capability recently added/expanding. Detection: monitor AI credential file access (.claude.json, .codex/auth.json, Cursor globalStorage), C2 domains (dobeqnesmot.cc, hjazfioe.surf), API usage anomalies from unexpected geolocations."
initial_access: "Infostealer distribution (method not disclosed); likely traditional vectors"
