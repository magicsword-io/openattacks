prevention_angle: "Rotate AI API keys after compromise; scope keys narrowly; monitor unusual API usage; endpoint protection; credential managers; monitor Aoki C2 domains; file integrity monitoring for AI credential files"
related_magicsword_projects: []
source_notes: "OS not specified; other targets suggest Windows; macOS/Linux not confirmed. Detection guidance: monitor AI credential file access, C2 communication (dobeqnesmot.cc, hjazfioe.surf), API usage anomalies from unexpected locations, unauthorized reads of .claude.json, .codex/auth.json, Cursor globalStorage, .copilot/config.json, .gemini/config.json, .aws/credentials, SSH keys."
