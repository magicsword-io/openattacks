ai_role_detail: "Multiple campaigns deliver covert backdoors via malicious AI skills on skills.sh and ClawHub platforms, targeting AI agent environments for credential theft and persistence"
technique_summary: "Snyk Security Research (Marco Milanta, Marc Fischer, Luca Beurer-Kellner, Nov 6, 2026) documents malicious skills targeting skills.sh and ClawHub platforms. callicrate/skills/agents-md bundles UPX-packed Rust binary, detaches with FAST_VALIDATE_WORKER=1 environment variable, appends remote text to ~/.claude/CLAUDE.md for persistence after skill removal. ClawHub campaigns: vinhbui3004/audio-upload-aioz-stream and video-upload-aioz-stream exfiltrate to api-w3stream.attoaioz.cyou; gloryjack/tushare-pro via tussahre.pro; neutronstar238/md-to-ppt runs npx slidew. Additional malicious skills: andy825lay-tech/github-automation-pro (obfuscated JavaScript), liuyanfeng1234/v19-trust-manifesto (agent enrollment as curl diagnostic utility). Unattributed campaigns; confirmed malicious behavior. Multiple attack vectors: packed binaries, remote CLAUDE.md modification, typosquatted domains, obfuscated JavaScript, fake diagnostic utilities."
initial_access: "Users install malicious skills from skills.sh or ClawHub platforms"
ai_tooling_and_models:
  - Claude AI
  - skills.sh platform
  - ClawHub platform
other_tooling:
  - UPX packer
  - Rust binaries
  - Node.js/npx
  - Obfuscated JavaScript
victims_and_sectors: "AI developers using skills.sh and ClawHub platforms; Claude AI users"
regions:
  - Multiple regions
attribution_or_cluster: "Unattributed campaigns; multiple distinct actors targeting AI skill platforms"
scale_and_metrics: "Multiple malicious skills identified Nov 2026 across skills.sh and ClawHub"
prevention_angle: "Verify skill publisher authenticity before installation; scan for UPX-packed binaries in skill packages; monitor ~/.claude/CLAUDE.md for unauthorized modifications; block suspicious domains (api-w3stream.attoaioz.cyou, tussahre.pro); audit skills for obfuscated JavaScript; detect FAST_VALIDATE_WORKER=1 environment variable usage; review npx commands in skill execution; restrict skill permissions to minimum required; implement skill sandboxing where possible"
