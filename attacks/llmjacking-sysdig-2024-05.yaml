scale_and_metrics: Potential >$46,000/day Claude 2.x costs cited; July 2024
  spike 61k Bedrock requests in 3 hours
prevention_angle: Monitor Bedrock ListFoundationModels+Invoke/Converse from
  long-term AKIA keys; rotate exposed keys; SCP restrict Bedrock
