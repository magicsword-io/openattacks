detections:
  - name: Monitor AWS Bedrock API abuse
    format: guidance
    notes: Alert on unusual Bedrock ListFoundationModels, InvokeModel, and Converse
      API calls, especially from AKIA long-term keys. Monitor for spike patterns (e.g.,
      61k requests in 3 hours). Implement CloudTrail analysis for Bedrock usage from
      unexpected geolocations or IAM principals.
  - name: Detect stolen cloud credentials
    format: guidance
    notes: Scan for exposed AWS keys in public repositories, logs, and error tracking
      services. Rotate credentials immediately upon detection. Use SCPs to restrict
      Bedrock access to approved principals only.
