attack_flow:
  nodes:
    - id: probes
      title: Parallel credential and signup probes
      description: "From late October to mid-November 2026, ARTEX-Harvester tried stolen credentials, anonymous storage probing, public sign-up, password-reset and sign-in flows, and identity-provider probing. Almost every request used a different residential or ISP proxy exit."
      kind: access
      source_urls: &wiz
        - https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks
    - id: ci-trust
      title: CI trust dumps secrets and state
      description: "Compromised version-control credentials reached private repositories. Attacker-created branches abused CI workload identity trust. Harvest workflows dumped CI-accessible secrets and Terraform state, and those secrets and repositories were exfiltrated."
      kind: execution
      source_urls: *wiz
    - id: node-collector
      title: Privileged pod mounts the node
      description: "A stolen application-pod service-account token created privileged pods with the node root filesystem mounted. A node-level collector pod harvested kubelet PKI and every projected service-account token on the node. Wiz Sensor also saw nsenter, IMDS kube-env queries, and drifted scripts reaching for cloud credentials."
      kind: execution
      source_urls: *wiz
    - id: argo-admin
      title: cert-manager token to cluster-admin
      description: "A cert-manager token collected from the node could read ArgoCD secrets, and that access led to cluster-admin."
      kind: impact
      source_urls: *wiz
    - id: csai
      title: CyberStrikeAI runs the operation
      description: "In a separate anonymized case, CyberStrikeAI ran the operation. Created names use a csai- prefix, including csai-escape pods, a csai-pentest-role IAM role, and a csai-probe runner. An ARTEX checkout sat next to .claude, .grok, and .agents. The same server ran ARTEX against several other organizations that month, unsuccessfully. An auto-generated Chinese-language report masked the intrusion as an authorised red-team pentest with 58 findings."
      kind: ai
      source_urls: *wiz
    - id: tf-binding
      title: Terraform runner opens the cluster
      description: "Across four days in October, two AWS accounts, and seven EKS clusters, a stolen Terraform-runner session read the kubelet kubeconfig and created a privileged pod and a cluster-admin binding."
      kind: access
      source_urls: *wiz
    - id: jenkins-rootkit
      title: Jenkins shell and a node rootkit
      description: "Remote code execution on the Jenkins controller opened a reverse shell to the attacker server. A pod escape placed a Linux ld.so.preload userland rootkit with a DNS-tunnel channel on the nodes, disguised as a fontconfig service, with zero VirusTotal detections."
      kind: execution
      source_urls: *wiz
    - id: offbox
      title: Off-box credentials read secrets
      description: "Node, IRSA, and Terraform-runner credentials were used from the attacker server to read Terraform state and Secrets Manager and to open SSM sessions."
      kind: impact
      source_urls: *wiz
    - id: open-dir
      title: Open directory shows the rest
      description: "The same server's open directory of more than 3,000 files showed forged identity-provider admin tokens for 3,392 users and their live session tokens, beacons on 19 hosts, 50 SSH private keys from the bastion database, dumped GitHub Actions secrets, a production Jenkinsfile changed to run before its approval gate, Anthropic API keys from 50 hosts, and coding-assistant session histories mined for production SSO credentials."
      kind: impact
      source_urls: *wiz
  edges:
    - source: probes
      target: ci-trust
    - source: probes
      target: node-collector
    - source: node-collector
      target: argo-admin
