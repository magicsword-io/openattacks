victims_and_sectors: "More than a dozen organizations in the ARTEX-Harvester cluster, at varying confidence. One anonymized case covered two AWS accounts and seven EKS clusters. No sector was named for either case. The Black October vendor names are other disclosed incidents, not a victim list for these two cases."
