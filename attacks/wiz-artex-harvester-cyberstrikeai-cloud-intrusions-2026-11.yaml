atlas_techniques:
  - id: AML.T0103
    rationale: "CyberStrikeAI ran the anonymized case, and ARTEX-Harvester is an agentic-framework cluster with self-labeling intent counters."
    source_urls:
      - https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks
  - id: AML.T0053
    rationale: "The frameworks carried the cloud and Kubernetes actions, including CI harvest workflows, pod creation, and secret reads."
    source_urls:
      - https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks
  - id: AML.T0012
    rationale: "Both cases started from stolen credentials: version-control access in one, and a Terraform-runner session in the other."
    source_urls:
      - https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks
  - id: AML.T0055
    rationale: "Harvest workflows, the node collector, ArgoCD secrets, Terraform state, Secrets Manager, GitHub Actions secrets, Anthropic API keys, and coding-assistant session histories exposed credentials."
    source_urls:
