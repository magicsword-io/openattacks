source_notes: "The narrative, counts, and self-labeling strings are from the 23 November 2026 Wiz Research post. The Black October vendor list is Wiz's update on other disclosed incidents. Wiz says there is not enough public detail to tie every one of those incidents to one actor or even to an agentic framework. GBHackers restates the Wiz cases and is not an independent source for the counts. The IOC CSV labels 68.68.250[.]114, 192.238.246[.]157, and 104.207.150[.]173 as ARTEX operator hosts. The other addresses here are a subset of rows labeled as used with stolen cloud or identity credentials. 45.199.130[.]245 is also labeled for wide probing and password spraying, and the CSV says a match may be a failed attempt. The CSV is the full list. Wiz says a new residential or ISP proxy exit per request makes IP blocking weak. No victim addresses are included. Link arctic-wolf-antifox-iis-aws-2026-11, wiz-ai-driven-cloud-2026-10, wiz-storm-0940-overlapping-operator-runs-2026-10, and elastic-cyberstrikeai-aws-cloudtrail-2026-11."
