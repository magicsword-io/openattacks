ai_role_detail: "Wiz ties the second case to CyberStrikeAI by csai- names, an ARTEX checkout beside .claude, .grok, and .agents, an incrementing intent counter, and an auto-generated report. ARTEX-Harvester is a separate cluster, based on a boto3 build, Intent IDs, and proxy pools."
technique_summary: "Wiz Research (Rami McCarthy and Hila Ramati, 23 November 2026) says that since late September 2026 it has seen ARTEX, its forks and rebrands, and similar agentic frameworks in the wild, including Cairn, CyberStrikeAI, HexStrike, generic harnesses such as Hermes, and custom harnesses. Wiz says activity attributed to ARTEX comes from many unrelated operators and is not one campaign or one threat actor. Since the Black October post, vendors have disclosed 20 more related incidents, and Wiz CIRT has seen a 3x rise in engagement requests. Wiz says not every one of those incidents has enough public detail to tie it to a single actor, or even to an agentic framework. Censys counted more than 1,400 exposed ARTEX consoles in early November, as reported by Wiz. ARTEX-Harvester is one of a dozen campaigns Wiz tracks. Wiz clustered it on a distinctive boto3 build, incrementing Intent IDs across victims, and overlapping proxy pools. From late October to mid-November 2026 Wiz tied it, at varying confidence, to activity at more than a dozen organizations. Almost every request used a different residential or ISP proxy exit, more than 220 IPs against a single target. The operator tried stolen credentials, anonymous storage probing, public sign-up, password-reset and sign-in flows, and identity-provider probing in parallel. One success used compromised version-control credentials for private repository access. Attacker-created branches abused CI workload identity trust to reach the cloud. Harvest workflows dumped CI-accessible secrets and Terraform state, and those secrets and repositories were exfiltrated. In parallel, a stolen application-pod service-account token could create privileged pods with the node root filesystem mounted. A node-level collector pod harvested kubelet PKI and every projected service-account token on the node. A cert-manager token could read ArgoCD secrets, leading to cluster-admin. Self-labeling tells include pentest-recon user agents, pentest-* workspaces and pods, and an incrementing pentest-iNNNNNN task intent counter. Wiz Sensor saw privileged container creation, nsenter, IMDS kube-env queries, and drifted scripts reaching for cloud credentials. A separate anonymized case, seen from both sides through the attacker's open directory of more than 3,000 files, covered four days in October, two AWS accounts, and seven EKS clusters. A stolen Terraform-runner session read the kubelet kubeconfig, then created a privileged pod and a cluster-admin binding. Remote code execution on the Jenkins controller opened a reverse shell. A pod escape placed a Linux ld.so.preload userland rootkit with a DNS-tunnel channel on the nodes, disguised as a fontconfig service, with zero VirusTotal detections. Node, IRSA, and Terraform-runner credentials were used from the attacker server to read Terraform state and Secrets Manager and to open SSM sessions. The open directory also showed forged identity-provider admin tokens for 3,392 users and their live session tokens, beacons on 19 hosts, the bastion database decrypted for 50 SSH private keys, dumped GitHub Actions secrets, and a production Jenkinsfile modified to run before its approval gate. CyberStrikeAI ran that operation. Names use a csai- prefix, including csai-escape pods, a csai-pentest-role IAM role, and a csai-probe runner. An ARTEX checkout sat next to .claude, .grok, and .agents directories. The same server ran ARTEX against several other organizations that month, unsuccessfully. The operator's auto-generated Chinese-language report masked the intrusion as an authorised red-team pentest with 58 findings. Anthropic API keys were harvested from 50 hosts, and employees' AI coding-assistant session histories were mined for production SSO credentials. Where victims of the broader Black October incidents disclosed a root cause, Wiz lists stolen or leaked credentials (Zeabur, Kernel, Lightning AI, Bitrise), exposed or vulnerable services (Chainstack's default-credential Grafana, NEAR AI's SGLang RCE, Northflank's API zero-day), and tenant-isolation escapes (Railway, Phala, Dokploy). Wiz says attackers go for environment variables and stored customer secrets, prioritizing AI provider and cloud keys. Residential and ISP proxy rotation makes IP blocking weak. Link arctic-wolf-antifox-iis-aws-2026-11, wiz-ai-driven-cloud-2026-10, wiz-storm-0940-overlapping-operator-runs-2026-10, and elastic-cyberstrikeai-aws-cloudtrail-2026-11."
initial_access: "Stolen credentials. The confirmed ARTEX-Harvester path was compromised version-control credentials reused against CI. The separate case started from a stolen Terraform-runner session. Wiz does not say how either set of credentials was first taken."
