detections:
  - name: Kubernetes Privileged Pod Created
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/kubernetes/privilege_escalation_privileged_pod_created.toml"
    notes: "Kubernetes audit. Creation of a pod whose container sets privileged mode. Matches the privileged pods in both cases. It does not detect a hostPath mount that is not privileged."
  - name: Kubernetes Pod Created with a Sensitive hostPath Volume
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/kubernetes/privilege_escalation_pod_created_with_sensitive_hostpath_volume.toml"
    notes: "Kubernetes audit. A new or updated pod mounting a sensitive host path, and the path list includes /. Matches the node root filesystem mount when that path is logged."
  - name: Container With A hostPath Mount Created
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/application/kubernetes/audit/kubernetes_audit_hostpath_mount.yml"
    notes: "Kubernetes audit. Pod create with any hostPath volume. Low severity, because DaemonSets also use hostPath. Broader than the Elastic sensitive-path rule."
  - name: Kubernetes Cluster-Admin Role Binding Created
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/kubernetes/persistence_cluster_admin_rolebinding_created.toml"
    notes: "Kubernetes audit. Create of a RoleBinding or ClusterRoleBinding whose roleRef is cluster-admin. Matches the binding in the CyberStrikeAI case. The ARTEX-Harvester path used an existing cert-manager token that could read ArgoCD secrets, which this creation rule does not cover."
  - name: AWS EC2 Role GetCallerIdentity from New Source AS Organization
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_new_terms_sts_getcalleridentity_ec2_role_new_source_as.toml"
    notes: "AWS CloudTrail. First GetCallerIdentity by an EC2 instance-role session from a new source AS organization, which is the public rule closest to credentials used outside normal egress. It does not cover ECS task roles or IRSA, and Wiz does not say this case called GetCallerIdentity."
  - name: AWS Secrets Manager Rapid Secrets Retrieval
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/credential_access_rapid_secret_retrieval_attempts_from_secretsmanager.toml"
    notes: "AWS CloudTrail. Twenty or more distinct GetSecretValue or BatchGetSecretValue calls by one identity in a short window. Wiz describes Secrets Manager reads and does not give a count, so the threshold may not have been met."
  - name: AWS SSM Session Started to EC2 Instance
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/lateral_movement_aws_ssm_start_session_to_ec2_instance.toml"
    notes: "AWS CloudTrail. First SSM session from a user or role to an EC2 instance. Matches the SSM sessions in the CyberStrikeAI case. It does not require the caller to be outside AWS."
  - name: Potential Docker Escape via Nsenter
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/privilege_escalation_docker_escape_via_nsenter.toml"
    notes: "Linux endpoint. nsenter changing into another namespace. Wiz Sensor saw nsenter during the ARTEX-Harvester cluster activity."
  - name: Wiz-only cloud rules and self-labeling tells
    format: guidance
    notes: "Wiz names its own detections EC2 Instance Credentials Used Outside Of AWS, ECS Task Credentials Used Outside Of AWS, and Unusual Mass Secret Value Retrieval. Those are not public Sigma, Splunk, or Elastic rules, so they are not cited under those formats. No public rule in the checked set alerts on ECS task-role or IRSA credentials used from an external server. Sigma's Privileged Container Deployed rule keys on a capabilities field, not securityContext.privileged, so it is not cited for these pods. Also hunt pentest-recon user agents, pentest-* workspaces and pods, the pentest-iNNNNNN intent counter, csai- resource names, a Jenkinsfile edited to run before its approval gate, and the published proxy behavior. IP blocking is weak because exits rotate."
