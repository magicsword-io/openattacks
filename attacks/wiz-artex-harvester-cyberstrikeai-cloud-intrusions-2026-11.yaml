region_notes: "Wiz does not name victim countries. The case 2 report is auto-generated in Chinese. That is an operator signal, not a victim location, and Wiz does not attribute a country. Hosting providers in the IOC CSV are not victim regions."
attribution_or_cluster: "Unnamed operators. Wiz named the cluster ARTEX-Harvester and says ARTEX activity comes from many unrelated operators, not one actor. A separate operator ran the anonymized case with CyberStrikeAI and wrote a Chinese-language report. Wiz attributes neither case to a country."
scale_and_metrics: "Framework activity since late September 2026. Twenty further related incidents disclosed by vendors since the Black October post. Wiz CIRT engagement requests up 3x. More than 1,400 exposed ARTEX consoles counted by Censys in early November, per Wiz. ARTEX-Harvester: more than a dozen organizations from late October to mid-November 2026, and more than 220 IPs against one target. Separate case: four days in October, two AWS accounts, seven EKS clusters, an open directory of more than 3,000 files, forged tokens for 3,392 users, beacons on 19 hosts, 50 SSH private keys, 58 findings in the operator report, and Anthropic API keys from 50 hosts."
prevention_angle: "Restrict CI workload identity trust with branch and ref conditions on OIDC. Block privileged pods and hostPath mounts with admission policy. Limit what a service-account token can read, including a cert-manager token that can read ArgoCD secrets. Alert when cloud credentials are used outside the cloud. Keep AI provider keys and coding-assistant session histories out of reach of stolen workload and CI credentials. Use approval gates that a Jenkinsfile edit cannot bypass. Lock down exposed agent consoles. Wiz says residential and ISP proxy rotation makes IP blocking weak."
