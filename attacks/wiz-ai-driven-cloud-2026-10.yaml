technique_summary: "AI agent ran full cloud operations: initial access, credential theft, pivots
  across GCP/AWS/K8s/CI-CD/IdP, debugging its own scripts. Loud (thousands of actions/hour),
  pentest-named resources, numeric task IDs with -b/-c retries, commented generated scripts. Lived
  off SSM, SA token minting, IdP admin creation, GitOps manifests, runner-log exfil."
initial_access: Confirmed Java RCE in exposed Kafka UI among multiple probed doors; same source IP
  scanned 600+ other Wiz customer environments
ai_tooling_and_models:
  - "Unnamed AI agent system (Wiz: agent ran the whole operation)"
other_tooling:
  - Kafka UI exploit
  - SSM
  - GCP SA token creation
  - IdP admin APIs
  - CI/CD pipelines
  - GitOps/K8s manifests
  - webhook.site
  - IMDS credential harvest
victims_and_sectors: Large multi-cloud organization (Wiz customer); opportunistic scanning across many other customers
regions:
  - unknown
attribution_or_cluster: unknown
scale_and_metrics: Hundreds–thousands of actions per hour; 600+ environments scanned from same IP
prevention_angle: Unify multi-platform logs; runtime visibility on runners/VMs/pods; restrict
  cross-system trust; rotate credentials on compromise; correlate loud agent tells (pentest-
  prefixes, task IDs)
related_magicsword_projects: []
source_notes: null
