attribution_or_cluster: "No threat actor. Forever Security disclosed the findings to the vendors. Noma Security is credited for a July 24 Claude Desktop report that Anthropic accepted."
scale_and_metrics: "Five products. Two issues, Codex and VS Code, were still unpatched when the post was published on Oct 29, 2026. Cursor was patched on Oct 1. Copilot was fixed in 1.1.29."
prevention_angle: "Treat the browser inside each assistant as an endpoint that loads untrusted pages and local files. Keep Cursor and Copilot on builds that include the Oct 1 and 1.1.29 fixes. Do not open local HTML from a repository you do not trust, including a file the assistant links. Do not treat a required Enter or a single click as a control when the assistant is the one asking for it."
