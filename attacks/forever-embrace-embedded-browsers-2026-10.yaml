detections:
  - name: Embedded-browser findings have no single host rule
    format: guidance
    notes: "The post does not name a process, a package, or a network destination that a Sigma, Splunk, or Elastic rule would match. Hunt assistant browsers opening local HTML, an agent disabling its own sandbox after a blocked command, and Copilot preview tabs whose recorded address is github.com while the page is not. The macOS folder index is a file the page reads, not a separate malware family."
