attack_flow:
  nodes:
    - id: open
      title: Page or local file opens in the assistant browser
      description: "A site is opened in Cursor or Copilot, or the assistant links a local HTML file from a repository the user asked it to set up."
      kind: access
      source_urls: &a1
        - https://forever.security/blog/embrace-hacking-5-ai-assistants-embedded-browsers
    - id: bend
      title: The embedded browser breaks a browser rule
      description: "Cursor lets the page feed the agent. Copilot accepts an address the page supplies. Codex, Claude Desktop, and VS Code let a local file read outside its folder, through a web worker in the last two."
      kind: ai
      source_urls: *a1
    - id: act
      title: Command, file read, or spoofed address
      description: "Cursor's agent can disable its own sandbox after a block. The local file reads SSH keys, .env files, npm tokens, and the hosts file. Copilot's bar can show github.com for a different page."
      kind: execution
      source_urls: *a1
    - id: status
      title: Two issues still open at publication
      description: "Cursor was patched on Oct 1 and Copilot in 1.1.29. Forever Security says Codex and VS Code were still unpatched on Oct 29, 2026."
      kind: impact
      source_urls: *a1
  edges:
