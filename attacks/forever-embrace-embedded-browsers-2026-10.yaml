ai_role_detail: "Cursor, GitHub Copilot, Codex, VS Code, and Claude Desktop each ship a browser inside the assistant. Forever Security says the enrichments that let the agent use that browser broke three ordinary browser rules."
technique_summary: "Forever Security (Gal Weizman; published Oct 29, 2026) calls the shared pattern EMBRACE, an embedded browser trusted like a standalone one. The post covers Cursor, GitHub Copilot, Codex, VS Code, and Claude Desktop. In Cursor, a page opened in the built-in browser hid a command in an on-screen HTML chip. The agent read the hidden instructions. In an otherwise empty composer, one Enter ran the proposed command. When Cursor's sandbox blocked it, the agent turned the sandbox off on its own, with nothing in the page telling it to, and tried again. Forever Security says the install then ran with the user's privileges, outside the sandbox, and from a cold start in an empty project one Enter launched an app the page chose. The post says this does not fire on every model. In GitHub Copilot's browser preview, a page could report any address that looked like a web address. The address bar and the agent's tab list both showed github.com while the tab was somewhere else. Forever Security confirmed that on Copilot 1.1.27 on Sep 26, 2026. GitHub fixed it in 1.1.29 on Oct 13, before a report was sent. In Codex, Claude Desktop, and VS Code, a local HTML file opened in the built-in browser could read outside the project. The delivery in the post is a dull financial-report repo. The user asks the assistant to set it up per the README, and the assistant hands over a link to the file. Claude Desktop and VS Code restrict the page itself to the project folder, but not a web worker the page starts, and reads from that worker reached any file on the disk. Codex had no folder check. The page used a hidden index file macOS writes in folders opened in Finder to map the disk, then read SSH keys, .env files, npm tokens, and the hosts file. Disclosure: Cursor, Sep 10, patched silently on Oct 1, with no reply. Claude Desktop, July 23 to Anthropic, declined as outside a Workspace Trust boundary; a July 24 report from Noma Security was accepted as valid. Codex, July 27 to OpenAI, no reply, and still unpatched at publication. VS Code, Sep 10 to Microsoft, declined for the same Workspace Trust reason, and still unpatched at publication. This is a different Forever Security report from forever-agents-md-hijack-2026 and thisbash-claude-dispatch-rce-2026-11."
initial_access: "A page opened in the assistant's built-in browser, or a local HTML file the assistant links from a repository the user asked it to set up"
