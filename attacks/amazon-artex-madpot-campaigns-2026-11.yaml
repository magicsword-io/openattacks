detections:
  - name: Web Server Cloud Metadata SSRF Request
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/credential_access_web_server_cloud_imds_ssrf_request.toml
    notes: "Matched SSRF and 169.254.169.254 with security-detections-mcp. Web-server URL or query hitting a cloud metadata endpoint. Amazon's captured playbook includes SSRF through URL-fetch features to cloud metadata. Amazon did not confirm each attempt succeeded."
  - name: Cloud Instance Metadata Credential Path HTTP Request
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/network/credential_access_cloud_imds_credential_http_request.toml
    notes: "Matched 169.254.169.254 with security-detections-mcp. HTTP GET to a metadata credential path. Same playbook item, seen on packet capture rather than the web-server log."
  - name: Ollama API Accessed from External Network
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/initial_access_ollama_api_external_access.toml
    notes: "Matched Ollama with security-detections-mcp. Ollama is one of the exposed AI applications the agents' records say they hunted. The rule flags an unauthenticated Ollama API accepting an external connection. It does not identify ARTEX."
  - name: No rule for the KYC deepfake or the named gateway flaws
    format: guidance
    notes: "security-detections-mcp searches for deepfake, KYC, liveness, Langflow, RAGFlow, default credential, master key, and source map returned no Sigma, Splunk, or Elastic rule for this activity. A master-key hit was Windows DPAPI, which is a different control. Hunt the LiteLLM default master key, CVE-2025-3248, CVE-2026-28797, the One API family isCliRequest authentication bypass, and secrets in JavaScript bundles, source maps, debug routes, and environment files. There is no detection rule in the index for a rejected liveness deepfake."
