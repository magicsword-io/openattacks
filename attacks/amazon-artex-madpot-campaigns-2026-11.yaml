ai_role_detail: "MadPot decoys that presented LLM chat-completion APIs received ARTEX agents' own campaign memory, including prompts, tool history, and the shared knowledge graph."
technique_summary: "Amazon Threat Intelligence (CJ Moses, AWS Security Blog, 13 November 2026) says that from 3 October to 5 November 2026, MadPot decoys configured as popular LLM chat-completion APIs received requests from AI agents. The requests carried persistent task context, system prompts, tool histories, knowledge-graph state, and reported findings. Amazon assesses with moderate confidence that the agents ran on ARTEX, from prompt references to ARTEX tooling and other ARTEX artifacts, and with moderate confidence that the operators were disparate Chinese-nexus groups, from simplified Chinese prompts, China time-zone settings, targeting consistent with Chinese interests, and tooling predominantly used by Chinese-nexus threats. Standing instructions set mission, targeting, and constraints, including a fixed country sequence, a preference for enterprise production sites over personal projects, a ban on mainland China targets and government domains, and a requirement that outbound traffic use proxies. Credentials exposed for more than 30 days were to be treated as low-value. Most activity split work across planner, worker, verification, and compression agents sharing a knowledge graph. Campaign 1, in the agents' records, hunted internet-exposed AI gateways and application builders, extracted upstream provider keys, validated them, and pooled them. Named targets were One API, New API, Veloera, Sub2API, LiteLLM, Dify, FastGPT, Langflow, RAGFlow, Open WebUI, LobeChat, and Ollama. The recorded playbook mapped each product to known chains, including uninitialized installs, anonymous management and provider-configuration endpoints, the LiteLLM default master key, CVE-2025-3248 (Langflow), CVE-2026-28797 (RAGFlow), an isCliRequest authentication bypass on One API family systems, SSRF through URL-fetch features to cloud metadata services, and secrets in client-side JavaScript, source maps, debug routes, and environment files. Discovery used internet scanning, certificate transparency, GitHub repositories and event archives, npm and PyPI tarballs, container layers, notebooks, model-hosting spaces, paste sites, and Telegram. Stolen keys were fed into the framework gateway so stolen inference funded more hunting. Cloud credentials were validated, storage was enumerated, and managed AI services, secrets stores, and application identities were prioritized over general cloud permissions. Leads were graded L1, L2 for a working API call, and L3 for quantified impact. Campaign 2, in concurrent sessions against two cryptocurrency exchanges, attempted real-time deepfake video for liveness checks and forged ID-document photos. The agents' records say the vendor's server-side verdict rejected the deepfake on every recorded attempt. Amazon did not say whether the forged document photos passed. At least four sessions ran at once, on cash-out, balances, the deepfake pipeline, and the verification bypass. Amazon did not observe the described activity on other organizations as it happened and cannot verify the outcomes the agents reported. It notified potentially affected AWS customers. Community forks that answered HTTP 200 on 16 November 2026 are https://github.com/RuoJi6/ARTEX and https://github.com/MoLeft/ARTEX. The original Autumn-27/ARTEX repository returned HTTP 404."
initial_access: "The agents' records describe exposed AI management interfaces, default credentials, known product flaws, and public artifact searches. Amazon did not observe those intrusions on customer or third-party systems."
