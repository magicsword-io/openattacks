attribution_or_cluster: "Unnamed Chinese-nexus groups. Amazon Threat Intelligence, moderate confidence, from simplified Chinese prompts, China time zones, targeting, and tooling. Financially motivated. Not a single named cluster."
scale_and_metrics: "MadPot collection window 3 October through 5 November 2026. The records describe hundreds of targets. Campaign 2 names two cryptocurrency exchanges and at least four concurrent agent sessions. Every recorded liveness verdict rejected the deepfake. No confirmed victim count was published."
prevention_angle: "Put AI gateways, application builders, and inference endpoints under the same controls as other production systems. Change default credentials, including the LiteLLM default master key, and do not leave an install uninitialized. Remove unauthenticated management and provider-configuration endpoints. Review Langflow for CVE-2025-3248 and RAGFlow for CVE-2026-28797, and do not trust an isCliRequest header as authentication on One API family systems. Alert on URL-fetch features that can reach cloud metadata, and on secrets in client-side JavaScript, source maps, debug routes, and environment files. Watch provider spend. Treat the published IPs as MadPot observations of agent traffic in the stated windows, and corroborate them before blocking."
related_magicsword_projects: []
source_notes: "The campaigns, the moderate-confidence attribution, the product list, the CVEs, the isCliRequest bypass, the SSRF and secret locations, the knowledge-graph roles, the two exchanges, the rejected liveness checks, and the eleven IPs are from the Amazon blog. Amazon states that it did not watch the off-decoy activity and cannot verify agent-reported outcomes. The Hacker News article of 16 November 2026 restates that blog. It also discusses Cloudflare and other ARTEX reporting that is not part of this entry. The Hacker News flaw table says Langflow versions before 1.3.0 are affected by CVE-2025-3248; Amazon's blog names the CVE and does not give that version range. https://github.com/RuoJi6/ARTEX and https://github.com/MoLeft/ARTEX returned HTTP 200 on 16 November 2026. https://github.com/Autumn-27/ARTEX returned HTTP 404 and is not linked. Mainland China appears only as an operator exclusion, not as a victim region."
last_reviewed: "2026-11-16"
region_notes: "Amazon describes a fixed country sequence and an instruction to exclude mainland China and government domains. It does not name the countries of the hundreds of targets or of the two exchanges. Those instructions are not recorded as victim regions."
