technique_summary: "Microsoft Security Research (Uri Oren and Dor Edry, 17 November 2026) ran a controlled lab simulation in which a test account approved a GitHub OAuth device-code request started by an attacker-controlled client using the public GitHub Copilot CLI client ID. The verification page is the real github.com page, and the authorization shows the legitimate application name. The requested scopes were repo, read:user, read:org, gist and codespace, chosen by the client that starts the flow. With that one approval the researchers could (1) steer an active Copilot CLI session remotely when the user had enabled remote control and policy allowed it, and have the agent run a command on the test machine subject to its approval prompts and OS permissions, (2) add misleading entries to Copilot Memory with the /memory command so they could influence later interactions, (3) read Copilot CLI sessions synced to the cloud, including sessions from before the simulation, and (4) access private repositories available to the account. Microsoft states these are proof-of-concept outcomes of features working as designed and that it has not observed them in earlier device-code campaigns (Storm-2372, the 2026 AI-enabled campaign, EvilTokens) or in the wild. Remote control is off by default and is enabled with remoteSessions in ~/.copilot/settings.json; enterprises can set remoteControl.mode to disabled or requireSSO."
initial_access: Device code phishing (email or Microsoft Teams lure carrying a GitHub verification link and an attacker-generated code)
ai_tooling_and_models:
  - GitHub Copilot CLI (target)
  - Copilot Memory (target)
other_tooling:
  - GitHub OAuth device authorization flow
  - Copilot CLI remote control / cloud session storage
victims_and_sectors: Developers using GitHub Copilot CLI (lab simulation, no victims)
regions:
  - unknown
region_notes: Lab research; no victim geography.
attribution_or_cluster: Vulnerability and abuse research by Microsoft Security Research; not an attributed campaign
scale_and_metrics: "Proof of concept only. Two Microsoft Defender XDR detections shipped: Suspected GitHub Copilot CLI device code phishing via email, and via Microsoft Teams. Defender can disrupt by suspending the affected GitHub Enterprise Managed User."
prevention_angle: "Approve only device codes you started yourself. Set the GitHub Store local sessions in the Cloud policy and remoteControl.mode to the least permissive option (disabled or requireSSO). Review and revoke unexpected GitHub OAuth authorizations, limit repository roles, and review saved Copilot Memory entries during incident response, since disabling memory does not delete stored entries."
