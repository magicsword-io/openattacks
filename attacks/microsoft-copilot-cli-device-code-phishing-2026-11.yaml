    - id: step-2
      title: Victim approves the code on github.com
      description: A lure framed as an IT request or Copilot license check sends the code and the real verification link; the victim approves.
      kind: access
      source_urls: *a1
    - id: step-3
      title: Attacker steers the running agent session
      description: With remote control enabled, the attacker interacts with the active Copilot CLI session and has the agent run a command, subject to local approvals.
      kind: ai
      source_urls: *a1
    - id: step-4
      title: Memory poisoning and session read-back
      description: The attacker writes misleading Copilot Memory entries with /memory and reads cloud-synced sessions.
      kind: ai
      source_urls: *a1
    - id: step-5
      title: Private repository access
      description: The token reaches private repositories available to the account.
      kind: impact
      source_urls: *a1
