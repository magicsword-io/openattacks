    notes: "Unit 42 describes weak-password spraying, unauthenticated cloud-storage writes, account-creation bypasses, and minted administrator accounts on unnamed application stacks. No Sigma, Splunk, or Elastic rule names Cairn, AIScan Runner Skills, or those application flaws. Hunt the published IPs 154.44.31.4 and 82.29.129.54, unexpected administrator accounts and API tokens, and unauthenticated writes to standards or directory data. A same-/24 panel lead is not an indicator from this report."
