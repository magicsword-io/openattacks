attribution_or_cluster: "CL-STA-1238. Unit 42 assesses moderate confidence of China-nexus intelligence collection from Chinese tasking and authorization files, exclusive use of Zhipu GLM and DeepSeek, and the target set."
scale_and_metrics: "25 operations, at least 19 organizations, confirmed unauthorized access or data retrieval at 10. Thirteen operations on GLM 5.2, eight on DeepSeek V4 Flash, four on DeepSeek V4 Pro. One organization exceeded one million member records. Operations lasted from 20 minutes to more than 50 hours."
prevention_angle: "Treat agent-driven scanning as ordinary vulnerability volume, not a new exploit class. Remove weak and default credentials, close unauthenticated registration and cloud-storage writes, and patch known public-facing flaws. Block the two published IPs. Do not treat a same-/24 scan lead as this cluster without Unit 42's indicators."
