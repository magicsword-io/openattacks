ai_role_detail: "CL-STA-1238 ran a customized Cairn fork so Zhipu GLM 5.2 and DeepSeek V4 Flash or Pro planned and executed intrusion tasks. A Chinese authorization preamble told the model never to refuse."
technique_summary: "Palo Alto Networks Unit 42 (published Nov 12, 2026) tracks CL-STA-1238, assessed with moderate confidence as China-nexus intelligence collection. From August through September 2026, Chinese-speaking operators used the open-source Cairn framework (https://github.com/oritera/Cairn) for 25 operations against at least 19 organizations and confirmed unauthorized access or data retrieval at 10. They paired Cairn with Zhipu GLM 5.2 (13 operations), DeepSeek V4 Flash (8), and DeepSeek V4 Pro (4), using the higher-tier Pro model for repeats against targets that resisted Flash. Each operation loaded a skill pack named AIScan Runner Skills, which Unit 42 says is not in upstream Cairn. A worker system-prompt preamble framed every Reason and Explore phase as authorized security testing, CTF, assessment, vulnerability research, or code audit and forbade refusal. Each operation also wrote AUTHORIZATION.md treating task creation as a client-approved engagement. Neither model refused that framing. Operators supplied a one-line goal and a root domain, and sometimes prior intelligence such as VPN gateway addresses, group names, and shared group passwords. Cairn then mapped the target, broke the goal into three to seven stages, and looped until the model judged the goal met, options exhausted, or the operator stopped it. Individual operations ran from 20 minutes to more than 50 hours. Confirmed outcomes include weak-password spraying that yielded dozens of valid credentials and non-public directory data at an industry standards body, plus an unauthenticated cloud-storage write that overwrote a live standards-ballot document; a brute-forced production credential at a semiconductor company followed by unauthorized administrator accounts and a persistent API token; an unauthenticated account-creation bypass at a U.S. teachers' union that logged access to more than one million member records, roughly 31,000 CRM contacts, and staff password hashes; an open registration endpoint on a defense-policy identity platform exposing roughly 500 user records, including .mil and .gov accounts; and five further cases covering tens of thousands of content-management records, employee data at a semiconductor-lithography manufacturer, roughly 150,000 internal documents at an industrial-automation manufacturer, and student data at an education nonprofit. Targeting concentrated on semiconductor and advanced-manufacturing supply chain (seven organizations), defense and defense policy (three, including a space technology company, a defense-analytics vendor, and a policy think tank), and human rights and civil society (four, including a Canadian human-rights body, a U.S. teachers' union, a science-policy advocacy group, and an education nonprofit). Unit 42 assesses a single operator or small team. The exploited flaws were known classes: authentication bypasses, insecure direct object references, mass-assignment privilege escalation, weak and default credentials, exposed cloud APIs, and dated public CVEs. Infrastructure: Cairn hosting 154.44.31.4 (Hong Kong, AS979, NetLab Global) and egress and staging 82.29.129.54 (United States, AS142036, Hosteons Pte. Ltd.). Link cairn-norforge-2026-10 and cert-in-crafty-falcon-bfsi-2026-11."
initial_access: "Operator-supplied root domain, sometimes with pre-gathered VPN gateways, group names, and shared passwords. Cairn then used authentication bypasses, weak or default credentials, insecure object references, and exposed cloud APIs."
