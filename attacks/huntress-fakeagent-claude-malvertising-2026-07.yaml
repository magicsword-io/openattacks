detections:
  - name: Windows Unsigned DLL Side-Loading In Same Process Path
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_unsigned_dll_side_loading_in_same_process_path.yml
    notes: "Selected from a security-detections-mcp search for unsigned DLL side-loading. Sysmon Event 7 where an unsigned DLL loads from the same directory as the process, outside Windows and Program Files. That matches libcef.dll beside the signed JetBrains host and tempdir.dll beside the signed IBM host. A valid signature on the DLL would not match."
  - name: Scheduled Task Creation Via Schtasks.EXE
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml
    notes: 'Selected from a security-detections-mcp search for schtasks creation. Matches schtasks.exe with " /create " in the command line, excluding a system user. Huntress does not publish the command line. A task created through the Task Scheduler API would not match.'
  - name: Local Scheduled Task Creation
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_local_scheduled_task_creation.toml
    notes: "Selected from a security-detections-mcp search for scheduled task creation. Requires an untrusted process or a listed script host, then schtasks.exe /create with a scheduling flag, within one minute, and not at SYSTEM integrity. The same command-line limit applies. Huntress did not show schtasks.exe."
  - name: Sideload path and task location gaps
    format: guidance
    notes: "Sigma Abusable DLL Potential Sideloading From Suspicious Location does list libcef.dll, but only under Perflogs, Users\\Public, Temporary Internet Files, Windows\\Temp, Favorites, Contacts, and Pictures. It does not cover a Downloads or AppData copy, so it is not cited. Sigma Scheduled Task Executed From A Suspicious Location matches Temp, Desktop, Downloads, and Public, not AppData\\Roaming\\Microsoft\\EdgeUpdate. No Elastic image-load rule in the index covers a generic unsigned DLL beside a signed host."
