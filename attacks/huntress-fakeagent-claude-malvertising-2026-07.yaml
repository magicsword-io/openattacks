ai_role_detail: "Confirmed for the lure. A Bing ad and a public Claude Artifact impersonate Claude Desktop. Claude was not compromised. The secondary role is vendor-asserted. ExaTrack says FakeGuard and its C2 were very probably generated by a model, citing Russian-language docstrings, and thinks SteamLoader was too. ExaTrack says it has no proof that VMLoader or GPULoader were generated that way. SectopRAT theft is not recorded as AI-credential theft."
technique_summary: "Huntress (Michael Tigges, 22 July 2026) calls this campaign FakeAgent. Bing ads for a Claude Desktop download pointed at a public Claude Artifact, claude.ai/public/artifacts/ca456f1f-44c0-42af-b329-4f1c7534a877, which had about 7,100 views and the platform disclaimer that the content is user-generated and unverified. Anthropic had removed the artifact by the time the post was published. The artifact redirected to claude.ai.download-app.us and then downloading-api.it.com/html/claude/win, which served a fake ClaudeDesktop.exe. download-app.us was registered on 9 May 2026. ClaudeDesktop.exe is a signed JetBrains jcef_helper.exe, the same file Huntress also saw copied as DockerDesktop.exe for a scheduled task. It sideloads a VMProtect-packed libcef.dll. That DLL reads an Ethereum contract, downloads cache.dat, and the task keeps a copy under the EdgeUpdate install directory. A second stage, sslconf.exe, is a signed IBM SPSS binary that sideloads tempdir.dll. That DLL checks the GPU vendor and VRAM, skips QEMU and VMware, and decrypts appcfg.dat with a DirectX shader used as an AES-256-CTR routine. The embedded payload is SectopRAT, an HVNC .NET RAT. Its C2 address is stored on a BNB Smart Chain contract. Huntress observed the campaign against 29 organizations on 21 and 22 July 2026. The live C2 in the post is 2.24.131.246, with backup domain 5ca8758c-02d0-4a72-89c8-d468b66dda41.com. ExaTrack (5 November 2026) analyzes the same chain and names the first DLL VMLoader and the second GPULoader. VMLoader rejects software adapters, low VRAM, short adapter names, and vendor ids for the Microsoft Basic Render driver, QEMU, and VMware, then runs 15 VM modules. Module 8 adds a Defender exclusion for C:\\Users. Module 13 creates a logon task named MicrosoftEdgeUpdate at the highest run level. GPULoader decrypts a companion file only on a real GPU. An optional stage-2 binary, siteguard.exe, is FakeGuard, a banking adversary-in-the-middle add-on with a local CA named PC Site Guard Local CA, a PAC proxy, and a Chrome extension. Its hardcoded C2 is 45.59.122.85. ExaTrack assesses FakeGuard as very probably model-generated from the Russian docstrings and says the same is unproven for VMLoader and GPULoader. A docstring IP, 216.126.227.160, was not found in the contracts or hardcoded values. The SectopRAT contract 0xe012d0f34cde9b870e9d9ed566ea5f8fd9b92228 shows 2.24.128.29 on 25 July 2026. A second contract, 0xfdf3acb71c52889e5bb38e77512a7a18d292fe10, carries the same style of updates. ExaTrack dates the loader campaign from April 2026, the SectopRAT C2s from May 2025, and contract URL updates through 23 October 2026. The July window remains Huntress's Claude-ad observation. ZIP names also cover Chrome, Exodus, and Docker Desktop. The published hash list is not exhaustive."
initial_access: "Bing ads for a Claude Desktop download, leading to a public Claude Artifact and then a fake Windows installer."
