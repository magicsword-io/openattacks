detections:
  - name: Windows Unsigned DLL Side-Loading In Same Process Path
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_unsigned_dll_side_loading_in_same_process_path.yml
    notes: "Selected from a security-detections-mcp search for unsigned DLL side-loading. Sysmon Event 7 where an unsigned DLL loads from the same directory as the process, outside Windows and Program Files. That matches libcef.dll beside the signed JetBrains host and tempdir.dll beside the signed IBM host. A valid signature on the DLL would not match."
  - name: Scheduled Task Creation Via Schtasks.EXE
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml
    notes: 'Selected from a security-detections-mcp search for schtasks creation. Matches schtasks.exe with " /create " in the command line, excluding a system user. ExaTrack publishes schtasks /create /tn MicrosoftEdgeUpdate /sc onlogon /rl highest. The IOC table leaves /tr as a space. /rl highest is not SYSTEM, so a SYSTEM-only schtasks rule is not cited.'
  - name: Local Scheduled Task Creation
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_local_scheduled_task_creation.toml
    notes: "Selected from a security-detections-mcp search for scheduled task creation. Requires an untrusted process or a listed script host, then schtasks.exe /create with a scheduling flag, within one minute, and not at SYSTEM integrity. ExaTrack's command uses /sc onlogon and /rl highest, which fits that limit when the parent is untrusted."
  - name: Windows Defender Exclusions Added via PowerShell
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_defender_exclusion_via_powershell.toml
    notes: "Selected from the indexed Elastic rules after a security-detections-mcp search for Defender exclusion. powershell.exe with Add-MpPreference or Set-MpPreference and an -Exclusion argument. ExaTrack publishes powershell -NoProfile -Command Add-MpPreference -ExclusionPath 'C:\\Users'."
  - name: Powershell Defender Exclusion
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_defender_exclusion.yml
    notes: "Selected from a security-detections-mcp search for Add-MpPreference. powershell.exe with Add-MpPreference or Set-MpPreference and -ExclusionPath, -ExclusionExtension, or -ExclusionProcess. Same published command."
  - name: Powershell Windows Defender Exclusion Commands
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/powershell_windows_defender_exclusion_commands.yml
    notes: "Selected from the same search. PowerShell script block 4104 containing Add-MpPreference or Set-MpPreference and -exclusion. Same published command. It needs script-block logging."
  - name: Sideload path and GPU decrypt gaps
    format: guidance
    notes: "Sigma Abusable DLL Potential Sideloading From Suspicious Location does list libcef.dll, but only under Perflogs, Users\\Public, Temporary Internet Files, Windows\\Temp, Favorites, Contacts, and Pictures. It does not cover a Downloads or AppData copy, so it is not cited. Sigma Scheduled Task Executed From A Suspicious Location matches Temp, Desktop, Downloads, and Public, not an EdgeUpdate folder. security-detections-mcp searches for D3D11, GPU decrypt, and shader returned no rule for a GPU-only decrypt or for VM bytecode. No indexed rule names siteguard.exe or the local CA."
