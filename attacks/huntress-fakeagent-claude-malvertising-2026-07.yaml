attribution_or_cluster: "Unnamed. Huntress ties the download domain to one registrant who also held earlier domains, including one Microsoft seized, and an April 2026 fake Docker Desktop that used the same sideload. No person or group is named."
scale_and_metrics: "29 organizations, 21-22 July 2026. The artifact had about 7,100 views before Anthropic removed it."
prevention_angle: "Download Claude Desktop from Anthropic. Treat a search ad and a public artifact as unverified. Alert when a signed JetBrains or IBM binary loads an unsigned DLL from the same directory, when powershell.exe runs Add-MpPreference -ExclusionPath for C:\\Users, and when schtasks.exe creates MicrosoftEdgeUpdate at logon. A sandbox without a real GPU will not see the GPULoader decrypt."
related_magicsword_projects: []
source_notes: "Classified as adversary use of AI with the lure role, the same treatment as the Adception fake Claude installer and the ANY.RUN fake AI-tool installers. The AI product is the bait. Anthropic's platform hosted a user-generated artifact, and Huntress does not describe a compromise of Claude or of Anthropic. SectopRAT steals broadly. That is not recorded as a second role of AI-credential theft. Huntress used Claude Opus 4.8 while recovering a one-byte mistake in the shader key. That is the analyst's method, not the attacker's, and it is not an indicator. Benign signed hosts, which should not be blocked on the hash alone, are ClaudeDesktop.exe and DockerDesktop.exe SHA256 f8acb8f5cf88b77a4c27d7fd6856aa299bb178e85f9963c2fbd447d818da3ed0 (JetBrains jcef_helper.exe) and SSLConf.exe SHA256 fd826215add30c1319eefa291b6eaf8ddfa7720cfe816c49aef6fe8a88de7939 (IBM SPSS). Huntress quotes the second persistence path as %APPDATA%\\Roaming\\Microsoft\\EdgeUpdate\\Install\\sslconf.exe. The libcef.dll contract is 0xc1907d7be91f95903ad66d775c397302e7dd9228 and the SectopRAT contract is 0xe012d0f34cde9b870e9d9ed566ea5f8fd9b92228. polse.us is an earlier domain Huntress links to the same registrant. Microsoft seized it in Operation Endgame as StealC hosting. It is not a host of the July installer. An April 2026 Docker Hub fake Docker Desktop used the same libcef.dll sideload. The registrant email is omitted. ExaTrack's 5 November 2026 post is the source for the VMLoader and GPULoader names, the Defender exclusion command, the scheduled-task command, FakeGuard, the extra C2 addresses, and the second contract. Truncated wallet and contract prefixes in that post are not expanded. 216.126.227.160 is a docstring mention ExaTrack could not confirm in a contract or a hardcoded value, so it is not listed as a C2. ExaTrack discusses an old wallet topped up years earlier from a KYC exchange and says the wallet might have been stolen. No person is named here. The hash list below adds ExaTrack's published subset and remains incomplete."
