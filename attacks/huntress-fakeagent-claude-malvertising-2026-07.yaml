ai_role_detail: "A Bing ad and a public Claude Artifact impersonate Claude Desktop. Claude was not compromised. The payload is a conventional Windows RAT, so this is not credential theft aimed at an AI account and not an attacker using a model."
technique_summary: "Huntress (Michael Tigges, 22 July 2026) calls this campaign FakeAgent. Bing ads for a Claude Desktop download pointed at a public Claude Artifact, claude.ai/public/artifacts/ca456f1f-44c0-42af-b329-4f1c7534a877, which had about 7,100 views and the platform disclaimer that the content is user-generated and unverified. Anthropic had removed the artifact by the time the post was published. The artifact redirected to claude.ai.download-app.us and then downloading-api.it.com/html/claude/win, which served a fake ClaudeDesktop.exe. download-app.us was registered on 9 May 2026. ClaudeDesktop.exe is a signed JetBrains jcef_helper.exe, the same file Huntress also saw copied as DockerDesktop.exe for a scheduled task. It sideloads a VMProtect-packed libcef.dll. That DLL reads an Ethereum contract, downloads cache.dat, and the task keeps a copy under the EdgeUpdate install directory. A second stage, sslconf.exe, is a signed IBM SPSS binary that sideloads tempdir.dll. That DLL checks the GPU vendor and VRAM, skips QEMU and VMware, and decrypts appcfg.dat with a DirectX shader used as an AES-256-CTR routine. The embedded payload is SectopRAT, an HVNC .NET RAT. Its C2 address is stored on a BNB Smart Chain contract. Huntress observed the campaign against 29 organizations on 21 and 22 July 2026. The live C2 in the post is 2.24.131.246, with backup domain 5ca8758c-02d0-4a72-89c8-d468b66dda41.com."
initial_access: "Bing ads for a Claude Desktop download, leading to a public Claude Artifact and then a fake Windows installer."
