attack_flow:
  nodes:
    - id: ad
      title: Bing ad opens an artifact
      description: "An ad for a Claude Desktop download sends the visitor to a public Claude Artifact. The page is user-generated. Anthropic later removed it."
      kind: access
      source_urls:
        - https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat
    - id: redirect
      title: Artifact redirects to the installer
      description: "The artifact sends the browser to claude.ai.download-app.us and then to downloading-api.it.com, which serves the fake ClaudeDesktop.exe."
      kind: ai
      source_urls:
        - https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat
    - id: sideload
      title: VMLoader sideloads and persists
      description: "The signed JetBrains binary sideloads libcef.dll, which ExaTrack names VMLoader. It checks the GPU, adds a Defender exclusion for C:\\Users, reads a BSC URL, and creates the MicrosoftEdgeUpdate logon task."
      kind: execution
      source_urls:
        - https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat
        - https://www.exatrack.com/publications/sectoprat-gpuloader.html
    - id: rat
      title: GPULoader decrypts SectopRAT
      description: "tempdir.dll, which ExaTrack names GPULoader, decrypts its companion only on a real GPU. SectopRAT then reads C2 from contract 0xe012d0f34cde9b870e9d9ed566ea5f8fd9b92228. Huntress's live address is 2.24.131.246. ExaTrack records 2.24.128.29 on 25 July."
      kind: impact
      source_urls:
        - https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat
        - https://www.exatrack.com/publications/sectoprat-gpuloader.html
    - id: fakeguard
      title: Optional FakeGuard banking proxy
      description: "siteguard.exe is optional. It installs a local CA and a Chrome extension and proxies banking traffic. ExaTrack assesses this add-on as model-generated. That claim is vendor-asserted. VMLoader and GPULoader are not."
      kind: impact
      source_urls:
        - https://www.exatrack.com/publications/sectoprat-gpuloader.html
  edges:
    - source: ad
      target: redirect
    - source: redirect
      target: sideload
    - source: sideload
      target: rat
    - source: sideload
      target: fakeguard
      label: optional stage-2 file
