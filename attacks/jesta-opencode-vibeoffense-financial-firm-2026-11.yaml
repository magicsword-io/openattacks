victims_and_sectors: "One unnamed major financial-services firm, a Jesta customer. Jesta says the firm's real system refused the first request, later traffic was on a decoy, and nothing real was taken."
regions:
  - unknown
region_notes: "Jesta does not name the customer or a victim country. Bucharest, DIGI Romania, and AS8708 are the source of the traffic, not a victim region."
attribution_or_cluster: "Unnamed operator. Jesta attributes the session to its own logs and does not name a person or a group."
scale_and_metrics: "One source address, one session, 5 minutes and 44 seconds, from 4:24:57 a.m. ET to 4:30:41 a.m. ET on 16 November 2026. Jesta flagged it 64 seconds in. Three clients from that address. Three key variations in under 10 seconds. Three submit attempts. No return visit. No stolen customer data."
prevention_angle: "A blocklist of known addresses would not have seen this source. Jesta says it was absent from the threat feeds the customer had. Watch web logs for OpenCode-User/1.0, for Chrome 157 switching to the Pixel 10 preset from the same source, and for curl/8.7.1 from that source in the same few minutes. Treat a client that follows a link present only inside an API document, and a burst that tries a presented key, no key, and a same-length fake key, as an agent session. A decoy or honeytoken API document is what let Jesta classify this one. Older OpenCode builds send a Chrome 143 user agent instead of OpenCode-User/1.0, so the client name is not required for the behavioral checks."
related_magicsword_projects: []
source_notes: "The timestamps, user agents, status codes, the 64-second flag, the 66 seconds before the OpenCode user agent, the planted key, the decoy /openapi.json, the masked source address, and the statement that nothing real was taken are from Jesta. The Register reports the same session and says Jesta and the customer disclosed it to law enforcement. The Register's article calls the operator a Romanian hacker because the address is in Bucharest. Jesta does not name the person and does not state a nationality. The schema has no related-attack field. opencode-mcp-oauth-rce-2026-10 is a different case: a vulnerability in opening an MCP OAuth URL, not this operator pointing OpenCode at a customer site. Customer names, hosts, and the body of the decoy are redacted in the sources and are not reconstructed here."
