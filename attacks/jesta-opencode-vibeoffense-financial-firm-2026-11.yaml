attack_flow:
  nodes:
    - id: step-1
      title: Front page refuses Chrome on a Mac
      description: "At 4:24:57 a.m. ET on 16 November 2026, one IPv6 address in Bucharest requests the front page with Chrome 157 on a Mac. The customer system returns 403."
      kind: access
      source_urls: &a1
        - https://jesta.ai/blog/vibeoffense
        - https://www.theregister.com/security/2026/11/24/an-ai-coding-agent-a-browser-and-a-mac-tool-found-a-financial-firms-access-key-in-under-6-minutes/5311922
    - id: step-2
      title: A decoy API document answers
      description: "The same Chrome switches to the Pixel 10 mobile preset and is refused. The API description is refused. /openapi.json on a second address answers. That address is a Jesta decoy."
      kind: access
      source_urls: *a1
    - id: step-3
      title: Jesta flags an AI agent
      description: "The client follows a link that exists only in the API document. At 4:26:01 a.m. ET, 64 seconds in, Jesta marks the visitor as an AI agent. A later request sends the OpenCode-User/1.0 user agent. The model is unknown."
      kind: ai
      source_urls: *a1
    - id: step-4
      title: curl tests a planted key three ways
      description: "curl/8.7.1 sends four session messages in 13 seconds, then within 10 seconds tries the planted key, no key, and a same-length fake key. The decoy accepts the planted key and refuses the other two."
      kind: execution
      source_urls: *a1
    - id: step-5
      title: Three submit attempts, then it stops
      description: "The client makes three submit attempts. Two use a path with a double slash and get 404. The third fixes the path and uses GET on a submit-only endpoint and gets 405. The last request is at 5 minutes 44 seconds. Nothing real is taken."
      kind: impact
      source_urls: *a1
  edges:
    - source: step-1
      target: step-2
    - source: step-2
      target: step-3
    - source: step-3
      target: step-4
    - source: step-4
      target: step-5
