ai_role_detail: "Jesta identified OpenCode from one web-fetch request that sent the client name OpenCode-User/1.0. Jesta does not know the model. Jesta says the browser may have been the agent or a person working beside it."
technique_summary: "Lior Finkelshtein (Jesta, 24 November 2026) and Jessica Lyons (The Register, 24 November 2026) describe one session against a live system of an unnamed major financial-services firm that is a Jesta customer. On 16 November 2026 at 4:24:57 a.m. ET, a single IPv6 address in Bucharest, on a DIGI Romania business line (AS8708), requested the front page with Chrome 157 on a Mac. The site refused it. Six seconds later the same address presented Chrome's built-in Pixel 10 mobile preset and was refused again. It then asked for an API description and was refused. Five seconds later it requested /openapi.json on a second address. That address was a Jesta decoy, and it answered. Thirteen seconds later the client followed a link that exists only inside that document. At 4:26:01 a.m. ET, 64 seconds after the first request, Jesta marked the visitor as an AI agent and opened a case. From that point the customer system was no longer what the client was touching. Everything after the flag was content Jesta had set up, including the access key the client found. At 4:27:07 a.m. ET one request fetched the API document again with user agent Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; OpenCode-User/1.0; +https://opencode.ai. Jesta says that string is OpenCode's web-fetch tool, that it is written into OpenCode's code, and that Jesta had already flagged the session 66 seconds before this request. Jesta does not know which model was connected. The same address also used the desktop Chrome 157 user agent, the Pixel 10 preset of that browser, and curl/8.7.1, the curl that ships with macOS 15 and later. Chrome 157 came out on 3 November 2026. No other tooling was installed. Jesta says a key seen in the browser appeared in a curl request about two minutes later, and a second key seen first on the command line appeared in the browser about a minute after that. Jesta says it cannot tell whether the browser was driven by the agent or by a person clicking while the agent used the terminal. With the planted key, the client switched to curl. It sent four session messages in 13 seconds, then tested the key three ways in under 10 seconds: the planted key, no key, and a made-up key of the same length, deadbeefdeadbeefdeadbeef. The fake key was sent in the same second as the request with no key. Each try had a read of the API document between it. The planted key was accepted by the decoy. The other two were refused. About a minute later the client returned to the browser and made three submit attempts. The first built a path with two slashes and received 404. Six seconds later it sent that same path from the phone preset and received 404. Fourteen seconds later it corrected the path and used GET on an endpoint that only accepts submissions, and received 405. That last request was at 4:30:41 a.m. ET, 5 minutes and 44 seconds after the first request. The address has not returned. Jesta says nothing real was taken, the customer's system refused the first request, and none of the threat feeds it checked knew the address. Jesta and the customer reported the case to law enforcement. OpenCode is https://github.com/anomalyco/opencode. This is not opencode-mcp-oauth-rce-2026-10. That entry is a vulnerability in how OpenCode opened an MCP OAuth URL. This entry is an operator pointing OpenCode at a customer's site."
initial_access: "An operator pointed OpenCode at a live system of a Jesta financial-services customer. The front page and the API description refused the client. A Jesta decoy at /openapi.json answered, and the client followed a link that exists only in that document."
