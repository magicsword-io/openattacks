detections:
  - name: OpenCode client name, Pixel 10 preset switch, and key variation
    format: guidance
    notes: "security-detections-mcp searches for OpenCode, openapi, user-agent, curl, and macOS curl returned no Sigma, Splunk, or Elastic rule that matches this session. Web Server Suspicious User Agent Requests matches a fixed scanner list (nikto, sqlmap, gobuster, and similar) and does not include OpenCode-User/1.0, Chrome/157.0.0.0, or curl/8.7.1. HTTP Scripting Tool User Agent and HTTP Malware User Agent depend on Splunk lookups of known tool and malware user agents. Those lookups are not published as a match for OpenCode-User/1.0, and this entry does not treat them as coverage. Shell Evaluated Curl Downloaded Content on macOS requires a shell -c command that evals curl output. This session's curl sent API requests. It did not eval a download. Suspicious Curl from macOS Application requires curl spawned from an application in /Applications toward a raw IP. Jesta's curl/8.7.1 is the system curl on the operator's Mac, seen in the customer's web log, and the destinations were redacted. GenAI CLI Started with Unsafe Permission Bypass matches an opencode process only when it is started with --dangerously-skip-permissions. Jesta does not report that flag. The customer's evidence is the web log. Hunt one source that, within minutes, sends the desktop Chrome 157 user agent, then Mozilla/5.0 (Linux; Android 16; Pixel 10) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/157.0.0.0 Mobile Safari/537.36, then curl/8.7.1, or that sends Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; OpenCode-User/1.0; +https://opencode.ai. Older OpenCode versions send a Chrome 143 user agent instead. Also hunt a client that follows a URL present only in an API document, and a burst that retries one request with the presented key, with no key, and with a same-length fake key such as deadbeefdeadbeefdeadbeef."
