ai_role_detail: "CSIRT Italia says the campaigns used ARTEX, CyberStrikeAI, DeepSeek Harness in Red Team Mode, and PentAGI. The DeepSeek Harness write-up is the bulletin's worked example of the jailbreak and the six-agent layout."
technique_summary: "CSIRT Italia bulletin BL01/261123/CSIRT-ITA, version 2.0, 23 November 2026, says the agency saw mass compromise campaigns in Italy run by autonomous AI agents. The tools it names in those campaigns are ARTEX, CyberStrikeAI, DeepSeek Harness with a Red Team Mode plugin, and PentAGI. For DeepSeek Harness, ACN describes an open-source agent framework pointed at DeepSeek's cloud model. A Markdown system prompt, which ACN calls prompt injection, frames the work as a scored team exercise in a controlled environment so the model accepts requests it would otherwise refuse. The layout ACN describes has six agents: a coordinator that plans and assigns work, plus agents for information gathering, asset reconnaissance and classification, vulnerability finding, exploitation, and penetration and persistence. The operator supplies a subnet and plain-language instructions in a web UI, and can exclude hosts, add constraints, or stop the agents. From that subnet the agents reconnoiter, prefer known vulnerabilities and unauthenticated interfaces, then can set up tunnels and remote-control components and use the compromised host to reach internal systems and networks beyond the original scope. ACN says that in the campaigns it watched, the agents also wrote malicious code in real time to get past endpoint defenses, chained low-impact flaws and misconfigurations, and in directly observed cases compromised a large number of systems within a few hours with agents running in parallel. ACN publishes daily MISP feeds for Artex, CyberStrike, PentAGI, DeepSeek Harness, Redamon, CAIRN, and HexStrike infrastructure, plus YARA rules, open-proxy and Tor exit lists. It tells organizations to prioritize the CVEs listed in the bulletin. BleepingComputer (Bill Toulas, 25 November 2026) reports the bulletin alongside a Swiss NCSC warning about the first AI-agent compromises that center had received. That Swiss notice is separate reporting and is not evidence for the Italian campaigns. Cybersecurity Trends (24 November 2026) restates the bulletin."
initial_access: "Exploitation of known vulnerabilities and unauthenticated interfaces on exposed systems. ACN does not name the vulnerabilities in the public summary used here, and it points defenders to the CVE list in the bulletin."
