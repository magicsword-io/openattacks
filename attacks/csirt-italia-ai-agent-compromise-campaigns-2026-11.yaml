detections:
  - name: Web Server Discovery or Fuzzing Activity
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/reconnaissance_web_server_discovery_or_fuzzing_activity.toml
    notes: "Web access logs. A burst of GET requests from one source that return 404 or 403. Matches the reconnaissance of exposed applications ACN describes. It does not identify ARTEX, CyberStrikeAI, PentAGI, or DeepSeek Harness."
  - name: Web or Application Server Spawning a Shell
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/web_or_application_server_spawning_a_shell.yml
    notes: "Process creation. A shell started by a web or application server process. Matches follow-on execution after an exposed application is compromised. ACN does not publish the process names, so this is a class rule, not a campaign signature."
  - name: Path Traversal Exploitation Attempts
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_path_traversal_exploitation_attempt.yml
    notes: "Web server logs. A small set of traversal strings in the query. ACN says the agents exploit known vulnerabilities on exposed systems and does not publish the request strings, so this is a class rule for that activity. A hit is not evidence of these campaigns."
  - name: No public rule for the named frameworks or the MISP indicators
    format: guidance
    notes: "security-detections-mcp searches on 26 November 2026 did not return a Sigma, Splunk, or Elastic rule that names ARTEX, CyberStrikeAI, PentAGI, or DeepSeek Harness. The indicators are in daily MISP feeds, not on the public page, so none were searched as IOC tokens. ACN does not name the tunnel software, so tunnel-tool rules are not cited. The real-time code ACN describes has no stable command line in the bulletin."
