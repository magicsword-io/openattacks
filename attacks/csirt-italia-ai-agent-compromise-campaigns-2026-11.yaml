attack_flow:
  nodes:
    - id: prompt
      title: Markdown prompt and six agents
      description: "DeepSeek Harness, as ACN describes it, ships a Markdown system prompt that frames the work as a scored team exercise so the cloud model accepts requests it would refuse. Six agents run under a coordinator: information gathering, asset reconnaissance and classification, vulnerability finding, exploitation, and penetration and persistence."
      kind: ai
      source_urls:
        - https://www.acn.gov.it/portale/w/impiego-di-agenti-di-ia-in-campagne-di-compromissione-automatizzate
    - id: task
      title: Operator sets a subnet in the web UI
      description: "The operator gives a subnet and plain-language instructions in a web UI, and can exclude hosts, add constraints, or stop the agents. ACN also names ARTEX, CyberStrikeAI, and PentAGI as tools used in the campaigns. It does not say every campaign used this DeepSeek Harness layout."
      kind: access
      source_urls:
        - https://www.acn.gov.it/portale/w/impiego-di-agenti-di-ia-in-campagne-di-compromissione-automatizzate
    - id: exploit
      title: Known flaws and open interfaces first
      description: "From the assigned subnet the agents reconnoiter, judge what can be compromised, and prefer known vulnerabilities and interfaces that do not require authentication."
      kind: execution
      source_urls:
        - https://www.acn.gov.it/portale/w/impiego-di-agenti-di-ia-in-campagne-di-compromissione-automatizzate
    - id: pivot
      title: Tunnels and scope beyond the subnet
      description: "After a host is compromised, the system can set up tunnels and remote-control components and use that host to reach internal systems. ACN says the activity can continue into networks the operator did not name."
      kind: execution
      source_urls:
        - https://www.acn.gov.it/portale/w/impiego-di-agenti-di-ia-in-campagne-di-compromissione-automatizzate
    - id: adapt
      title: Code written during the intrusion
      description: "In the campaigns ACN watched, the agents chained misconfigurations and low-impact flaws and wrote malicious code in real time to get past endpoint defenses. ACN says some directly observed cases compromised a large number of systems within a few hours."
      kind: impact
      source_urls:
        - https://www.acn.gov.it/portale/w/impiego-di-agenti-di-ia-in-campagne-di-compromissione-automatizzate
  edges:
    - source: prompt
      target: task
    - source: task
      target: exploit
    - source: exploit
      target: pivot
    - source: pivot
      target: adapt
