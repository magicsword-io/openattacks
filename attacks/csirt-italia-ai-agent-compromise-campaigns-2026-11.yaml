region_notes: "Italy is the country where CSIRT Italia says it saw the campaigns. The actor's country is not stated. BleepingComputer also summarizes a Swiss NCSC warning. Those Swiss victims belong to that separate notice, not to this bulletin."
attribution_or_cluster: "Unnamed operators. CSIRT Italia does not name a group, a country, or a motive."
scale_and_metrics: "Bulletin BL01/261123/CSIRT-ITA, version 2.0, dated 23 November 2026. No victim count is published. ACN says some directly observed cases compromised a large number of systems in a few hours, with agents working in parallel and without a human in the loop between steps."
prevention_angle: "Patch internet-exposed systems and take unpatched ones off the internet until they are updated. Remove management consoles, admin APIs, and CI/CD interfaces from direct exposure. Use least privilege, MFA on interactive access, and short-lived credentials for workloads. Segment exposed hosts and limit their outbound traffic. Watch identity, API, and data-access sequences, because ACN says single events look like normal use. ACN's MISP feeds are daily and each indicator is valid only for the timeframe in its comment. ACN says not every indicator is malicious and that it is not responsible for blocklisting them."
related_magicsword_projects: []
source_notes: "The narrative is from bulletin BL01/261123/CSIRT-ITA, version 2.0, 23 November 2026. Indicators of compromise are in the MISP feeds, not on the public bulletin page, so none are copied here. ACN says infrastructure changes quickly, some servers run briefly on known CDNs, and an indicator is valid only for the timeframe in its comment. ACN also says not every indicator is malicious. ACN does not name which Red Team Mode plugin repository was used, so none is linked. The MISP feed list also names Redamon, CAIRN, and HexStrike infrastructure. The bulletin's list of tools used in the campaigns is ARTEX, CyberStrikeAI, DeepSeek Harness in Red Team Mode, and PentAGI. BleepingComputer is the source for the Swiss NCSC summary. There is no Swiss NCSC entry in this catalog to cross-reference. Cybersecurity Trends restates ACN and is not an independent count."
