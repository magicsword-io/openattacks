ai_role: attacker_uses_ai_as_operator
ai_role_secondary: ai_credential_theft
ai_role_detail: Threat actors use ARTEX autonomous agent framework to mass-query GitHub
  for exposed credentials, authenticate as Azure Entra service principals, and autonomously
  enumerate and exfiltrate Azure Key Vault secrets, storage keys, App Service settings,
  AKS credentials, SharePoint/OneDrive data, and Azure AI/Foundry keys within minutes
technique_summary: Microsoft Threat Intelligence (Nov 5, 2026) reports unattributed
  cloud-credential harvesting campaign using ARTEX autonomous agent framework. Attackers
  conduct mass GitHub secret searches querying organization names, cloud keywords
  (Azure, AWS, Entra, Key Vault), and AI provider keys. ARTEX agents authenticate
  as compromised Azure Entra service principals, then autonomously enumerate and exfiltrate
  Azure Key Vault secrets, storage account keys, App Service configuration settings,
  AKS cluster credentials, SharePoint/OneDrive files, Microsoft Graph queries, Azure
  AI Studio keys, and Azure Foundry credentials within approximately 5 minutes per
  compromised tenant. Agents feature adaptive retry logic that automatically corrects
  Azure Resource Manager API version errors on failed calls, demonstrating autonomous
  error recovery. Campaign operates from IPs 199.19.77.84, Tor exit 199.19.77.18,
  65.87.223.26, and 157.22.126.128. Microsoft notes median dwell time of 8 minutes
  from initial service principal authentication to complete key-vault enumeration,
  indicating highly automated credential-harvesting workflow targeting cloud and AI
  infrastructure. VulnCheck (Patrick Garrity, Nov 8, 2026) reports 199.19.77.84 hit
  VulnCheck canaries Nov 7 exploiting CVE-2025-3248 (Langflow /api/v1/validate/code
  endpoint). Agent staged Python using @exec decorator, _lf_probe() wrapper function,
  and |RAISE| exception-based exfiltration channel; dumped env/.env files and langflow.db;
  checked Docker socket and cloud metadata endpoint 169.254.169.254; grepped for sk-,
  AIza, AKIA key patterns; read mem0 configuration; decrypted Langflow Fernet-encrypted
  variables. Linked to Microsoft campaign via shared IP 199.19.77.84; vendor-asserted
  AI involvement (VulnCheck notes network traffic alone cannot definitively prove
  agent autonomy).
initial_access: Exposed credentials in public GitHub repositories; compromised Azure
  Entra service principal credentials
ai_tooling_and_models:
  - ARTEX autonomous agent framework (https://github.com/RuoJi6/ARTEX)
  - LLM-driven Azure API enumeration with adaptive retry
  - Langflow (https://github.com/langflow-ai/langflow) - targeted for credential theft
    via CVE-2025-3248
frameworks:
  - artex
other_tooling:
  - GitHub API for secret search
  - Azure Resource Manager API
  - Microsoft Graph API
  - Tor network for anonymization
victims_and_sectors: Organizations with exposed Azure service principal credentials
  on GitHub; targets include AI/ML development teams, cloud infrastructure operators,
  and enterprises using Azure AI Studio / Foundry
regions:
  - Multiple regions
attribution_or_cluster: Unattributed activity cluster; Microsoft Threat Intelligence
  notes related infrastructure observed by Todyl; cloud and AI credential harvesting
  for follow-on cybercrime operations
scale_and_metrics: Active Nov 2026; median 8-minute dwell time from service principal
  authentication to complete Key Vault enumeration; ~5 minutes per tenant for full
  credential exfiltration; campaign IPs observed across multiple tenants
prevention_angle: Scan public repositories for accidentally committed Azure credentials;
  implement Azure AD Conditional Access policies requiring managed device or IP restrictions
  for service principals; enable Azure Key Vault firewall and private endpoints; activate
  Microsoft Defender for Cloud Apps for anomalous Graph API usage; rotate service
  principal secrets regularly; use managed identities instead of service principal
  passwords where possible; monitor for rapid sequential ARM API calls and Key Vault
  enumeration patterns; implement Azure Sentinel detections for service principal
  authentication from Tor exits or VPN/proxy infrastructure
