detections:
- name: Entra ID Device with ROADtools Default OS Build
  format: elastic
  url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/entityanalytics_entra_id/persistence_entra_id_device_roadtools_default_os_build.toml
  notes: Detects anomalous Entra ID device registration patterns; relevant for detecting
    unauthorized service principal usage
- name: Entra ID Protection - Risk Detection - Sign-in Risk
  format: elastic
  url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/azure/initial_access_entra_id_protection_sign_in_risk_detected.toml
  notes: Detects Entra ID sign-in risk events; directly applicable to ARTEX campaign
    service principal authentication from Tor/VPN
- name: Azure Key Vault secret enumeration monitoring
  format: guidance
  notes: Monitor for rapid sequential Key Vault secret list/get operations; alert
    on service principal authentication from Tor exit nodes (199.19.77.18) or known
    VPN/proxy IPs; detect ARM API calls with version-correction retry patterns (ARTEX
    adaptive error recovery); flag Graph API queries for all users/applications from
    single service principal; monitor for SharePoint/OneDrive bulk access from service
    principals; alert on Azure AI Studio / Foundry key access from non-development
    IPs
- name: Microsoft Defender for Cloud Apps anomalous Graph API usage
  format: guidance
  notes: Enable Defender for Cloud Apps policies for unusual Graph API query volumes,
    service principal activity from unexpected geolocations, and rapid tenant enumeration
    patterns
