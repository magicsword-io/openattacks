technique_summary: Google ad for 'claude mac' lists bing.com, Bing click-tracking redirects through
  compromised retailer to fake Claude download. Page shows real Anthropic install command; Copy
  button swaps clipboard to decode lake-90.com URL and pipe into zsh (InstallFix). Dual cloaking on
  referrer.
initial_access: Malvertising + clipboard swap / paste into Terminal
ai_tooling_and_models:
  - Fake Claude download / InstallFix lure
other_tooling:
  - Google Ads
  - Bing ck/a redirect
  - zsh/curl pipe
victims_and_sectors: macOS users searching for Claude
regions:
  - unknown
attribution_or_cluster: Push AcSig ClickFix toolkit family
scale_and_metrics: unknown
prevention_angle: Check pasted commands; do not pipe remote scripts into shell
