attack_flow:
  nodes:
    - id: step-1
      title: Search ad redirects
      description: An ad for Claude on Mac redirects through tracking and a compromised
        retailer to a fake download page.
      kind: access
      source_urls: &id001
        - https://pushsecurity.com/blog/adception-malvertising-another-search-engines-search-results
    - id: step-2
      title: Claude branding earns trust
      description: The page displays a real-looking Anthropic installation command.
      kind: ai
      source_urls: *id001
    - id: step-3
      title: Clipboard command is swapped
      description: The Copy button substitutes a command that decodes a different download
        URL and pipes content to zsh.
      kind: execution
      source_urls: *id001
    - id: step-4
      title: Victim runs attacker content
      description: Pasting the copied command into Terminal runs attacker-supplied content.
      kind: impact
      source_urls: *id001
  edges:
    - source: step-1
      target: step-2
    - source: step-2
      target: step-3
    - source: step-3
      target: step-4
