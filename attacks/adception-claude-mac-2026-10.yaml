technique_summary: Google ad for claude mac lists bing.com, Bing click-tracking redirects
  through compromised retailer to fake Claude download. Page shows real Anthropic
  install command; Copy button swaps clipboard to decode lake-90.com URL and pipe
  into zsh (InstallFix). Dual cloaking on referrer. Mate Research (Nadav Lorber) documents
  full attack chain - clipboard swap Copy button triggers base64 curl pipe to zsh,
  AES-CTR zsh stager, beacon to /api/metrics/run?event=pasted|stager, AMOS infostealer
  exfiltration to 152.42.143.45, root backdoor via LaunchDaemons com.apple.accountsd.helper
  and com.apple.metadata.mds.worker. Signed DMG served from claude-desktop.com as
  Claude.dmg with Developer ID OSMAN ASTUR; jsDelivr note points to anchorpost13.com.
  Google Ads campaign 24303764142 served via claude-desk-code.com, promotion-chatgpt.com,
  lake-90.com. PasteSwitch toolkit family, unattributed.
initial_access: Malvertising + clipboard swap / paste into Terminal
ai_tooling_and_models:
  - Fake Claude download / InstallFix lure
other_tooling:
  - Google Ads campaign 24303764142
  - Bing ck/a redirect
  - zsh/curl pipe with base64 encoding
  - AES-CTR zsh stager
  - AMOS infostealer
  - LaunchDaemons persistence (com.apple.accountsd.helper, com.apple.metadata.mds.worker)
  - Signed DMG (Developer ID OSMAN ASTUR)
  - PasteSwitch toolkit
