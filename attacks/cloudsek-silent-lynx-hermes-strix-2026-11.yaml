victims_and_sectors: "Tajikistan national railway and the national electronic document platform, including defence correspondence. Uzbekistan Smart Forestry geospatial platform. Turkmenistan Railways and Ahal administration lures were built and tested. Kyrgyzstan implant builds were on the server. Government and transport."
regions:
  - Tajikistan
  - Uzbekistan
  - Turkmenistan
  - Kyrgyzstan
region_notes: "Tajikistan and Uzbekistan are intrusions CloudSEK describes from the server. Turkmenistan is lures tested in October, not a confirmed compromise. Kyrgyzstan is a per-target implant build on the server. Armenia and Pakistan appear as further targets in the agent memory, not as confirmed intrusions, and are not listed here. Kazakhstan is the assessed operator nexus, not a victim region."
attribution_or_cluster: "Silent Lynx. CloudSEK cites the vendor names UAT-6275 (Cisco Talos) and TAG-193 (Recorded Future). High confidence the server is a Silent Lynx operator. Medium confidence on the Kazakhstan nexus. The Record also uses the names Cavalry Werewolf and YoroTrooper; CloudSEK's background table describes overlaps with those names, not identity."
scale_and_metrics: "Directory contents span April to October 2026. Railway domain access from mid-August to at least 10 October 2026. More than 2,000 government documents described. More than a dozen gigabytes on the open directory. No victim-organization count beyond the named networks."
prevention_angle: "Treat shortcut files and ISO or ZIP lures that launch hidden PowerShell and download a script as initial access. Alert on IEX with DownloadString, on new Ligolo tunnels, and on PostgreSQL COPY FROM PROGRAM. The published hashes, 89.125.213[.]123, foreverpeace[.]ru, and the P.ps1 and decoy.pdf URLs are hunt indicators. An autonomous agent with heredoc and SQL DROP pre-approved, plus a Telegram gateway on an operator server, is not visible in the victim's model logs. Review government SSO accounts that can read documents outside their agency."
related_magicsword_projects: []
source_notes: "IPs, URLs, hashes, the Strix configuration table, the Telegram display name, and the DESKTOP-S3MHLFV\\nemo test host are from the CloudSEK article. The Record is a 12 November 2026 recap and adds that the research does not establish a Kazakh government link. Hermes Agent is linked because the public repository matches the Telegram gateway, cron, sub-agents, and OpenRouter use CloudSEK describes. CloudSEK did not publish that URL. Link hermes-operators-campaigns-2026 for other public Hermes-operator reporting. CloudSEK says the same harness and model family appeared in its earlier Gentlemen affiliate investigation and that the two operators are unrelated. inc-gentlemen-ransomware-ai-2026-10 is a separate SOCRadar report about OpenCode, Claude, and Kimi, not that CloudSEK investigation. The old Hermes URL github.com/Hermes-Autonomous-Intelligence/hermes returned HTTP 404 on 18 November 2026 and is not used."
