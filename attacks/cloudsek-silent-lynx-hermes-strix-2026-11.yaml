ai_role_detail: "CloudSEK recovered the agent's config, persona, memory, conversation database, and Telegram gateway logs on the exposed server. The operator tasked Hermes, branded Strix, in Russian, including from a phone."
technique_summary: "CloudSEK TRIAD (11 November 2026) found a Debian VPS at 89.125.213[.]123, on Baxet Group, serving files on port 8088 without authentication. The directory held tooling, victim data, and a .hermes/ tree with agent state, memory, persona, scripts, and logs from April through October 2026. CloudSEK assesses with high confidence that the server belongs to a Silent Lynx operator, from implant code markers and build paths that match published Laplas and Chvost samples, and with medium confidence a Kazakhstan nexus: Russian-language operation, the operator's test traffic from a residential Kazakhtelecom line, and working hours on UTC+5. That matches earlier Cisco Talos (UAT-6275) and Recorded Future (TAG-193) assessments. CloudSEK says the collection priorities are regional intelligence gathering, not a financial motive. The Record (Daryna Antoniuk, 12 November 2026) covers the same report and says the findings do not establish a connection to the Kazakh government. The operator ran much of the work through Hermes, an open-source agent framework, branded Strix. CloudSEK does not publish a repository URL. The public project that matches the described Telegram gateway, cron, delegation, and OpenRouter routing is https://github.com/NousResearch/hermes-agent. The primary model was DeepSeek V4.1 Flash via OpenRouter, with Gemini 2.5 Flash for sub-agents. Heredoc shell execution and SQL DROP were allowlisted without confirmation, the tool-loop hard stop was off, and unsafe browser JavaScript evaluation was on. Toolsets were terminal, computer use, browser, cron, delegation, a task board, and Telegram. The persona told the agent to drop safety disclaimers and favour low-noise techniques. The operator tasked it in Russian. The Telegram gateway let the operator send tasks from a phone. CloudSEK says the gateway logs tie inbound commands to one Telegram user, display name Марат, and quotes a 2 October test-shell announcement. The agent analysed recon output, continued collection from a handoff file that described the railway electronic-document login chain, and wrote a report on access to the railway's upstream ISP. In early October it shredded shell histories, vacuumed databases, cleared cron rows, and zeroed login records. Its memory told it to pull a secret and use it inside a single shell command so Hermes token redaction would not apply. Intrusions CloudSEK describes: domain-level access to Tajikistan's national railway from mid-August to at least 10 October 2026, with a Ligolo tunnel and more than 2,000 government documents including defence correspondence, reached through one railway employee's government SSO account; webshell and database access to Uzbekistan's Smart Forestry GeoServer, including PostgreSQL COPY FROM PROGRAM and cron callbacks; Kyrgyzstan implant builds on the server; and Turkmenistan Railways and Ahal administration lures built and tested in October, which CloudSEK treats as an upcoming campaign rather than a confirmed intrusion. The agent's memory also records Armenian government networks filtering the operator and an October 2026 engagement against Pakistan's Ministry of Foreign Affairs and its national telecom provider. Delivery was LNK and archive lures that launch PowerShell, fetch P.ps1 from hxxp://89.125.213[.]123:8080/P.ps1, and open a raw TCP shell. The final shortcut variant uses IEX (DownloadString). An AMSI-bypass variant sets amsiInitFailed before the download. Implants are Laplas (srvdriv.exe) and Chvost (ssdpdrv.exe), plus service wrappers. Tools on the server include fscan (https://github.com/shadow1ng/fscan), Ligolo-ng (https://github.com/nicocha30/ligolo-ng), GOST (https://github.com/go-gost/gost), Inveigh (https://github.com/Kevin-Robertson/Inveigh), Responder (https://github.com/lgandx/Responder), NetExec (https://github.com/Pennyw0rth/NetExec), and Impacket (https://github.com/fortra/impacket). Infrastructure includes foreverpeace[.]ru for a NetBird control plane and a Pangolin proxy, and 134.17.14[.]24 as a cron callback whose ownership CloudSEK does not confirm. The operator test host in the logs is DESKTOP-S3MHLFV\\nemo. CloudSEK says the same harness and model family appeared in its earlier Gentlemen affiliate investigation and that those two operators are unrelated."
initial_access: "LNK, ZIP, password-protected archive, or ISO lures launch hidden PowerShell, which downloads P.ps1 and opens a raw TCP shell. Separate intrusions used a railway employee SSO account and a GeoServer webshell."
