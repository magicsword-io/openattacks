attack_flow:
  nodes:
    - id: lure
      title: LNK and archive lures
      description: "A PDF-themed shortcut in a ZIP, password-protected archive, or ISO opens a decoy and starts hidden PowerShell. One variant bypasses AMSI first."
      kind: access
      source_urls:
        - https://www.cloudsek.com/blog/off-the-rails-inside-an-exposed-silent-lynx-server
    - id: powershell
      title: P.ps1 opens a TCP shell
      description: "PowerShell downloads P.ps1 from the operator server and runs commands with Invoke-Expression. Laplas and Chvost implants call back over TLS."
      kind: execution
      source_urls:
        - https://www.cloudsek.com/blog/off-the-rails-inside-an-exposed-silent-lynx-server
    - id: strix
      title: Hermes agent Strix
      description: "On the operator server, Strix uses DeepSeek V4.1 Flash and Gemini 2.5 Flash. The operator tasks it in Russian over the Telegram gateway. Destructive commands are pre-approved."
      kind: ai
      source_urls:
        - https://www.cloudsek.com/blog/off-the-rails-inside-an-exposed-silent-lynx-server
    - id: collect
      title: Railway, forestry, and cleanup
      description: "Domain access on the Tajik railway, document collection, and a Smart Forestry webshell. In early October the agent shreds histories and clears logs. The exposed directory remained."
      kind: impact
      source_urls:
        - https://www.cloudsek.com/blog/off-the-rails-inside-an-exposed-silent-lynx-server
  edges:
    - source: lure
      target: powershell
    - source: powershell
      target: strix
    - source: strix
      target: collect
