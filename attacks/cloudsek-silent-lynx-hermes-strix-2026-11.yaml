detections:
  - name: PowerShell Download and Execution Cradles
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_download_iex.yml"
    notes: "Windows process creation. Command lines that both download and invoke expression, including IEX and DownloadString. CloudSEK says the final shortcut runs hidden PowerShell with IEX (DownloadString) of P.ps1. A renamed download cmdlet, or a command line that never hits the process-creation log, will not match."
  - name: Implants, the tunnel, and the operator-side agent
    format: guidance
    notes: "Also hunt the published SHA-256 values, connections to 89.125.213[.]123 including port 8080 for P.ps1 and decoy.pdf and the TCP shell, and foreverpeace[.]ru. Strix ran on the operator server. Victim logs do not show the DeepSeek or Gemini calls. No public rule cited here names Laplas, Chvost, or srvdriv.exe."
