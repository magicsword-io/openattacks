detections:
  - name: Unusual LD_PRELOAD/LD_LIBRARY_PATH Command Line Arguments
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_ld_preload_cmdline.toml"
    notes: "Linux. A command line that sets LD_PRELOAD. Matches soffice.py when the env assignment is visible on the command line. It does not match a library path that exists only inside the Python process."
  - name: Unusual Preload Environment Variable Process Execution
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_unusual_preload_env_vars.toml"
    notes: "Linux. A process started with an unusual LD_PRELOAD or LD_LIBRARY_PATH. Matches the LibreOffice process the helper execs after setting the variable."
  - name: lo_socket_shim.so is not an ld.so.preload file edit
    format: guidance
    notes: "Rules for writes to /etc/ld.so.preload describe a different technique and are not cited. Hunt for lo_socket_shim.so under the temp directory, and for a compiler writing that file before soffice.py. Sigma has no rule for the LD_PRELOAD environment variable."
