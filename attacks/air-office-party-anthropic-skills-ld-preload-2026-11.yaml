      title: Document skill calls soffice.py
      description: "docx, pptx, and xlsx skills run scripts/office/soffice.py --headless --convert-to pdf. The docx skill does this for every document it writes."
      kind: ai
      source_urls:
        - https://www.air.security/blog-posts/office-party
    - id: preload
      title: Failed socket sets LD_PRELOAD
      description: "If the Unix socket cannot be opened, soffice.py sets LD_PRELOAD to tempfile.gettempdir()/lo_socket_shim.so with no ownership or content check."
      kind: execution
      source_urls:
