ai_role: ai_credential_theft
ai_role_secondary: ai_tool_as_lure
ai_role_detail: "Multiple adversary campaigns distributing malicious OpenClaw skills via fake repos and skill registries to steal AI credentials and deliver malware"
technique_summary: "Multiple 2026 campaigns targeting OpenClaw AI skill framework: (1) ClawHavoc (Koi, Feb 1): 23 malicious skills on fake GitHub repos and openclaw-skills[.]com registry; deliver AMOS infostealer (macOS) and Raccoon Stealer (Windows); skills named 'productivity-boost', 'code-optimizer', 'security-scanner'. Harvest Anthropic keys, OpenAI keys, GitHub tokens, AWS credentials, crypto wallets, browser cookies. 4,800+ downloads Feb-May 2026. (2) Unit 42 (Jun 23): Five malicious skills distributed via typosquat repos and SEO-poisoned blog posts; skills: 'api-connector-pro', 'github-integration-plus', 'llm-optimizer', 'data-processor-advanced', 'security-audit-tool'. Embedded Node.js credential harvesters + reverse shells. 2,100+ downloads identified. Both campaigns exploit OpenClaw's permissive skill installation (users can install from arbitrary URLs/repos). Detection: verify OpenClaw skill sources before install; review ~/.openclaw/skills/ for unexpected skills; check skill manifests for suspicious permissions (filesystem access, network egress, env var access); monitor for openclaw-skills[.]com domain; scan for AMOS/Raccoon indicators."
initial_access: "User installs malicious OpenClaw skill from fake GitHub repo, typosquat, or rogue skill registry (openclaw-skills[.]com)"
ai_tooling_and_models:
  - OpenClaw AI skill framework
  - Anthropic Claude API
  - OpenAI API
other_tooling:
  - AMOS infostealer (macOS)
  - Raccoon Stealer (Windows)
  - Node.js credential harvesters
  - Reverse shells
  - openclaw-skills[.]com rogue registry
victims_and_sectors: "ClawHavoc: 4,800+ downloads Feb-May 2026; Unit 42: 2,100+ downloads; AI developers using OpenClaw"
regions:
  - Multiple regions
attribution_or_cluster: "ClawHavoc campaign (unknown actor, Feb-May 2026); Unit 42 findings (unknown actor, Jun 2026); likely distinct campaigns with similar TTPs"
scale_and_metrics: "ClawHavoc 4,800+ downloads, Unit 42 2,100+ downloads; combined 6,900+ installations across both campaigns Jan-Jun 2026"
prevention_angle: "Only install OpenClaw skills from trusted sources; verify GitHub repo authenticity (org, stars, commit history); review skill manifest permissions before install; use allowlisted skill sources; monitor ~/.openclaw/skills/ for unexpected additions; implement endpoint security detecting AMOS/Raccoon; educate users on skill installation risks"
related_magicsword_projects: []
source_notes: "Koi Security ClawHavoc analysis; Unit 42 malicious skill report. OpenClaw skill framework allows arbitrary code execution with user permissions; no sandboxing or permission model as of mid-2026. Detection: monitor OpenClaw skill installations, alert on skills from unknown repos, check for openclaw-skills[.]com domain (rogue registry), scan for AMOS/Raccoon Stealer indicators, review skills with network egress or credential file access."
