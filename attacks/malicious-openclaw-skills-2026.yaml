technique_summary: "Multiple 2026 campaigns targeting OpenClaw AI skill framework: (1) ClawHavoc (Koi, Feb 1): 23 malicious skills on fake GitHub repos and openclaw-skills[.]com registry; deliver AMOS infostealer (macOS) and Raccoon Stealer (Windows); skills named productivity-boost, code-optimizer, security-scanner. Harvest Anthropic keys, OpenAI keys, GitHub tokens, AWS credentials, crypto wallets, browser cookies. 4,800+ downloads Feb-May 2026. (2) Unit 42 (Jun 23): Five malicious skills distributed via typosquat repos and SEO-poisoned blog posts; skills: api-connector-pro, github-integration-plus, llm-optimizer, data-processor-advanced, security-audit-tool. Embedded Node.js credential harvesters + reverse shells. 2,100+ downloads identified. (3) Cyera Research (Nov 3, 2026): Across 1M+ skills analyzed, 516 samples tied to AMOS campaign, including 70 confirmed-malicious exhibits active in September 2026 outside Hugging Face datasets. Every one of the 70 received A or B security grade on Skills Directory because automated grading evaluated SKILL.md only and ignored companion files and external paste relays. Fake openclaw-agent / ClawHub prerequisite lures (the skill will not work without openclaw-agent), OS-split instructions (base64 -D | bash with decoy echo swcdn.apple.com on macOS delivering AMOS; ZIP/EXE archives on Windows), 22 MB inflated README droppers. Primary payload C2 91.92.242.30 (83.7% of IP references), secondary IPs 5.42.65.10, 45.137.65.112, 185.234.72.19, 2.26.75.16. Domains: socifiapp.com, custom-registry.com, openclawskills.net, install.app-distribution.net, openclawcli.vercel.app, download.setup-service.com, laosji.net, letssendit.fun, monster-secure.site, vorderingenonline.com. Paste relays glot.io/snippets/hfdxv8uyaf, glot.io/snippets/hfd3x9ueu5, rentry.co/openclaw-code. Publisher handles: hightower6eu, Demerzels-lab, LJT-520, dexiaong, Ddoy233. Both campaigns exploit OpenClaw permissive skill installation (users can install from arbitrary URLs/repos). Detection: verify OpenClaw skill sources before install; review ~/.openclaw/skills/ for unexpected skills; check skill manifests for suspicious permissions; monitor for openclaw-skills[.]com and AMOS C2 91.92.242.30; scan for AMOS/Raccoon indicators; detect base64-decoded pipe to bash patterns."
initial_access: "User installs malicious OpenClaw skill from fake GitHub repo, typosquat, or rogue skill registry (openclaw-skills[.]com)"
