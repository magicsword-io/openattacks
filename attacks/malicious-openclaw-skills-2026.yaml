  - Reverse shells
  - openclaw-skills[.]com rogue registry
victims_and_sectors: "ClawHavoc: 4,800+ downloads Feb-May 2026; Unit 42: 2,100+ downloads; Cyera: 516 AMOS samples, 70 confirmed-malicious active Sep 2026; AI developers using OpenClaw"
regions:
  - Multiple regions
attribution_or_cluster: "ClawHavoc campaign (unknown actor, Feb-May 2026); Unit 42 findings (unknown actor, Jun 2026); likely distinct campaigns with similar TTPs"
scale_and_metrics: "ClawHavoc 4,800+ downloads, Unit 42 2,100+ downloads; Cyera analyzed 1M+ skills finding 516 AMOS-linked samples including 70 confirmed-malicious active in Sep 2026; primary C2 91.92.242.30 in 83.7% of IP references; combined campaign Jan-Nov 2026"
prevention_angle: "Only install OpenClaw skills from trusted sources; verify GitHub repo authenticity (org, stars, commit history); review skill manifest permissions before install; use allowlisted skill sources; monitor ~/.openclaw/skills/ for unexpected additions; implement endpoint security detecting AMOS/Raccoon; educate users on skill installation risks"
related_magicsword_projects: []
source_notes: "Koi Security ClawHavoc analysis; Unit 42 malicious skill report. OpenClaw skill framework allows arbitrary code execution with user permissions; no sandboxing or permission model as of mid-2026. Detection: monitor OpenClaw skill installations, alert on skills from unknown repos, check for openclaw-skills[.]com domain (rogue registry), scan for AMOS/Raccoon Stealer indicators, review skills with network egress or credential file access."
