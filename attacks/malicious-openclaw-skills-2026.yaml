detections:
  - name: Linux Base64 Encoded Pipe to Shell
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_base64_execution.yml"
    notes: "Detects base64 -D | bash patterns; directly applicable to Cyera-documented AMOS macOS delivery via base64-decoded pipes"
  - name: Keychain Password Retrieval via Command Line
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/macos/credential_access_keychain_pwd_retrieval_security_cmd.toml"
    notes: "Detects macOS keychain credential access; relevant for AMOS infostealer credential theft on macOS"
  - name: Linux Shell Pipe to Shell
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_susp_pipe_shell.yml"
    notes: "Detects suspicious shell pipes; applicable to AMOS delivery mechanisms using curl | bash patterns"
  - name: OpenClaw skill supply-chain monitoring
    format: guidance
    notes: "Monitor ~/.openclaw/skills/ for unexpected installations; alert on skills from unknown publishers (hightower6eu, Demerzels-lab, LJT-520, dexiaong, Ddoy233); detect fake openclaw-agent prerequisite lures; scan SKILL.md for inflated README droppers (22 MB+); flag Skills Directory A/B grades on skills with external paste relay references (glot.io, rentry.co); monitor outbound connections to AMOS C2 91.92.242.30 and secondary IPs; detect base64 -D | bash with decoy echo swcdn.apple.com; block domains socifiapp.com, custom-registry.com, openclawskills.net, laosji.net; audit skills with OS-split instructions for macOS (bash delivery) vs Windows (ZIP/EXE)"
