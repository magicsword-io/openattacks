id: malicious-openclaw-skills-2026
name: Multiple campaigns distributing malicious OpenClaw skills
date_reported: 2026-06-23
researcher: Koi Security, Cyera Research
org: Koi Security, Cyera
sources:
  - url: https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
    title: "Koi: ClawHavoc Campaign Delivers AMOS via Malicious OpenClaw Skills"
  - url: https://www.cyera.com/research/poisoned-skills-target-developer-credentials
    title: "Cyera: Poisoned Skills Target Developer Credentials"
    publisher: Cyera Research
borderline: false
borderline_note: null
ai_role: ai_credential_theft
ai_role_secondary: ai_tool_as_lure
ai_role_detail: "Multiple adversary campaigns distributing malicious OpenClaw skills via fake repos and skill registries to steal AI credentials and deliver malware"
technique_summary: "Koi reported ClawHavoc skills distributed through fake repositories and a rogue registry to deliver infostealers and harvest developer credentials. Cyera later reported poisoned skills using fake prerequisite lures, OS-specific installation instructions, external paste relays, and inflated README droppers. Detection should verify skill provenance, inspect companion files rather than only SKILL.md, and monitor agent-initiated shell and network activity."
initial_access: "User installs malicious OpenClaw skill from fake GitHub repo, typosquat, or rogue skill registry (openclaw-skills[.]com)"
ai_tooling_and_models:
  - OpenClaw AI skill framework
  - Anthropic Claude API
  - OpenAI API
other_tooling:
  - AMOS infostealer (macOS)
  - Raccoon Stealer (Windows)
  - Node.js credential harvesters
  - Reverse shells
  - openclaw-skills[.]com rogue registry
victims_and_sectors: AI developers installing untrusted OpenClaw skills
regions:
  - Multiple regions
attribution_or_cluster: ClawHavoc campaign and related poisoned-skill activity; actor unknown
scale_and_metrics: Multiple malicious skills and associated payload infrastructure reported during 2026
prevention_angle: "Only install OpenClaw skills from trusted sources; verify GitHub repo authenticity (org, stars, commit history); review skill manifest permissions before install; use allowlisted skill sources; monitor ~/.openclaw/skills/ for unexpected additions; implement endpoint security detecting AMOS/Raccoon; educate users on skill installation risks"
related_magicsword_projects: []
source_notes: "Koi Security ClawHavoc analysis and Cyera poisoned-skill research. Detection should monitor skill installation, unknown source repositories, unexpected network egress, and credential-file access."
last_reviewed: 2026-11-04
