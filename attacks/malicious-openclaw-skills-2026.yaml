atlas_techniques:
  - id: AML.T0000
    rationale: "Multiple campaigns delivering malicious AI skill framework extensions to steal credentials and deploy malware on AI developer machines"
    source_urls:
      - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
attack_flow:
  nodes:
    - id: distribute-skills
      title: Distribute malicious skills
      description: "ClawHavoc: 23 skills on fake GitHub repos + openclaw-skills[.]com registry. Unit 42: 5 skills via typosquat repos + SEO-poisoned blogs. Skills named to appear legitimate (productivity-boost, code-optimizer, security-scanner, api-connector-pro, github-integration-plus)"
      kind: access
      source_urls:
        - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
    - id: user-installs
      title: User installs skill
      description: "User finds malicious skill via search, fake registry, or social engineering; installs to ~/.openclaw/skills/ via OpenClaw CLI or UI; skill auto-loads on next OpenClaw startup"
      kind: ai
      source_urls:
        - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
    - id: execute-payload
      title: Execute malware and harvest
      description: "ClawHavoc: deploys AMOS (macOS) or Raccoon Stealer (Windows); harvests Anthropic keys, OpenAI keys, GitHub tokens, AWS creds, crypto wallets, browser cookies. Unit 42: Node.js credential harvester + reverse shell; targets same credential types"
      kind: execution
      source_urls:
        - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
    - id: exfiltrate-persist
      title: Exfiltrate and maintain access
      description: "Credentials POST to attacker C2; reverse shells provide persistent access; 6,900+ affected installations across both campaigns (ClawHavoc 4,800, Unit 42 2,100)"
      kind: impact
      source_urls:
        - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
  edges:
    - source: distribute-skills
      target: user-installs
    - source: user-installs
      target: execute-payload
    - source: execute-payload
      target: exfiltrate-persist
category: attacks-on-ai
attribution:
  actor_name: ClawHavoc
  country: Unknown
  motivation: financially-motivated
  attributed_by: Koi Security
  confidence: medium
ai_involvement_confidence: confirmed
detections:
  - name: Linux Base64 Encoded Pipe to Shell
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_base64_execution.yml"
    notes: "Detects base64 -D | bash patterns; directly applicable to Cyera-documented AMOS macOS delivery via base64-decoded pipes"
  - name: Keychain Password Retrieval via Command Line
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/macos/credential_access_keychain_pwd_retrieval_security_cmd.toml"
    notes: "Detects macOS keychain credential access; relevant for AMOS infostealer credential theft on macOS"
  - name: Linux Shell Pipe to Shell
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_susp_pipe_shell.yml"
    notes: "Detects suspicious shell pipes; applicable to AMOS delivery mechanisms using curl | bash patterns"
  - name: OpenClaw skill supply-chain monitoring
    format: guidance
    notes: "Monitor ~/.openclaw/skills/ for unexpected installations; alert on skills from unknown publishers (hightower6eu, Demerzels-lab, LJT-520, dexiaong, Ddoy233); detect fake openclaw-agent prerequisite lures; scan SKILL.md for inflated README droppers (22 MB+); flag Skills Directory A/B grades on skills with external paste relay references (glot.io, rentry.co); monitor outbound connections to AMOS C2 91.92.242.30 and secondary IPs; detect base64 -D | bash with decoy echo swcdn.apple.com; block domains socifiapp.com, custom-registry.com, openclawskills.net, laosji.net; audit skills with OS-split instructions for macOS (bash delivery) vs Windows (ZIP/EXE)"
