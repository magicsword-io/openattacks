attack_flow:
  nodes:
    - id: distribute-skills
      title: Distribute malicious skills
      description: "ClawHavoc: 23 skills on fake GitHub repos + openclaw-skills[.]com registry. Unit 42: 5 skills via typosquat repos + SEO-poisoned blogs. Skills named to appear legitimate (productivity-boost, code-optimizer, security-scanner, api-connector-pro, github-integration-plus)"
      kind: access
      source_urls:
        - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
        - https://unit42.paloaltonetworks.com/five-malicious-openclaw-skills/
    - id: user-installs
      title: User installs skill
      description: "User finds malicious skill via search, fake registry, or social engineering; installs to ~/.openclaw/skills/ via OpenClaw CLI or UI; skill auto-loads on next OpenClaw startup"
      kind: ai
      source_urls:
        - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
    - id: execute-payload
      title: Execute malware and harvest
      description: "ClawHavoc: deploys AMOS (macOS) or Raccoon Stealer (Windows); harvests Anthropic keys, OpenAI keys, GitHub tokens, AWS creds, crypto wallets, browser cookies. Unit 42: Node.js credential harvester + reverse shell; targets same credential types"
      kind: execution
      source_urls:
        - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
        - https://unit42.paloaltonetworks.com/five-malicious-openclaw-skills/
    - id: exfiltrate-persist
      title: Exfiltrate and maintain access
      description: "Credentials POST to attacker C2; reverse shells provide persistent access; 6,900+ affected installations across both campaigns (ClawHavoc 4,800, Unit 42 2,100)"
      kind: impact
      source_urls:
        - https://koi.security/blog/clawhavoc-malicious-openclaw-skills-amos
        - https://unit42.paloaltonetworks.com/five-malicious-openclaw-skills/
  edges:
    - source: distribute-skills
      target: user-installs
    - source: user-installs
      target: execute-payload
    - source: execute-payload
      target: exfiltrate-persist
