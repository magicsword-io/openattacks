ai_role_detail: "Symantec rates AI assistance high confidence and an operator-in-the-loop, rather than an autonomous agent, at moderate confidence. The model was not identified. Gaps between scripts never fell below seven seconds."
technique_summary: "Symantec Threat Hunter Team (Broadcom; SECURITY.COM article created Nov 16, 2026) describes a September 2026 intrusion at a U.S. retailer. The initial access vector is unknown. The earliest activity, Sep 18, was on three Microsoft SQL Server hosts, with cmd.exe running under sqlservr.exe, which Symantec treats as likely xp_cmdshell. Some of those commands were already long PowerShell scripts with quoted section labels. The scripts searched point-of-sale synchronization directories for stored passwords and connection strings, tested egress to 155.254.22[.]215:9458, and on one host appended base64 text under ProgramData, decoded it with Certutil, and compiled it with csc.exe. The source was EfsPotato (https://github.com/zcgonvh/EfsPotato). The payload saved the SAM, SYSTEM, and SECURITY hives. On Sep 21 an internet-facing IIS server appeared, with commands under w3wp.exe. On Sep 22 the commands looked hand-typed: 110 actions, three typos including systemifo and pwoershell, average length about 45 characters. Loaders were killed by security software, including a Bitdefender bdreinit.exe sideload of log.dll and log.txt from 204.194.49[.]129:8080, a pairing also seen with ShadowPad loaders and not unique to one actor. The operators reran that loader about five times in 20 minutes. They also staged an AES PowerShell reverse shell, server.ps1, toward 166.0.25[.]106:443 with a fallback host at 154.81.37[.]136, and wrote ASP webshells filemanager.asp and qwdajhsd.asp. On Sep 23 they staged a G DATA ask.exe/ask.dll sideload and BreakChainC.exe, then switched to about 50 long, error-free PowerShell scripts over about two hours. Banners included ===FILES MENTIONING CONN STRINGS===. Comments stated a hypothesis, cited earlier results, and revised a conclusion, which Symantec reads as model reasoning pasted into a webshell. The scripts collected connection strings, the FileZilla Server user database, WinSCP, PuTTY, and RDP settings, IIS configuration, and Windows logon registry values. They found SolarWinds Orion, read its bundled RabbitMQ .erlang.cookie, and ran Orion's erl.exe so rpc:call reached os:cmd on a second server. The command was passed as decimal character codes. That was about 10 minutes after the first Orion query. Later the same day BreakChainCs.exe relaunched the sideloaded binaries through WMI and shell modes so they were no longer children of w3wp.exe. From Sep 24 to Sep 29 the activity reached more SQL servers, a host that looks like a domain controller, Chisel, a password sprayer, and searches for NTDS.dit, Group Policy Preferences passwords, and LAPS. No data theft or encryption was observed. Symantec's financial-motive reading rests on the point-of-sale password search, contact with 155.254.22[.]215 (named in a separate Sep 22 Gambit Security report as an AI console tied to card-skimming activity), and later domain-credential theft that could be ransomware preparation. Loader files and the staging server overlap an August intrusion elsewhere and a July intrusion at a securities firm; neither of those showed AI assistance. Yuze (https://github.com/P001water/yuze) was used in the August case back to 204.194.49[.]129. Trend Micro has documented Yuze use by Warlock operators (Symantec Longlegs, also known as Storm-2603). Symantec does not attribute this intrusion to them. ATT&CK techniques in the report include T1574.002, T1505.003, T1552.001, T1021, and T1003.002."
initial_access: "Unknown. The first observed commands were cmd.exe under sqlservr.exe on SQL Server, consistent with xp_cmdshell, and later cmd.exe under w3wp.exe on IIS."
ai_tooling_and_models:
  - "Unidentified model. Symantec assesses AI-written PowerShell with an operator relaying output, not an autonomous agent."
other_tooling:
  - "EfsPotato (https://github.com/zcgonvh/EfsPotato), compiled on the server with csc.exe"
  - "Chisel (https://github.com/jpillora/chisel)"
