victims_and_sectors: "A U.S. retail organization. Internet-facing IIS and at least six further servers, most of them Microsoft SQL Server. Point-of-sale synchronization scripts were searched for passwords."
regions:
  - United States
region_notes: "The primary victim is a U.S. retailer. The August and July overlaps are different organizations and are not given countries in the retailer write-up."
attribution_or_cluster: "Unnamed. Symantec does not tie the activity to Warlock, Longlegs, or Storm-2603. ShadowPad-associated sideloading and Yuze are shared with other actors and are not treated as an attribution."
scale_and_metrics: "Sep 18 through at least Sep 29, 2026. On Sep 23, about 50 scripts in about two hours, median length over 500 characters, against about 45 characters for the earlier hand-typed commands. About 10 minutes from the first Orion query to command execution on a second server. No theft or encryption observed in this intrusion."
prevention_angle: "Alert when w3wp.exe or sqlservr.exe spawns cmd.exe or PowerShell, and when xp_cmdshell is used. Treat a same-directory unsigned DLL next to bdreinit.exe or ask.exe as sideloading. Alert on csc.exe compiling from ProgramData or a user-writable path, on Chisel client arguments, and on reg save of SAM, SYSTEM, or SECURITY. Hunt Orion's bundled erl.exe making rpc:call with a cookie, and ASP files dropped in the web application's image directory. A sudden change from short mistyped commands to long labelled scripts is an investigation lead, not a benign automation signature. Restrict xp_cmdshell, the Erlang distribution port, and the RabbitMQ cookie file."
related_magicsword_projects: []
source_notes: "Dates, typos, script counts, the Orion cookie path, the decimal-encoded rpc:call, and the published hashes are from the Symantec article at https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer (canonical; the blog-post URL serves the same title). The article's createdDate is 2026-11-16. Symantec lists many additional file hashes; the set below is the named tooling from that table, not every unnamed suspicious file. Yuze's Warlock reporting is Symantec's summary of Trend Micro, and Symantec says it is not an attribution. Link the August staging overlap only as Symantec describes it."
