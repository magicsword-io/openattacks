detections:
  - name: Suspicious Process By Web Server Process
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_webshell_susp_process_spawned_from_webserver.yml"
    notes: "Selected from a security-detections-mcp search for w3wp. Windows process creation. A web-server parent, including w3wp.exe, spawning a suspicious child. Matches commands Symantec saw under the IIS worker. It does not match sqlservr.exe as the parent."
  - name: Suspicious Child Process Of SQL Server
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mssql_susp_child_process.yml"
    notes: "Selected from a security-detections-mcp search for sqlservr. Windows process creation. sqlservr.exe spawning cmd.exe, PowerShell, or another listed child. Matches the Sep 18 pattern Symantec reads as xp_cmdshell."
  - name: MSSQL XPCmdshell Suspicious Execution
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/application/mssqlserver/win_mssql_xp_cmdshell_audit_log.yml"
    notes: "Selected from a security-detections-mcp search for xp_cmdshell. Windows application log. MSSQL audit event 33205 whose data contains object_name:xp_cmdshell and statement:EXEC. Requires the xp_cmdshell audit policy. The process-creation rule above still applies when that audit policy is off."
  - name: Windows Unsigned DLL Side-Loading In Same Process Path
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_unsigned_dll_side_loading_in_same_process_path.yml"
    notes: "Selected from a security-detections-mcp search for DLL side-loading. Sysmon image load. An unsigned DLL loaded from the same directory as the process, outside Windows and Program Files. Fits bdreinit.exe with log.dll and ask.exe with ask.dll staged in the same folder. A signed decoy executable does not have to be on a named-binary list."
  - name: Privilege Escalation via Rogue Named Pipe Impersonation
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/privilege_escalation_via_rogue_named_pipe.toml"
    notes: "Selected from a security-detections-mcp search for Potato. The rule cites https://github.com/zcgonvh/EfsPotato and alerts on Sysmon pipe-creation event 17 when the pipe path contains a nested Pipe segment. It does not match the string EfsPotato. The Splunk Potato-family rule's file-name list does not include EfsPotato, so that rule is not cited. A renamed compile can still miss a name-based hunt."
  - name: Dynamic .NET Compilation Via Csc.EXE
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_csc_susp_dynamic_compilation.yml"
    notes: "Selected from a security-detections-mcp search for csc.exe. Windows process creation. csc.exe whose command line points at ProgramData, Temp, or another listed user-writable location. Symantec compiled under ProgramData. The rule filters a w3wp.exe parent, so a compile whose parent is only the IIS worker does not match."
  - name: PUA - Chisel Tunneling Tool Execution
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_pua_chisel.yml"
    notes: "Selected from a security-detections-mcp search for chisel. Windows process creation. Image ending in chisel.exe, or command lines with client/server and reverse, socks, or r: arguments. Symantec's Chisel detection on Sep 25 was on a Windows host. The Linux Chisel rule is not cited."
  - name: Windows Registry Entries Exported Via Reg
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_registry_entries_exported_via_reg.yml"
    notes: "Selected from a security-detections-mcp search under T1003.002. Endpoint process data. reg.exe with save or export. Symantec says the EfsPotato payload saved the SAM, SYSTEM, and SECURITY hives. This matches that copy when it is reg.exe. A custom writer that does not call reg.exe will not match."
  - name: Erlang rpc:call and the Orion cookie
    format: guidance
    notes: "security-detections-mcp search for erl.exe returned no rule. Nothing in the index alerts on Orion's bundled erl.exe, rpc:call, or a read of .erlang.cookie. Hunt process creation for erl.exe under the Orion Erlang path with -setcookie and rpc:call. ASP names filemanager.asp and qwdajhsd.asp, and BreakChainC.exe, are also absent from the index; the w3wp child-process rule covers shells spawned from the web worker, not the ASP file drop by itself."
