attack_flow:
  nodes:
    - id: sql-and-iis
      title: SQL Server and IIS command shells
      description: "From Sep 18, cmd.exe runs under sqlservr.exe. From Sep 21, commands run under w3wp.exe. Symantec does not identify the initial entry vector."
      kind: access
      source_urls:
        - https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer
    - id: stalled
      title: Hand-typed commands stall
      description: "Sep 22 commands include typos such as systemifo and pwoershell. Security software kills staged loaders, including the bdreinit.exe and log.dll pair, and the operators retry without changing approach."
      kind: execution
      source_urls:
        - https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer
    - id: ai-scripts
      title: Long labelled scripts
      description: "On Sep 23 about 50 error-free PowerShell scripts run in about two hours, with section banners and comments Symantec reads as model reasoning. Pauses fit an operator pasting the next script."
      kind: ai
      source_urls:
        - https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer
    - id: orion-move
      title: Orion cookie reaches a second server
      description: "About 10 minutes after the first Orion query, the operators read the RabbitMQ cookie and use the bundled erl.exe rpc:call path to run a command on a second server. Later activity dumps credential hives. No encryption was observed."
      kind: impact
      source_urls:
        - https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer
  edges:
    - source: sql-and-iis
      target: stalled
    - source: stalled
      target: ai-scripts
    - source: ai-scripts
