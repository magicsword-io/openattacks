scale_and_metrics: "Microsoft reported access to more than 2,250 Microsoft 365 tenants. The FBI FLASH repeats that figure and asks defenders to review every tenant where the affected ConnectWise applications are or were installed."
prevention_angle: "FBI FLASH-20261113-001, citing Microsoft, says to review every Microsoft 365 tenant where affected ConnectWise applications are or were installed, searching by application ID rather than display name. Review successful and failed service-principal sign-ins separately, including sources outside the published IP list, and review Entra audit records for application credential additions, new applications, consent grants, and privileged role assignments. Start the review from at least 1 October 2026. Keep affected ConnectWise application connections disabled until ConnectWise provides restoration instructions, and do not delete the enterprise applications as the first response. The FLASH says the published addresses are historical and can be reassigned."
related_magicsword_projects: []
source_notes: "Imported from the AI Threat Watch Notion feed (an automated daily scan); not yet editorially reviewed. Feed severity: High. Feed novelty: Evolution. The 13 November 2026 FBI FLASH, citing Microsoft, lists 144.172.64.60, 144.172.64.99, and 144.172.64.128 as ConnectWise-campaign sign-ins and Graph API activity, and 187.15.88.186, 187.15.90.217, and 187.15.89.186 as Graph API access through compromised apps, transient VPN addresses relevant on 15-16 October 2026. The same addresses are in the FLASH CSV. 144.172.64.99 was already described in this entry's password-spray note. The CSV says the artifacts are not standalone indicators of ARTEX."
