detections:
  - name: Password Spray Activity
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/identity_protection/azure_identity_protection_password_spray.yml
    notes: "Matched password spray with security-detections-mcp. Microsoft says Storm-0940 used ARTEX for an Entra password spray from 144.172.64.99, with more than 151,000 failed logons across eight organizations on 10-14 October 2026."
  - name: Azure AD Multiple Users Failing To Authenticate From Ip
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/cloud/azure_ad_multiple_users_failing_to_authenticate_from_ip.yml
    notes: "Matched T1110.003 with security-detections-mcp. Same Entra password-spray window: many accounts failing from one infrastructure range, then ConnectWise application sign-ins."
  - name: Entra ID Application Credential Modified
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/azure/persistence_entra_id_application_credential_modification.toml
    notes: "Matched application credential with security-detections-mcp. Microsoft says the agents added application credentials and changed privileges after authenticating with the stolen ConnectWise app identities."
  - name: Microsoft Defender titles for this campaign
    format: guidance
    notes: "The blog's Defender coverage (unusual Graph activity for the ConnectWise application, application self-assigned Global Administrator, Graph activity from a threat-intelligence IP) is not a Sigma, Splunk, or Elastic rule. security-detections-mcp did not return those titles. Keep them as tenant alerts alongside the three rules above."
