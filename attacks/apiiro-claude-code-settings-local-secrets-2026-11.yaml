attack_flow:
  nodes:
    - id: approve
      title: Yes, and don't ask again
      description: "Claude Code proposes a shell command that already contains a secret from config or .env. The user approves that exact command for good."
      kind: access
      source_urls: &a1
        - https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again
    - id: save
      title: The command is saved in settings.local.json
      description: "The allow rule can be the full command line. Global git excludes hide the file on that one computer and are not written into the repository .gitignore."
      kind: ai
      source_urls: *a1
    - id: commit
      title: The file is committed
      description: "In 539 of 1,105 traced repositories with a secret, a commit co-authored by Claude changed the file. History and forks keep copies after deletion."
      kind: execution
      source_urls: *a1
    - id: public
      title: 1,122 public copies hold a secret
      description: "Apiiro counted 1,379 secrets in current copies and 2,539 once history, shared settings, and transcripts are included. A July 2026 ISC diary also shows scans for this path on web servers."
      kind: impact
      source_urls:
        - https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again
        - https://isc.sans.edu/diary/33150
  edges:
    - source: approve
      target: save
    - source: save
      target: commit
    - source: commit
      target: public
