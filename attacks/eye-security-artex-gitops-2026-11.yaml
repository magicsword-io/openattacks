attack_flow:
  nodes:
    - id: upload
      title: PHP upload becomes a webshell
      description: "Extension-fuzzed uploads such as artx_s5.php and zzartx0000.php accept X-ARTX-KEY and return ### ARTX-AGENT."
      kind: access
      source_urls: &eye
        - https://labs.eye.security/how-we-defended-against-an-ai-driven-attack/
    - id: secrets
      title: Pod secrets used within minutes
      description: "Environment variables and the secret store yield API keys. A rate limiter is bypassed in about three minutes."
      kind: execution
      source_urls: *eye
    - id: tunnel
      title: Neo-reGeorg across pods
      description: "Neo-reGeorg is modified to keep state in the internal cache so the tunnel survives load-balanced pods."
      kind: execution
      source_urls: *eye
    - id: gitops
      title: GitOps restores the attacker pod
      description: "A deployment-repo change creates artx-pod. Deleting it brings the pod back within a second."
      kind: impact
      source_urls: *eye
    - id: escape
      title: Privileged pod to the node
      description: "A privileged staging pod is used with nsenter to reach the host node."
      kind: execution
      source_urls: *eye
    - id: runner
      title: Self-hosted runners named sink-*
      description: "A CI app key registers self-hosted GitHub runners that are re-registered through the night."
      kind: impact
      source_urls: *eye
  edges:
    - source: upload
      target: secrets
    - source: secrets
      target: tunnel
    - source: secrets
      target: gitops
    - source: gitops
      target: escape
    - source: secrets
      target: runner
