ai_role: attacker_uses_ai_as_operator
ai_role_secondary: null
ai_role_detail: "Eye Security recovered ARTEX markers in pod names, files, data probes, and user agents during a multi-day incident at a payment and gift-card company. The agents adapted a rate-limit bypass in about three minutes."
technique_summary: "Eye Security (Bas van den Berg, Nov 12, 2026) describes a multi-day ARTEX intrusion that started at a vulnerable custom PHP upload function. Uploads were extension-fuzzed (.phtml, .php5, .php7, .phar, .inc, .PHP) into webshells such as artx_s5.php and zzartx0000.php. The shell accepted header X-ARTX-KEY or parameter k, used key k=x9f3c2b7e, and returned ### ARTX-AGENT. Environment variables on the pod leaked API keys, and the first call with a stolen key landed within minutes. When a rate limiter engaged, the agents rewrote their client in about three minutes to rotate a spoofed client-IP header and peaked at over 9,000 requests a minute. After that path was blocked they used a pool of more than 17,000 residential proxies. They pulled Neo-reGeorg (https://github.com/L-codes/Neo-reGeorg) and changed it to keep state in the internal cache so it worked across load-balanced pods. Its default user agent is Mozilla/5.0 (X11; Linux x86_64; rv:38.0) Gecko/20100101 Firefox/38.0. With an engineer's Git hosting identity they changed the deployment repo so GitOps deployed attacker pods, including artx-pod and a privileged pod on a staging host. Deleting the pod brought it back within a second. From the privileged pod they broke out to the node with nsenter. Separately, Eye counted thirteen logins in under three minutes, one socket per login, asking a file-transfer server to forward Docker, containerd, CRI-O, lightweight Kubernetes, the system bus, the PHP worker pool, the process supervisor, and sshd. The server refused every one of those forwards. A CI app key from the secret store was used to register self-hosted GitHub runners named sink-*, re-registered about every eight minutes through the night. Backdoor admins looked like QA or audit accounts (qa_probe_*, qa.audit29a). In phpMyAdmin they used LOAD DATA LOCAL INFILE into databases named artx_* and INTO OUTFILE write tests at /tmp/x.php5. The operators went after gift-card codes. Eye also publishes OSINT infrastructure from similar ARTEX activity: 207.5.195.93, artex.lol, staging.artex.lol, artex.tokena2b.top, artex.ok7777.eu.cc, artex.noog2infra.site, images tomicdd/artex and congdonglinux/artex, and callbacks on dnslog.cn, oast.me, and webhook.site. Data markers include ARTEX_WRITE_PROBE, ARTEX-PROBE-0001, ARTX_PERSIST_OK, and artex_control_marker_zz9q. Link srm-artex-ir-host-artifacts-2026-11, datadog-artex-aws-cognito-2026-11, arctic-wolf-antifox-iis-aws-2026-11, microsoft-artex-github-secrets-keyvault-2026-11, and badbyte-artex-backdoor-docker-2026-11."
initial_access: "Vulnerable custom PHP upload function, then extension-fuzzed webshells"
ai_tooling_and_models:
  - "ARTEX (https://github.com/RuoJi6/ARTEX)"
other_tooling:
  - "Neo-reGeorg (https://github.com/L-codes/Neo-reGeorg)"
  - "nsenter container breakout"
