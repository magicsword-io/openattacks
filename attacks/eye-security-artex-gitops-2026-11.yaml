victims_and_sectors: "A company running payment and gift-card services. Eye did not name the company."
regions:
  - unknown
attribution_or_cluster: "Unnamed. Eye ties one address to public ARTEX reporting on payment-API abuse. No country is given."
scale_and_metrics: "Peak over 9,000 requests a minute. More than 17,000 residential proxy addresses. Thirteen socket-forward logins in under three minutes, all refused by the server. GitOps recreated a deleted attacker pod within a second. Runners were re-registered about every eight minutes."
prevention_angle: "Block the published webshell names and the X-ARTX-KEY header. Alert on php-fpm or the web server spawning a shell, nsenter into the host PID namespace, a privileged pod, and a new self-hosted GitHub runner such as sink-*. Treat GitOps reconciliation as a persistence path: a deleted artx-pod that returns immediately is the deployment repo, not a restart."
related_magicsword_projects:
  - LOTTunnels
source_notes: "File names, the shell key, the request peak, the proxy count, the GitHub runner names, and the nsenter breakout are from the Eye Security incident write-up. 207.5.195.93 and the artex.* domains are in Eye's OSINT infrastructure list for similar ARTEX activity, not described as addresses observed inside this victim. Neo-reGeorg is tracked by LOTTunnels at https://lottunnels.github.io/lottunnels/Binaries/neo-regeorg/. The Sigma ReGeorg web-log rule requires a null user agent, and this tunnel used Firefox/38.0, so that rule is not cited."
last_reviewed: 2026-11-15
region_notes: "Eye did not name the victim's country. Infrastructure countries are not recorded as victim regions."
