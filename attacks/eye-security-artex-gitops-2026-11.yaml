detections:
  - name: Linux Webshell Indicators
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_webshell_detection.yml"
    notes: "Linux process creation. A web server parent spawning a shell utility. Parent images in the rule include httpd, nginx, and apache2. php-fpm is not in that parent list, so a shell whose parent is only php-fpm will not match."
  - name: Potential Docker Escape via Nsenter
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/privilege_escalation_docker_escape_via_nsenter.toml"
    notes: "Linux endpoint. nsenter changing into another namespace, including the host breakout Eye saw from the privileged pod."
  - name: Kubernetes Privileged Pod Created
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/kubernetes/privilege_escalation_privileged_pod_created.toml"
    notes: "Kubernetes audit. Creation of a privileged pod. Matches the staging pod used before nsenter."
  - name: Remote GitHub Actions Runner Registration
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/execution_register_github_actions_runner.toml"
    notes: "Endpoint, cross-platform. Runner.Listener registering a self-hosted runner. Matches the sink-* runners."
  - name: New GitHub Self Hosted Action Runner
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/github/initial_access_github_register_self_hosted_runner.toml"
    notes: "GitHub audit log. A new self-hosted runner registered on a repository."
  - name: ARTEX shell key and Neo-reGeorg user agent
    format: guidance
    notes: "No cited rule contains X-ARTX-KEY, k=x9f3c2b7e, ### ARTX-AGENT, artx_s5.php, or the Firefox/38.0 Neo-reGeorg agent. The Sigma ReGeorg web-log rule requires a null user agent, so it misses this tunnel."
