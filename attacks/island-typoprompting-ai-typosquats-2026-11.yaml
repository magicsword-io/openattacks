detections:
  - name: Suspicious Curl.EXE Download
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_curl_susp_download.yml"
    notes: "Windows process creation. curl.exe download. Matches the ClickFix command that saves W901.ps1. The decimal host 3112851459 is not a dotted IP, so a dotted-IP-only rule would miss it."
  - name: Potential File Transfer via Curl for Windows
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/command_and_control_tool_transfer_via_curl.toml"
    notes: "Windows endpoint. curl.exe retrieving a remote file. Same ClickFix download, followed by powershell -w h -nop -ep bypass."
  - name: Decimal host, Net Guard, and search override
    format: guidance
    notes: "No cited rule encodes 3112851459, -w h -ep bypass, the Net Guard package family MyflixlyApp.NetGuard_k6q889pad57pt, or extension IDs lihnhjjcdlfdomjliljlommppbfacmbj and nlmpdomhofmjdidcghodlgneobojdjfm. A Store signature matching hash bdddb50204d6867b4bd73d9cfe93cbc98c4518342da104e4608f04e675ac6cb3 is the package Island analyzed, not a clean verdict."
