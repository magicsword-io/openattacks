attack_flow:
  nodes:
    - id: typo
      title: AI-brand typo loads
      description: "A lookalike such as cloude.ai or preplexity.ai is served instead of the intended AI product. A parking page hands the browser to a traffic-distribution system."
      kind: access
      source_urls: &a1
        - https://www.island.io/blog/typoprompting-from-ai-typos-to-malware
    - id: clickfix
      title: Fake Cloudflare check copies a command
      description: "The Windows route copies a curl.exe download of W901.ps1 from decimal host 3112851459 and a hidden PowerShell launch."
      kind: execution
      source_urls: *a1
    - id: netguard
      title: Store-signed Net Guard
      description: "Other typos install the real Microsoft Store Net Guard package, whose buntai-sdk can change search settings and run DevTools scripts."
      kind: impact
      source_urls: *a1
    - id: extension
      title: Search-hijack extension
      description: "preplexity.ai leads to an unlisted Chrome extension that sets the default search provider to find.flashysearches.com."
      kind: impact
      source_urls: *a1
  edges:
    - source: typo
      target: clickfix
    - source: typo
      target: netguard
    - source: typo
      target: extension
