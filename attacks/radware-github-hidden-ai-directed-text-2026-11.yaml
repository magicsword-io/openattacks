detections:
  - name: Execution via GitHub Actions Runner
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/execution_via_github_actions_runner.toml
    notes: "Selected with security-detections-mcp from a search for GitHub Actions workflow execution. Endpoint process events. A child of Runner.Worker, or a shell whose command line references a runner entrypoint.sh, running a command the rule treats as dangerous. This can see a CI agent that actually runs a shell on a monitored self-hosted runner. It does not see hidden HTML in an issue, and it does not see a triage agent that only changes labels. The authors' replay used mock tools and did not execute on a runner. Five of the 43 attacks target a CI agent. The rule is marked high noise."
  - name: Hidden HTML comments and triage verdicts
    format: guidance
    notes: "security-detections-mcp searches for prompt injection, HTML comments, hidden text, and GitHub tokens did not return a Sigma, Splunk, or Elastic rule for hidden Markdown in a GitHub issue, pull request, comment, or README. MCP Prompt Injection requires Splunk MCP JSON-RPC logs and a fixed phrase list such as IGNORE PREVIOUS INSTRUCTIONS. It does not read GitHub Markdown. AWS Bedrock Claude Possible Prompt Injection requires Bedrock Claude prompt logs. High Confidence Prompt Injection in a GenAI User Message requires that GenAI integration, not a GitHub issue. GitHub Token Activity from Unusual User Agent requires GitHub audit logs of a token used from a new user agent for clone, push, zip download, or API. The paper does not report that follow-on use. No indexed rule matched the strings HTML comment or ipi-scan. Strip outsider HTML comments before the agent reads the item, and alert on a new hidden comment in an issue or pull request that names a triage label, a workflow token, or a shell tool. That control is not one of the indexed rules."
