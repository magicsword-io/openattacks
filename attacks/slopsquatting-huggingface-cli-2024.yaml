technique_summary: "Attackers register package names that code-generating LLMs
  hallucinate. Researchers registered hallucinated PyPI name huggingface-cli and
  observed tens of thousands of downloads (including reported Alibaba adoption).
  Broader study: 5.2%/21.7% hallucination rates commercial vs open-source
  models."
