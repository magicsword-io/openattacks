ai_role_detail: "Single operator 'bossjy' deployed mesh of 12 AI agents working together to conduct persistent espionage and intrusion campaigns across 11 countries"
technique_summary: "Nov 4, 2026: Acronis TRU discovered BOSSAI, a mesh of 12 AI agents (9 active, 3 inactive) operated by single actor 'bossjy' (aliases TIAN0517, lstjks) based in Hualien, Taiwan. Agents divided into infrastructure builders (Grok, OpenClaw, Claude Code) running commercial models, and offensive agents (Hermes, HalberdStrike, CyberStrike) running abliterated local models (DeepSeek-V4, Qwen 3.5 122B). Commercial models repeatedly refused attack commands, forcing use of locally-run abliterated models. Agent mesh targeted hundreds of organizations across government emergency services, banks, universities, military systems in 11 countries. Confirmed breaches at Taiwan emergency services (patient care records, 119 dispatch data), universities (Thailand SQL injection), and financial institutions. Operator ran mesh from home IP alongside legitimate businesses (gas store, K-beauty reseller, Facebook auto-post SaaS). Attack mesh generated high volumes of data with frequent hallucinations and false positives; agents sometimes refused lucrative targets (Honduran military base) due to autonomous scope decisions. MCP servers provided GitHub security, CVE lookup, OSINT, cloud auditing, Ghidra, Radare2, Playwright automation, and Kali Linux tools (nmap, sqlmap, Metasploit, Hydra). GPU fleet: RTX 4090s serving abliterated models via llama.cpp, plus 8 VPS nodes for proxying. OPSEC failures exposed entire operation: GitHub account linked to physical storefront, SSH sessions exposed home IP, credentials hardcoded throughout."
initial_access: "Vulnerability exploitation (SQL injection, RCE), credential harvesting, exposed systems"
ai_tooling_and_models:
  - BOSSAI 12-agent mesh
  - Hermes Agent (github.com/NousResearch/hermes-agent)
  - HexStrike AI (github.com/0x4m4/hexstrike-ai)
  - PentestGPT (github.com/GreyDGL/PentestGPT)
  - HalberdStrike (PentestGPT fork)
  - CyberStrike (github.com/CyberStrikeAI/CyberStrikeAI)
  - Grok 4.5 (infrastructure)
  - Claude Code (infrastructure)
  - MiniMax M3 (infrastructure, OpenClaw agent)
  - Abliterated DeepSeek-V4 (DS4, 64K context, offensive)
  - Abliterated Qwen 3.5 122B (offensive)
  - Abliterated GLM (offensive)
  - DeepSeek-R1 70B (offensive, later replaced)
other_tooling:
  - "MCP servers: HexStrike AI, Kali Linux, Ghidra, Radare2, Playwright"
  - "nmap, sqlmap, Metasploit, Hydra"
  - FOFA reconnaissance
  - Acunetix Web Vulnerability Scanner (cracked)
  - Hikvision Comprehensive Vulnerability Exploitation Tool
  - RTX 4090 GPU fleet with llama.cpp
  - SOCKS5 proxy pool
  - BrightData datacenter proxies
  - WeChat gateway
  - LINE messenger
victims_and_sectors: "Taiwan emergency services (fire department, 119 dispatch, disaster response), financial institutions (lending, mobile payment, fire-dispatch vendors), universities (Thailand: 3 confirmed SQL injection with data exfiltration, 2 partial), Mexico (206,800+ residential phone records, 124,000+ yellow pages records), Honduras military air force personnel system (characterized but not exploited), government agencies across 11 countries"
