  - GTFOBins
  - LOLSkills
source_notes: "Acronis TRU analysis. Attribution via OPSEC failures: GitHub account TIAN0517 with email linking to 99 Gas Store (九九瓦斯行) in Hualien County; lstjks SSH key identity matching GitHub; Jy技術團隊 logo across infrastructure; home IP exposed in SSH sessions; legitimate SaaS 行銷快手 (SnapPost) Facebook auto-post tool, INCELLDERM K-beauty reseller, and gas delivery business ran from same residential IP; WeChat QR tied to Tencent iLink enterprise registration; hardcoded credentials throughout (Shodan API, Cloudflare API, MiniMax API, NVIDIA API keys)"
