technique_summary: GitHub repository haiou-666/haiou-codex promoted on Bilibili and QQ as Codex jailbreak bundle. Installation decrypts AES-GCM encrypted payload.pkg and installs global Codex instructions plus seagull-* skills that inject advertisements for zz.aiapi2025.top into agent responses. Malicious skills also prevent agent from testing or revealing the injected ads. Attack monetizes jailbreak distribution through forced API gateway advertising while appearing to provide free model access workarounds.
initial_access: User downloads and installs haiou-codex jailbreak bundle from GitHub promoted on Chinese social platforms
ai_tooling_and_models:
  - Codex
  - Global Codex instructions
  - Malicious skills (seagull-* series)
other_tooling:
  - AES-GCM encrypted payload
  - GitHub repository (haiou-666/haiou-codex)
victims_and_sectors: Codex users seeking jailbreak or free access, primarily Chinese-speaking users
regions:
  - China
  - Asia
attribution_or_cluster: haiou-666 (GitHub username)
scale_and_metrics: Promoted on Bilibili and QQ; repository stars and download count unknown
prevention_angle: Review global Codex instructions for unauthorized modifications; scan installed skills for ad injection patterns; monitor agent responses for unexpected commercial content; verify instruction and skill sources; detect connections to suspicious API gateways; educate users about jailbreak bundle risks
related_magicsword_projects:
  - LOLSkills
source_notes: |
  Relevant detection rules:
  - Monitor modifications to global Codex instructions
  - Detect installation of unexpected skills (seagull-* naming pattern)
  - Alert on connections to suspicious API gateways (zz.aiapi2025.top)
  - Review skill content for ad injection patterns or output manipulation logic
  - Note: No direct Sigma rules for agent skill poisoning; requires custom monitoring of agent configuration changes and skill installation events, plus network monitoring for unexpected API gateway connections.
