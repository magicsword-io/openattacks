id: email-prompt-injection-ai-assistants-2026-11
name: Email prompt injection against mail AI assistants (Sublime, Barracuda)
date_reported: 2026-11-06
researcher: Harley Halsey, Brandon Murphy, Randy Pargman (Sublime); Merium Khalid
  (Barracuda)
org: Sublime Security, Barracuda Networks
sources:
- url: https://sublime.security/blog/invoice-fraud-campaign-adds-prompt-injection-aimed-at-email-ai-agents/
  title: 'Sublime: Invoice Fraud Campaign Adds Prompt Injection Aimed at Email AI
    Agents'
  publisher: Sublime Security
- url: https://www.cybersecurity-insiders.com/phishing-has-a-new-target-the-ai-assistant-reading-your-email/
  title: Phishing Has a New Target - The AI Assistant Reading Your Email
  publisher: Cybersecurity Insiders
magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: null
ai_role_detail: Email AI assistants manipulated via hidden HTML prompt injection to
  forward emails, search mailboxes for sensitive data, and self-propagate across organization
technique_summary: Sublime Security (Harley Halsey, Brandon Murphy, Randy Pargman)
  primary research documents invoice fraud campaign hiding forward this email with
  its PDF to ap.confirm+<controller>@<target> instructions in zero-size HTML span
  elements and Unicode Tag characters invisible to humans. Barracuda (Merium Khalid,
  Nov 7) via Cybersecurity Insiders reports recruiting email hiding HTML playbook
  telling assistant to forward to all-staff mailing lists for self-propagation and
  search mailbox for seed phrases, private keys, wallet data to exfiltrate to outside
  Gmail accounts. Both campaigns target email AI assistants reading/processing messages
  on behalf of users. Unattributed actors; confirmed in wild by Sublime and Barracuda
  independently.
initial_access: Phishing emails with hidden HTML prompt injection targeting email
  AI assistants
ai_tooling_and_models:
- Email AI assistants (unspecified vendors)
- Mailbox automation agents
other_tooling:
- Zero-size HTML span elements
- Unicode Tag characters
- HTML playbook instructions
victims_and_sectors: Organizations using email AI assistants; finance teams (invoice
  fraud); general workforce (recruiting fraud)
regions:
- Multiple regions
attribution_or_cluster: Unattributed campaigns; confirmed active in wild Nov 2026
  by Sublime and Barracuda
scale_and_metrics: Active Nov 2026; confirmed by two independent security vendors
prevention_angle: Strip hidden HTML elements from emails before AI processing; sanitize
  Unicode Tag characters; implement AI assistant output validation; restrict AI assistant
  forwarding capabilities; require human approval for bulk forwards; monitor for unusual
  mailbox search patterns; educate users on prompt injection risks; implement strict
  email content security policies
related_magicsword_projects: []
source_notes: Sublime Security blog (primary source) documents invoice fraud campaign
  with zero-size span and Unicode Tag injection; Barracuda report via Cybersecurity
  Insiders adds recruiting fraud with all-staff self-propagation and mailbox search
  for crypto data; both confirm active attacks Nov 2026
