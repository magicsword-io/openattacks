  confidence: low
ai_involvement_confidence: confirmed
detections:
- name: Email AI assistant security controls
  format: guidance
  notes: Strip zero-size HTML elements before AI processing; sanitize Unicode Tag
    characters (U+E0000–U+E007F); detect hidden text with display:none, font-size:0,
    opacity:0; validate AI assistant actions (forwards, searches); require human approval
    for bulk operations; monitor for ap.confirm+ email patterns; alert on mailbox
    searches for seed phrase, private key, wallet; log all AI assistant forwarding
    actions; implement AI output validation
