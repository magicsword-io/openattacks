technique_summary: 3AM ransomware affiliate used AI loop against UK schools showing model-style command errors including Bash escape sequences in Windows commands and malformed for /f syntax passing K" to comsvcs. Numbered retry scripts (av_remove2, av_remove3) indicate automated iteration. Probe files da_proof.txt and psexec-ok suggest autonomous validation. Backdoor admins library and svc_bkpmon created. Staging registry path HKLM\SOFTWARE\FIN001. Attack demonstrates AI-driven operations with observable execution errors and iteration patterns.
initial_access: unknown
