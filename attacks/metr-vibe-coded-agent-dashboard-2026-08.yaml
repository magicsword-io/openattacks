technique_summary: "Aug 31, 2026: METR disclosed incident where 'vibe-coded' (minimally tested, rapidly prototyped) AI agent dashboard accidentally exposed API key in client-side code. Unknown actor discovered key, used AI tooling to rapidly enumerate victim's cloud AI accounts (AWS Bedrock, Azure OpenAI, GCP Vertex AI), and drained approximately $600,000 in AI inference credits via unauthorized LLM calls. Demonstrates security risks of rapid AI prototyping ('vibe-coding') and AI-augmented attacker enumeration. METR estimates AI tooling accelerated enumeration ~10x vs manual methods."
