ai_role_detail: "Compromised Cline CLI npm package (cline-cli) installs malicious OpenClaw skill that harvests AI service credentials"
technique_summary: "Feb 17, 2026: cline-cli@2.8.1 npm package published with malicious postinstall script (GHSA-9ppg-jx86-fqw7). Cline is AI coding assistant CLI (github.com/cline/cline). Compromised version installs rogue OpenClaw skill 'cline-helper' to ~/.openclaw/skills/ that runs on OpenClaw startup. Skill harvests: Anthropic API keys, OpenAI keys, GitHub tokens, VS Code settings (including API keys), filesystem access tokens. Exfiltrates to hxxps://cline-telemetry[.]io/api/collect. Package removed within 6 hours; ~1,200 downloads during window. Part of broader Feb 2026 wave targeting AI CLI tools. Detection: check npm audit for GHSA-9ppg-jx86-fqw7; review ~/.openclaw/skills/ for unexpected skills; monitor cline-telemetry[.]io egress; scan npm postinstall scripts for skill installation logic."
initial_access: "npm install cline-cli@2.8.1 (compromised version, available ~6 hours on Feb 17, 2026)"
ai_tooling_and_models:
  - Cline AI coding assistant
  - OpenClaw skill framework
  - Anthropic Claude API
  - OpenAI API
other_tooling:
  - npm supply chain attack
  - Malicious OpenClaw skill
  - cline-telemetry[.]io C2
victims_and_sectors: "~1,200 downloads in 6-hour window; AI developers using Cline CLI"
regions:
