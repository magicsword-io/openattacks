source_notes: "GitHub Security Advisory GHSA-9ppg-jx86-fqw7; Cline GitHub github.com/cline/cline. Related to ClawHavoc and other malicious OpenClaw skill campaigns. Detection: alert on npm packages with postinstall scripts installing to ~/.openclaw/skills/, check for cline-telemetry[.]io domain, monitor AI credential file access from unexpected processes."
