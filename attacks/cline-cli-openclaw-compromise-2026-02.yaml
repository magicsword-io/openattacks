attribution_or_cluster: "Unknown actor; part of Feb 2026 wave targeting AI CLI tools and skill frameworks"
scale_and_metrics: "~1,200 downloads in 6-hour exposure window; package removed Feb 17, 2026"
prevention_angle: "Use npm package lock files; verify package integrity; review postinstall scripts; monitor ~/.openclaw/skills/ for unexpected additions; use npm audit to check for GHSA-9ppg-jx86-fqw7; rotate credentials after suspected exposure; implement SCA tools"
