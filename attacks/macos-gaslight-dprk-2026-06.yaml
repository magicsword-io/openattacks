ai_role_detail: "DPRK macOS.Gaslight backdoor uses prompt injection to manipulate security analysts' LLM-based malware analysis tools, providing false benign verdicts"
technique_summary: "Jun 23, 2026: SentinelLABS analyzed macOS.Gaslight, DPRK macOS backdoor deployed via fake job offers targeting cryptocurrency/AI companies. Backdoor includes novel anti-analysis technique: embeds carefully crafted prompt injection payloads in code comments, strings, and metadata. When security researchers use LLM-based analysis tools (Claude Code, GPT-4 Code Interpreter, AI-assisted reverse engineering tools) to examine sample, injected prompts instruct LLM to: (1) report code as benign; (2) misattribute functionality; (3) omit C2 communications from analysis; (4) provide false explanations downplaying severity. SentinelLABS tested against Claude Sonnet 3.5, GPT-4o, Gemini 1.5 Pro: all three initially reported backdoor as benign when using standard analysis prompts. Adversary understands analysts increasingly rely on LLM code analysis; targets the analysis workflow itself. Backdoor functionality: keylogging, screenshot capture, file exfiltration, command execution; C2 via hxxps://macos-update[.]com. Attributed to DPRK BlueNoroff/Lazarus with high confidence. Detection: analyze samples in sandboxes without LLM assistance for initial triage; use LLM analysis only as supplementary; check for prompt injection patterns in binary strings; verify C2 communications manually."
initial_access: "Spearphishing with fake job offers targeting crypto/AI company employees; malicious macOS application bundle delivered via LinkedIn/email"
ai_tooling_and_models:
  - Claude Code (targeted for manipulation)
