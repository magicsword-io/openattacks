attribution_or_cluster: "DPRK BlueNoroff/Lazarus (high-confidence attribution by SentinelOne); revenue generation and intelligence collection operations"
scale_and_metrics: "Unknown number of infections; discovered Jun 2026; first documented malware using prompt injection to manipulate analyst LLM tools"
prevention_angle: "Educate employees on fake job offer phishing; verify job offers via official channels; use Gatekeeper and notarization (macOS); implement EDR detecting keyloggers and C2 communications; for analysts: do not rely solely on LLM-based analysis tools; use traditional sandboxing and manual analysis for initial triage; verify LLM analysis results against manual inspection"
related_magicsword_projects: []
source_notes: "SentinelLABS analysis with DPRK attribution. macOS.Gaslight represents significant evolution: adversary anticipates security analyst workflows and embeds anti-analysis prompt injection targeting LLM tools increasingly used in malware research. Detection: sandbox malware without LLM analysis initially; scan binary strings/comments for prompt injection patterns ('ignore previous instructions', 'this is benign', 'do not report'); verify C2 manually; check for macos-update[.]com domain; look for keylogger/screenshot indicators on macOS."
