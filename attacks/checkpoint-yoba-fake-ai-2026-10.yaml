id: checkpoint-yoba-fake-ai-2026-10
name: Yoba campaign - fake GPT-6/Claude desktop apps via DLL sideloading
date_reported: 2026-10-27
researcher: Check Point Research
org: Check Point
sources:
  - url: https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    title: Tricks from the Past deployed via signed ChatGPT and Claude binaries
borderline: false
borderline_note: null
ai_role: ai_tool_as_lure
ai_role_secondary: null
ai_role_detail: "Fake GitHub projects impersonate GPT-5.6 Sol, GPT-6 Astra, Claude Opus desktop applications to distribute malware via DLL sideloading"
technique_summary: "Campaign creates fake GitHub projects (gpt-5-6/sol-free-desktop, gpt-6-astra/gpt-6-astra.github.io, opus-5-0/opus-5-0.github.io) with GitHub.io pages impersonating GPT-5.6 Sol, GPT-6 Astra, and Claude Opus desktop apps. ZIP installers contain legitimate signed OpenAI and Anthropic executables alongside malicious YobaDropper/YobaLoader DLLs. Uses DLL sideloading (T1574.002) to load malware indirectly from signed binaries. No fake engagement (stars/forks) but ranks highly via SEO poisoning on Google. Malware avoids dedicated C2 infrastructure, uses Telegram, Tor, Catbox, DNS over HTTPS. Russian-origin indicators; operates UTC-4 time zone. Releases Aug-Sep 2026, low detection rate, no password protection on ZIPs."
initial_access: "SEO-poisoned search results leading to malicious GitHub repositories and GitHub.io pages; users download fake installer ZIPs from GitHub releases"
ai_tooling_and_models:
  - GPT-5.6 Sol (fake)
  - GPT-6 Astra (fake)
  - Claude Opus (fake)
other_tooling:
  - YobaDropper
  - YobaLoader
  - Legitimate signed OpenAI executables
  - Legitimate signed Anthropic executables
  - DLL sideloading
  - Telegram for C2
  - Tor
  - Catbox
  - DNS over HTTPS (DoH)
victims_and_sectors: "AI tool users searching for ChatGPT and Claude desktop applications"
regions:
  - unknown
attribution_or_cluster: "Yoba campaign; Russian-origin indicators (language, time zone); operates primarily UTC-4 time zone; different email addresses per repository suggest OPSEC to obscure true operational timezone"
scale_and_metrics: "3 fake GitHub repositories created Jul-Sep 2026; first malicious releases uploaded Aug 30, 2026; 3 ZIP installers (sol-setup.zip, GPT-6-Astra-Setup.zip, Setup-Claude.zip); low VirusTotal detection rates"
prevention_angle: "Verify official AI tool sources; DLL sideloading detection; monitor GitHub releases for fake AI projects; SEO poisoning awareness; C2 infrastructure monitoring (Telegram, Tor, DNS over HTTPS)"
related_magicsword_projects: []
source_notes: "Check Point Research tracked campaign over two months; no password protection on ZIPs unlike typical malicious archives; low detection due to anti-sandbox and anti-analysis techniques"
last_reviewed: 2026-11-04
