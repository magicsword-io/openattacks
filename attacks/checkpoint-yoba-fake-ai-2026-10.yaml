attack_flow:
  nodes:
    - id: seo-poison
      title: SEO poisoning and fake repositories
      description: "Created fake GitHub repositories impersonating GPT-5.6 Sol, GPT-6 Astra, Claude Opus; GitHub.io pages with download links; no fake engagement but ranks highly on Google via SEO poisoning"
      kind: access
      source_urls:
        - https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    - id: lure
      title: User downloads fake installer
      description: "Victim searches for AI desktop apps, finds malicious GitHub repositories via Google; downloads ZIP from GitHub releases (sol-setup.zip, GPT-6-Astra-Setup.zip, Setup-Claude.zip)"
      kind: access
      source_urls:
        - https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    - id: sideload
      title: DLL sideloading from signed binaries
      description: "ZIP contains legitimate signed OpenAI/Anthropic executables alongside malicious YobaDropper DLL; when legitimate signed binary runs, it loads malicious DLL via DLL search order hijacking"
      kind: execution
      source_urls:
        - https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    - id: dropper
      title: YobaDropper deploys YobaLoader
      description: "YobaDropper executes, deploys YobaLoader component; anti-sandbox and anti-analysis techniques; no password protection needed due to low detection"
      kind: execution
      source_urls:
        - https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    - id: c2
      title: C2 via Telegram, Tor, Catbox, DoH
      description: "YobaLoader contacts attacker infrastructure via Telegram, Tor, Catbox, DNS over HTTPS; no dedicated C2 infrastructure for strong OPSEC; fetches final payload"
      kind: ai
      source_urls:
        - https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
    - id: payload
      title: Final payload execution
      description: "YobaLoader executes final payload on infected system; details of final payload capabilities not disclosed in source"
      kind: impact
      source_urls:
        - https://research.checkpoint.com/2026/tricks-from-the-past-deployed-via-signed-chatgpt-and-claude-binaries/
  edges:
