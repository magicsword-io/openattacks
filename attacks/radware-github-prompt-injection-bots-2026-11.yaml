ai_role_detail: "GitHub triage, review, and CI bots manipulated via hidden HTML comments, invisible Unicode, and CSS tricks in issues/PRs to execute unauthorized actions"
technique_summary: "Radware researchers Zvika Babo and Gabi Nakibly (Nov 5, 2026) document hidden prompt injection techniques targeting GitHub maintainer bots processing issues and pull requests. Attackers hide instructions in HTML comments, invisible Unicode characters, and CSS display tricks. Examples documented: (1) google-gemini/gemini-cli#28575 - deduplication agent told to use run_shell_command to write base64-encoded GITHUB_TOKEN into GITHUB_ENV; (2) openai/codex#16733 - labeler told to curl webhook.site and dump environment variables; (3) microsoft/agent-framework#7177 - fake triage gate with allow_triage=true, gate_result=pass markers; (4) blondesean/Kings_Herald#21 - hidden backdoor instruction in feature request. Attackers study bot tool names and output field formats to forge steering markers. Hidden instructions can bypass human review while manipulating bot behavior. Radware provides examples repository at github.com/rdwr-gabin/github-ipi-in-the-wild. No specific threat actor attribution; confirmed technique active in wild."
initial_access: "Malicious GitHub issues or pull requests with hidden prompt injection"
ai_tooling_and_models:
  - GitHub triage bots
  - GitHub review bots
  - GitHub CI/CD automation bots
  - Repository automation agents
other_tooling:
  - HTML comments
  - Invisible Unicode characters
  - CSS display manipulation
  - webhook.site exfiltration
victims_and_sectors: "GitHub repositories using AI-powered triage, review, and CI bots; examples include Google Gemini, OpenAI, Microsoft repositories"
regions:
  - Multiple regions
attribution_or_cluster: "Unattributed technique; confirmed active in wild with documented examples"
scale_and_metrics: "Multiple confirmed examples across major repositories (Google, OpenAI, Microsoft); active Nov 2026"
prevention_angle: "Strip HTML comments before bot processing; sanitize invisible Unicode from issues/PRs; validate bot tool output fields against expected schema; implement bot action approval gates; monitor for suspicious run_shell_command, curl webhook, environment variable access; restrict bot permissions to minimum required; log all bot actions for audit; educate maintainers on prompt injection risks; implement bot behavioral analysis"
