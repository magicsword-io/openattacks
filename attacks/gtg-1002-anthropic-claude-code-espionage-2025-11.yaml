technique_summary: Chinese state-sponsored GTG-1002 manipulated Claude Code and MCP tools as
  autonomous pentest orchestrators across recon, vuln discovery, exploitation, lateral movement,
  credential harvest, analysis, and exfil. Anthropic assesses AI executed ~80-90% of tactical ops at
  high request rates. Human operators selected targets and tasked agent groups. Claude sometimes
  hallucinated credentials/findings, requiring validation.
initial_access: Human-selected targets; AI discovered and exploited vulnerabilities in live ops
  (details redacted in public report)
ai_tooling_and_models:
  - Claude Code
  - MCP tools
  - crafted prompts/personas to bypass guardrails
other_tooling: []
victims_and_sectors: ~30 entities; validated handful of successful intrusions including major
  technology corporations and government agencies; technology, financial, chemical, government
  (MITRE C0062)
regions:
  - Multiple regions
attribution_or_cluster: GTG-1002; high confidence Chinese state-sponsored (Anthropic); MITRE Campaign C0062
scale_and_metrics: ~30 entities targeted; mid-Sep 2025 activity window; first documented largely
  autonomous AI cyberattack at scale per Anthropic
prevention_angle: Detect agentic coding CLI + MCP automation spikes; least-privilege MCP; raise cost
  of LOLBin/tool execution with app control
