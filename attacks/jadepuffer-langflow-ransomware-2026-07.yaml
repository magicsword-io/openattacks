ai_role_detail: "JADEPUFFER autonomous LLM agent conducts end-to-end ransomware operations via Langflow; ENCFORGE variant specifically targets and encrypts AI model weights"
technique_summary: "Jul 1, 2026: Sysdig discovered JADEPUFFER, LLM agent-driven ransomware using Langflow framework (github.com/langflow-ai/langflow). Agent autonomously: (1) Scans network for file servers, backups, databases; (2) Exfiltrates data to attacker cloud storage; (3) Encrypts files; (4) Generates and sends ransom note. ENCFORGE variant (Jul 20) specifically targets AI/ML infrastructure, encrypting model weights (.pt, .ckpt, .safetensors) and training datasets. Microsoft links operations to Storm-3168 actor. Represents first fully autonomous LLM-driven ransomware workflow."
initial_access: "Exploits in cloud services, container escapes"
