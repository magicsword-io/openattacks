detections:
  - name: Monitor underground marketplace activity
    format: guidance
    notes: Track dark web forums and Telegram channels for mentions of jailbroken
      LLM services like FraudGPT and WormGPT. Look for cryptocurrency transactions
      associated with known underground AI service providers.
  - name: Detect AI-generated content patterns
    format: guidance
    notes: Analyze phishing emails and malware samples for characteristics of LLM-generated
      content (unnaturally fluent multi-language text, specific formatting patterns,
      code style markers). Implement email security that flags likely AI-generated
      phishing attempts.
