attack_flow:
  nodes:
    - id: drop
      title: Malicious instruction file dropped to Downloads
      description: Website drops AGENTS.md or CLAUDE.md into ~/Downloads folder
      kind: access
      source_urls: &a1
        - https://forever.security/blog/hijacking-ai-agents-via-downloads-folder/
    - id: launch
      title: Developer launches agent in Downloads
      description: User starts coding agent in Downloads directory following common workflow for testing downloaded projects
      kind: ai
      source_urls: *a1
    - id: read
      title: Agent reads malicious instruction file
      description: Agent discovers and loads AGENTS.md or CLAUDE.md based on instruction file precedence
      kind: ai
      source_urls: *a1
    - id: execute
      title: Malicious instructions executed
      description: AGENTS.md variant edits ~/.codex/config.toml and runs npm install function-color; CLAUDE.md variant steals OAuth token
      kind: execution
      source_urls: *a1
    - id: impact
      title: Malware installed or credentials stolen
      description: function-color MALFEX downloader installed or OAuth tokens exfiltrated
      kind: impact
      source_urls: *a1
  edges:
    - source: drop
      target: launch
    - source: launch
      target: read
    - source: read
      target: execute
    - source: execute
      target: impact
