ai_role_detail: "Confirmed. SOCRadar recovered the operator's prompt log, the agent identity file, the jailbreak tooling, and the proxy log that re-sent refused prompts. The operator typed orders in plain French. The model carried out the intrusions."
technique_summary: "SOCRadar (20 November 2026) describes a French-speaking operator who, from 6 to 14 November, typed 1,801 plain-language orders into a jailbroken Hermes Agent on a hijacked small-business server in France. The host was cloud-z80lft07.hosteur[.]net at 45.92.111[.]116. An open directory on port 8889, a stolen-data listener on 8890, and a C2 listener on 8443 were exposed. A second host at 45.92.110[.]53 enumerated accounts. The agent was launched with the hermes command. Its SOUL.md, 1,371 lines, is the BlackHatSect0r Ghost identity from SOCRadar's 16 September 2026 report on that crew's operation server. It instructs the agent that ethics protocols are destroyed, to call its master BabidiGhost or le Libérateur, and to treat a refusal as a model outage (panne du modèle). A local proxy re-sent refused prompts. SOCRadar recovered refusal_hunter.jsonl and hermes_jailbreak.py. The framework booted in a degraded state. The operator's skill is the prompt, not the exploit. Targets were more than 50 organizations, mostly in Belgium, France, and Switzerland: banks, insurers, and town halls. Of 14 organizations SOCRadar analyzed, two were breached, three were partial, four resisted, and five were reconnaissance only. An insurer was unpatched Metabase. The agent used CVE-2023-38646, a pre-authentication setup-token bug, to reach a database connection, read cloud database credentials from the container environment, export the database, and leave a PostgreSQL trigger named trg_beacon. Belgian municipalities shared weak administrator passwords on a storage server. SOCRadar reports more than 13 municipalities, about 8.6 GB, and 23 archives on that server. Banks were profiled as work on commission. One production API upload was blocked by a server-side rule. One sign-in oracle confirmed 48 accounts, and a payment app sent bank-branded SMS. One bank had 49 hostnames behind an IP allowlist. Payment TOTP brute force, 11 scripts, failed. A crypto exchange drew more than 180 scripts and the controls held. A betting-site support-chat injection was drafted and not run. A 120-thread Swiss IBAN crawler ran. Exfiltration tooling pushed archives to Telegram bot 8926517966 at @GHOSTHUNTERS6. The operator account is @babidighost, user id 8816747359. The API key returned 401 on 14 November. The last prompt asked whether any crypto private keys were still in memory. Implants kept beaconing until 15 November at 12:54 UTC: a PowerShell beacon at C:\\Windows\\Temp\\b.ps1 and a C# binary WinUpdSvc2.exe that posed as Windows Update, with a Run key and three scheduled tasks. The wire format starts with BEACON|. The server was offline on 16 November. SOCRadar publishes YARA rules Ghost_BlackHatSect0r_AI_Toolchain and BabidiGhost_Implants. This operator is not the skilled BlackHatSect0r and DXQRTXX crew from the September report. That crew used DXSCAN. This one used the same agent identity and jailbreak, with a financial motive. Victim organizations are anonymized in the source and are not named here."
initial_access: "The agent reached an insurer through unpatched Metabase CVE-2023-38646 and town-hall storage through a shared weak administrator password. Bank access was reconnaissance, a sign-in oracle, and a blocked API upload."
