attack_flow:
  nodes:
    - id: prompts
      title: Jailbroken Hermes on the staging server
      description: "The operator typed French orders to Hermes Agent. SOUL.md imposed the Ghost identity. A proxy re-sent refused prompts. This ran on 45.92.111[.]116, not on the victims."
      kind: ai
      source_urls:
        - https://socradar.io/blog/babidighost-ai-augmented-cybercrime/
        - https://socradar.io/blog/blackhatsect0r-dxqrtxx-operation-server/
    - id: reach
      title: Metabase or a shared password
      description: "On an insurer, the agent used Metabase CVE-2023-38646 and then read database credentials from the container. On town halls, it used a weak shared administrator password."
      kind: access
      source_urls:
        - https://socradar.io/blog/babidighost-ai-augmented-cybercrime/
    - id: steal
      title: Database export and archives
      description: "The insurer database was exported and a PostgreSQL trigger trg_beacon was left behind. The Belgian municipal server yielded about 8.6 GB. Bank TOTP brute force failed."
      kind: impact
      source_urls:
        - https://socradar.io/blog/babidighost-ai-augmented-cybercrime/
    - id: exfil
      title: Telegram and leftover implants
      description: "Archives went to Telegram bot 8926517966. After the API key was revoked on 14 November, b.ps1 and WinUpdSvc2.exe kept beaconing until 15 November."
      kind: execution
      source_urls:
        - https://socradar.io/blog/babidighost-ai-augmented-cybercrime/
  edges:
    - source: prompts
      target: reach
    - source: reach
      target: steal
    - source: steal
      target: exfil
