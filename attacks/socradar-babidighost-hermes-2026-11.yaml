  - "WinUpdSvc2.exe, Run key, and three scheduled tasks"
victims_and_sectors: "European banks, insurers, and town halls. SOCRadar does not name the organizations. Two of 14 analyzed organizations were breached, including an insurer and a shared municipal storage server."
regions:
  - Belgium
