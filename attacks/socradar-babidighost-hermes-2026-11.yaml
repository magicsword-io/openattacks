region_notes: "More than half of the targets SOCRadar counted were in Belgium. The staging server was a hijacked small-business host in France. Switzerland is a target country, including the IBAN crawler."
attribution_or_cluster: "Operator Telegram @babidighost, identity BabidiGhost. The Ghost SOUL.md is the BlackHatSect0r agent identity. SOCRadar does not attribute this operator to the BlackHatSect0r and DXQRTXX crew."
scale_and_metrics: "Nine days, 6 to 14 November 2026. 1,801 orders, 5,779 model requests, 41 refusals that the proxy still got past. More than 50 organizations. 14 analyzed: 2 breached, 3 partial, 4 resisted, 5 reconnaissance. About 8.6 GB and 23 archives from the Belgian municipal server. Implants beaconed until 15 November 12:54 UTC. Server offline 16 November."
prevention_angle: "Patch Metabase past CVE-2023-38646 and close the setup token. Alert on a new PostgreSQL trigger and on bulk database export from the Metabase container. On Windows, hunt C:\\Windows\\Temp\\b.ps1, WinUpdSvc2.exe, and a process posing as Windows Update that beacons with a BEACON| prefix. DNS for api.telegram.org from a server or implant is the exfil path SOCRadar recovered. The prompt log lived on the attacker's staging server, not on the victims."
related_magicsword_projects: []
source_notes: "Narrative, counts, hosts, the Telegram identifiers, implant names, and the CVE are from the 20 November SOCRadar article. The bot secret in that article is omitted. The 16 September article is the source for the Ghost SOUL.md and the BlackHatSect0r operation server. It is the prior campaign, not this operator's log. Both socradar.io pages return 403 to the source-link checker and are cited the same way as the other SOCRadar entries."
