detections:
  - name: Telegram Bot API Request
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/network/dns/net_dns_susp_telegram_api.yml
    notes: "Selected from a security-detections-mcp search for Telegram bot API. It matches DNS queries for api.telegram.org. SOCRadar says the exfiltration tooling pushed archives to a Telegram bot. It does not prove every query is this campaign."
  - name: Windows DNS Query Request by Telegram Bot API
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/network/windows_dns_query_request_by_telegram_bot_api.yml
    notes: "Selected from the same Telegram search. It is Windows DNS for api.telegram.org. It can match a Windows host running the beacon. The staging server SOCRadar describes is Linux, so this rule does not cover exfil from that server."
  - name: Powershell Defender Exclusion
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_defender_exclusion.yml
    notes: "Selected from a security-detections-mcp search for Add-MpPreference. SOCRadar's ATT&CK table records Defender exclusions. The article does not publish the command line. The rule matches powershell.exe with Add-MpPreference or Set-MpPreference and an -ExclusionPath, -ExclusionExtension, or -ExclusionProcess argument."
  - name: Metabase, the trigger, and the implants have no matching rule
    format: guidance
    notes: "A security-detections-mcp search for metabase returned no Sigma, Splunk, or Elastic rule. None of the indexed rules name CVE-2023-38646, the PostgreSQL trigger trg_beacon, C:\\Windows\\Temp\\b.ps1, or WinUpdSvc2.exe. Elastic Local Scheduled Task Creation and the Sigma Run-key rules require schtasks.exe or reg.exe, which the article does not show. Hunt the trigger name, the two implant paths, and a beacon line that starts with BEACON|."
