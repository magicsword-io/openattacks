ai_role_detail: "Financially motivated operators use ARTEX autonomous agents for automated intrusions; exposed control panels leak operator prompts, model choices, agent decision steps, and target data"
technique_summary: "Check Point (Nov 5, 2026) and CERT-EU (Nov 5, 2026) document exposed ARTEX operator control panels leaking database dumps containing operator prompts, model selection (primarily DeepSeek Flash and Kimi), autonomous agent decision steps, and campaign targets. Three campaign fleets identified: (1) iOS signing shops - steal .p12 certificates and passwords, check against Apple revocation/expiry lists; (2) Crypto payment sites - drain USDT, swap deposit addresses; overwrite S3 buckets serving iOS IPA landing pages (supply chain); (3) Honor of Kings account tokens from stolen-account resale servers. Access methods: hardcoded admin passwords in JavaScript bundles, unauthenticated APIs, command injection, SSTI, IDOR vulnerabilities. Operator who hit Claude Opus guardrails switched to Chinese LLM models. Version-tag infrastructure clusters: sco-fix2 (38.11.173.0/24, 38.11.221.0/24, 198.200.59.85-89, AS54600 PEG TECH); dev-db-resilience-20261031 (103.122.245.x, AS152918 Liberally Network, Thailand); 0.3.15-pro.* (192.236.172.197, 198.44.123.66, 204.44.66.81, 104.168.112.237, AS36352 HostPapa). Custom framework PZZ referenced. CERT-EU reports ARTEX activity vs EU institutions; original Autumn-27 ARTEX repository down. Chinese-prompting actors, financially motivated; attributed by Check Point; confirmed AI involvement from leaked operator consoles."
initial_access: "Hardcoded admin passwords, unauthenticated APIs, command injection, SSTI, IDOR"
ai_tooling_and_models:
  - ARTEX autonomous offensive agent (https://github.com/RuoJi6/ARTEX)
  - DeepSeek Flash (primary)
  - Kimi (Chinese LLM)
  - Claude Opus (hit guardrails, operator switched)
  - Custom framework PZZ
other_tooling:
  - iOS .p12 certificate theft
  - USDT cryptocurrency draining
  - S3 bucket overwrite for supply chain
  - Honor of Kings account token theft
victims_and_sectors: "iOS signing shops, cryptocurrency payment sites, Honor of Kings account resale servers, EU institutions (CERT-EU report)"
regions:
  - Multiple regions
  - European Union
attribution_or_cluster: "Chinese-prompting financially motivated operators; attributed by Check Point; confirmed from leaked operator console databases"
scale_and_metrics: "Three major campaign fleets (iOS signing, crypto payment, game accounts); multiple exposed ARTEX panels with leaked operator databases; infrastructure across AS54600 PEG TECH, AS152918 Liberally Network Thailand, AS36352 HostPapa"
prevention_angle: "Secure ARTEX deployments against unauthorized access (remove hardcoded passwords, authenticate APIs); patch command injection, SSTI, IDOR vulnerabilities; rotate compromised credentials; monitor for iOS .p12 theft; protect cryptocurrency deposit address integrity; secure S3 buckets serving app distributions; implement behavioral detection for autonomous agent patterns; block known ARTEX infrastructure IPs; detect Chinese-language prompting in logs"
