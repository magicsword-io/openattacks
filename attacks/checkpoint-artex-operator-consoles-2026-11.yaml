detections:
  - name: Detect New Open S3 Buckets
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/cloud/detect_new_open_s3_buckets.yml
    notes: Detects S3 bucket operations including overwrites used in iOS IPA supply
      chain attacks
  - name: ARTEX console security monitoring
    format: guidance
    notes: Scan for exposed ARTEX control panels via hardcoded admin passwords in JS
      bundles; detect unauthenticated ARTEX APIs; patch command injection, SSTI, IDOR
      in ARTEX deployments; monitor for Chinese-language prompting in agent logs; detect
      iOS .p12 certificate theft; alert on cryptocurrency deposit address swaps; monitor
      S3 bucket integrity for iOS IPA distributions; flag Honor of Kings token theft
      patterns; block known ARTEX infrastructure (AS54600, AS152918, AS36352)
  - name: ARTEX infrastructure detection
    format: guidance
    notes: "Monitor version-tag clusters: sco-fix2, dev-db-resilience-20261031, 0.3.15-pro.*;
      detect custom framework PZZ references; alert on DeepSeek Flash and Kimi model
      usage in offensive contexts; detect operator model switching after guardrail triggers"
  - name: No new host procedure in the Commission confirmation
    format: guidance
    notes: "A security-detections-mcp search for ARTEX returned no Sigma, Splunk, or Elastic rule. The 19 November confirmation names systems taken offline and does not publish a host command, file, or network indicator, so no additional rule is cited. The S3 bucket rule remains the indexed match for the Check Point supply-chain path."
