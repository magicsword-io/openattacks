ai_role_detail: Financially motivated operators use ARTEX autonomous agents for automated
  intrusions; exposed control panels leak operator prompts, model choices, agent decision
  steps, and target data
technique_summary: "Check Point (Nov 5, 2026) and CERT-EU (Nov 5, 2026) document exposed
  ARTEX operator control panels leaking database dumps containing operator prompts,
  model selection (primarily DeepSeek Flash and Kimi), autonomous agent decision steps,
  and campaign targets. Three campaign fleets identified: (1) iOS signing shops -
  steal .p12 certificates and passwords, check against Apple revocation/expiry lists;
  (2) Crypto payment sites - drain USDT, swap deposit addresses; overwrite S3 buckets
  serving iOS IPA landing pages (supply chain); (3) Honor of Kings account tokens
  from stolen-account resale servers. Access methods: hardcoded admin passwords in
  JavaScript bundles, unauthenticated APIs, command injection, SSTI, IDOR vulnerabilities.
  Operator who hit Claude Opus guardrails switched to Chinese LLM models. Version-tag
  infrastructure clusters: sco-fix2 (38.11.173.0/24, 38.11.221.0/24, 198.200.59.85-89,
  AS54600 PEG TECH); dev-db-resilience-20261031 (103.122.245.x, AS152918 Liberally
  Network, Thailand); 0.3.15-pro.* (192.236.172.197, 198.44.123.66, 204.44.66.81,
  104.168.112.237, AS36352 HostPapa). Custom framework PZZ referenced. CERT-EU's 5
  November post says it has seen activity against its constituency that highly likely
  involved ARTEX. That post does not name the European Commission. On 19 November
  2026, Commission spokesperson Thomas Regnier confirmed on the record an AI-generated
  cyber campaign first detected on 22 October. He did not name the tool or the attackers'
  motivation. The Record reports no evidence of a data breach affecting Commission
  staff broadly, no ransom demand he was aware of, and that services were taken offline
  as a protective measure. POLITICO's 19 November Brussels Playbook, citing an EU
  official granted anonymity, is the public source that names ARTEX for this incident.
  That official said CERT-EU detected international hackers using ARTEX against the
  Commission. The same Playbook names Sysper, MyPMO, and translation services as
  disrupted. The Commission confirmation does not adopt that name. The original
  Autumn-27 repository was already down in the CERT-EU post. Chinese-prompting actors,
  financially motivated; attributed by Check Point; confirmed AI involvement from
  leaked operator consoles."
initial_access: Hardcoded admin passwords, unauthenticated APIs, command injection,
  SSTI, IDOR
ai_tooling_and_models:
  - ARTEX autonomous offensive agent (https://github.com/RuoJi6/ARTEX)
  - DeepSeek Flash (primary)
  - Kimi (Chinese LLM)
  - Claude Opus (hit guardrails, operator switched)
  - Custom framework PZZ
frameworks:
  - artex
other_tooling:
  - iOS .p12 certificate theft
  - USDT cryptocurrency draining
  - S3 bucket overwrite for supply chain
  - Honor of Kings account token theft
victims_and_sectors: "iOS signing shops, cryptocurrency payment sites, Honor of Kings account resale servers. On 19 November 2026 the European Commission confirmed an AI-generated cyber campaign, first detected 22 October, that took personnel and translation services offline. POLITICO names Sysper, MyPMO, and translation services. The Commission did not name the tool. The ARTEX name for this incident comes only from CERT-EU via an anonymous official quoted by POLITICO. No evidence of a staff-wide breach and no ransom were reported."
regions:
  - Multiple regions
  - Belgium
region_notes: "Belgium is the Commission confirmation. The Check Point campaigns are not assigned a country. CERT-EU's constituency warning is not a country."
attribution_or_cluster: Chinese-prompting financially motivated operators; attributed
  by Check Point; confirmed from leaked operator console databases
scale_and_metrics: Three major campaign fleets (iOS signing, crypto payment, game
  accounts); multiple exposed ARTEX panels with leaked operator databases; infrastructure
  across AS54600 PEG TECH, AS152918 Liberally Network Thailand, AS36352 HostPapa
prevention_angle: Secure ARTEX deployments against unauthorized access (remove hardcoded
  passwords, authenticate APIs); patch command injection, SSTI, IDOR vulnerabilities;
  rotate compromised credentials; monitor for iOS .p12 theft; protect cryptocurrency
  deposit address integrity; secure S3 buckets serving app distributions; implement
  behavioral detection for autonomous agent patterns; block known ARTEX infrastructure
  IPs; detect Chinese-language prompting in logs
related_magicsword_projects: []
source_notes: "Check Point blog (Nov 5, 2026) is the campaign and infrastructure source. CERT-EU's 5 November post is a constituency warning and does not name the Commission. The Record (Alexander Martin, 19 November 2026) is the on-the-record confirmation by spokesperson Thomas Regnier. POLITICO Brussels Playbook the same morning, by Gerardo Fortuna, is the piece that names ARTEX, attributed to CERT-EU through an anonymous EU official. Regnier's quoted remarks in that Playbook do not name ARTEX. No new IOCs come from either 19 November piece. POLITICO returns 403 to the source-link checker and is still cited. Other catalog entries that share this tool are linked from the tool page."
