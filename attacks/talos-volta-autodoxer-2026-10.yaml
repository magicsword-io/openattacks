attack_flow:
  nodes:
    - id: steal
      title: Stealer collects host evidence
      description: "The Windows sample collects browser secrets, mail, chat, game, VPN, cloud, and wallet data, cracks wallet vaults, reads Wi-Fi profiles, and launches Chrome with --headless for App-Bound Encryption. It then deletes itself."
      kind: execution
      source_urls:
        - https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/
    - id: bundle
      title: Evidence bundle is enriched
      description: "Stolen sessions pull receipts, delivery orders, Discord identity, and a Rolimons Roblox valuation into a structured bundle with address, employer, and card last-4."
      kind: execution
      source_urls:
        - https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/
    - id: rank
      title: Models rank resale value
      description: "The bundle is posted to OpenRouter. Claude Opus 4.6 is asked for a low, medium, or high appraisal and an operational-security note. A refusal falls through to Kimi K2 and then Gemini 2.5 Flash."
      kind: ai
      source_urls:
        - https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/
    - id: deliver
      title: Appraisal is packaged
      description: "Identity_Report.txt and AI_Analysis.txt are zipped as volta_log.zip, volta_dox.zip, and volta_doxnet.zip. Talos says customers receive the assessment through Telegram. No attacker server is in the sample."
      kind: impact
      source_urls:
        - https://blog.talosintelligence.com/appraisal-by-ai-model-driven-victim-prioritization-in-the-volta-infostealer/
  edges:
    - source: steal
      target: bundle
    - source: bundle
      target: rank
    - source: rank
      target: deliver
