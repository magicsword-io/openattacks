detections:
  - name: Browser Execution In Headless Mode
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_browsers_chromium_headless_exec.yml
    notes: "Selected from a security-detections-mcp search for headless browser execution. Matches chrome.exe, msedge.exe, and other Chromium browsers whose command line contains --headless. Talos documents that flag for the App-Bound Encryption bypass. It does not see the model request."
  - name: Local LLM Framework DNS Query
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/local_llm_framework_dns_query.yml
    notes: "Selected from a security-detections-mcp search for openrouter. Hunting search on Sysmon DNS event 22. The query list includes *openrouter*, and it excludes browsers plus Windows system directories. A DNS lookup for openrouter.ai from the stealer process matches. It does not see the POST body, the model name, or the evidence bundle."
  - name: Connection to Common Large Language Model Endpoints
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/command_and_control_common_llm_endpoint.toml
    notes: "Selected from a security-detections-mcp search for openrouter. Matches a DNS query for openrouter.ai from a listed script host, or from an unsigned executable under a user profile, ProgramData, or a temp directory. Talos does not publish the sample's path, so a copy outside those directories would miss. The rule does not inspect the chat request."
  - name: Headless flag and third-party endpoints
    format: guidance
    notes: "Splunk Headless Browser Usage requires both --headless and --disable-gpu. Talos documents only --headless, so that rule is not cited. There is no attacker domain. OpenRouter and Rolimons are third-party services the sample calls."
