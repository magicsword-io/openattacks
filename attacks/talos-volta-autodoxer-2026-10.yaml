ai_role_detail: "The stealer sends the victim's evidence bundle to a model and asks it to rank assets by resale value. The model is an operator tool. It is not the target, and Talos does not claim a model wrote the stealer."
technique_summary: "Cisco Talos (Ryan Fetterman, 31 October 2026) describes VOLTA-AUTODOXER, a self-deleting Windows stealer. After it collects credentials, sessions, and wallets, it builds a structured evidence bundle and sends that bundle to a model, which ranks the assets by resale value and comments on the victim's operational security. The request is a hand-assembled POST to the public OpenRouter chat-completions API, with temperature 0.2 and a browser User-Agent. The default model is Claude Opus 4.6 (anthropic/claude-opus-4.6). If the reply contains a refusal such as \"I can't\" or \"I'm not able\", the sample tries Kimi K2 (moonshotai/kimi-k2) and then Gemini 2.5 Flash (google/gemini-2.5-flash). The prompt asks for a forensic-style appraisal with the sections WHAT THEY'RE WORTH (low, medium, or high) and THEIR OPSEC. The bundle includes geolocation, a home address, employer or domain, an inferred birth year, card last-4, Slack, document authorship, iPhone backup indicators, and a live Roblox valuation. Stolen sessions enrich it from Gmail receipts (Amazon, DoorDash, Uber Eats, Grubhub, Walmart, PayPal), Uber Eats and DoorDash order history, Discord, and Rolimons. Collection covers Chromium passwords, cookies, and cards, Firefox, Thunderbird, Outlook, Slack, Steam, Battle.net, Discord, Telegram, Roblox, SSH, gcloud, OpenVPN, Hide.me, an inline wallet-vault cracker, Wi-Fi passwords via WlanGetProfileList, and a Chrome App-Bound Encryption bypass that launches the browser with --headless. Output files are Identity_Report.txt and AI_Analysis.txt, then volta_log.zip, volta_dox.zip, and volta_doxnet.zip when network enrichment runs. A debug log is left at %APPDATA%\\volta_debug.txt. The builder fills six slots at build time. The key is a SHA-256 of two constants in the same binary. Talos says the sample has no attacker-owned server. Telegram is the customer channel for the finished assessment. Talos does not name the author or a country, and treats a builder-for-sale reading as an inference."
initial_access: "A Windows executable the victim runs. Talos does not describe the delivery path."
ai_tooling_and_models:
  - "Claude Opus 4.6 (anthropic/claude-opus-4.6), the default appraisal model"
  - "Kimi K2 (moonshotai/kimi-k2), the first fallback when the default model refuses"
  - "Gemini 2.5 Flash (google/gemini-2.5-flash), the second fallback"
  - "OpenRouter public chat-completions API, the only model endpoint in the sample"
other_tooling:
  - "Self-deleting Windows stealer with a six-slot builder"
  - "Chrome launched with --headless to bypass App-Bound Encryption"
  - "Rolimons lookup for a live Roblox valuation"
  - "Telegram as the customer channel for the finished assessment"
victims_and_sectors: "No named victim. Talos published one Windows sample."
regions:
  - unknown
region_notes: "Talos does not name a victim country. The sample's own geolocation collection is not a victim region."
attribution_or_cluster: "Unnamed. Talos does not assign a group or a country. A builder-sale claim is Talos's inference from the swappable slots, not a named seller."
scale_and_metrics: "One published sample. VirusTotal first seen 2026-10-11 12:46 UTC. The PE timestamp 2026-08-17 20:35 is a build stamp, not a victim event. No victim count."
prevention_angle: "Hunt a non-browser process resolving openrouter.ai, and Chrome or Edge started with --headless by an unexpected parent. The sample deletes itself. Keep %APPDATA%\\volta_debug.txt, Identity_Report.txt, AI_Analysis.txt, and the volta_log, volta_dox, and volta_doxnet archives."
related_magicsword_projects: []
source_notes: "Category is adversary use of AI because the model ranks stolen assets for the operator. Claude, Kimi, and Gemini are called as services. None of them was compromised, and OpenRouter is the public inference API, not an attacker host. Rolimons is a public lookup the sample uses to price Roblox accounts. Talos does not publish a Telegram host or bot token, so none is listed. The analyzed file is SHA256 57ef4242666d78c50df145b34023df564f0fad38812d6a580e66433d427e2279, seen as 9BY0tjwOc3ut.exe and yLP9m5J3i2Aw.exe, PE32+ x86-64. Talos says the sample surfaced in its malware research collection. The model chain, prompt, temperature, and refusal check are hardcoded, which is why AI involvement is confirmed rather than inferred. Kimi K2's model repository is https://github.com/MoonshotAI/Kimi-K2. OpenRouter has no single product repository that this entry should link."
