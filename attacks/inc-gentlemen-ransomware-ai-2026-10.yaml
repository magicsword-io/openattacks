ai_role_detail: "INC Ransom and The Gentlemen ransomware affiliates use Claude Opus and Kimi AI via OpenCode to automate reconnaissance, lateral movement, and data exfiltration"
technique_summary: "Oct 20, 2026: SOCRadar tracked INC Ransom and The Gentlemen RaaS affiliates deploying AI agents via OpenCode framework. Agents powered by Claude 3.5 Opus (Anthropic) and Kimi (Moonshot AI, Chinese). Workflow: (1) Initial access via RDP brute-force or stolen credentials; (2) Deploy OpenCode agent with 'network-recon', 'privilege-escalation', 'data-discovery' skills; (3) Agent autonomously scans Active Directory, identifies high-value targets (domain controllers, file servers, backups), maps network topology; (4) Agent generates PowerShell/C# payloads for privilege escalation (leveraging Kimi for Chinese-language Windows environments); (5) Automates data exfiltration staging to Mega/SFTP; (6) Deploys ransomware after validation of backup destruction. SOCRadar observed affiliates using abliterated models (uncensored variants refusing no requests). Both groups share OpenCode infrastructure and AI access via underground markets. Detection: monitor for OpenCode agent indicators (Python process with LLM API calls), alert on rapid automated AD queries, check for Anthropic/Moonshot API traffic from unexpected sources, review PowerShell/C# script generation patterns characteristic of LLM output."
initial_access: "RDP brute-force, stolen VPN credentials, phishing with malware loaders"
