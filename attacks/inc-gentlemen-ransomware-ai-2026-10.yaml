attribution_or_cluster: "INC Ransom affiliates, The Gentlemen affiliates; financially motivated ransomware-as-a-service operations; shared AI infrastructure access via underground markets"
scale_and_metrics: "Unknown number of intrusions; SOCRadar tracking Oct 2026; affiliates share AI infrastructure and techniques across both RaaS families"
prevention_angle: "Enforce MFA on RDP/VPN; monitor for rapid automated AD enumeration; detect OpenCode agent processes; block or monitor Anthropic/Moonshot API traffic from non-developer endpoints; use behavioral analytics detecting LLM-generated script patterns; implement EDR detecting automated reconnaissance; segment networks to slow lateral movement"
related_magicsword_projects: []
source_notes: "SOCRadar Dark Web Team analysis. Related to n0n ransomware OpenCode campaign (socradar-n0n-ransomware-ai-2026-10). INC Ransom and The Gentlemen represent shift toward RaaS affiliates sharing AI agent infrastructure for operational automation. Detection: look for OpenCode Python agent process with network recon modules, monitor Anthropic API (api.anthropic.com) and Moonshot API traffic, alert on rapid AD queries from single source, check PowerShell/C# scripts for LLM generation patterns (verbose comments, specific formatting, error-handling characteristics)."
