technique_summary: ARTEX planner agent activity observed Sep 24-Oct 27 2026 by Unit 42. Agent autonomously harvested source maps, OpenAPI specifications, and runtime-config.json files. Attempted OAuth redirect URI abuse and password spraying. Successfully self-registered on exposed APIs without authentication. Read approximately 50 MB of data. Wrote data to an unauthenticated development document store. Attack demonstrates autonomous API reconnaissance and exploitation capabilities. Microsoft tracks related activity as Storm-0940 with Oct 21 observations.
