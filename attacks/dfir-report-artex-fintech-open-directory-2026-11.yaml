region_notes: "The DFIR Report does not name victim countries or organisations. Sector labels are not a geography."
attribution_or_cluster: "Unknown operator. The DFIR Report attributes the logs to an operator running ARTEX and does not name the person, a group, or a country."
scale_and_metrics: "Dozens of fintech, crypto-payment, and iGaming targets. 46 documented findings with reproduction steps: 11 Critical, 13 High, 16 Medium, and 6 Low. Many findings include exfiltrated secrets. No victim names and no intrusion dates in the post."
prevention_angle: "Remove public database dumps and backups. Keep secrets out of front-end bundles, and rotate any that were shipped, including 2FA seeds and payment keys. Fix path traversal and object-level authorization. Restrict Spring Boot Actuator, Prometheus /metrics, and public Swagger. Protect Redis and block Gopher and other SSRF to internal services."
related_magicsword_projects: []
source_notes: "The finding counts, sectors, and tradecraft are from The DFIR Report's 25 November 2026 posts on X and Mastodon. Both URLs returned HTTP 200 when checked. The post does not name victims, dates of the intrusions, a model, or indicators. The evidence class for this entry is recovered operator artifacts: the engagement logs in the open directory. Link microsoft-artex-github-secrets-keyvault-2026-11 and wiz-artex-harvester-cyberstrikeai-cloud-intrusions-2026-11. This is a separate operator and a separate set of targets from those entries."
