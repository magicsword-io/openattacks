ai_role: attacker_uses_ai_as_operator
ai_role_detail: "The DFIR Report recovered the operator's engagement logs and says ARTEX produced them while running a templated full-chain playbook. The human operator is unidentified. The logs are the evidence that an agent wrote the findings."
technique_summary: "The DFIR Report (25 November 2026) says that while reviewing an exposed open directory it recovered the operator's own engagement logs, produced by ARTEX running a templated full-chain playbook across dozens of fintech, crypto-payment, and iGaming targets. The logs hold 46 documented findings, each with reproduction steps and in many cases exfiltrated secrets: 11 Critical, 13 High, 16 Medium, and 6 Low. Recurring tradecraft is cloud credentials, including API keys and database passwords, harvested from publicly exposed database dumps and backup files; path traversal escalated to production database credentials and root SSH private keys, which the report treats as full host and lateral compromise; Redis reached via Gopher SSRF and then abused for remote code execution; secrets lifted from front-end JavaScript bundles (Vite, Angular, and Ember), including access passwords, 2FA seeds, and live payment keys; IDOR and broken object-level authorization exposing customer PII at scale; and exposed Spring Boot Actuator, Prometheus /metrics, and public Swagger. Victims are unnamed. The post publishes no indicators. The evidence is the recovered operator artifacts in the open directory. Related entries: microsoft-artex-github-secrets-keyvault-2026-11 and wiz-artex-harvester-cyberstrikeai-cloud-intrusions-2026-11."
initial_access: "The recovered logs document several paths, not one vector for every target: publicly exposed database dumps and backup files, path traversal, Gopher SSRF to Redis, secrets in front-end bundles, IDOR, and exposed Actuator, metrics, and Swagger."
ai_tooling_and_models:
  - "ARTEX. The DFIR Report says the engagement logs were produced by ARTEX. It does not name the model."
frameworks:
