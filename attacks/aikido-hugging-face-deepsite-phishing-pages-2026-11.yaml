attack_flow:
  nodes:
    - id: prompt
      title: A prompt to DeepSite
      description: "An attacker prompts DeepSite. An open-weight model generates the site. In 24 of 29 DeepSite pages the commit messages are those prompts, in French, English, Hindi, Portuguese, Indonesian, or Russian."
      kind: ai
      source_urls: &aikido
        - https://www.aikido.dev/blog/hugging-face-phishing-pages
    - id: space
      title: Published as a Hugging Face Space
      description: "The result is a Space, a git repository served at *.hf.space. 29 pages carry deepsite/deepsite-v3. 26 link to the DeepSite badge or README and use the default README text."
      kind: access
      source_urls: *aikido
    - id: page
      title: Fake login, bots hidden
      description: "The pages impersonate brand logins. One Microsoft page sends email, password, phone, and date of birth to Telegram and then redirects to Outlook. Prompts also ask to hide the page from crawlers and headless browsers and to reject the first password."
      kind: execution
      source_urls: *aikido
    - id: steal
      title: Telegram, Discord, or a form service
      description: "25 Telegram bots, 11 Discord webhooks, and 6 form services received credentials, OTPs, card details, bank transaction passwords, phone numbers, dates of birth, and IPs."
      kind: impact
      source_urls: *aikido
    - id: down
      title: Reported, then paused or removed
      description: "Aikido reported the 42 pages to Hugging Face on 16 October 2026. All were paused or removed by 29 October 2026. Visitor counts are unknown."
      kind: unknown
      source_urls: *aikido
  edges:
    - source: prompt
      target: space
    - source: space
      target: page
    - source: page
      target: steal
    - source: steal
      target: down
