ai_role: attacker_uses_ai_as_operator
ai_role_detail: "Aikido says attackers prompted DeepSite, Hugging Face's AI website builder, and an open-weight model generated the site, which was published as a Space. The catalog has no llm-generated-content role. attacker_uses_ai_as_operator is the closest value: a person used a generative builder to produce phishing pages. The pages are not described as an agent operating the victim network. llm_generated_malware is not used, because the reported objects are phishing pages rather than malware."
technique_summary: "Aikido Security (Hunter Schwartz, 24 November 2026, updated 25 November 2026) says Hugging Face Spaces are git repositories served as apps at *.hf.space, and DeepSite, Hugging Face's AI website builder, generates a site from a prompt with an open-weight model and publishes it as a Space. On 16 October 2026 Aikido found 42 phishing and credential-stealing pages on Spaces, impersonating 28 brands: Microsoft 365/SKEMA, Google/Gmail, Roundcube, Zimbra, Orange Mail, ID.me, PayPal, Bank of America, Chase, Coinbase, Scotiabank, CIBC, Coris Bank, Orange Money, SumUp, Instagram, Facebook, Netflix, Discord, Adobe, Roblox, Brawl Stars, and Growtopia, plus a C2 panel and a file grabber. 34 were live and 8 were paused. 29 of the 42 were built with DeepSite. All 29 carry the deepsite/deepsite-v3 tag. 26 link to a DeepSite badge or README (enzostvs-deepsite.hf.space, huggingface.co/deepsite, deepsite.hf.co). They use the default README text. In 24 of the 29, the commit messages are the attacker's prompts. cgfcbftdsf/microsoft-auth-portal, at cgfcbftdsf-microsoft-auth-portal.static.hf[.]space, is a fake Microsoft login that sends email, password, phone, and date of birth to a Telegram bot and then redirects to real Outlook. It was built in 15 commits, 14 of them within 90 minutes on 25 October 2025, with prompts in French. Prompts asked for an Instagram verified phishing page, in Hindi and English, to send data to Telegram, to forward logins along with the user agent and IP, to fix a button that did not send to a Discord webhook, to hide the page from Googlebot, Bingbot, headless browsers, curl, and wget, and to reject the first password attempt. Prompt languages were French, English, Hindi, Portuguese, Indonesian, and Russian. Exfiltration was 25 Telegram bots, 11 Discord webhooks, and 6 form services (submit-form.com, Formspree, and EmailJS). The pages captured OTPs, card details, bank transaction passwords, phone numbers, dates of birth, and IPs. 13 pages were not DeepSite and came from three repeat operators, Account-sign-in, asigmaguy, and ntrsdasda. The oldest page, InstagramPage/look-this, was published on 26 April 2025. 23 pages were older than a year. Aikido reported the pages to Hugging Face on 16 October 2026. All were paused or removed by 29 October 2026. Visitor and victim counts are unknown. Deeba Ahmed (Hackread, 26 November 2026) restates the report. The Hugging Face model-lure case is a different incident: jfrog-artex-hugging-face-self-leaking-models-2026-11."
initial_access: "A person opens a Hugging Face Space link and submits credentials, and in some cases a one-time code or card data, to a fake login page. Aikido does not describe how the links were delivered."
ai_tooling_and_models:
  - "DeepSite, Hugging Face's AI website builder. It generates a site from a prompt with an open-weight model and publishes the result as a Space. Aikido does not name the model."
  - "Hugging Face Spaces, served at *.hf.space."
other_tooling:
  - "25 Telegram bots, 11 Discord webhooks, and 6 form services (submit-form.com, Formspree, and EmailJS)"
victims_and_sectors: "Aikido does not name victims or a visitor count. The pages impersonate 28 brands across email, banking, payments, social media, and games, plus a C2 panel and a file grabber."
regions:
  - unknown
region_notes: "Aikido does not name victim countries. Brand names and prompt languages are not victim locations. The Space hostnames are attacker pages on Hugging Face, not victim infrastructure."
attribution_or_cluster: "Multiple unattributed operators. Aikido names three repeat operators on the non-DeepSite pages: Account-sign-in, asigmaguy, and ntrsdasda. It does not attribute a group or a country."
scale_and_metrics: "42 pages impersonating 28 brands, found 16 October 2026. 34 live and 8 paused. 29 built with DeepSite, 26 with a DeepSite badge or README, and 24 whose commit messages are the prompts. 13 non-DeepSite pages from three operators. Exfiltration: 25 Telegram bots, 11 Discord webhooks, and 6 form services. Oldest page published 26 April 2025. 23 pages older than a year. All paused or removed by 29 October 2026. Visitor and victim counts unknown."
prevention_angle: "Treat *.hf.space links in email like any other free-hosting domain. Search DNS, proxy, and email logs for the hostnames in this entry. If there is a match, reset the password and revoke sessions. OTP was captured, so MFA alone is not enough. Aikido also says platforms should check, at publish time, static pages that post credentials to Telegram, Discord, or form services."
related_magicsword_projects: []
source_notes: "Counts, prompt themes, operator names, and the 42 hostnames are from Hunter Schwartz's Aikido post (24 November 2026, updated 25 November 2026). Hackread (Deeba Ahmed, 26 November 2026) restates it. The domains below are the hostname column of Aikido's indicators table, in that table's order, with the dot before space defanged. DeepSite badge hosts (enzostvs-deepsite.hf.space, huggingface.co/deepsite, deepsite.hf.co) are the builder, not phishing pages, and are not listed as indicators. submit-form.com, Formspree, and EmailJS are named as exfiltration services, not as attacker-owned domains. No Telegram bot tokens or Discord webhook URLs are copied here. Link jfrog-artex-hugging-face-self-leaking-models-2026-11 only as another Hugging Face case. That incident is an ARTEX model lure, not these phishing Spaces, and this entry does not use ARTEX."
last_reviewed: "2026-11-26"
