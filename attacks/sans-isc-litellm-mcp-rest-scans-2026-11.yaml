id: sans-isc-litellm-mcp-rest-scans-2026-11
name: Scans exploit LiteLLM MCP test endpoint for unauthenticated command execution (CVE-2026-42271 + Starlette BadHost CVE-2026-48710)
date_reported: 2026-11-16
researcher: Johannes B. Ullrich (SANS Internet Storm Center); exploit chain validated by Horizon3.ai
