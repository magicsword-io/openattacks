magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: null
ai_role_detail: "The scans targeted the MCP server test feature of the LiteLLM AI gateway."
technique_summary: "SANS ISC honeypots saw requests targeting LiteLLM MCP test endpoints starting the weekend of Nov 14–15, 2026. The traffic was consistent with a chain that combines a Starlette request handling flaw (CVE-2026-48710) with command execution in vulnerable LiteLLM versions (CVE-2026-42271). The chain can allow unauthenticated code execution with the privileges of the proxy process. The honeypot report documents scanning activity."
initial_access: "Requests targeted internet-facing LiteLLM proxies and included anomalous Host headers consistent with an authentication bypass attempt."
ai_tooling_and_models:
  - "LiteLLM proxy / AI gateway (https://github.com/BerriAI/litellm), versions 1.74.2 through 1.83.6"
other_tooling:
  - "Starlette versions before 1.0.1 (CVE-2026-48710)"
  - "aiohttp-based scanner (User-Agent Python/3.14 aiohttp/3.14.5)"
victims_and_sectors: "Organizations running internet-facing LiteLLM proxies"
regions:
  - unknown
attribution_or_cluster: "Unattributed scanning observed by SANS ISC honeypots"
scale_and_metrics: "SANS ISC honeypots started seeing the requests the weekend of Nov 14–15, 2026. The diary does not publish a hit count."
prevention_angle: "Upgrade LiteLLM to 1.83.7 or later and Starlette to 1.0.1 or later. Restrict access to the MCP test endpoints and allow only expected hostnames at ingress. If compromise is suspected, review child processes spawned by LiteLLM and rotate exposed provider credentials."
related_magicsword_projects: []
source_notes: "SANS ISC documents the scan traffic and timing. Horizon3.ai validated the chained impact. The project advisories document affected and fixed versions. This is a different LiteLLM incident from socket-litellm-supply-chain-2026-10."
last_reviewed: 2026-11-16
region_notes: "The honeypot diary does not name a target country."
