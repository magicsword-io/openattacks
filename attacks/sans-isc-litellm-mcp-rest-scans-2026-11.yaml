attack_flow:
  nodes:
    - id: badhost
      title: Bypass the API key check
      description: "A malformed Host header (localhost], [localhost, 127.0.0.1]) confuses Starlette's URL-based access control."
      kind: access
      source_urls:
        - https://isc.sans.edu/diary/33522
    - id: mcp-test
      title: Submit a stdio MCP server config
      description: "POST /mcp-rest/test/tools/list with transport stdio and an attacker-chosen command."
      kind: ai
      source_urls:
        - https://isc.sans.edu/diary/33522
    - id: exec
      title: Command runs on the proxy host
      description: "LiteLLM spawns the command as the proxy process, which can read stored provider keys."
      kind: impact
      source_urls:
        - https://horizon3.ai/attack-research/vulnerabilities/cve-2026-42271-chained-with-cve-2026-48710/
  edges:
    - source: badhost
      target: mcp-test
    - source: mcp-test
      target: exec
