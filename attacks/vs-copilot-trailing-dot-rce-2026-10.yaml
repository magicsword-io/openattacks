technique_summary: Copilot edit guard blocked writes to .mcp.json via string
  compare. Writing '.mcp.json.' bypasses check; Win32 strips trailing dot so
  write lands on real MCP config → RCE via MCP server command or ripgrepPath
  pointing at arbitrary binary. Chainable via indirect prompt injection from a
  file or MCP server. Shared Microsoft.VisualStudio.Copilot.Core.dll affects VS
  2022/2026 and SSMS. Patched with GetFullPath.
initial_access: Indirect prompt injection (file content / MCP) into Copilot
  chat, or misaligned agent
ai_tooling_and_models:
  - GitHub Copilot in Visual Studio / SSMS
  - MAI-Code-1-Flash (PoC model)
other_tooling:
  - MCP config
  - ripgrepPath setting
victims_and_sectors: Visual Studio and SSMS users
regions:
