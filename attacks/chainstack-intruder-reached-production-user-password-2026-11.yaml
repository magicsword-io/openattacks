atlas_techniques:
  - id: AML.T0049
    rationale: "The entry point was an internet-exposed Grafana. Chainstack says no software vulnerability was exploited; the data-source proxy and the unchanged default administrator account were abused."
    source_urls:
      - https://chainstack.com/security-incident-nov-2026/
  - id: AML.T0053
    rationale: "An unauthenticated MCP tool server became the command executor, and Chainstack says the attacker used ARTEX."
    source_urls:
      - https://chainstack.com/security-incident-nov-2026/
  - id: AML.T0055
    rationale: "Development credentials, a production secrets-manager bulk read, Kubernetes secrets, and the instance-metadata token were stolen."
    source_urls:
      - https://chainstack.com/security-incident-nov-2026/
  - id: AML.T0012
    rationale: "The Grafana default administrator account, cloud service-account keys, and a VPN peer key were reused as valid accounts, including from development into production."
    source_urls:
      - https://chainstack.com/security-incident-nov-2026/
attack_flow:
  nodes:
    - id: grafana
      title: Default-credential Grafana
      description: "From Oct 26 19:26 UTC a test Grafana on a development cluster, reachable from the internet with unchanged default administrator credentials, proxies requests to internal services."
      kind: access
      source_urls:
        - https://chainstack.com/security-incident-nov-2026/
    - id: mcp-exec
      title: MCP server runs commands
      description: "At 21:01 the proxy reaches an unauthenticated MCP tool server whose service account is cluster-admin. Chainstack says that server was the command executor. artx and artex names appear on the artifacts."
      kind: ai
      source_urls:
        - https://chainstack.com/security-incident-nov-2026/
    - id: prod-secrets
      title: Development credentials reach production
      description: "Machine credentials from development work in production. Oct 31 brings a bulk read of the production secrets manager, a VPN key into the database network, and queries against production databases."
      kind: execution
      source_urls:
        - https://chainstack.com/security-incident-nov-2026/
    - id: persist
      title: Chisel and a systemd timer
      description: "On Oct 30, cron starts a Chisel reverse SOCKS tunnel to 185.242.233[.]68:10800 and the artx-guard systemd timer beacons to port 8088. Copied credentials last work at Nov 2 06:28 UTC."
      kind: impact
      source_urls:
        - https://chainstack.com/security-incident-nov-2026/
  edges:
    - source: grafana
      target: mcp-exec
    - source: mcp-exec
      target: prod-secrets
    - source: prod-secrets
      target: persist
