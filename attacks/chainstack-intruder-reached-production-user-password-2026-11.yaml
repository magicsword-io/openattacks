detections:
  - name: Potential Protocol Tunneling via Chisel Client
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/command_and_control_linux_chisel_client_activity.toml"
    notes: "Selected from a security-detections-mcp search for chisel. Linux endpoint. Chisel client command-line flags followed by a network connection from an uncommon process. Matches the reverse SOCKS tunnel Chainstack found on development hosts. The Windows chisel.exe rule is not cited."
  - name: Systemd Timer Created
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_systemd_scheduled_timer_created.toml"
    notes: "Selected from a security-detections-mcp search for systemd timer. Linux endpoint. Creation of a systemd timer, including user timers. Matches artx-guard.timer. The rule does not look for the artx-guard name or the :8088/artx-beacon URL."
  - name: Cron Job Created or Modified
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_cron_job_creation.toml"
    notes: "Selected from a security-detections-mcp search under T1053.003. Linux endpoint. A new or changed cron job. Chainstack found /etc/cron.d/artx-ngx launching Chisel. The rule is the cron write, not the Chisel binary."
  - name: Kubernetes Privileged Pod Created
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/kubernetes/privilege_escalation_privileged_pod_created.toml"
    notes: "Selected from a security-detections-mcp search for privileged pod. Kubernetes audit. Creation of a pod or container with privileged mode. Matches the production pod Chainstack described with host networking and host PID. A hostPath mount that is not privileged needs the hostPath rule instead."
  - name: Kubernetes Pod Exec Cloud Instance Metadata Access
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/kubernetes/credential_access_kubernetes_pod_exec_cloud_instance_metadata.toml"
    notes: "Selected from a security-detections-mcp search for instance metadata. Kubernetes audit of pod exec commands that reference a cloud metadata endpoint. Chainstack says a host-network pod took the node cloud token from the instance metadata service. A token read that never appears in an exec command line will not match."
  - name: Kubernetes Secrets Enumeration
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/application/kubernetes/audit/kubernetes_audit_secrets_enumeration.yml"
    notes: "Selected from a security-detections-mcp search for Kubernetes secrets. Kubernetes audit list on secrets. Chainstack says a production list request returned secret contents, which this list event covers. The follow-on individual reads are a separate get."
  - name: Grafana default login, the data-source proxy, and the MCP server
    format: guidance
    notes: "security-detections-mcp search for Grafana returned no rule about default administrator credentials or /api/datasources/proxy/. The hits were unrelated process rules, so they are not cited. Hunt Grafana logins that still use the default administrator account, new data sources aimed at cluster-internal addresses, and proxy requests to those addresses. The cluster-admin role-binding creation rules are also not cited: Chainstack says the MCP server's service account already had cluster-admin. No indexed rule alerts on an unauthenticated MCP server using a pre-existing cluster-admin account."
