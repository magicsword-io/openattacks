ai_role: attacker_uses_ai_as_operator
ai_role_secondary: ai_agent_or_mcp_as_target
ai_role_detail: "Chainstack's Nov 10 update says the attacker used ARTEX. An unauthenticated internal MCP tool server, running as cluster-admin, was the command executor. That is a secondary case of an AI tool server being abused, not the initial entry."
technique_summary: "Chainstack's incident page (created Nov 3, 2026, technical update Nov 10, page updated Nov 11) says an attacker reached production and customer account data, including password hashes. The Nov 10 update replaces the earlier unknown entry point. A test Grafana instance, deployed in July to a development Kubernetes cluster, was exposed to the internet with the default administrator credentials unchanged and without SSO or basic authentication in front. From Oct 26 at 19:26 UTC the attacker used Grafana's data-source proxy to reach internal services. A Grafana administrator can point a data source at any URL, and the proxy forwards the request. Over about two hours that reached dozens of internal services, including identity, database, automation, and monitoring. At 21:01 the proxy reached an internal MCP tool server that exposes Kubernetes operations to AI agents. It required no authentication, and its service account was bound to cluster-admin. Chainstack says network flows and the changes that followed show this server was the command executor; the individual tool calls were not recovered. The same night the attacker tested an internal workflow engine with names artx-check-* and artex-verify-*, created administrator users in the development identity provider, and replaced JavaScript in a development web app by mounting ConfigMaps over the served files. On Oct 27 the same loader was applied to staging and to the development Grafana. The loader referenced hxxps://silverbullet[.]icu/p/17fbad90-3094-4198-9b60-49fc852e331d/bootstrap.js and the marker window.__artx7f3a. No software vulnerability was exploited. Development machine credentials also worked in production. On Oct 29 those credentials and a BI-tool API key were used from 187.15.134[.]80. Between 17:03 and 17:12 a workflow was rewritten in the platform database so it ran shell commands, triggered with a valid webhook token through Grafana, then restored. That returned the automation pod's environment, its Kubernetes service-account token, and a machine identity. At 17:49 production Kubernetes secrets were listed from 18.237.52[.]142. On Oct 31, from 01:40 to 08:31, 187.15.134[.]45 bulk-read the production cloud secrets manager, created extra keys, and created a Kubernetes service account artx-sa with role artx-observer and token artx-sa-token. A short-lived pod on the host network took the node's cloud token from the instance metadata service. Another cluster ran a privileged pod with host networking and host PID and installed a static-pod relay to 185.242.233[.]68:39443. A compromised VPN peer key from that address reached the database network and flapped the tunnel, which is how the intrusion was noticed. Attacker pods queried production databases, including PostgreSQL pg_shadow on one instance. On Oct 30 a cron job ran Chisel (https://github.com/jpillora/chisel) as a reverse SOCKS tunnel to 185.242.233[.]68:10800, and a systemd timer named artx-guard beaconed to 185.242.233[.]68:8088/artx-beacon. The same host also served a VPN client on port 9331. Access paths were cut on Oct 31. Copied tokens kept working until 06:28 UTC on Nov 2. Chainstack assesses with high confidence that the attacker used ARTEX, from artx/artex markers such as artex-i37257-*, parallel paths, and chisel, and says the indicators do not match the actor-specific lists published for Vapor Panda, Storm-0940, or Storm-3358. Customer nodes, the console, and the API were not modified. Password hashes, organization and account names, member emails, and node credentials are treated as exposed. Payment card data is not stored. ATT&CK techniques Chainstack maps include T1078.001, T1078.004, T1609, T1610, T1611, T1053.003, T1053.006, T1552.005, T1552.007, and T1572."
initial_access: "Internet-exposed test Grafana in a development Kubernetes cluster, left on the default administrator credentials, then Grafana's data-source proxy into an unauthenticated MCP tool server whose service account had cluster-admin"
ai_tooling_and_models:
  - "ARTEX (https://github.com/RuoJi6/ARTEX)"
  - "Unauthenticated MCP tool server bound to cluster-admin, used as the command executor"
frameworks:
  - artex
other_tooling:
  - "Grafana data-source proxy"
  - "Chisel (https://github.com/jpillora/chisel)"
  - "systemd timer artx-guard"
victims_and_sectors: "Chainstack, a blockchain infrastructure provider, and its customers' account records (organization names, account-holder names, member emails, password hashes) and node credentials, which Chainstack treats as exposed"
regions:
  - unknown
region_notes: "Chainstack lists offices in the United States and Singapore. The report does not say which country the compromised clusters ran in. Actor attribution is not a victim location."
attribution_or_cluster: "Unnamed. Chainstack attributes the tooling to ARTEX with high confidence and says that does not identify the operator. None of the indicators match the actor-specific sets published for Vapor Panda, Storm-0940, or Storm-3358."
scale_and_metrics: "Development access from Oct 26 19:26 UTC. Production Kubernetes secrets read Oct 29 17:49 UTC. Production secrets-manager bulk reads Oct 31 01:40-08:31 UTC. Last use of a copied credential Nov 2 06:28 UTC. Customer-facing services kept running. Password hashes and node credentials are in scope. Card data was not stored."
prevention_angle: "Do not publish a test Grafana, or any admin UI, without SSO or an equivalent extra login, and replace default administrator credentials at deploy time. Treat a data-source proxy as privileged: allowlist destinations and block cluster-internal addresses that are not approved data sources. An MCP or other AI tool server needs authentication and must not run as cluster-admin. Development credentials must not be valid in production. Alert on secret lists, bulk cloud secret reads, a new privileged or hostPath pod, a systemd timer, cron launching a tunnel, and the same VPN peer key presented from two addresses. artx and artex resource names are a hunt clue only when tied to this behavior."
related_magicsword_projects: []
source_notes: "The Nov 10 technical section is the source for the Grafana entry, the MCP server, the ARTEX assessment, the IPs, and the hashes. The page was updated Nov 11. The Hacker News article is the Nov 3 report, before that section existed. Hashes are of application files the attacker modified to carry the loader, not of a second stage or of host binaries. Chainstack also published Grafana bundle hashes 07691e5949a123e313e1d589288e3831ec8ac30b90c45ab99d3b6ad07f23789a and 455473033f7ecbeafaa70e38f41f924377d54013efedeb0996ee84d3422c10ce, and test-page hashes 7c5925a3bc97983bfbfccdc514edb4dadbdb5b796a0747a764b0dcc4f103ea15 and b4a701949a1489e81754637238ed3f8177520f9f950e655f9357900d9e30aea8. Link barracuda-artex-cloud-key-intrusion-2026-11 and srm-artex-ir-host-artifacts-2026-11 for the i-counter artifact pattern."
