technique_summary: "Sep 2, 2026: Unit 42 observed threat actor deploying multiple parallel AI agents working simultaneously: (1) Web agent exploits application vulnerabilities; (2) Cloud agent pivots through IAM misconfigurations to gain root cloud access; (3) AI-hijack agent identifies and compromises victim's AI API endpoints (LLM inference, embeddings, RAG) for cryptomining, model theft, and prompt injection. Parallel autonomous operation significantly accelerates attack timeline. Multiple victims; hijacked AI endpoints used for unauthorized inference and data exfiltration. Attribution unknown."
