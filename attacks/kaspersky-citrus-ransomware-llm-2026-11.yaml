attribution_or_cluster: "Citrus, Russian-speaking, financially motivated. Kaspersky notes TTP overlap with Toy Ghouls and no shared infrastructure."
scale_and_metrics: "Newly documented group. Hashes and two IPs published. No victim count."
prevention_angle: "Do not reuse contractor VPN credentials. Monitor AD for machine accounts named GHOST plus 8 letters and for CVE-2026-54121 certificate requests pointing at 91.210.109.118. Block the published hashes. Alert on schtasks names KasperskyAgentInstallTask, Sysvc, and Java rpchost agent, and on Deploy-KasperskyGPO.ps1."
related_magicsword_projects:
  - LOLRMM
source_notes: "Hashes, IPs, task names, file paths, GHOST account examples, and the LLM-comment judgment are from the Securelist article. MD5s: Sn00py 17b29b6c9de80402a45e321bbe1168fa and build_64.exe 9eee984b187423c46c10a63d080da15d; Xray d631627131b90d576d77f4bf530e1abe; keylogger e251df2d0b7c3682965efb4d2009a2f4; Meterpreter stager 7107fb029e7c63523e3aca5fc8e56b38; fscan cf903e4a1629aa0582fd0363b5786676. IPs 91.210.109.118 and 91.210.108.180."
