ai_role: llm_generated_malware
ai_role_secondary: attacker_uses_ai_as_operator
ai_role_detail: "During the intrusion the crew ran PowerShell and batch scripts that Kaspersky judges were written by an LLM, based on step-by-step explanatory comments. No prompts or API traces were recovered."
technique_summary: "Kaspersky GERT (Stanislav Larinsky, Vladislav Vlasov, Boris Trefilov; Securelist, Nov 11, 2026) documents Citrus, a Russian-speaking ransomware group that hits Russian companies. Initial access is credentials stolen from contractors' staff, used on corporate VPNs or exposed RDP. During execution the crew runs Windows commands and full PowerShell and batch scripts Kaspersky assesses as LLM-generated because the commands carry comments attackers rarely write, including a disable-admin-account example with verify-result comments, a threaded session-enumeration script, and an edited ransomware GPO deploy script. Privilege escalation includes attempts to exploit CVE-2026-54121 Certighost against AD CS, which created machine accounts named GHOST plus 8 letters (examples GHOSTAUFTAFGS, GHOSTCZYQVAZS, GHOSTIVPRLDZA), with cdc pointing at 91.210.109.118. They also use Impacket atexec and 1C-Shell on 1C:Enterprise. Credential and discovery tools include mimikatz, a modified peeping-tom keylogger at C:\\ProgramData\\Oracle\\Java\\jhost.exe, Snaffler, fscan, ADRecon, and SharpHound. Tunnels are Xray VLESS plus REALITY disguised as mirror.yandex.ru and yastatic.net, plus silent AnyDesk. Before encryption they run steal_tgs.ps1 to collect Telegram tdata. Sn00py ransomware (Go, RSA-2048 and ChaCha20) appends .citrus and drops CITRUS_README.txt. It is pushed by a malicious Kaspersky GPO from KasperskyGPO_Deploy_64.exe SFX archives and Deploy-KasperskyGPO.ps1. Scheduled tasks include Java rpchost agent, KasperskyAgentInstallTask, and Sysvc. Kaspersky notes TTP overlap with Toy Ghouls and no shared infrastructure. Tools: Snaffler https://github.com/SnaffCon/Snaffler, fscan https://github.com/shadow1ng/fscan, Xray https://github.com/XTLS/Xray-core, ADRecon https://github.com/adrecon/ADRecon, Impacket https://github.com/fortra/impacket."
initial_access: "Contractor staff credentials used on corporate VPN or exposed RDP"
ai_tooling_and_models:
  - "LLM-written PowerShell and batch scripts (model not named; no prompts recovered)"
