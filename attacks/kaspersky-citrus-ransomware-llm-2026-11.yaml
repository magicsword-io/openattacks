detections:
  - name: HackTool - Mimikatz Execution
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml"
    notes: "Windows process creation. Mimikatz command lines. Kaspersky lists mimikatz among Citrus credential tools."
  - name: Detect SharpHound Usage
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/detect_sharphound_usage.yml"
    notes: "Windows endpoint. SharpHound collection, which Kaspersky lists in the discovery toolset."
  - name: Remote Access Tool - AnyDesk Silent Installation
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_remote_access_tools_anydesk_silent_install.yml"
    notes: "Windows process creation. Silent AnyDesk install, which matches the remote-access step."
  - name: Windows Scheduled Task Created in a Group Policy Object
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_scheduled_task_created_in_a_group_policy_object.yml"
    notes: "Windows. Scheduled task creation inside a GPO. Citrus deploys Sn00py with Deploy-KasperskyGPO.ps1 and tasks KasperskyAgentInstallTask and Sysvc."
  - name: Creation or Modification of a new GPO Scheduled Task or Service
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/privilege_escalation_gpo_schtask_service_creation.toml"
    notes: "Windows. GPO scheduled-task or service changes, the deployment path for KasperskyGPO_Deploy_64.exe."
  - name: Citrus-specific markers
    format: guidance
    notes: "Also hunt machine accounts matching GHOST plus 8 letters, cdc 91.210.109.118, jhost.exe under C:\\ProgramData\\Oracle\\Java, steal_tgs.ps1, .citrus files, CITRUS_README.txt, and the six published MD5s. No rule names Certighost or Sn00py."
