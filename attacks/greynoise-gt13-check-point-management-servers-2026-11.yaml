detections:
  - name: SSH Authorized Keys File Activity
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/persistence_ssh_authorized_keys_modification.toml"
    notes: "File change or creation whose name is authorized_keys or authorized_keys2. GreyNoise says an SSH key was appended to /root/.ssh/authorized_keys on the hop. The rule does not know whether that key is GT13."
  - name: Modification of Dynamic Linker Preload Shared Object
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/privilege_escalation_ld_preload_shared_object_modif.toml"
    notes: "Linux file modification of /etc/ld.so.preload. GreyNoise saw /usr/lib/.libproc.so in that file via an error string from a failed certificate task. The error string alone is not the file event this rule requires."
  - name: Check Point Run Script, HFS cookie forge, and shared VPN exits
    format: guidance
    notes: "No public Sigma, Splunk, or Elastic rule checked for this entry detects a forged Rejetto HFS admin cookie, a Check Point SmartConsole Run Script task, a policy unload, or a new Internal CA certificate. The 99 addresses are ExpressVPN exits or compromised Check Point devices. The five addresses in this entry are examples from the GreyNoise post, and a shared VPN exit is not sufficient on its own. HASSH eeca2460550b9ded084ecf2f70a75356 is a common OpenSSH 10 hash."
