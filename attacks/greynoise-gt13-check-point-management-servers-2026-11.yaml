attack_flow:
  nodes:
    - id: hfs
      title: Forge an HFS admin cookie
      description: "On 2 October at 13:17 UTC an automated pipeline exploited Rejetto HFS CVE-2026-61500. It collected Math.random() sid values from loginSrp1, rebuilt the V8 PRNG, and forged an admin cookie with allow_session_ip_change set."
      kind: access
      source_urls: &gn
        - https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign
    - id: keys
      title: SSH key on the hop
      description: "On 5 October, HFS middleware hooks ran commands and an SSH key was appended to /root/.ssh/authorized_keys. On 8 October the check-in was uname -a, df -h, and whoami."
      kind: execution
      source_urls: *gn
    - id: hop
      title: Chisel, Nmap, and a failed ZULT pull
      description: "On 19 October a pull of the Linux implant ZULT from data-zt.newpayapp[.]com failed. The actor returned the next day over SSH. On 20 October an unauthenticated HTTP server on the hop received a route scan from a Check Point management server. Nmap and Chisel were installed."
      kind: execution
      source_urls: *gn
    - id: sms
      title: Run Script unloads the firewall
      description: "Victim A ran a Chisel client. exploit.py for CVE-2026-16232 launched more than 100 management tasks, copied the firewall database and Internal CA, minted pivot.p12, and unloaded security policies. Further scripts stole credentials and configuration from a second device through the first."
      kind: impact
      source_urls: *gn
    - id: preload
      title: Failed cert task shows ld.so.preload
      description: "On 26 October a bulk certificate task to 24 management servers failed. One error showed /usr/lib/.libproc.so in /etc/ld.so.preload. On 2 November the hop checked itself for CVE-2026-98432 and dropped IPv4 packets that carry IP options."
      kind: impact
      source_urls: *gn
    - id: agents
      title: Suspected agent harnesses
      description: "GreyNoise suspects separate agentic harnesses for weaponizing, scanning, and auto-exploiting. It does not name a model. It puts little weight on the hours with no hands-on-keyboard activity, and it says the campaign is likely ongoing."
      kind: ai
      source_urls: *gn
