region_notes: "GreyNoise lists these as places where victims had assets, not as one headquarters and not as an origin. It makes no nation-of-origin assessment. The newpayapp registrant state Hai Phong and country code VN are called a possible coincidence and are not an attribution."
attribution_or_cluster: "Unknown. GreyNoise tracks the activity as GT13 and does not attribute a group, motive, or country."
scale_and_metrics: "Confirmed Check Point attack activity from 17 October to 2 November 2026, with the HFS hop activity starting 2 October. At least 22 organizations and 24 management servers. 99 IP addresses, more than 1,400 sessions, more than 800 command lines, and more than 1,200 files. More than 100 management tasks on Victim A. At least 30 Python scripts. GreyNoise says the campaign is likely ongoing."
prevention_angle: "Patch CVE-2026-16232 and Rejetto HFS CVE-2026-61500. Restrict Check Point management access using Check Point's hardening guidance. If a management server was exposed, rotate the Internal CA, certificates, and admin credentials. Check /etc/ld.so.preload on management servers. Alert on unexpected Run Script tasks, policy unloads, and new certificates. Block outbound connections from management servers. The ExpressVPN addresses are shared exits and are not sufficient on their own."
related_magicsword_projects: []
source_notes: "The timeline, counts, and indicators are from the 23 November 2026 GreyNoise post. That post says it summarizes a longer GreyNoise Labs version. Its Read the full report control does not link to a public Labs URL, so none is cited. SecurityWeek, Security Affairs, and The Hacker News restate the campaign. The Hacker News is the source for Check Point's Sergey Shykevich saying CVE-2026-16232 is patched and is not a new vulnerability. The IP addresses below are a subset of the ExpressVPN exits in the GreyNoise post. The full list is in that post. They are shared VPN exits. HASSH eeca2460550b9ded084ecf2f70a75356 is a common OpenSSH 10 hash and is only useful combined with other GT13 behavior. User agents were Mozilla/5.0 (X11; Linux x86_64) research and Mozilla/5.0 research. No victim addresses are included. Link greynoise-papercut-ai-campaign-2026-09."
