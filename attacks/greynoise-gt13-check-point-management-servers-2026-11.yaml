technique_summary: "GreyNoise (Steve Miller, 23 November 2026) tracks GreyNoise Threat 13 (GT13), confirmed attack activity from 17 October to 2 November 2026 against Check Point Security Management Servers at least 22 organizations. Victims had assets in the United Kingdom, Ireland, France, the Netherlands, Greece, Germany, Austria, Bulgaria, Poland, India, Thailand, Vietnam, South Korea, Hong Kong, China, Australia, and the United States. Sectors included financial services, energy, government, transportation, mining, engineering, and manufacturing. GreyNoise makes no attribution, motive, or country assessment. It observed the activity on GreyNoise Global Observation Grid sensors. The actor used 99 IP addresses, all ExpressVPN egress (AS206092) or compromised victim Check Point devices, across more than 1,400 sessions, more than 800 command lines, and more than 1,200 files. On 2 October at 13:17 UTC an automated pipeline exploited Rejetto HFS CVE-2026-61500. It collected Math.random() sid values from loginSrp1, rebuilt V8 PRNG state, recovered the cookie signing key, and forged an admin cookie. The cookie setting allow_session_ip_change was true. On 5 October, HFS middleware hooks ran commands, and an SSH key was appended to /root/.ssh/authorized_keys. On 8 October a check-in ran uname -a, df -h / piped to tail -1, and whoami. On 19 October the actor tried to pull a Linux implant named ZULT through HFS server_code from data-zt.newpayapp[.]com. The download failed. Troubleshooting used ps, curl, and network configuration. The actor returned the next day over SSH. GreyNoise suggests a multi-agent architecture problem. On 20 October, /root/exfil/srv_post2_<redacted>.py was an unauthenticated HTTP server on the hop. The first upload was a route scan from a compromised Check Point management server. The actor installed Nmap and Chisel. Victim A's host ran a Chisel client. Over that tunnel, exploit.py for CVE-2026-16232, a SmartConsole authentication bypass to Run Script adapted from the Metasploit module, launched more than 100 management tasks. Those tasks copied the firewall database and the Internal CA, minted a pivot.p12 certificate, and unloaded security policies, which disabled the firewall. spray_portal.py, comb.py, ssh_comb.py, and ssh_spray.py used default, weak, and victim-themed credentials. pull_<id>.py led to exploit_socks.py and then exploit.py, which stole credentials, Internal CA files, and firewall configuration from a second device through the first. The actor probed NetScaler, Ivanti, vCenter, Exchange, Oracle TNS, and domain controllers, with exploits for CVE-2020-1472, CVE-2023-4966, CVE-2024-21893, CVE-2021-26855, CVE-2021-34473, CVE-2021-21972, and CVE-2023-34048. GreyNoise also lists CVE-2025-5777, CVE-2026-41089, and CVE-2026-98432. At least 30 Python scripts were used, with Nmap, Chisel, Impacket, and Paramiko. On 26 October at 02:17 UTC a bulk certificate task to 24 compromised Check Point management servers, Victim A and 21 others, was issued from elsewhere in the actor infrastructure. Results were copied with scp to /root/exfil/pc_<ip>.txt. All of them failed. One error showed /usr/lib/.libproc.so in /etc/ld.so.preload, which GreyNoise treats as a possible implant. On 2 November at 02:28 UTC the hop checked itself for CVE-2026-98432 and then installed an nftables rule that drops IPv4 packets with IP options, which GreyNoise reads as protection from other actors. GreyNoise saw no hands-on-keyboard activity from about 17:00 to 00:19 UTC and none in the 05:00 UTC hour, and it puts little weight on that gap. newpayapp[.]com was registered on 13 March 2026. The registrant state was Hai Phong and the country code was VN, which GreyNoise calls a possible coincidence. GreyNoise suspects a mature AI-enabled offensive apparatus with separate agentic harnesses for weaponizing, scanning, and auto-exploiting. It says the campaign is likely ongoing. The Hacker News reports Check Point's Sergey Shykevich saying this was not a new vulnerability, that CVE-2026-16232 is patched, and that customers should apply updates and hardening. The GreyNoise post says it is a summary of a longer Labs write-up. The page does not publish a separate Labs URL. Link greynoise-papercut-ai-campaign-2026-09."
initial_access: "Rejetto HFS CVE-2026-61500 on the hop, by forging an admin cookie from Math.random() sid values. Check Point management servers were then reached with CVE-2026-16232, a SmartConsole authentication bypass to Run Script, adapted from the Metasploit module. Check Point says CVE-2026-16232 is a patched issue, not a new vulnerability."
