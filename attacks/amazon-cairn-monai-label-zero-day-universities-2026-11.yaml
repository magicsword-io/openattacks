detections:
  - name: Python Site or User Customize File Creation
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_site_and_user_customize_file_creation.toml
    notes: "Elastic rule on Linux file events. It alerts when sitecustomize.py or usercustomize.py is created. Amazon says a later session wrote a Python reverse shell into sitecustomize.py. Amazon does not name the operating system, so a host that is not covered by this rule's Linux file telemetry will not match. The rule does not detect the MONAI Label upload or the training API call."
  - name: Redis abuse and the failed credential sprays
    format: guidance
    notes: "No Sigma, Splunk, or Elastic rule reviewed for this entry names Cairn or the MONAI Label datastore endpoints. Amazon's failed Redis operation used replication abuse, a Lua sandbox escape, configuration writes, memory corruption, a Log4Shell attempt, Qdrant SSRF, and credential sprays against PostgreSQL and SSH. Hunt unauthenticated Redis, unexpected Redis replication, and credential failures from a single source against SSH, PostgreSQL, and campus portals. Those hunts are not a confirmed rule match for this incident."
