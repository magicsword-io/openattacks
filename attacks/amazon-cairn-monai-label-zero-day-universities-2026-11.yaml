  nodes:
    - id: exposed
      title: Exposed Cairn instance
      description: "On 10 September 2026 Amazon found a public unauthenticated Cairn instance. Project configs, prompts in Simplified Chinese, and AI output were visible. The campaign had started on 8 September against university addresses in East Asia outside mainland China."
      kind: access
      source_urls:
        - https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/
    - id: agents
      title: Agents get a shell-access goal
      description: "The operator supplied target addresses and variations of a goal to obtain shell access. Cairn agents planned and adapted without the operator choosing each step. Amazon does not name the model."
      kind: ai
      source_urls:
        - https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/
    - id: failed
      title: Redis and password attempts fail
      description: "About 16 hours and 148 actions against unauthenticated Redis failed, including a Log4Shell attempt, Qdrant SSRF, and credential sprays. A separate GPU-server operation tried more than 30,000 combinations from about 80 public usernames and also failed."
      kind: execution
      source_urls:
        - https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/
    - id: traversal
      title: MONAI Label path traversal
      description: "Agents mapped a medical-imaging AI application's API, found an upload filename parameter, and confirmed path traversal in about 11 minutes. The maintainers' advisory identifies the application as MONAI Label and the endpoints PUT /datastore/image and PUT /datastore/label."
      kind: execution
      source_urls:
        - https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/
        - https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94
    - id: shell
      title: Root shell via sitecustomize.py
      description: "A later session wrote a Python reverse shell into sitecustomize.py and triggered a training API endpoint. The new Python process loaded the file and opened a root reverse shell."
      kind: impact
