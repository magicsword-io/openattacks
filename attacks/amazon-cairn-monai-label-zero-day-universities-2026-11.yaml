victims_and_sectors: "Universities in East Asia outside mainland China. One university Redis host and one GPU server were attacked without success. One MONAI Label server was compromised with a root shell. A second university network was reached through an operator-supplied proxy. Amazon does not name the universities."
regions:
  - Asia
region_notes: "Amazon says the targets were universities in East Asia outside mainland China and does not name the countries. Mainland China is excluded by that wording, so it is not a victim region. Simplified Chinese and China Standard Time are operator signals. San Jose geolocation in the Censys lead is hosting infrastructure, not a victim country."
attribution_or_cluster: "Unnamed Chinese-nexus operator. Amazon Threat Intelligence assesses moderate confidence from Simplified Chinese prompts, China Standard Time script timestamps, and targeting of universities it describes as likely of strategic interest to China. This is not CL-STA-1238."
scale_and_metrics: "About 48 hours starting 8 September 2026. Redis operation about 16 hours and 148 actions, failed. GPU-server operation more than 6 hours, about 80 usernames and more than 30,000 credential combinations, failed. MONAI Label path from API mapping to arbitrary file write about 11 minutes, then a root shell in a later session. Two published addresses, records dated 8-10 September 2026. Victim count beyond those operations is unknown."
prevention_angle: "Do not expose MONAI Label to untrusted networks. The advisory's workarounds are to set MONAI_LABEL_AUTH_ENABLE=True, not to grant ANNOTATOR to untrusted users, and to run the server as an unprivileged user that can write only the datastore directory. The code fix is pull request 1915. The advisory still lists no patched release. Do not leave Cairn panels on 0.0.0.0:8000 without authentication. Alert on writes to sitecustomize.py and on Redis instances that allow unauthenticated access. Block the two published addresses. A same-host-key lead is not an indicator from the Amazon report."
related_magicsword_projects: []
source_notes: "Campaign dates, the three operations, the root shell, attribution, and the two addresses are from the AWS Security Blog. Amazon's post does not print the product name MONAI Label. BleepingComputer and The Register do, and GHSA-qc22-rmgc-vg94 was reported by aws-sec-vdp and describes the same upload traversal. The advisory's patched-versions field was None on review, even though pull request 1915 is merged. CVE wording is from GHSA-2f43-rwqm-6h67. Amazon cites Gambit Security's report at https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company for a separate financially motivated Cairn case against online retailers. No catalog entry is that report. Link unit42-cairn-cl-sta-1238-2026-11 and cairn-norforge-2026-10. Censys lead, not an IOC. A Censys host snapshot queried at 2026-09-09T12:00:00Z shows 142.4.98[.]145 and 142.4.107[.]34 in AS54600 (PEG TECH INC), geolocated to San Jose, serving an HTTP page titled Cairn on port 8000 (uvicorn) and SSH on port 12686 with the same SSH host key (SHA-256 af825c8d0b6dfc2505b0c59040f8b97effcd37e28bbece0ba693d462fd5e2bce). 142.4.107[.]34 also served a Python SimpleHTTP/0.6 directory listing on port 9999. The listing included cairn-prompts/, 51 files named claude-XXXX-cwd plus a claude-1000 directory, attack1_traversal.snapshot through attack7_pax.snapshot, craft_malicious_snapshot.py, docker_ssrf_probe.sh, docker_exec_rce.py, dns_server.py, dns_callbacks.log, combined_134_passwords.txt, context_passwords.txt, and err_CommonsCollections1.txt and similar err_CommonsCollections names. Whether the claude-XXXX-cwd names are Claude Code working-directory files is not established by the directory listing. A third address, 142.4.107[.]57, presented the same SSH host key in that 9 September snapshot and no Cairn page. It is an unconfirmed lead and is not an IOC. An October snapshot of 142.4.98[.]145 (14 October 2026) no longer showed the Cairn page or port 9999. It showed Apache with PHP 5.6.40 on 8081 and 18082, MySQL 5.6.51 on 33062, and SSH on 12686. The same October check was not repeated here for the other two addresses. No victim IP addresses are included."
