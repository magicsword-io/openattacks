ai_role_detail: "Amazon saw the exposed Cairn instance's project configs, operator prompts, and AI output. The operator supplied target addresses and a shell-access goal. The agents planned, executed, and adapted without the operator choosing each step. Amazon does not name the model."
technique_summary: "CJ Moses (Amazon Threat Intelligence, AWS Security Blog, 20 November 2026) describes a Chinese-nexus operator using the open-source Cairn framework (https://github.com/oritera/Cairn). On 10 September 2026 Amazon found a publicly reachable Cairn instance with no authentication. Its operational history was visible, including project configurations, actor prompts, and AI output. Prompts were in Simplified Chinese, and timestamps in executed scripts used China Standard Time. The visible campaign lasted about 48 hours starting 8 September 2026 and targeted IP addresses of universities in East Asia outside mainland China. The operator gave target address lists and variations of the goal to obtain shell access. The agents then planned, executed, and changed approach without the operator choosing each next step. One operation spent about 16 hours and 148 sequential actions on an unauthenticated Redis instance at one university. Amazon says the agents tried known Redis control techniques, including replication abuse to load code, a Lua sandbox escape, configuration-file writes, and memory corruption, then a Log4Shell attempt against another service on the same host. After those failed, the agents used server-side request forgery in a co-located Qdrant instance to map the internal Docker network and sprayed credentials at PostgreSQL, SSH, and other services. That operation failed. A separate operation of more than 6 hours targeted a university GPU server. The agents built about 80 real usernames from faculty directories, lab sites, archived pages, and papers, then tried more than 30,000 credential combinations against SSH, an admin dashboard, a NAS, a VPN server, and the campus portal. That operation also failed. The successful operation targeted an open-source medical-imaging AI application. BleepingComputer and The Register identify that application as MONAI Label. The agents fingerprinted the framework, mapped API endpoints, found an upload endpoint with a filename parameter, and confirmed path traversal. Amazon says the gap from API mapping to arbitrary file write was about 11 minutes. A later session wrote a Python reverse shell into sitecustomize.py, which Python imports at startup, triggered a training API endpoint so a new Python process would load it, and obtained a root reverse shell. GHSA-qc22-rmgc-vg94 (published 18 November 2026, reported by aws-sec-vdp, fixed in pull request 1915) says PUT /datastore/image takes an unvalidated image parameter and PUT /datastore/label builds its path the same way. The advisory's example value is a relative path such as ../../../tmp/x. Authentication is off by default (MONAI_LABEL_AUTH_ENABLE=False). When authentication is on, the ANNOTATOR role is enough. Affected versions are 0.8.5 and earlier. The advisory's patched-versions field is None, and it says the fix will be in the next MONAI Label release. CVE-2026-133968 (GHSA-2f43-rwqm-6h67) describes the same traversal and says it was exploited in the wild starting in September 2026. Amazon assessed the bug as a zero-day with high confidence because, at the time of the activity, it had no matching fix, issue, advisory, or vulnerability-database entry. After the agents found the bug, the operator supplied a proxy that tunneled into a second university network. The server at the far end ran the same vulnerable software. Amazon infers the operator had already used the zero-day there to build the tunnel, and then directed the agents at other machines on that network. Attribution is Chinese-nexus at moderate confidence, from language, timezone, and targeting. The universities are not named. The victims were not AWS customers. Amazon notified the maintainers and worked with a government partner to notify the victims. Amazon also points to a separate Gambit Security report on a financially motivated actor using Cairn against online retailers. That report is not this campaign. Link unit42-cairn-cl-sta-1238-2026-11 and cairn-norforge-2026-10."
initial_access: "Operator-supplied university IP addresses and a goal to obtain shell access, run by Cairn agents. The successful path was an unauthenticated path traversal in MONAI Label's datastore upload API. The Redis and credential-spray operations failed. The initial access vector for the Cairn host itself is unknown."
