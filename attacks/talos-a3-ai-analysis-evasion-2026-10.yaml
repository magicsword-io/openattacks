ai_role: other
ai_role_secondary: null
ai_role_detail: Malware embeds natural-language instructions to steer defender
  LLM triage (prompt injection against analyzers)
technique_summary: 84 samples across families embed plaintext comments telling
  LLMs to ignore the file, refuse reverse engineering, or claim DoD/IP.
  Direct-instruction trick steered models toward benign ~35% in best runs.
  MANTLEMAZE pairs this with iqvw64e.sys BYOVD (CVE-2015-2291); ROZESHELL pairs
  with AMSI bypass and csc.exe.
initial_access: unknown (varies by family; technique is anti-analysis layer)
ai_tooling_and_models:
  - Prompt injection against defender LLM pipelines
other_tooling:
  - iqvw64e.sys (LOLDrivers)
  - csc.exe (LOLBAS)
  - VMProtect costume sections
victims_and_sectors: unknown
regions:
  - unknown
attribution_or_cluster: CAIRN families FRUITSHELL, PLOTSAFE, HOLLOWCLAD,
  MANTLEMAZE, ROZESHELL; A3 technique class
scale_and_metrics: 84 samples Jan 2025–Jul 2026; ~35% steering in best direct-instruction runs
prevention_angle: Treat sample text as evidence never instruction; prevent
  iqvw64e load via app control
