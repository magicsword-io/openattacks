ai_role_detail: "BUGSTER campaign deploys DeepSeek-powered Hermes autonomous agent and Cursor IDE to conduct attacks against Indian university networks"
technique_summary: "Oct 21, 2026: Unit 42 tracked BUGSTER campaign targeting Indian universities (IIT Delhi, IIT Bombay, IIM Bangalore, NIT Trichy, others). Initial access via phishing with fake scholarship/research collaboration offers. Post-compromise: (1) Install Hermes autonomous agent (github.com/Hermes-Autonomous-Intelligence/hermes) backed by DeepSeek R1/V3 models (Chinese); (2) Install Cursor IDE with attacker-controlled API keys; (3) Hermes agent navigates network, identifies vulnerable systems (unpatched ERP, student portals, research databases); (4) Cursor IDE used to generate exploits for discovered vulnerabilities (SQLi, auth bypass, file upload); (5) Agent automates data theft (student records, research IP, financial data); (6) Deploys ransomware or sells access to other actors. Unit 42 observed 19 compromised universities Oct-Nov 2026. Hermes agent makes autonomous decisions on targets and methods. Detection: monitor for Hermes agent processes (Python, hermes CLI), detect Cursor IDE usage from unexpected accounts, alert on DeepSeek API traffic (api.deepseek.com), review automated scanning patterns, check for rapid exploitation of multiple vulnerabilities."
initial_access: "Spearphishing emails with fake scholarship/research collaboration offers targeting faculty and students"
ai_tooling_and_models:
  - Hermes autonomous agent framework
  - DeepSeek R1 and DeepSeek V3 models
  - Cursor IDE
other_tooling:
  - SQL injection exploits (AI-generated)
  - Authentication bypass exploits
  - File upload vulnerabilities
  - Data exfiltration tools
  - Ransomware (some cases)
victims_and_sectors: "19 Indian universities compromised Oct-Nov 2026: IIT Delhi, IIT Bombay, IIM Bangalore, NIT Trichy, others; education sector; research institutions"
regions:
  - India
attribution_or_cluster: "Unknown actor(s); BUGSTER campaign cluster; financially motivated (data theft, access brokering, ransomware)"
scale_and_metrics: "19 confirmed compromised universities Oct-Nov 2026; student records, research IP, financial data stolen; some victims received ransomware"
prevention_angle: "Security awareness training on phishing; MFA for all accounts; patch ERP and student portals; segment research networks; monitor for Hermes agent and Cursor IDE usage from unexpected accounts; block or alert on DeepSeek API traffic from non-approved sources; implement behavioral analytics detecting automated scanning and exploitation patterns; use EDR monitoring for AI agent processes"
related_magicsword_projects: []
source_notes: "Unit 42 analysis. BUGSTER demonstrates targeting of education sector with AI agents for automated exploitation and data theft. Hermes agent GitHub github.com/Hermes-Autonomous-Intelligence/hermes. Detection: look for Hermes Python process (hermes, autonomous-agent), monitor Cursor IDE installs on non-developer machines, check DeepSeek API traffic (api.deepseek.com), alert on rapid multi-vulnerability scanning, review exploit payloads for AI generation patterns (detailed comments, specific error handling)."
