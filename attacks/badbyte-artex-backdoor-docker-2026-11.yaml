ai_role_detail: "Supply-chain backdoor injected into prebuilt Docker image of ARTEX autonomous offensive AI agent platform; operators deploying backdoored image expose their LLM API keys, MCP configurations, prompts, and harvested target credentials"
technique_summary: "After Autumn-27 closed ARTEX source on Oct 8, 2026, unknown operator controlling Docker Hub accounts tomicdd and congdonglinux (mirror) pushed backdoored ARTEX images while maintaining deleted GitHub bait repository trhhubsd/ARTEX (formerly ptasm) with swapped docker-compose.yml pulling backdoored tomicdd/artex. Prebuilt /app/artex binary adds verifyCaptcha function: unauthenticated POST to /api/auth/login with marked captcha field executes arbitrary sh -c commands as root before password verification, bypassing authentication entirely. Backdoor exposes ARTEX operator's LLM API keys (OpenAI, Anthropic, DeepSeek), MCP server configurations, autonomous agent prompts, and credentials harvested from targets during offensive operations. BadByte analysis (Nov 4, 2026) confirmed /app/artex SHA-256 d5070f52262effe216b840711343bff8f2787f39208d887d8dfd9c673f8d1573, image index digest sha256:ce85d8369ccc1a85423f1f75d2f3afaa2fab759e580da37a6891af2f7392745e, UI build ID 3aC1db3gGU08O4UHbAt4J. Docker Hub removed tomicdd/artex on Nov 5, 2026. Backdoor demonstrates supply-chain risk in offensive AI agent tooling where operators' own credentials become attack surface."
initial_access: "ARTEX operators pull backdoored tomicdd/artex or congdonglinux/artex Docker image via compromised docker-compose.yml in deleted trhhubsd/ARTEX repository"
ai_tooling_and_models:
  - ARTEX autonomous offensive agent (clean source at https://github.com/RuoJi6/ARTEX)
  - Backdoored ARTEX Docker image (tomicdd/artex, congdonglinux/artex - now removed from Docker Hub)
other_tooling:
  - Docker / Docker Compose
  - Unauthenticated /api/auth/login backdoor endpoint
victims_and_sectors: "ARTEX operators conducting offensive security operations; exposed: operator LLM API keys, MCP configurations, autonomous agent prompts, harvested target credentials"
regions:
  - Multiple regions
attribution_or_cluster: "Unknown operator controlling Docker Hub tomicdd (primary) and congdonglinux (mirror) accounts; deleted GitHub repository trhhubsd/ARTEX (formerly ptasm); initially surfaced by Dan Tentler (Viss) on Nov 2, 2026; analyzed by BadByte"
scale_and_metrics: "tomicdd/artex available on Docker Hub Oct 8 - Nov 5, 2026; unknown number of pulls before takedown; backdoor active approximately 4 weeks"
prevention_angle: "Verify Docker image integrity via official repository sources and signed images; audit docker-compose.yml for unexpected image sources; use Docker Content Trust / Notary v2 for image verification; scan container images for suspicious network listeners and authentication bypasses; monitor container logs for unauthenticated command execution attempts; never deploy offensive tooling images from unverified third-party Docker Hub accounts; build ARTEX from official source (github.com/RuoJi6/ARTEX) rather than pulling prebuilt images; implement network segmentation for offensive security infrastructure"
