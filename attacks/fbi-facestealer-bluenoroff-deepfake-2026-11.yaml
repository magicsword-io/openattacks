detections:
  - name: Potential In-Memory Download And Compile Of Payloads
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/macos/process_creation/proc_creation_macos_susp_in_memory_download_and_compile.yml"
    notes: "macOS process creation. A command line that contains both curl and osacompile. Matches the calendly.idcheck.watch cradle."
  - name: Suspicious Curl.EXE Download
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_curl_susp_download.yml"
    notes: "Windows process creation. curl.exe downloading a payload. Matches the front half of the Windows ClickFix cradle. It does not see the powershell ReadToEnd|iex half."
  - name: ReadToEnd stdin cradle
    format: guidance
    notes: "security-detections-mcp and a corpus search found no Sigma, Splunk, or Elastic rule for [Console]::In.ReadToEnd()|iex. The Sigma IEX rules require a space that this cradle omits. Also hunt the NovaStream HTML hash and the four IPs."
