attack_flow:
  nodes:
    - id: account
      title: Hijacked messenger account
      description: "A prior victim's Telegram, LinkedIn, Slack, or Discord account messages contacts and sends a Calendly invite."
      kind: access
      source_urls: &face
        - https://www.ic3.gov/CSA/2026/261112.pdf
    - id: meeting
      title: Typosquat meeting page
      description: "The link, such as uu01webzoom.us or teams.livemeet.us, plays stolen webcam video and starts recording the new target."
      kind: execution
      source_urls: *face
    - id: deepfake
      title: Generator-tagged deepfakes
      description: "Arctic Wolf found 122 assets from seven generators, identified by embedded tags and C2PA rather than appearance. Stolen footage is still most of the scheme."
      kind: ai
      source_urls:
        - https://www.ic3.gov/CSA/2026/261112.pdf
        - https://arcticwolf.com/wp-content/bluenoroff_still_in_the_meeting.pdf
    - id: clickfix
      title: ClickFix paste
      description: "Windows uses curl piped to powershell ReadToEnd|iex. macOS uses curl piped to osacompile."
      kind: execution
      source_urls:
        - https://arcticwolf.com/wp-content/bluenoroff_still_in_the_meeting.pdf
  edges:
    - source: account
      target: meeting
    - source: meeting
      target: deepfake
    - source: meeting
      target: clickfix
