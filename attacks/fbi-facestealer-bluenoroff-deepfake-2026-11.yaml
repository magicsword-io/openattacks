ai_role_secondary: null
ai_role_detail: "The FBI FLASH says the operators use what it calls super intelligence to make deepfake video of well-known crypto and web3 figures from public photos and video, and that stolen real footage is still most of the scheme. Arctic Wolf is the generator provenance: 122 assets from seven generators, identified from embedded tags and C2PA data rather than appearance. Grok Imagine and Google Generative AI were nearly two-thirds, with Wondershare AIGC, GPT-4o, GPT Image, and BytePlus ModelArk making up the rest."
technique_summary: "FBI FLASH AC-111226-MS (Nov 12, 2026) describes FaceStealer, attributed to Sapphire Sleet / BlueNoroff / APT38 / UNC1069. The operators take over a victim's Telegram, LinkedIn, Slack, or Discord account, read the chat history, and message contacts to catch up or talk investment. A Calendly invite sets the time. Shortly before the call, the link points at a typosquat such as uu01webzoom.us or teams.livemeet.us. The copycat Zoom or Teams page plays the trusted contact's stolen webcam recording, often next to other participants. A chat message says the target cannot be heard and walks them through an update, script, or terminal paste that installs a cookie harvester, keyloggers, a screen capturer, and a backdoor. The target's webcam is recorded from the moment the link opens and feeds the next round. The FBI says the group has begun using what it calls super intelligence to make deepfakes of crypto and web3 figures alongside stolen footage. Earlier in 2026 a maintainer of a widely downloaded JavaScript library ran the fix during a fake Teams call, and the operators then published malicious dependencies that were caught quickly. The FBI has also seen attempts against npm maintainers and, recently, Rust crate maintainers. Arctic Wolf's Nov 12 paper adds lures that end in a ClickFix command: NovaStream Player at vip.novaplayer.online (HTML SHA-256 ca14040cc48fbc3b00ea5f74e891266128f7bb3058be400782c5b08436f7668a), a Chrome PDF Viewer kit at chromeupdate.docdock.online and calendly.docdock.online, and calendly.idcheck.watch. The macOS idcheck command is curl piped to osacompile. The Windows cradle is curl piped to powershell -c with [Console]::In.ReadToEnd()|iex. Hosting includes Hostwinds 104.168.149.21, 104.168.149.182, and 104.168.149.230, and Petrosky 83.136.210.38 for docdock.online. Arctic Wolf's appendix lists 98 high-confidence domains. The domains below are that table plus the FBI examples and the lure hosts named in the paper. Link bluenoroff-uses-deepfaked-executives-fake-zoom-2025-06 and unc1069-gemini-deepfake-crypto-2025."
initial_access: "Hijacked messenger accounts, then a typosquat Zoom or Teams page and a ClickFix paste"
ai_tooling_and_models:
  - "Grok Imagine"
  - "Google Generative AI"
  - "Wondershare AIGC"
  - "GPT-4o and GPT Image"
  - "BytePlus ModelArk"
other_tooling:
  - "Stolen webcam recordings"
  - "ClickFix terminal paste"
  - "NovaStream Player lure"
victims_and_sectors: "Cryptocurrency and web3 individuals and companies, plus open-source maintainers. The FBI says the group stole more than $400 million in 18 months."
regions:
  - Multiple regions
attribution_or_cluster: "Sapphire Sleet, BlueNoroff, APT38, UNC1069, Dangerous Password, CryptoCore, Stardust Chollima. FBI FLASH AC-111226-MS. Arctic Wolf independently attributes the activity to BlueNoroff."
scale_and_metrics: "More than $400 million stolen in 18 months, per the FBI. Arctic Wolf: 122 AI-generated assets from seven generators, and 98 high-confidence domains on the Hostwinds cluster."
prevention_angle: "Treat a meeting link that arrives in chat just before the call as hostile until the domain is the vendor's. Do not paste a command from a call. On Windows, hunt curl.exe piped into powershell with ReadToEnd and iex. On macOS, hunt curl and osacompile in the same command line. Block the domains and the four IPs below."
related_magicsword_projects: []
source_notes: "The takeover loop, the two example typosquats, the deepfake statement, and the maintainer supply-chain note are from the FBI PDF. Generator counts, the ClickFix command lines, the Hostwinds and Petrosky addresses, the NovaStream hash, and the high-confidence domain table are from the Arctic Wolf white paper. The Sigma IEX rules require a space in '| iex' or 'iex ', and the published cradle is ReadToEnd()|iex with no space, so those rules are not cited. The osacompile run-only rule requires -x and -e, and the idcheck command uses osacompile -o, so that rule is not cited either. There is no attacker GitHub repository."
last_reviewed: 2026-11-15
region_notes: "North Korea is the actor origin from the FBI, not a victim region. Arctic Wolf's target countries are not listed as a closed set, so the entry uses Multiple regions."
