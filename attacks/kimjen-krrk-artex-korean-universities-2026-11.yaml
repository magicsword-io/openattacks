ai_role_detail: "S2W assesses KimJEN used the ARTEX agent framework. The leak contains an ARTEX task path, an agent-style report marked as an authorised CTF, and a job log stopped when its budget ran out. KimJEN denies ARTEX and names CyberStrikeAI as a preference; that use is not confirmed."
technique_summary: "S2W TALON (published 18 November 2026; analysis of public posts and attacker-distributed files through 17 November) profiles KimJEN, also krrk. The persona joined RaidForums on 27 October 2026 and, from 12 November, posted claims of hacking South Korean education institutions and pointed readers to a Telegram channel opened on 26 October. S2W says the channel published claimed stolen data without a sale price. KimJEN says the activity is for fun, claims to be European, and says they can speak Korean. S2W does not assign a country: late-evening activity in Korea time is not treated as proof of residence, some Korean messages look machine-translated, and Chinese-language strings in the leak could be the operator's or could have been produced by a Chinese-language model. Asked about ARTEX, KimJEN denied using it because law enforcement monitors it, and said they prefer CyberStrike. S2W says ac.kr.zip contradicts the denial. It contains the ARTEX task path /home/hd/tools/artex/ARTEX/data/tasks/17/ and task ids i2777 and i2843, consistent with a Linux account named hd. A report in police_go_kr.zip is labelled Engagement: authorised CTF and uses status symbols S2W associates with LLM writeups. A log records a job that stopped when its execution budget ran out. A defacement HTML comment reads Prtseek只用于学习和授权场景 (Prtseek is only for learning and authorized scenarios). S2W describes Prtseek as an ARTEX-based tool associated with a Chinese hacking-community user and says that person is not shown to have carried out this intrusion. Yonhap, citing S2W, reports the same limit. On Webcash rERP, a research-administration system shared by many universities, S2W reconstructs an arbitrary file read that stole the remote-deployment key and web-server configuration, use of that key to install a web shell, and collection of accounts, operating-system details, configuration, and keys. S2W describes this rERP path at about 20 universities. On four universities an unauthenticated UNIVais accounting interface returned login accounts, user records, attachment metadata, bank-account details, and login history. Subdomains were replaced with pages reading Hacked by KRRK after index.html was backed up to index.html.bak_YYYYMMDD. Suspected remote-access files were P-a424e320.exe, copied to C:\\Windows\\Temp on Windows, and /tmp/pa_v2.elf on Linux. Other institutions showed web shells with database dumps, SQL injection, unauthenticated APIs, and database credentials taken from Git, including Tomato System eXCampus and university LMS platforms. KimJEN claimed access to about 100 universities and daily further dumps. S2W says that scale is not confirmed. Boannews reports a separate review by Team D4rkn3ttz of ac.kr.zip: 28 universities in the archive, rERP material in 17 folders, and ARTEX and Prtseek strings in Python code treated as a possibility rather than proof. That review also said the files do not by themselves prove the rERP vendor was breached or that every leaked record is authentic."
initial_access: "Arbitrary file read on shared Webcash rERP, then the stolen remote-deployment key. Four universities exposed an unauthenticated UNIVais interface. Other paths in the leak include SQL injection, unauthenticated APIs, and database credentials in Git."
ai_tooling_and_models:
  - "ARTEX (https://github.com/Hinln/ARTEX)"
  - "CyberStrikeAI (https://github.com/AIPentest/CyberStrikeAI), KimJEN's stated preference; use is not confirmed in the leak"
frameworks:
  - artex
other_tooling:
  - Web shell installed with the stolen rERP deployment key
  - P-a424e320.exe
  - pa_v2.elf
  - Prtseek, named only in a defacement comment
victims_and_sectors: "South Korean universities and education institutions using shared Webcash rERP, UNIVais, Tomato System eXCampus, and university learning-management systems. S2W describes about 20 universities on rERP and four on UNIVais. Boannews, citing Team D4rkn3ttz, lists 28 universities in ac.kr.zip."
regions:
  - South Korea
region_notes: "South Korea is the victim location. KimJEN's claim to be European, Chinese-language artifacts, and Korea-time Telegram activity are not a country attribution and are not victim locations."
attribution_or_cluster: "KimJEN (krrk). S2W attributes the posts and the leak to that persona and does not assign a country. Team D4rkn3ttz reviewed the same leak separately, as reported by Boannews."
scale_and_metrics: "S2W: about 20 universities on the rERP path and four on UNIVais, from files posted 12-17 November 2026. The claim of about 100 universities is unverified. Boannews/Team D4rkn3ttz: 28 universities in ac.kr.zip, with rERP material in 17 folders."
prevention_angle: "With the software vendor, review exposed admin, deployment, and test pages, unauthenticated APIs, and missing patches, then disable functions that are not required. Rotate remote-deployment keys and database accounts. Hunt web shells, P-a424e320.exe, and pa_v2.elf. Review admin logins, remote access, and bulk queries. Share the abused function with other institutions on the same product. Do not treat an authorised-CTF label, a Prtseek comment, or a Hacked by KRRK page as authorization."
related_magicsword_projects: []
source_notes: "AI involvement is vendor-asserted and backed by artifacts in the leak S2W analyzed: the ARTEX task path and task ids, the Engagement: authorised CTF report, the budget-stop log, and the Prtseek comment. Team D4rkn3ttz, via Boannews, calls the ARTEX and Prtseek strings a possibility, not proof, so this entry does not raise the confidence above vendor-asserted. CyberStrikeAI is only KimJEN's stated preference and is not a frameworks value. No country is assigned. No network indicators or file hashes were published in these sources. The English S2W page is the same 18 November report as the Korean page."
