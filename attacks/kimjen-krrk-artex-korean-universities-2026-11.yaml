detections:
  - name: Linux Webshell Indicators
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_webshell_detection.yml
    notes: "security-detections-mcp search for webshell returned this Linux process rule. It fits the web shell S2W says was installed on rERP hosts. It does not match the ARTEX task path or the filenames P-a424e320.exe and pa_v2.elf."
  - name: Suspicious Process By Web Server Process
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_webshell_susp_process_spawned_from_webserver.yml
    notes: "security-detections-mcp search for webshell returned this Windows rule. It fits a web server spawning a shell on the Windows hosts where S2W describes the web shell and P-a424e320.exe."
  - name: Suspicious Child Execution via Web Server
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_webserver_suspicious_child_execution.toml
    notes: "security-detections-mcp list_by_mitre T1505.003 returned this Linux rule. It fits a web-server child process after the rERP web shell. It is not a match for UNIVais API reads."
  - name: Windows Process Execution in Temp Dir
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_process_execution_in_temp_dir.yml
    notes: "security-detections-mcp search for Windows Temp returned this rule. S2W says P-a424e320.exe was copied to C:\\Windows\\Temp and executed. The rule is any execution from Temp, not a hash match."
  - name: ARTEX task path, CTF pretext, and named files
    format: guidance
    notes: "security-detections-mcp searches for webshell, Windows Temp, and defacement did not return a rule for /home/hd/tools/artex/ARTEX/data/tasks/17/, task ids i2777 and i2843, Engagement: authorised CTF, the budget-stop log, the Prtseek comment, P-a424e320.exe, or pa_v2.elf. The defacement hits were Windows wallpaper and icon changes, which do not match a replaced index.html. Hunt those strings directly. UNIVais is an application-specific unauthenticated interface, and no returned rule describes that product."
