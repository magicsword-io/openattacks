ai_role_detail: "A homemade queue named maq handed each target to a patched Oh My Pi worker run with --auto-approve against two self-hosted DeepSeek V4.1 endpoints. GOAL.md told an agent to keep working until a real payout above $50,000 USDT. SOCRadar says the operation was human-directed and that full autonomy was not reached."
technique_summary: "SOCRadar Threat Research Unit (published 18 November 2026) describes an unnamed financially motivated operator who had a working PHP2Shell exploit (CVE-2026-109618 and CVE-2026-109619) on 21 October 2026, the day public proofs of concept were released, and aimed it at default PHP/Apache. Open directories exposed the operation: 206.245.153[.]56 was command and control, tool hosting, and loot collection, and 157.180.96[.]7:18082, found on 8 November 2026, was the operator's AI lab. 185.65.134[.]250 appears as an exploit and SSH source. Targeting used Shodan queries for PHP and Apache version banners, from a pool SOCRadar counts at 68,198 hosts. The maq queue dispatched patched Oh My Pi workers with --auto-approve to self-hosted DeepSeek V4.1 endpoints. After a shell, Linux hosts retrieved collect.sh, deep-loot.sh, persist2.sh, and x280.sh from port 8088. Persistence was SSH authorized keys, cron beacons, PHP web shells, a Nextcloud application named Beacon, a Laravel route-cache backdoor, and a localhost-only Dropbear tunnel. GOAL.md told an agent to chase more than $50,000 USDT autonomously until a real payout. SOCRadar says that payout was not confirmed: a large USDC withdrawal stayed pending and encrypted bitcoin was not taken. The completed impact on that track was about 3.3 million user records from an unauthenticated Redis instance. Across both directories the operator attacked 595 IP addresses in 57 countries, and SOCRadar assesses 404 hosts as compromised. The actor is unnamed. SOCRadar's confidence in an initial-access-broker pattern is moderate, and its confidence in the operator's identity is low. This is a different operator from dream-chinese-nexus-operator-claude-code-2026-10."
initial_access: "PHP2Shell (CVE-2026-109618 and CVE-2026-109619) against exposed PHP/Apache, selected from Shodan."
ai_tooling_and_models:
  - "Oh My Pi (https://github.com/can1357/oh-my-pi), patched workers started with --auto-approve"
  - "DeepSeek V4.1, self-hosted on two endpoints"
  - maq queue, operator-built, with no public project identified
other_tooling:
  - "PHP2Shell (https://github.com/3em0/php2shell, https://github.com/9bie/php2shell-bypass-aslr-exp)"
  - collect.sh
  - deep-loot.sh
  - persist2.sh
  - x280.sh
  - Dropbear
  - Nextcloud Beacon app
  - Laravel route-cache backdoor
victims_and_sectors: "Exposed PHP/Apache hosts, including custom PHP applications, Nextcloud, and a small number of payment and other sector systems SOCRadar could identify. Selection followed the software banner, not a named sector."
regions:
  - Multiple regions
region_notes: "SOCRadar counts victim hosts in 57 countries and does not list them here. 206.245.153[.]56, 157.180.96[.]7, and 185.65.134[.]250 are operator infrastructure, not victim locations."
attribution_or_cluster: "Unnamed. SOCRadar assesses a financially motivated operator in an initial-access-broker pattern, with low confidence in identity. Not the Dream PHP2Shell operator."
scale_and_metrics: "595 IP addresses attacked in 57 countries and 404 hosts assessed compromised. About 290,000 exfiltrated files (9.5 GB). About 3.3 million user records from an open Redis instance. The GOAL.md payout above $50,000 USDT was not confirmed."
prevention_angle: "Upgrade exposed PHP to a fixed release, then restart the web server, and still hunt hosts that were exploited before the patch. Block and search for 206.245.153[.]56, 157.180.96[.]7, and 185.65.134[.]250, especially port 8088 and high ports used for reverse shells. Hunt new authorized_keys entries, cron beacons, /tmp/beacon.sh, web shells, a Nextcloud Beacon app, a Laravel route-cache backdoor, and Dropbear listening on localhost. Rotate cloud keys, database credentials, and SSH keys from exposed hosts. Do not treat an agent goal file as proof that a payout occurred."
related_magicsword_projects: []
source_notes: "Confirmed AI use is the maq queue, the Oh My Pi workers, the DeepSeek endpoints, and GOAL.md, recovered from the operator's own open directories. SOCRadar says an AI worker also ran the collector on the operator's lab by mistake. The same lab notes mention other attempts, including a React server-component scanner and exposed services. Those are not this PHP2Shell chain. No Sigma, Splunk, or Elastic rule names maq, the Nextcloud Beacon app, the Laravel token, or Dropbear as used here. dream-chinese-nexus-operator-claude-code-2026-10 is a different operator and is linked both ways. Identity and country are unknown. Indicators below are the operator infrastructure and tool hashes SOCRadar published for defense."
