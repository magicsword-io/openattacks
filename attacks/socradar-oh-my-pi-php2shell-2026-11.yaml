detections:
  - name: Potential PHP2Shell Exploitation Attempt
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/initial_access_potential_php2shell_exploitation_attempt.toml
    notes: "security-detections-mcp search for PHP2Shell returned this rule. It matches the PHP fatal-error signature Elastic associates with CVE-2026-109618 and CVE-2026-109619 in nginx and Apache error logs. It does not confirm code execution."
  - name: Cisco Secure Firewall - PHP2Shell Exploitation Attempt
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/network/cisco_secure_firewall___php2shell_exploitation_attempt.yml
    notes: "security-detections-mcp list_by_cve for CVE-2026-109618 returned this rule. It matches PHP2Shell HTTP on Cisco Secure Firewall. SOCRadar does not say the victims were Cisco appliances. Use it where that sensor sees the exploit traffic."
  - name: Potential PHP Reverse Shell
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_php_reverse_shell.yml
    notes: "security-detections-mcp search for PHP and Linux shell returned this rule. It fits PHP spawning a reverse shell after PHP2Shell. It does not encode CVE-2026-109618."
  - name: Suspicious Download and Execute Pattern via Curl/Wget
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_curl_wget_exec_tmp.yml
    notes: "security-detections-mcp search for curl and sh returned this Linux rule. SOCRadar says compromised hosts fetched collector and persistence scripts and piped them to a shell."
  - name: Linux SSH Authorized Keys Modification
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/linux_ssh_authorized_keys_modification.yml
    notes: "security-detections-mcp search for authorized_keys and list_by_mitre T1098.004 returned this rule. It fits the SSH keys SOCRadar says were written for persistence."
  - name: Cron Job Created or Modified
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_cron_job_creation.toml
    notes: "security-detections-mcp list_by_mitre T1053.003 returned this Linux rule. It fits the cron beacons SOCRadar describes. It does not name /tmp/beacon.sh."
  - name: Suspicious Child Execution via Web Server
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_webserver_suspicious_child_execution.toml
    notes: "security-detections-mcp list_by_mitre T1505.003 returned this Linux rule. It fits a web-server process spawning a shell or collector after the exploit."
  - name: Dropbear, Nextcloud Beacon, Laravel backdoor, and maq
    format: guidance
    notes: "security-detections-mcp search for Dropbear returned only Unusual SSH Client Banner, which excludes the SSH-2.0-dropbear banner, so that rule does not detect this tunnel. Searches did not return a rule for the Nextcloud Beacon app, the Laravel route-cache token, maq, Oh My Pi --auto-approve, GOAL.md, or the script names collect.sh, deep-loot.sh, persist2.sh, and x280.sh. Hunt the published paths, hashes, and the three operator addresses directly. list_by_cve also returned Cisco PHP2Shell payload and upload signatures; the exploitation-attempt rule above is the one included, and the others are the same sensor family."
