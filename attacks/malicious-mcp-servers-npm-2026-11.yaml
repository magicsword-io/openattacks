detections:
  - name: Curl Download Activity from npm Package Install
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/command_and_control_curl_download_from_npm_install.toml"
    notes: "Endpoint, cross-platform. curl spawned from an npm or npx process tree. Fits @rfewqa-fes/mnm-doc-mcp, whose install fetches an off-registry HTTP tarball."
  - name: Suspicious PowerShell from npm Package Install
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/execution_suspicious_powershell_from_npm_install.toml"
    notes: "Windows. PowerShell started from an npm install script. Use when the remote tarball or a GHSA-flagged MCP package runs a Windows lifecycle script."
  - name: Plain-HTTP tarball and GHSA-only packages
    format: guidance
    notes: "Also block http://121.199.24.94/dl/health-utils-1.0.0.tgz and alert on package.json dependencies that are bare http:// tarball URLs. @lemili9804/mcp-weather-server, mcp-contract-tester, and @bestcoolman/dev-mcp are confirmed malicious by GitHub but have no published behavior, so no tighter rule is cited for them."
