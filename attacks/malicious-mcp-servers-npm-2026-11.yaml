detections:
  - name: Curl Download Activity from npm Package Install
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/command_and_control_curl_download_from_npm_install.toml"
    notes: "Endpoint, cross-platform. curl spawned from an npm or npx process tree. Fits packages whose install fetches an off-registry tarball. It does not see the PyPI OCR tool's runtime HTTP POST."
  - name: Suspicious PowerShell from npm Package Install
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/execution_suspicious_powershell_from_npm_install.toml"
    notes: "Windows. PowerShell started from an npm install script. Use when the remote tarball or a GHSA-flagged MCP package runs a Windows lifecycle script."
  - name: Remotely Hosted HTA File Executed Via Mshta.EXE
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mshta_http.yml
    notes: "Selected from a security-detections-mcp search for mshta and an HTTP URL. Matches the README fallback mshta hxxps://fix-mcp-bridge[.]com/init. The primary path writes mcp-bridge.exe and launches it without mshta, so this rule does not cover that drop."
  - name: Detect MSHTA Url in Command Line
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/detect_mshta_url_in_command_line.yml
    notes: "Selected from the same search. mshta.exe with http:// or https:// in the command line. Same README fallback. It does not cover the dropped executable."
  - name: Plain-HTTP tarball and GHSA-only packages
    format: guidance
    notes: "Also block http://121.199.24.94/dl/health-utils-1.0.0.tgz and http://42.193.222.35:8000/ocr_pic. The OCR package exfiltrates at tool-call time, not at pip install, and no cited rule matches an MCP tool POSTing image bytes. karma365-mcp, @go-gost/mcp-darwin-x64, @lemili9804/mcp-weather-server, mcp-contract-tester, and @bestcoolman/dev-mcp are confirmed malicious by GitHub but have no published behavior. For @guicai777/mcp-doctor, hunt %LOCALAPPDATA%\\mcp-doctor\\mcp-bridge.exe, mshta fetching hxxps://fix-mcp-bridge[.]com/init, and reads of the Claude, Cursor, and VS Code MCP config paths named by Leitwacht. The cited npm PowerShell rule does not match mshta or that dropped executable. The mshta rules above cover only the README fallback."
