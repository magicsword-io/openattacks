id: malicious-mcp-servers-npm-2026-11
name: Malicious MCP servers on npm (ifasn, gadgethumans)
date_reported: 2026-11-02
researcher: OpenSSF, Leitwacht
org: OpenSSF, Leitwacht
sources:
  - url: https://github.com/ossf/malicious-packages
    title: OpenSSF Malicious Packages repository
    publisher: OpenSSF
magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: null
ai_role_detail: null
technique_summary: Malicious MCP servers published on npm. @ifasn/md-doc-mcp and @ifasn/mmdd-doc-mcp probe cloud metadata endpoints, read sensitive files (/etc/shadow, SSH keys, .env, Kubernetes tokens), and exfiltrate to 121.199.24.94. gadgethumans-mcp versions 1.0.10-1.0.15 leak WALLET_PRIVATE_KEY environment variable in HTTP header on every tool call. Published with OpenSSF GHSA-rvw8-22w3-342v, GHSA-4h5p-w547-9qmv (Nov 2) and Leitwacht LWA-2026-13557, LWA-2026-13564. Attack exploits trust in MCP ecosystem and npm package distribution.
initial_access: User installs malicious MCP server from npm
ai_tooling_and_models:
  - MCP servers
  - npm packages (@ifasn/md-doc-mcp, @ifasn/mmdd-doc-mcp, gadgethumans-mcp)
other_tooling:
  - Cloud metadata probing (AWS, GCP, Azure)
  - File system access (/etc/shadow, SSH keys, .env, k8s tokens)
  - HTTP exfiltration
victims_and_sectors: AI agent developers, organizations using MCP servers
regions:
  - Multiple regions
attribution_or_cluster: unknown
scale_and_metrics: Three malicious packages identified Nov 2 2026; exact installation count unknown
prevention_angle: Verify MCP server sources before installation; review MCP server permissions and network access; monitor cloud metadata endpoint access; detect unauthorized file reads of sensitive paths; inspect HTTP headers for credential leakage; use MCP server sandboxing; inventory installed MCP packages
related_magicsword_projects:
  - LOLSkills
source_notes: OpenSSF GHSA-rvw8-22w3-342v and GHSA-4h5p-w547-9qmv published Nov 2 2026; Leitwacht advisories LWA-2026-13557 and LWA-2026-13564
