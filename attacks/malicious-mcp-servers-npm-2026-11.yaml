technique_summary: "Multiple malicious MCP servers published on npm. @ifasn/md-doc-mcp and @ifasn/mmdd-doc-mcp probe cloud metadata endpoints, read sensitive files (/etc/shadow, SSH keys, .env, Kubernetes tokens), and exfiltrate to 121.199.24.94. @ifasn/ms-doc-mcp versions 2.0.9 and 2.1.1 (GHSA-556m-xfwj-7wff, MAL-2026-18603) use imdsAudit() function to steal Alibaba Cloud IMDS credentials from 100.100.100.200 and exfiltrate them over MCP stdout. gadgethumans-mcp versions 1.0.10-1.0.15 leak WALLET_PRIVATE_KEY environment variable in HTTP header on every tool call. Published with OpenSSF GHSA-rvw8-22w3-342v, GHSA-4h5p-w547-9qmv (Nov 2) and Leitwacht LWA-2026-13557, LWA-2026-13564. Aug 12, 2026: Pillar Security disclosed Deadbugz malicious MCP server (GitHub zellkernel) stealing AI model credentials and API keys. Feb 20, 2026: Socket discovered SANDWORM_MODE campaign spreading malicious MCP servers targeting developer credentials. November 9-12 additions: @rfewqa-fes/mnm-doc-mcp 1.0.0 (MAL-2026-19148, Amazon Inspector) ships an inert MCP stub in index.js. Its package.json pulls the only dependency, node-health-utils, as an off-registry tarball over plain HTTP from http://121.199.24.94/dl/health-utils-1.0.0.tgz, so whatever that host serves, including lifecycle scripts, runs at npm install. package.json sha256 f8ad55746cfac30b0a9401634b2728afc93e6dc20a85c511efd0ed312e466e8d. Package tarball sha1 f3ad664b487c4041e7e66e5744656ed44e1a6f6a. GitHub also marked @lemili9804/mcp-weather-server 1.0.3 and 1.0.6 (GHSA-qwfq-cw9x-55x4), mcp-contract-tester all versions (GHSA-34p7-qcxm-gc39, MAL-2026-19082), and @bestcoolman/dev-mcp (GHSA-vgx2-8w7x-xr8v, MAL-2026-19052) as malware, with no published behavior write-up. The entry now covers PyPI as well. my-mcp-server-driving-license-ocr 0.1.3 (MAL-2026-19204, GHSA-wg5f-m5mv-gmjg, Amazon Inspector, Nov 12) exposes an MCP tool, analyze_image, described as driving-license OCR. It POSTs the caller's image URLs or base64 bytes over plain HTTP to the hardcoded http://42.193.222.35:8000/ocr_pic and overwrites any MY_API_URL setting so the destination cannot be changed. karma365-mcp 2.1.0 (GHSA-72xc-q3v8-7grp, Nov 13) and @go-gost/mcp-darwin-x64 0.1.0 (GHSA-gfpg-48q7-c68h, Nov 12) are GitHub malware advisories with no published behavior. Nov 16, 2026: Leitwacht LWA-2026-14164 says @guicai777/mcp-doctor 1.0.1 is a trojanized MCP config diagnostics CLI. On each run, index.js requests hxxps://fix-mcp-bridge[.]com/v[.]json. If the response field active is false, it prints that the remote payload is disabled and exits. Otherwise it decodes the bundled 866KB bridge.bin, a base64 blob XOR-encoded with a single-byte key stored as the file's first byte, into a Windows PE and writes it to %LOCALAPPDATA%\\mcp-doctor\\mcp-bridge.exe, then launches that file hidden and detached. Before the drop it reads ~/.claude.json, %APPDATA%\\Claude\\claude_desktop_config.json, ~/.cursor/mcp.json, and ~/.vscode/mcp.json. The README fallback is mshta hxxps://fix-mcp-bridge[.]com/init. The advisory describes the dropped file only as a bridge restart. @tnhorg/agent-skills versions 1.0.0 through 2.1.1 (published 15-20 June 2026; GHSA-fv82-jh67-xx7q / MAL-2026-20104, flagged 18 November 2026) is the same kind of line: flagged, no behavior write-up. npm replaced that package with security holding version 0.0.1-security. @fdcasj_dfew/md-doc-mcp is a Markdown toolkit MCP server (tools md_toc, md_stats, md_table). Its index.js calls fieldCheck() at module load, before any MCP message, and requests the Alibaba Cloud metadata service at hxxp://100.100.100.200/latest/meta-data/ for hostname, instance-id, vpc-id, private-ipv4, and region-id. It writes the per-endpoint status and response length to stderr and to output/field_check.txt. The code, tool set, and banner version string 1.0.2 match @ifasn/md-doc-mcp, @ifasn/mmdd-doc-mcp, and @ifasn/ms-doc-mcp, so this is the ifasn cluster under a new account. npm package created 5 November 2026 at 12:35 UTC under maintainer fdcasj_dfew. Versions 1.0.0 (tarball sha1 bd6688f5c0c3486664e531aa64cc2d23401dbd19, 12:37 UTC) and 1.0.1 (tarball sha1 cde7e78e41c1f372339b34aab144eaa22195f1ed, 12:41 UTC) were still on npm on 19 November 2026. index.js sha256 b6f9d2dbf97b1c9c81a3f340358a67c746fe5cc495d8ac36814e4598d1ccf191. OpenSSF malicious-packages credits finder wormsign (MAL-2026-20187, GHSA-m5xq-h2p4-962g). First flagged 18 November 2026. Attack exploits trust in the MCP ecosystem and in npm and PyPI."
