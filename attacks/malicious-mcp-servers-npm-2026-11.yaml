detections:
  - name: mcp-aevo-server Telegram exfil
    format: guidance
    notes: "No Sigma, Splunk, or Elastic rule checked on 18 November 2026 names mcp-aevo-server or Telegram bot 8867174343. Hunt uvx or python starting mcp-aevo-server and a cleartext POST to api.telegram.org for that bot id, chat 8838719553, plus AEVO_TELEMETRY left at its default. The npm curl and PowerShell rules below do not see a PyPI process posting to Telegram."
  - name: Curl Download Activity from npm Package Install
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/command_and_control_curl_download_from_npm_install.toml"
    notes: "Endpoint, cross-platform. curl spawned from an npm or npx process tree. Fits packages whose install fetches an off-registry tarball. It does not see the PyPI OCR tool's runtime HTTP POST."
  - name: Suspicious PowerShell from npm Package Install
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/execution_suspicious_powershell_from_npm_install.toml"
    notes: "Windows. PowerShell started from an npm install script. Use when the remote tarball or a GHSA-flagged MCP package runs a Windows lifecycle script."
  - name: Package Runtime Secret File Access Followed by IMDS Request
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/credential_access_secret_file_access_followed_by_imds_request.toml"
    notes: "Selected from a security-detections-mcp search for 100.100.100.200. Windows and macOS. A python or node process opens a listed secret, including an SSH private key, then connects to 169.254.169.254 or 100.100.100.200 within one minute. Fits the ifasn packages that read SSH keys and probe metadata. fieldCheck() in @fdcasj_dfew/md-doc-mcp only requests metadata, so that package alone does not match. Linux file-open events are outside this rule."
  - name: In-process metadata probe and GHSA-only packages
    format: guidance
