source_notes: "Imported from the AI Threat Watch Notion feed (an automated daily scan); not yet editorially reviewed. Feed severity: High. Feed novelty: Evolution. The 16 November 2026 GTIG tracker says that from late August to early October 2026 a threat actor used a customized attack orchestration platform built on the open-source version of PentAGI for systematic reconnaissance and vulnerability scanning against organizations in Asia. The public project page checked for that name is https://github.com/vxcontrol/pentagi, which returned HTTP 200 on 16 November 2026. GTIG did not publish a repository URL. frameworks already includes pentagi. Cairn is not added here: the same tracker describes a separate Cairn intrusion, including a US aerospace target, which is noted on unit42-cairn-cl-sta-1238-2026-11 rather than attributed to UNC7228."
