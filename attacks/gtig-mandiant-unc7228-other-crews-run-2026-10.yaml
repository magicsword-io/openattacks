detections:
  - name: Kerberoasting Activity - Initial Query
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_kerberoasting_activity.yml
    notes: "Matched Kerberoasting with security-detections-mcp. GTIG says ARTEX ran Kerberoasting scripts to harvest service tickets."
  - name: First Time Seen Account Performing DCSync
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/credential_access_dcsync_newterm_subjectuser.toml
    notes: "Matched DCSync with security-detections-mcp. GTIG says ARTEX followed Kerberoasting with DCSync scripts for the krbtgt key and domain-controller hashes."
  - name: Potential Pass-the-Hash (PtH) Attempt
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/lateral_movement_alternate_creds_pth.toml
    notes: "Matched Pass the Hash with security-detections-mcp. GTIG lists Pass-the-Hash among the lateral-movement scripts ARTEX attempted against domain controllers."
  - name: Linux Webshell Indicators
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_webshell_detection.yml
    notes: "Matched webshell with security-detections-mcp. GTIG describes JSP webshells written through MySQL general_log on a Linux Weaver OA server."
  - name: Connection to Commonly Abused Web Services
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/command_and_control_common_webservices.toml
    notes: "Matched webhook.site with security-detections-mcp. GTIG says a Windows database server used curl to post command results to rotating webhook.site URLs."
  - name: MySQL general_log poisoning and artex-probe filenames
    format: guidance
    notes: "security-detections-mcp searches for jsp and webshell returned Linux webshell and SAP NetWeaver rules. None encode SET GLOBAL general_log_file writes of JSP content, the cl1217.jsp-style names, or artex-probe filenames. Hunt those strings in web and database logs."
