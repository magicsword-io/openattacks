region_notes: "Unit 42 describes the set as global and names one victim as a US hospitality and gaming company. It does not name other victim countries. Three major clouds are not three countries. Chinese comments in one WMI backdoor are not an origin."
attribution_or_cluster: "Unknown. Unit 42 describes multiple unnamed operators and does not attribute the set to one actor or country."
scale_and_metrics: "More than 10 campaigns from July through September 2026. One attack active 140 minutes across two days with about 800 unique commands. One 12-day campaign with more than 8,000 unique commands. Median inter-command gap 23.9 seconds in the human phase and 1.4 seconds after the agent took over. 40 to 100 unique Base64 payloads per session. In the hospitality case, 20 AWS services across 8 regions. On the multi-OS case, more than 40 web shell locations and five variants in 26 minutes."
prevention_angle: "Patch the web applications that Unit 42 says were the initial-access path in every campaign, and treat a new web shell as the start of an agent-speed operation rather than a single manual session. Alert on command bursts near a 1.4 second gap, shell lines that use ===[Title]=== headers, and large sets of unique Base64 payloads in one session. Block or alert on IMDSv1, unexpected IMDSv2 token use, and S3 policy or ACL reads from a workload that does not administer buckets. Segment SMB so a Linux web shell cannot write ASPX under IIS, and do not leave web.config able to enable script execution. Rate-limit GitLab authentication and do not reuse marketing-staff passwords there. Hunt find commands that skip EDR paths, and strace attached to wdavdaemon."
related_magicsword_projects: []
source_notes: "Counts, fingerprints, and the tool list are from the 24 November 2026 Unit 42 post. Unit 42 does not name a model except by tying one C2 host to a CyberStrikeAI instance. ReliaQuest (7 October 2026) is cited only for that address: the report calls 204.194.54[.]240 a staging and pre-incident scanning host and shows a CyberStrikeAI login page and an open directory. Other addresses and tools in the ReliaQuest report are a different incident and are not listed here. The IP is defanged. Link cl-unk-1211-unit42-2026-10, elastic-cyberstrikeai-aws-cloudtrail-2026-11, and wiz-artex-harvester-cyberstrikeai-cloud-intrusions-2026-11."
