detections:
  - name: Suspicious Command Execution via Web Server
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_webserver_suspicious_command_execution.toml"
    notes: "Linux. A web-server parent, including php-cgi and php-fpm, starts a shell or reconnaissance command. This matches the PHP web shell when that worker is the parent. It does not cover the later ASPX shells on Windows."
  - name: "Web Shell Detection: Script Process Child of Common Web Processes"
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_webshell_detection.toml"
    notes: "Windows. A script host or shell whose parent is w3wp.exe or another listed web process. This matches an ASPX web shell executing under IIS. A copy over SMB that does not spawn from w3wp is not this rule."
  - name: AWS S3 Rapid Bucket Posture API Calls from a Single Principal
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/discovery_s3_rapid_bucket_posture_api_calls.toml"
    notes: "AWS CloudTrail. Repeated GetBucketAcl, GetBucketPolicy, and related calls by one principal in a short window. Unit 42 says the agent read the bucket policy and ACL and does not give a count, so the threshold may not have been met."
  - name: IMDSv1, WMI backdoors, and agent fingerprints
    format: guidance
    notes: "No public Sigma, Splunk, or Elastic rule checked for this entry is a specific detector for the ===[Title]=== headers, the 1.4 second command gap, or strace attached to wdavdaemon. The public strace rule that was reviewed requires strace after sshd exits, which is not this case. Unit 42's PowerShell WMI backdoor is not described as a WMI event subscription, so a subscription rule is not cited. Also hunt IMDSv1, an IMDSv2 token request from a process that is not the instance agent, and the defanged address 204.194.54[.]240."
