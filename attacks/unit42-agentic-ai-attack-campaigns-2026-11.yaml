ai_role: attacker_uses_ai_as_operator
ai_role_detail: "Unit 42 says a human set the objective and provided initial access, and an autonomous agent ran the operation. One campaign's C2 host also served a CyberStrikeAI instance. Unit 42 reports no other model or framework fingerprint."
technique_summary: "Unit 42 (Noa Dekel and Tom Fakterman, 24 November 2026) says that between July and September 2026 it tracked more than 10 global campaigns in which attackers deployed autonomous AI agents. The sectors were government, logistics, hospitality, manufacturing, agriculture, and education. Every campaign got initial access through web shells deployed via vulnerable web applications. A human set the objective and provided that access. The agent ran the operation. One attack was active for 140 minutes across two days and ran about 800 unique commands. Another 12-day campaign ran more than 8,000 unique commands. The median gap between commands was 23.9 seconds in the human phase and 1.4 seconds once the agent took over. Fingerprints in every campaign included section headers such as ===[Title]=== in shell commands. Chain-of-thought reasoning comments appeared in scripts in more than half of the campaigns. Output was structured and machine-readable. Each session used 40 to 100 unique Base64 payloads, and none of those payloads were identical. In a US hospitality and gaming company, the agent tried IMDSv1, then an IMDSv2 token, enumerated 20 AWS services across 8 regions, targeted payment and financial S3 paths, tested writes, deleted the test files, and read the bucket policy and ACL. Unit 42 says the abuse crossed three major clouds. On multiple operating systems, a Linux PHP web shell led to stolen SMB credentials and then Windows IIS. Within 2 minutes the agent was deploying ASPX web shells over SMB. Over 26 minutes it used more than 40 locations, five web shell variants, and a custom web.config to enable script execution. The agent adapted. It found credentials for an IT vendor's self-managed GitLab on the compromised web server, mapped the vendor with WHOIS, and brute-forced GitLab using real marketing staff names. Unit 42 does not describe a GitLab vulnerability. The agent read NGINX vhost configs, found a dozen sister companies, harvested CSRF tokens, reused credentials, and ran four iterative SQL injection scripts against a parent-company admin panel. scan.sh was followed 21 seconds later by scan2.sh. It showed security awareness. find commands excluded three EDR vendors' paths on six endpoints. The agent checked for 16 security scanners, tried to exfiltrate a security-product directory, and ran strace on the Microsoft Defender for Endpoint daemon wdavdaemon. Unit 42 recovered no compiled backdoor, C2 framework, DLL implant, or shellcode loader. The arsenal was PHP web shells, PowerShell WMI backdoors, and Python credential harvesters. Open source came first. Copy Fail, CVE-2026-31431, was downloaded from GitHub or its site in three cases. Privilege escalation tried a precompiled PwnKit, then CVE-2024-1086, then custom C, then a Python rewrite. charon_lite.c was a network probe. paramiko was used in spray scripts. Attribution leads are thin. C2 address 204.194.54[.]240 appeared in PowerShell download cradles and curl probes, and that host also ran a CyberStrikeAI instance. ReliaQuest's 7 October 2026 report documents the same address as a staging and pre-incident scanning host with a CyberStrikeAI login page and an open directory. One campaign leaked the path /home/kali/exploitmasteryai/targets/warranty/shell5.php. A WMI backdoor appeared in two versions, one with Chinese comments and a newer English-only version. Unit 42 reports no other model or framework fingerprint. Link cl-unk-1211-unit42-2026-10, elastic-cyberstrikeai-aws-cloudtrail-2026-11, and wiz-artex-harvester-cyberstrikeai-cloud-intrusions-2026-11."
initial_access: "Web shells deployed through vulnerable web applications. Unit 42 says every campaign in the set started that way. The human provided that access. The agent ran the later operation."
