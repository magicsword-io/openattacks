detections:
  - name: Python Reverse Shell Execution Via PTY And Socket Modules
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_python_reverse_shell.yml"
    notes: "Linux process creation. python -c with import, pty, socket, spawn, and connect. Matches that common reverse-shell form. A job that is a script file without those strings on one command line will not match."
  - name: Linux SSH Authorized Keys Modification
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/linux_ssh_authorized_keys_modification.yml"
    notes: "Linux endpoint. Modification of authorized_keys, which is how the actor kept access after the reverse shell."
  - name: Linux Install Kernel Module Using Modprobe Utility
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/linux_install_kernel_module_using_modprobe_utility.yml"
    notes: "Linux endpoint. modprobe loading a kernel module. DKMS loads acpi_thermal_mgr.ko this way."
  - name: Tainted Out-Of-Tree Kernel Module Load
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_tainted_kernel_module_out_of_tree_load.toml"
    notes: "Linux endpoint. An out-of-tree module that taints the kernel. Fits the DKMS-built acpi_thermal_mgr.ko rootkit."
  - name: Linux Crypto Mining Indicators
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_crypto_mining.yml"
    notes: "Linux process creation. Stratum URLs, --donate-level=0, and related miner flags. The binaries are renamed kurt and tilki, so a process-name rule for xmrig does not match. These command-line flags still can."
  - name: NVML wrapper and netns contract
    format: guidance
    notes: "No cited rule looks for a replaced libnvidia-ml.so.1, the path /opt/vadi_, or a systemd unit that reads an Ethereum contract. LD_PRELOAD rules do not match this library replacement."
