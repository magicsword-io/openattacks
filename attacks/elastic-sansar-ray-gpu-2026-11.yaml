    title: "0% GPU utilization: How SANSAR hides Linux cryptomining"
    publisher: Elastic Security Labs
magicsword_coverage: []
borderline: false
borderline_note: null
ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: null
ai_role_detail: "The target is Ray, a distributed Python framework used for AI training and inference. The attacker is not described as using a model. The NVML wrapper is aimed at the GPU telemetry ML operators watch."
technique_summary: "Elastic Security Labs (Salim Bitam, Nov 12, 2026) tracks REF3364. The Ray dashboard was bound to loopback, but the job agent was reachable from the internet and accepted unauthenticated Jobs API submissions. External probes appeared in the Ray logs on October 22, 2026. On October 24 a submitted job ran nvidia-smi and sent the GPU inventory out. On October 25 a Python reverse-shell job connected to an external listener under the account that owned the Ray session. The actor added an SSH key to that account's authorized_keys, obtained root, and staged SANSAR under /opt/vadi_ on three GPU hosts. SANSAR is a Rust orchestrator (v0.1.3) with Tor/Arti command and control and Lyrebird obfs4/WebTunnel. It supervises XMRig, stored as kurt, and SRBMiner-MULTI, stored as tilki (https://github.com/xmrig/xmrig and https://github.com/doktor83/SRBMiner-Multi). A replaced libnvidia-ml.so.1 wraps the real NVML library and reports GPU use as 0 percent, randomizes temperature between 36 and 46 C and power between 100 and 200 W, and filters process lists, so nvidia-smi and other NVML clients lie. An ftrace rootkit, acpi_thermal_mgr.ko, is built with DKMS, loaded through the initramfs, and hides processes, files, and sockets. A systemd backdoor named netns reads its command-and-control address from an Ethereum smart contract and connects on TCP 8080. Elastic publishes YARA rules for SANSAR and netns. Link shadowray-2-0-hijacks-exposed-ray-2025-11."
initial_access: "Unauthenticated Ray Jobs API on an internet-reachable job agent"
ai_tooling_and_models:
  - "Ray (https://github.com/ray-project/ray)"
other_tooling:
  - "SANSAR orchestrator"
  - "XMRig, filename kurt (https://github.com/xmrig/xmrig)"
  - "SRBMiner-MULTI, filename tilki (https://github.com/doktor83/SRBMiner-Multi)"
  - "Lyrebird obfs4/WebTunnel"
  - "NVML wrapper libnvidia-ml.so.1"
victims_and_sectors: "Three GPU hosts running Ray. Elastic did not name the organizations."
regions:
  - unknown
attribution_or_cluster: "REF3364. Elastic does not attribute the activity to a named group or country."
scale_and_metrics: "Three GPU hosts. Activity from October 22 through October 25, 2026, from probe to persistent access."
prevention_angle: "Do not expose the Ray job agent. Require authentication on the Jobs API. Alert on a Python reverse shell from the Ray account, a new authorized_keys entry, an out-of-tree kernel module, and a miner command line even when the binary is named kurt or tilki. Compare nvidia-smi with a second GPU telemetry source so a wrapped libnvidia-ml.so.1 cannot be the only reading."
related_magicsword_projects: []
source_notes: "Dates, paths, component names, and the seven SHA-256 hashes are from the Elastic Security Labs article. The miners are renamed, so a rule that requires the process name xmrig or srbminer will miss kurt and tilki. The NVML change is a replaced libnvidia-ml.so.1, not an LD_PRELOAD or ld.so.preload edit, so those rules are not cited."
last_reviewed: 2026-11-15
region_notes: "Elastic did not name the countries of the GPU hosts."
