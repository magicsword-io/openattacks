ai_role_detail: "Browser extension on claude.ai pushes prompts to Claude Desktop via Dispatch, auto-clicks Allow; enables RCE reaching other machines on same account"
technique_summary: "Forever Security researcher Gal Weizman disclosed ThisBash vulnerability allowing browser extension on claude.ai to push prompts to Claude Desktop via Dispatch API, auto-clicking Allow button to execute commands without user interaction. Proof-of-concept demonstrated npm install -g add-colors-to-bash execution (opened Calculator app). Attack can reach other machines logged into same Claude account. Anthropic announced Dispatch retirement. No evidence of in-the-wild exploitation; marked borderline as researcher disclosure only."
