ai_role_detail: "Together AI says an AI coding agent committed a credential that could read a private Hugging Face repository of prompt samples. The agent product is not named."
technique_summary: "Vipul Ved Prakash (Together AI, Nov 21, 2026) says Together is notifying customers about prompt samples from its serverless inference service in June and July 2026. For routine software testing, Together collected prompt samples that were authorized for that use and stored them in a private Hugging Face repository. The samples came from requests to MiniMax M3, GLM-5.2, and Kimi K2.6, mainly on June 24, July 4, July 8, and July 14, 2026. While Together was developing its public GitHub repository xorl (https://github.com/togethercomputer/xorl), an AI coding agent committed a credential with access to that private Hugging Face repository. Together says its automated scanning detected the credential and the commit was reverted. Together does not publish the exposure dates or the name of the agent. During the exposure window an unauthorized party obtained the credential, downloaded the stored prompt samples, searched them for credentials to other services, and tested whether those credentials were valid. Five of the credentials tested were canary credentials from a Dragos security experiment, documented in dragos-ai-inference-canaries-provider-breaches-2026-11. Together engaged an external forensic firm and law enforcement. It says it has not found evidence of additional prompt leakage beyond this incident. Review of the prompt contents for sensitive personal information or other customer data is ongoing, and affected customers will be contacted directly. Changes after the incident are scoped or short-lived credentials and keyless access where supported, credential checks on all pull requests, zero data retention as the default for new accounts, and updated processes for AI coding agent use. Together tells customers who handle sensitive prompts to enable zero data retention."
initial_access: "An AI coding agent committed a credential for a private Hugging Face repository into the public GitHub repository xorl. Automated scanning caught it and the commit was reverted. An unauthorized party still obtained the credential during the exposure window. The exact dates and the agent product are not published."
ai_tooling_and_models:
  - "Unnamed AI coding agent. Together AI does not name the product."
  - "Serverless prompts to MiniMax M3, GLM-5.2, and Kimi K2.6"
other_tooling:
  - "Private Hugging Face repository holding the prompt samples"
  - "Public GitHub repository xorl (https://github.com/togethercomputer/xorl)"
victims_and_sectors: "Together AI customers whose serverless prompts were in the stored samples for MiniMax M3, GLM-5.2, and Kimi K2.6, mainly on four days in June and July 2026. Together says it will contact affected customers directly. It does not name them or give a count. Five tested credentials were Dragos canaries, not customer secrets."
regions:
  - unknown
region_notes: "Together AI does not name customer countries. The company's own location is not a victim region. The Dragos post describes where some canaries were later used, and that geography is recorded on dragos-ai-inference-canaries-provider-breaches-2026-11 rather than copied here as a Together victim location."
attribution_or_cluster: "Unknown. Together AI says an unauthorized party downloaded the samples and tested credentials found in them. It does not name that party. The commit itself is attributed to an unnamed AI coding agent used while developing xorl."
scale_and_metrics: "Prompt samples from serverless requests to three models, mainly June 24, July 4, July 8, and July 14, 2026. One exposed credential for the private Hugging Face repository. Five of the credentials the unauthorized party tested were Dragos canaries. No customer count. Together says it found no additional prompt leakage. The exposure window dates are not published."
prevention_angle: "Run secret scanning on every pull request, including commits from AI coding agents, and keep a pre-commit scan on that work. Use scoped, short-lived, or keyless credentials. Keep secrets out of agent context. Rotate a credential after any exposure even if the commit was reverted, because git history is scraped quickly. Enable zero data retention for sensitive prompts. Seed canaries in prompt data so a later download is visible."
related_magicsword_projects: []
source_notes: "The sample dates, the three model names, the private Hugging Face repository, the xorl commit by an unnamed AI coding agent, the revert, the unauthorized download, the five Dragos canary credentials, the forensic firm and law enforcement, and the control changes are from the Together AI post. Together does not publish the exposure dates or the agent product, and this entry does not invent them. The current xorl repository is https://github.com/togethercomputer/xorl. The reverted commit is not assumed to still be on the default branch. The Dragos post is the public report of the canary experiment Together refers to. Link dragos-ai-inference-canaries-provider-breaches-2026-11. This case is a coding agent writing a credential into a public repository. It does not describe an agent skill or an MCP server."
