detections:
  - name: GitHub Secret Scanning Alert for a Publicly Leaked Secret
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/github/credential_access_github_secret_scanning_alert_created.toml
    notes: "GitHub audit. secret_scanning_alert.create with github.publicly_leaked true, which is GitHub's mark that a matched secret is exposed in a public location. Together says the credential was committed to the public repository xorl and that its own automated scanning detected it. This rule matches only if GitHub secret scanning is enabled and GitHub raises that public-leak alert. A revert does not by itself clear the alert. Together does not say this GitHub event is the scan that caught the commit."
  - name: Reverted agent commits and the Hugging Face download
    format: guidance
    notes: "No cited Sigma, Splunk, or Elastic rule covers a credential committed by an unnamed coding agent and then reverted, or a later download from a private Hugging Face repository. Hunt the git host for a secret in a commit that was reverted, including history, and for pull requests from the coding agent. Treat the credential as exposed once the commit existed. Together does not publish the exposure timestamps, so a time-window rule cannot be matched to this incident from the post alone. Also hunt use of the Hugging Face credential from a new client, and tests of credentials found inside the downloaded prompts. Five of those tested values were Dragos canaries, covered on dragos-ai-inference-canaries-provider-breaches-2026-11."
