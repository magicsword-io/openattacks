detections:
  - name: Potential Okta Password Spray (Single Source)
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/okta/credential_access_okta_password_spray_single_source.toml
    notes: "Matched Okta password spray with security-detections-mcp. Wiz describes one-second Okta and Entra login bursts lasting 20 to 60 minutes. Wiz also names its own Okta password-spray alert, which is not this rule."
  - name: Potential Okta Password Spray (Multi-Source)
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/okta/credential_access_okta_password_spray_multi_source.toml
    notes: "Matched Okta password spray with security-detections-mcp. Wiz says a new address appeared within minutes after an IP was blocked, so the spray is not confined to one source."
  - name: Azure AD Multiple Users Failing To Authenticate From Ip
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/cloud/azure_ad_multiple_users_failing_to_authenticate_from_ip.yml
    notes: "Matched T1110.003 with security-detections-mcp. Wiz says the same actor password-sprayed Entra ID as well as Okta, using infrastructure Microsoft attributes to Storm-0940."
  - name: Cognito SignUp and source-map harvesting
    format: guidance
    notes: "security-detections-mcp's Cognito search returned only unauthenticated identity-pool credentials. Wiz describes Cognito SignUp, ForgotPassword, and InitiateAuth, plus downloads of JavaScript source maps and OpenAPI documents. That identity-pool rule does not match. Hunt those API events and the source-map requests Wiz lists."
