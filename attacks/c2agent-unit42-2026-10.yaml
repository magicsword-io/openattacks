attack_flow:
  nodes:
    - id: step-1
      title: Stager downloads the implant
      description: The reported two-stage chain fetches a Windows PE; the original delivery route is unknown.
      kind: access
      source_urls: &a1
        - https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-10-09-C2Agent-malware.txt
    - id: step-2
      title: LLM receives an operator goal
      description: A system prompt describes available tools, MCP connections, skills and memory.
      kind: ai
      source_urls: *a1
    - id: step-3
      title: Implant executes a tool call
      description: The model returns a JSON tool call for the implant to execute.
      kind: execution
      source_urls: *a1
    - id: step-4
      title: Tool results return to the model
      description:
        Results feed the next decision in an iterative loop; later versions can delegate to
        installed AI CLIs.
      kind: ai
      source_urls: *a1
  edges:
    - source: step-1
      target: step-2
    - source: step-2
      target: step-3
    - source: step-3
      target: step-4
    - source: step-4
      target: step-2
      label: Next decision
      loop: true
