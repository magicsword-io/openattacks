ai_role_detail: "Autonomous offensive agent hunts internet for exposed LLM/MCP endpoints, hijacks them to scan, exploit web frameworks, steal credentials/databases, deploy miners for up to 100K steps unattended"
technique_summary: "Autonomous offensive agent hunts exposed LLM endpoints (OpenAI-compatible APIs, self-hosted models, AI gateways, MCP servers) without authentication or with stolen keys. Wraps jailbreak around ~74 offensive tools, instructs model to ignore safety controls and treat credential theft as routine development. 'Skynet mode' authorizes 100,000 unattended steps without human approval. Scans for targets (VS Code servers, Django, Jupyter, Laravel, Supabase, Prisma Studio), exploits web frameworks, steals databases/credentials, quietly deploys XMRig miners (github.com/xmrig/xmrig) under /tmp/.x and go2rtc camera paths. Symantec AI honeypot captured full working prompt summer 2026; 127,000+ external requests from tens of thousands of addresses, dominated by endpoint reconnaissance, API key spraying, exposed config probing."
initial_access: "Exposed LLM endpoints without authentication: OpenAI-compatible APIs, self-hosted model servers, AI gateways, MCP servers; stolen API keys"
ai_tooling_and_models:
  - Exposed LLM endpoints (OpenAI-compatible)
  - Self-hosted model servers
  - AI gateways
  - Model Context Protocol (MCP) servers
other_tooling:
  - ~74 offensive tools (wrapped in jailbreak prompt)
  - XMRig cryptocurrency miner
  - go2rtc camera directory paths
  - VS Code servers
  - Django
  - Jupyter
  - Laravel
  - Supabase
  - Prisma Studio
victims_and_sectors: "Organizations with exposed AI/LLM endpoints; Symantec honeypot recorded 127,000+ requests from tens of thousands of addresses"
regions:
  - unknown
attribution_or_cluster: unknown
scale_and_metrics: "Symantec honeypot summer 2026 captured full working prompt; 127,000+ external requests from tens of thousands of addresses; authorized up to 100,000 unattended steps per session; deploys XMRig miners"
prevention_angle: "Never expose LLM APIs/MCP endpoints without authentication; require auth on all paths including health checks; place behind gateway; rotate AI API keys; scope keys narrowly; monitor unusual inference volume/spend; restrict outbound network from AI tools; IMDSv2 with hop limit 1; least privilege for agents; human approval for sensitive actions; keep exploited software patched; block mining pools and known miner hashes"
related_magicsword_projects: []
source_notes: "Symantec AI honeypot captured full working prompt; operators sent tool's entire prompt expecting real model on other end; honeypot impersonates unprotected internet-facing AI service. Detection guidance: monitor exposed endpoints, API key anomalies, XMRig processes, mining pool connections, web framework exploitation from AI infrastructure."
