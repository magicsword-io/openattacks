attack_flow:
  nodes:
    - id: adopt
      title: Named actors integrate ARTEX
      description: "Since the July 2026 release, Microsoft says Storm-0940, Storm-3358, Onyx Sleet, Pearl Sleet, Crystal Typhoon, and Salt Typhoon have integrated ARTEX. Autumn-27 published the Go, Next.js, and PostgreSQL project. The source was removed in October 2026. In November 2026 ThreatBook claimed ownership and offered ARTEX Pro."
      kind: ai
      source_urls: &msft
        - https://www.microsoft.com/en-us/security/blog/2026/11/25/what-defenders-need-to-know-artex-agentic-ai-framework-threat-actors-abuse/
    - id: plan
      title: Planner intents, then a real shell
      description: "A goals model feeds a planner that issues intents from a knowledge graph. Worker agents run them with a real shell. A reporter writes findings, reproduction steps, and a proof of concept. A model pool can fail over across providers and keys."
      kind: ai
      source_urls: *msft
    - id: recon
      title: Recon, credentials, and web apps
      description: "Microsoft says ARTEX is used to speed up network reconnaissance, credential attacks, and web application exploitation, including scans of internet-facing systems. Privileged access can follow in minutes, and did so in less than three hours in multiple Storm-0940 intrusions."
      kind: execution
      source_urls: *msft
    - id: host
      title: Web shells and server child processes
      description: "Agents use certutil, curl, wget, and netcat to launch web shells, install RATs, or persist. w3wp.exe, php-fpm, httpd/apache2, and Java application servers spawn sh, bash, cmd.exe, or PowerShell. New web scripts appear, including files written after a database log path was pointed at a web directory."
      kind: execution
      source_urls: *msft
    - id: cloud
      title: Cloud identity and directory attacks
      description: "Microsoft lists Graph reconnaissance, added application credentials, an application self-assigning Global Administrator, Kerberoasting, and DCSync. One Storm-0940 campaign produced more than 151,000 failed sign-ins, peaking at 2,900 a minute."
      kind: impact
      source_urls: *msft
    - id: rotate
      title: New IP and user agent when blocked
      description: "Operators change source IP and user agent when blocked, and rotate VPN, proxy, and Tor. Two or three chains run at once, and attempts resume after containment. User agents include artex-enrich/* and norma/*."
      kind: execution
      source_urls: *msft
