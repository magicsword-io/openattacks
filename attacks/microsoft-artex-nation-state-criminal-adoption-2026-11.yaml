victims_and_sectors: "Microsoft does not name the victim organisations in this post. It describes internet-facing systems, web applications, and cloud tenants, including Storm-0940 intrusions."
regions:
  - unknown
region_notes: "This post does not name victim countries. China-based describes ThreatBook, the company that claimed ARTEX in November 2026. It is not a victim location. Actor names and the secondary headlines are not victim locations."
attribution_or_cluster: "Microsoft Threat Intelligence names Storm-0940, Storm-3358, Onyx Sleet, Pearl Sleet, Crystal Typhoon, and Salt Typhoon as having integrated ARTEX. Microsoft describes the set as state-sponsored and financially motivated. This entry does not collapse those actors into one cluster or one country."
scale_and_metrics: "Abuse reported since the July 2026 release. Privileged access in a matter of minutes where configuration and defenses allow it, and in less than three hours in multiple Storm-0940 intrusions. One Storm-0940 campaign: more than 151,000 failed sign-ins, peaking at 2,900 failures per minute. Six named actors. No victim count in this post."
prevention_angle: "Microsoft's steps are to inventory and fix internet-facing exposure, run a WAF in prevention mode with rate limiting, map attack paths, run blocking endpoint protection on every internet-facing server including Linux, restrict outbound connections from web servers, use Conditional Access for users and workload identities, use banned passwords and smart lockout, keep application secrets out of code and rotate leaked ones, govern application registration and consent, and enable automatic attack disruption. On servers, block LOLBins such as certutil, and prevent web server processes from spawning shells or download tools with application control. Microsoft also says honeypots, decoys, tarpits, and fake wins reduced attack traffic that reached real assets in its testing."
related_magicsword_projects: []
source_notes: "The architecture, actor names, signals, and prevention steps are from the 25 November 2026 Microsoft Threat Intelligence post. Jonathan Greig (The Record, 25 November 2026) and James Coker (Infosecurity Magazine, 26 November 2026) restate that reporting. Microsoft publishes user-agent prefixes artex-enrich/* and norma/* and no IP addresses. The IOC object has no user-agent field, so those prefixes are recorded in the guidance detection. webhook[.]site is defanged. CyberStrikeAI Enterprise Edition is named only as a product ThreatBook began offering, not as the framework used in these intrusions. Link microsoft-artex-github-secrets-keyvault-2026-11, storm-0940-used-artex-agentic-ai-2026-10, storm-3358-artex-bank-intrusions-2026-11, crowdstrike-artex-sk-finance-2026-10, wiz-artex-harvester-cyberstrikeai-cloud-intrusions-2026-11, and microsoft-rates-eight-north-korean-actors-2026-10."
