detections:
  - name: Suspicious Command Execution via Web Server
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_webserver_suspicious_command_execution.toml"
    notes: "Linux. A web-server parent starts a shell or reconnaissance command. Microsoft says php-fpm, httpd/apache2, and Java application servers spawn sh or bash. A shell that is not a child of the web worker does not match."
  - name: "Web Shell Detection: Script Process Child of Common Web Processes"
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_webshell_detection.toml"
    notes: "Windows. A script host or shell whose parent is w3wp.exe or another listed web process. Microsoft names w3wp.exe spawning cmd.exe or PowerShell. A file drop that does not spawn from the web process is not this rule."
  - name: Suspicious Download Via Certutil.EXE
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_certutil_download.yml"
    notes: "Windows process creation for certutil download behavior. Microsoft says agents use certutil, with curl, wget, and netcat, to launch web shells, install RATs, or persist. Certutil use that is not a download does not match this rule."
  - name: Active Directory Replication from Non Machine Account
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_ad_replication_non_machine_account.yml"
    notes: "Windows Security 4662 replication from a non-machine account. Microsoft lists DCSync alerts. It does not publish the account or the GUID, so this rule may not be the alert Microsoft listed."
  - name: Kerberoasting Activity - Initial Query
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_kerberoasting_activity.yml"
    notes: "Windows Kerberos query associated with Kerberoasting. Microsoft lists Kerberoasting alerts and does not publish the ticket events, so this rule may not be the alert Microsoft listed."
  - name: Azure AD Identity Protection Password Spray
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/identity_protection/azure_identity_protection_password_spray.yml"
    notes: "Azure Identity Protection password spray. Microsoft describes one Storm-0940 campaign with more than 151,000 failed sign-ins, peaking at 2,900 a minute, and lists T1110.003. The post does not say those failures were Identity Protection events."
  - name: Entra ID Application Credential Modified
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/integrations/azure/persistence_entra_id_application_credential_modification.toml"
    notes: "Azure audit change to an application credential. Microsoft says actors add application credentials. An application self-assigning Global Administrator is a different alert and is not this rule."
  - name: ARTEX user agents, shadow reads, and Microsoft-only alerts
    format: guidance
    notes: "No public Sigma, Splunk, or Elastic rule checked for this entry keys on the user agents artex-enrich/* or norma/*, on a short title-only GET with no redirects, or on curl to rotating webhook[.]site URLs. Microsoft publishes no IP addresses. Also hunt rapid reads of /etc/shadow, .env files, private keys, and cloud credential files, new .php/.jsp/.jspx/.asp/.aspx/.ashx files in web or upload directories, several short-lived shells with incrementing names, and an application self-assigning Global Administrator. Those Microsoft alerts are not cited as Sigma, Splunk, or Elastic rules."
