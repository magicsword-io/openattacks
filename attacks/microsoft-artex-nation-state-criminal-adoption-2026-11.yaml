ai_role: attacker_uses_ai_as_operator
ai_role_detail: "Microsoft says state-sponsored and financially motivated actors integrated ARTEX and used it as the operator for reconnaissance, credential attacks, and exploitation. The human operators are the named actors. ARTEX can call any LLM, including frontier, open-weight, or abliterated models."
technique_summary: "Microsoft Threat Intelligence (25 November 2026) says that since ARTEX was released in July 2026, threat actors have abused it to speed up network reconnaissance, credential attacks, and web application exploitation. Microsoft previously reported ARTEX campaigns that searched public repositories for exposed secrets, enabled supply-chain compromise, and scanned internet-facing systems. Depending on configuration and defenses, ARTEX can go from reconnaissance to persistent privileged access in a matter of minutes. In multiple ARTEX-driven Storm-0940 intrusions, privileged access came less than three hours after initial targeting. Microsoft names Storm-0940, Storm-3358, Onyx Sleet, Pearl Sleet, Crystal Typhoon, and Salt Typhoon as having integrated ARTEX, and describes that set as state-sponsored and financially motivated. ARTEX (AI 自主渗透测试系统) is a Go backend that coordinates multiple LLM agents, with an embedded Next.js web UI and PostgreSQL. GitHub user Autumn-27 published it in July 2026 with a Chinese-language interface. The original developer removed the source in October 2026. Forks continue in other languages. In November 2026, China-based ThreatBook (微步在线) claimed ownership and began offering commercial ARTEX Pro, plus CyberStrikeAI Enterprise Edition. Microsoft describes a goals model, a planner agent that issues intents from a knowledge graph, worker agents that run those intents with a real shell, and a reporter agent that documents findings with reproduction steps and a proof of concept. Any LLM can be used, including frontier, open-weight, or abliterated models. An optional model pool fails over across providers and keys, with a priority order and a cooldown, so activity is not constrained by any single provider's safety controls or telemetry. Built-in tools are nmap, nc, telnet, whois, dig, curl, wget, Playwright with Chromium, node, python3, git, ripgrep, and jq. Actors add sqlmap, hydra, medusa, ncrack, nuclei, nikto, gobuster, ffuf, msfconsole, john, and hashcat. Network signals are bursts of machine-speed activity and retries, a large anomalous volume from one source, and the user agents artex-enrich/* (a short GET to each newly discovered asset to read the page title, with no redirects) and norma/* (the agents' built-in web-fetch tool). Actors change source IP and user agent when blocked, and they rotate VPN, proxy, and Tor. After access, agents use certutil, curl, wget, and netcat to launch web shells, install RATs, or persist. Web server processes (w3wp.exe, php-fpm, httpd/apache2, and Java application servers) spawn sh, bash, cmd.exe, or PowerShell. New .php, .jsp, .jspx, .asp, .aspx, and .ashx files appear in web or upload directories, including files a database server wrote after its log path was pointed at a web directory. Several short-lived web shells use incrementing names. Agents rapidly read /etc/shadow, .env files, configs, private keys, and cloud credential files. They open reverse shells and use curl to rotating webhook[.]site URLs to deliver scripts and return output. Two or three attack chains run at once, and attempts resume after containment. In cloud tenants Microsoft lists Graph reconnaissance, added application credentials, an application self-assigning Global Administrator (Storm-0940), Kerberoasting, and DCSync alerts. One Storm-0940 campaign produced more than 151,000 failed sign-ins, peaking at 2,900 failures per minute. In Microsoft testing, honeypots, decoys, tarpits, and fake wins reduced the attack traffic that reached real assets. Microsoft lists ATT&CK techniques T1021, T1213.006, T1530, T1090, T1102.002, T1078.004, T1199, T1098.001, T1098.003, T1110.003, and T1087.004. CyberStrikeAI Enterprise Edition is a separate product ThreatBook began offering. This entry does not treat it as the framework in the intrusions above. Related entries: microsoft-artex-github-secrets-keyvault-2026-11, storm-0940-used-artex-agentic-ai-2026-10, storm-3358-artex-bank-intrusions-2026-11, crowdstrike-artex-sk-finance-2026-10, wiz-artex-harvester-cyberstrikeai-cloud-intrusions-2026-11, and microsoft-rates-eight-north-korean-actors-2026-10."
initial_access: "Internet-facing systems, credential attacks, and web application exploitation. Microsoft says the path from reconnaissance to persistent privileged access can take minutes, and that privileged access in multiple Storm-0940 intrusions came less than three hours after initial targeting. The post does not name one exploit for every intrusion."
ai_tooling_and_models:
  - "ARTEX. A Go backend coordinates multiple LLM agents, with an embedded Next.js web UI and PostgreSQL. Any LLM, including frontier, open-weight, or abliterated models. An optional model pool fails over across providers and keys."
  - "ARTEX Pro, the commercial offering ThreatBook said it began selling in November 2026 after claiming ownership."
