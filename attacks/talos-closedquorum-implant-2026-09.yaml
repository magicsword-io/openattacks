id: talos-closedquorum-implant-2026-09
name: CLOSEDQUORUM implant - 4 LLMs vote on next action
date_reported: 2026-09-22
researcher: Ryan Fetterman
org: Cisco Talos
sources:
  - url: https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/
    title: "The Closed Quorum: Inside the first reported autonomous AI C2 implant"
borderline: true
borderline_note: "Public distribution build contains dummy API keys and webhook; Talos has not observed end-to-end run or confirmed in-the-wild deployment; binary artifacts connect developer to carding forum postings dating to 2025"
ai_role: attacker_uses_ai_as_operator
ai_role_secondary: ai_infra_as_c2
ai_role_detail: "First publicly documented Windows implant to delegate C2 decisions to LLM panel; 4 models vote on next action via plurality voting"
technique_summary: "CLOSEDQUORUM is Go-based Windows implant that queries DeepSeek, Qwen (via OpenRouter), Mistral, and Gemini in sequence for post-compromise decisions. Each model receives system info (hostname, Windows version, admin status) and constrained JSON prompt with 4 actions: steal (credentials/browsers/wallets), inject (process hollowing), persist (registry/startup), move (no handler in public build). Models vote; plurality wins; ties favor DeepSeek > Qwen > Mistral > Gemini. Decisions posted to Discord webhook with reasoning. No human operator commands needed after deployment. Public build uses dummy keys and webhook; injection branches reach Windows primitives but demonstrate no successful execution; empty decision round defaults to injection with STATUS_INVALID_PARAMETER. Talos discovered via CAIRN tool (open-source AI-malware hunter released same day). Developer artifacts link to carding forums since 2025."
initial_access: "Not established in public sample; deployment method unknown"
ai_tooling_and_models:
  - DeepSeek (api.deepseek.com, deepseek-chat)
  - Qwen (via OpenRouter, qwen/qwen-2.5-72b-instruct)
  - Mistral (api.mistral.ai, mistral-large-latest)
  - Google Gemini (gemini-2.0-flash-exp)
other_tooling:
  - Discord webhook for decision logging and exfiltration
  - CAIRN (Talos AI-malware hunting tool, used for discovery)
  - Go-based implant
  - Windows process injection primitives (CreateProcessW, CREATE_SUSPENDED)
victims_and_sectors: "No confirmed in-the-wild deployment; public sample analysis only"
regions:
  - unknown
attribution_or_cluster: "Developer artifacts link to carding forum postings dating to 2025; no confirmed threat actor attribution"
scale_and_metrics: "First publicly documented autonomous AI C2 implant; analysis dated Jun 17, 2026; disclosed Sep 22, 2026; public build non-functional (dummy keys)"
prevention_angle: "AI API key monitoring; Discord webhook traffic from unexpected processes; plurality voting pattern detection; LLM query patterns with system enumeration; CAIRN tool for AI-malware hunting"
related_magicsword_projects: []
source_notes: "Cisco Talos first public documentation; discovered via CAIRN (released same day); public build has significant discrepancies between advertised capabilities and execution paths; no quorum threshold, empty decision selects injection, main function queries providers only once; Malware Cake Factory independent analysis confirms plurality voting and tie-breaking logic"
