    title: "The Closed Quorum: Inside the first reported autonomous AI C2 implant"
borderline: true
borderline_note: "Public distribution build contains dummy API keys and webhook; Talos has not observed end-to-end run or confirmed in-the-wild deployment; binary artifacts connect developer to carding forum postings dating to 2025"
ai_role: attacker_uses_ai_as_operator
ai_role_secondary: ai_infra_as_c2
ai_role_detail: "First publicly documented Windows implant to delegate C2 decisions to LLM panel; 4 models vote on next action via plurality voting"
technique_summary: "CLOSEDQUORUM is a Go-based Windows implant that queries DeepSeek, Qwen (via OpenRouter), Mistral, and Gemini in sequence for post-compromise decisions. Each model receives system info (hostname, Windows version, admin status) and a constrained JSON prompt with 4 actions: steal (credentials/browsers/wallets), inject (process hollowing), persist (registry/startup), or move (no handler in the public build). Models vote; plurality wins; ties favor DeepSeek > Qwen > Mistral > Gemini. Decisions are posted to a Discord webhook with reasoning. No human operator commands are needed after deployment. The public build uses dummy keys and a dummy webhook, so Talos did not observe end-to-end execution. Talos discovered it via CAIRN, its open-source AI-malware hunting toolkit. Developer artifacts link to carding forums dating to 2025."
initial_access: "Not established in public sample; deployment method unknown"
ai_tooling_and_models:
  - DeepSeek (api.deepseek.com, deepseek-chat)
  - Qwen (via OpenRouter, qwen/qwen-2.5-72b-instruct)
  - Mistral (api.mistral.ai, mistral-large-latest)
  - Google Gemini (gemini-2.0-flash-exp)
other_tooling:
  - Discord webhook for decision logging and exfiltration
  - CAIRN (Talos AI-malware hunting tool, used for discovery)
  - Go-based implant
  - Windows process injection primitives (CreateProcessW, CREATE_SUSPENDED)
victims_and_sectors: "No confirmed in-the-wild deployment; public sample analysis only"
regions:
  - unknown
attribution_or_cluster: "Developer artifacts link to carding forum postings dating to 2025; no confirmed threat actor attribution"
scale_and_metrics: "First publicly documented autonomous AI C2 implant; analysis dated Jun 17, 2026; disclosed Sep 22, 2026; public build non-functional (dummy keys)"
prevention_angle: "AI API key monitoring; Discord webhook traffic from unexpected processes; plurality voting pattern detection; LLM query patterns with system enumeration; CAIRN tool for AI-malware hunting"
related_magicsword_projects: []
source_notes: "Cisco Talos first public documentation; discovered via CAIRN. Talos reports that the public distribution binary is inert because it contains dummy API keys and a dummy webhook. Static analysis confirms plurality voting and deterministic tie-breaking, not a minimum 3-of-4 quorum; if every provider fails, an unhandled consensus value causes the loop to sleep and retry."
