ai_role_detail: "Self-propagating 'sckit' worm targeting AI agent memory framework packages; steals credentials and re-publishes itself to npm/PyPI under similar package names"
technique_summary: "Oct 22, 2026: Self-replicating supply chain worm 'sckit' infected MemTensor AI agent memory packages on npm (@memtensor/agent-memory, @memtensor/vector-store, @memtensor/embeddings) and PyPI (memtensor-core, memtensor-agent). Worm payload in install/postinstall scripts: (1) harvests OpenAI keys, Anthropic keys, HuggingFace tokens, AWS credentials, GitHub tokens, Docker configs from env vars and filesystem; (2) scans local package.json/requirements.txt for AI/ML dependencies; (3) generates typosquat/combosquat variants of found packages; (4) re-publishes malicious clones to npm/PyPI using stolen credentials, embedding sckit payload; (5) exfiltrates to hxxps://sckit-relay[.]io/harvest and Discord webhooks. Worm spreads autonomously across AI package ecosystem. MemTensor is vector database and memory management framework for AI agents (github.com/memtensor/memtensor). StepSecurity identified 37 infected npm packages and 19 PyPI packages within 48 hours. npm/PyPI took down packages Oct 24; unknown number of infections propagated before removal. Detection: monitor for sckit signatures (typosquat patterns, postinstall credential harvesting, package auto-publishing logic), alert on npm publish from CI/dev machines, check for sckit-relay[.]io domain, review install scripts for eval/base64/obfuscation."
initial_access: "Installation of infected MemTensor packages or downstream typosquats via npm install / pip install"
ai_tooling_and_models:
  - MemTensor AI agent memory framework
  - OpenAI API
  - Anthropic Claude API
  - HuggingFace models
other_tooling:
  - npm package manager
  - PyPI Python package manager
  - sckit worm payload
  - Discord webhooks for exfiltration
  - sckit-relay[.]io C2
victims_and_sectors: "AI/ML developers using MemTensor or infected typosquat packages; 37 npm packages + 19 PyPI packages identified by StepSecurity; unknown downstream propagation"
regions:
  - Multiple regions
attribution_or_cluster: "Unknown actor; automated worm behavior suggests tooling designed for autonomous AI supply chain propagation"
scale_and_metrics: "37 infected npm packages, 19 infected PyPI packages within 48 hours; worm spread autonomously; packages removed Oct 24 after ~48-hour exposure window"
prevention_angle: "Use package lock files; verify package integrity with checksums; implement SCA tools; monitor postinstall/install scripts; use private registries; restrict npm publish credentials; rotate credentials after exposure; network egress filtering; dependency pinning; use npm audit / pip-audit"
related_magicsword_projects: []
source_notes: "StepSecurity analysis; MemTensor GitHub github.com/memtensor/memtensor. First documented self-replicating worm targeting AI package ecosystem. Detection: monitor for sckit-relay[.]io, look for postinstall scripts that scan package.json/requirements.txt and call npm publish/twine upload, check for typosquat generation logic, alert on credential file reads followed by network egress to unknown domains."
