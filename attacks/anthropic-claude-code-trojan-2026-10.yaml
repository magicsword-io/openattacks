detections:
  - name: Scheduled Task Creation Via Schtasks.EXE
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml"
    notes: "Windows process creation. schtasks.exe creating a task. Microsoft describes a SysMon scheduled task. The rule does not name SysMon."
  - name: New Cron File Created
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/file_event/file_event_lnx_susp_cron_file_created.yml"
    notes: "Linux file event. A new cron file. Matches the @reboot cron persistence Microsoft describes."
  - name: Potential Persistence Via PlistBuddy
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/macos/process_creation/proc_creation_macos_persistence_via_plistbuddy.yml"
    notes: "macOS process creation. PlistBuddy writing a LaunchAgent. Relevant to com.apple.sysmond only if the installer used PlistBuddy. Microsoft names the LaunchAgent, not the tool that wrote it."
  - name: Port Forwarding Activity Via SSH.EXE
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_ssh_port_forward.yml"
    notes: "Windows process creation. ssh.exe port forwarding. Matches the reverse tunnel on Windows. The Linux and macOS tunnels are the same destination, 134.209.82.225."
  - name: Potential SSH Tunnel Persistence Install Using A Scheduled Task
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_openssh_tunnelling.yml"
    notes: "Windows process creation. schtasks.exe installing an OpenSSH tunnel. Microsoft describes both a SysMon task and a reverse SSH tunnel."
  - name: Fireworks key and marketplace cache
    format: guidance
    notes: "No cited rule covers an exposed vendor access key or a write to the Cursor marketplace cache. Hunt svc-telemetry in authorized_keys and outbound SSH to 134.209.82.225."
