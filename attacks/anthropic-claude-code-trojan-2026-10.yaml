ai_role_detail: "The tampered package was a copy of Anthropic's Claude Code extension placed on the cache Cursor used for its VS Code marketplace. Anthropic did not publish that copy."
technique_summary: "Cursor's Nov 13, 2026 update says the attacker obtained an access key Cursor had issued to Fireworks. Fireworks exposed that key. The attacker copied a read-only bucket used to share data with Fireworks. The bucket held limited coding-agent traces, mostly from 2025, from sessions that were not in Privacy Mode and were permitted for training. A small number of traces had unredacted credentials. Less than 0.01% of customers had API credentials exposed. From those credentials the attacker reached select SaaS tools, then select archived non-production Cursor repositories, limited customer-support data and email, product usage metrics and contact details, summaries of some coding-agent conversations, and credentials users had sent to support. On Oct 29, using a stolen credential, the attacker placed malicious unauthorized copies of Anthropic's Claude Code extension on the cache used to serve the Cursor VS Code extension marketplace. Anthropic did not publish this copy. It was not a vulnerability in Anthropic's product. Open VSX never had the malware. At most 5,000 users who requested specific cached versions that day potentially received it. The copies were available for about 11 hours. The marketplace was taken offline, and a hosting provider took down the attacker's server. The last attacker activity Cursor saw was Nov 1, and it was blocked. Traces were exposed for fewer than 0.05% of non-Privacy-Mode users, who were notified. Privacy Mode prompts and code were not affected. Microsoft's Oct 30 analysis of the copies that were served, anthropic.claude-code 2.1.312 and 2.1.313, describes a loader in extension.js that collected hostname, username, and environment variables matching secret patterns, added SSH key svc-telemetry to authorized_keys, opened a reverse SSH tunnel to tunnel@134.209.82.225, and beaconed to :8099/beacon. Persistence was a com.apple.sysmond LaunchAgent on macOS, an @reboot cron job on Linux, and a SysMon scheduled task on Windows. The marketplace window Microsoft and Cursor's earlier notice described was Oct 29, about 5:27 AM to 4:35 PM ET."
initial_access: "Stolen access key that Cursor had issued to Fireworks, then a stolen credential used to place unauthorized Claude Code extension copies on the Cursor marketplace cache. Open VSX did not carry the malware."
ai_tooling_and_models:
  - Cursor IDE
  - anthropic.claude-code extension
other_tooling:
  - Reverse SSH tunnel
  - LaunchAgent persistence (macOS)
  - Cron persistence (Linux)
  - Scheduled task persistence (Windows)
victims_and_sectors: "Cursor users who requested the specific cached extension versions on Oct 29, and customers whose non-Privacy-Mode traces or support credentials were in the copied bucket. Production systems and customer code repositories were not described as affected."
regions:
  - Multiple regions
attribution_or_cluster: "Unnamed. Cursor published the Fireworks-key root cause on Nov 13, 2026. No country is stated."
scale_and_metrics: "At most 5,000 users potentially received the cached copies, which were available for about 11 hours. API credentials were exposed for less than 0.01% of customers. Traces were exposed for fewer than 0.05% of non-Privacy-Mode users. Tampered versions were anthropic.claude-code 2.1.312 and 2.1.313."
prevention_angle: "Rotate credentials that were in coding-agent traces or sent to support if Cursor notified the account. Review SSH authorized_keys for svc-telemetry, outbound SSH to 134.209.82.225, LaunchAgent com.apple.sysmond, @reboot cron, and a SysMon scheduled task. Do not treat Open VSX as the source of this copy."
related_magicsword_projects: []
source_notes: "The Fireworks access key, the read-only bucket, the 0.01% and 0.05% figures, the marketplace cache, the 5,000-user bound, the 11-hour window, and the Nov 1 last-seen activity are from Cursor's Nov 13, 2026 update. The loader, SSH key svc-telemetry, tunnel 134.209.82.225, beacon on port 8099, and the macOS, Linux, and Windows persistence names are from Microsoft's Oct 30 analysis. The earlier GitHub-repository explanation is not the root cause Cursor published on Nov 13."
