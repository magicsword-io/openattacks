technique_summary: Tampered anthropic.claude-code extension versions 2.1.312 and 2.1.313 served via Cursor marketplace install and auto-update on Oct 29 2026 from ~5:27 AM to 4:35 PM ET. Loader in extension.js collected hostname, username, environment variables matching secret patterns, added SSH key svc-telemetry to authorized_keys, established reverse SSH tunnel to tunnel@134.209.82.225, beaconed to :8099/beacon. Persistence via com.apple.sysmond LaunchAgent (macOS), @reboot cron (Linux), SysMon scheduled task (Windows). GitHub repo https://github.com/anthropics/anthropic-quickstarts compromised.
initial_access: Supply-chain compromise of official Cursor marketplace extension via compromised GitHub repository
ai_tooling_and_models:
  - Cursor IDE
  - anthropic.claude-code extension
other_tooling:
  - Reverse SSH tunnel
  - LaunchAgent persistence (macOS)
  - Cron persistence (Linux)
  - Scheduled task persistence (Windows)
victims_and_sectors: Cursor IDE users who installed or auto-updated anthropic.claude-code extension during compromise window
regions:
  - Multiple regions
attribution_or_cluster: unknown
scale_and_metrics: Served Oct 29 2026 ~5:27 AM-4:35 PM ET via Cursor marketplace; exact victim count unknown
prevention_angle: Monitor extension integrity; review SSH authorized_keys; detect outbound SSH tunnels to suspicious IPs; scan for LaunchAgent/cron/@reboot persistence; review scheduled tasks; monitor environment variable access patterns
related_magicsword_projects: []
source_notes: |
  Relevant detection rules:
