ai_role_detail: "The attacker selected and decrypted customer AI provider keys. Railway, citing Wiz, also describes the intrusion itself as a contest against abliterated models and an ARTEX-like harness. That operator-side claim is vendor-asserted."
technique_summary: "Railway (Jacob Cooper, Angelo Saraceno, Sarah Bedell, Luca Casonato; report published Nov 10, 2026) says the attacker's first signups began on October 18, when dummy accounts were created. At 07:28 UTC on October 20 a previously unknown bug in the multi-tenant build infrastructure gave a partial filesystem escape and a build-server credential. Railway's internal Temporal cluster trusted that credential. The attacker read stored histories of 353 builds between 13:50 and 15:30 UTC on October 20, including sealed build variables, and pulled a snapshot of Railway's internal monorepo. Railway says the source let the attacker run agent fanouts, find exploits, and move laterally. At 03:26 UTC on October 21 a misconfigured OIDC binding in a cloud environment exposed a short-lived cloud credential, which led to an SSH key and a long-lived credential on an orchestration machine. Between 04:42 and 05:14 UTC, and again between 06:36 and 07:15 UTC, the attacker queried the envelope-encrypted variables database with regexes for AI provider key names, focusing on customers with many variables, and decrypted them through KMS. At most 1.85 percent (about 100,000) of workspaces were affected. Linked-account tokens, BYOK agent keys and GitHub OAuth tokens, were exposed for 1,852 users. Railway reset those tokens. Unauthorized spend on the stolen keys was estimated at about 740,000 dollars. Starting at 09:25 UTC on October 21, Railway asked GitHub, GitLab, Anthropic, OpenAI, OpenRouter, SpaceXSI, Google, and Stripe to revoke keys. Railway reads the downstream use as credentials sold through AI-access relay services for distillation, seen in coding-agent traffic, agent-behaviour reviews used as training data, and checks of training tasks and their scoring. Railway links the incident to the wider Black October series (Fireworks, OpenCode, Warp, and others) without saying they are the same operator. The agent and ARTEX-like harness detail is attributed to Wiz. No attacker IPs or file hashes were published. ARTEX reference https://github.com/RuoJi6/ARTEX."
initial_access: "Previously unknown bug in Railway multi-tenant build infrastructure, partial filesystem escape, build-server credential"
ai_tooling_and_models:
  - "Customer AI provider keys (Anthropic, OpenAI, OpenRouter, and others Railway asked to revoke)"
  - "ARTEX-like harness described by Wiz (https://github.com/RuoJi6/ARTEX)"
other_tooling:
  - "Temporal client access with a build credential"
  - "Misconfigured OIDC binding"
  - "KMS decrypt of envelope-encrypted variables"
victims_and_sectors: "Railway customers, at most 1.85 percent of workspaces; 1,852 users with linked BYOK agent keys or GitHub OAuth tokens"
regions:
  - Multiple regions
attribution_or_cluster: "Unnamed. Financial motivation (resale of AI key access). Railway links the case to Black October but does not say it is the same operator as Fireworks, OpenCode, or Warp."
scale_and_metrics: "About 100,000 workspaces (1.85 percent). 1,852 users' linked tokens. About 740,000 dollars of unauthorized model spend. 353 build histories read."
prevention_angle: "Treat build credentials as production credentials. Do not let a build identity read Temporal histories or the variables database. Audit OIDC bindings. Alert on regex queries of variable names followed by KMS decrypt bursts. Prefer short-lived customer tokens and provider-side revocation."
related_magicsword_projects: []
source_notes: "Times, counts, the 740,000 dollar estimate, the provider list, and the Wiz attribution of the harness are from Railway's Nov 10 incident report. No IPs or hashes were published. Link gtig-llmjacking-unc6993-2026-11 (Fireworks), keyhunter-llm-key-theft-2026-11 (Railway named only as a scanned PaaS), and wiz-ai-driven-cloud-2026-10."
