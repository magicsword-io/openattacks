detections:
  - name: Railway build-escape and KMS decrypt hunting
    format: guidance
    notes: "No indexed Sigma, Splunk, or Elastic rule matches Railway's private Temporal client, the build-isolation escape, or application-database KMS decrypts of customer variables. AWS rules for PutKeyPolicy, key deletion, or Kubernetes AssumeRoleWithWebIdentity describe different events and are not cited. On a platform like Railway, alert on a build identity reading job histories, on regex scans of variable names, and on decrypt bursts between new credentials and AI-provider key prefixes."
