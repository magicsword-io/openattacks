ai_role_detail: "Shadowserver fingerprinted honeypot traffic as coming from hosts running agentic attack frameworks, and a smaller set of those addresses probed AI, LLM, and automation services."
technique_summary: "The Shadowserver Foundation (25 November 2026) now scans daily for 15 exposed agentic attack frameworks: AntiFox, ARTEX Gateway, BugTraceAI, Cairn, CyberStrikeAI, Decepticon, Luanniao (LuaN1ao) Penetration Agent, PentAGI, PentestCode, PentestGPT, RedAmon, ScopeWeaver, Strix, T3MP3ST Dashboard, and Xalgorix. AntiFox and ScopeWeaver are derived from ARTEX. Shadowserver says not every framework is malicious. Some are built for authorized testing, and the scans find exposed instances rather than proving each one is in an intrusion. On 23 November the scans saw about 4,200 exposed instances, up from just under 3,700 the day before. Over that week the count dipped from a peak of 3,850 on 17 November and then rose. On 23 November PentestCode tripled to more than 600 and the week's peak passed 4,300. Nearly half of the instances were in Asia, more than a third in North America, and most of the rest in Europe. ARTEX was about 70 percent of exposed instances on most days. CyberStrikeAI was about 500 and PentestCode about 600. PentAGI, shown on the dashboard as VXControl, fell from more than 400 on 17 November to below 200. AntiFox grew fastest, from a handful to about 200, and by 22 November ARTEX and AntiFox were three-quarters of instances. The other seven frameworks together were fewer than 100. From 9 to 23 November, more than 80 addresses fingerprinted as running these frameworks generated more than 10,000 events on Shadowserver's honeypots. A handful of addresses produced most of the events. Nearly nine in ten of the addresses were fingerprinted as ARTEX Gateway. CyberStrikeAI, Cairn, PentAGI, and RedAmon made up the rest, with five or fewer addresses each. Two addresses ran PentAGI, and one of those was the busiest address observed. The addresses geolocated to more than 20 countries, with activity concentrated in the United States and Hong Kong. Shadowserver says almost all of them were on cloud networks, so that concentration is hosting, not operator location. About six in ten tried to relay traffic. Payment, banking, and crypto services drew more than 40 percent of relay requests, though most of those came from two addresses. Other relay destinations included shops and SSH, MySQL, and CouchDB servers. A smaller number probed n8n, Dify, Flowise, and MLflow, LLM model-listing endpoints, agent and LLM-provider APIs, and Model Context Protocol endpoints. About one in ten looked for credentials, including .env files, sometimes through path traversal, Git metadata, and Jenkins logins with admin/admin. Two tried Telnet passwords. About one in ten sent exploit or injection payloads, most often for Metabase CVE-2023-38646, plus PHPUnit CVE-2017-9841, Cisco IOS XE CVE-2023-20198, and GeoServer CVE-2024-36401. A third of direct requests were general discovery. Most of the rest targeted VPN and virtualization platforms, web and business applications, or CI servers, and each of those categories was driven largely by one or two busy addresses. The most active addresses looked for VPN and remote-access gateways, VMware vSphere, Jenkins, Metabase, and GeoServer. Much of the traffic was automated. At peak, addresses sent dozens of requests in a minute. Most worked in short bursts, and nearly half spent less than an hour in total on the honeypots. A few were active in every hour of the day across several days. User agents were mostly browser-like, and many were spoofed. The rest were curl, python-requests, Go, and aiohttp. Exposure data is in the daily Device Identification report with device_type ai-attack-framework. The public dashboard has country statistics and no addresses. No addresses are on the public page."
initial_access: "Honeypot events were scans, relay attempts, credential probes, and exploit payloads against Shadowserver sensors. No victim intrusion is described."
