region_notes: "Nearly half of the exposed instances were in Asia, more than a third in North America, and most of the rest in Europe. Honeypot source addresses geolocated to more than 20 countries and concentrated in the United States and Hong Kong. Shadowserver says that concentration is cloud hosting, not where operators are. None of those places are recorded here as victim countries."
attribution_or_cluster: "Many unnamed operators. Shadowserver does not attribute the exposed instances or the honeypot traffic to a named actor."
scale_and_metrics: "About 4,200 exposed instances on 23 November 2026, and a weekly peak above 4,300 when PentestCode jumped. Honeypots from 9 to 23 November: more than 80 addresses and more than 10,000 events. Nearly nine in ten of those addresses were ARTEX Gateway. About six in ten tried to relay. About one in ten looked for credentials. About one in ten sent exploit payloads."
prevention_angle: "Shadowserver publishes the exposure data free in its daily Device Identification report, device_type ai-attack-framework, with the framework in device_vendor and device_model. Honeypot events use the same labels. The public dashboard has no addresses. Close exposed agent consoles. The honeypot traffic hunted .env files, Git metadata, default Jenkins logins, and the four CVEs named above. Shadowserver says a few addresses caused most of the events, so a block on one address does not describe the set."
related_magicsword_projects: []
source_notes: "Counts, framework names, and the honeypot breakdown are from the 25 November 2026 Shadowserver post. No addresses are published on that page, so none are listed here. AntiFox is included because the scan measured it as the fastest-growing exposed fork. The honeypot fingerprints Shadowserver names are ARTEX Gateway, CyberStrikeAI, Cairn, PentAGI, and RedAmon. RedAmon has no tool page here. Shadowserver says not every exposed instance is malicious, that a handful of addresses produced most honeypot events, and that the payment, banking, and crypto share of relay requests mostly came from two addresses. User-agent and timing details are from the same post."
