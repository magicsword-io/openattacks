detections:
  - name: Source Code Enumeration Detection by Keyword
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/web/webserver_generic/web_source_code_enumeration.yml
    notes: "Web server logs. A request containing .git/. Matches the Git metadata probes Shadowserver describes for about one in ten of the addresses. It does not cover .env files."
  - name: Web Server Discovery or Fuzzing Activity
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/reconnaissance_web_server_discovery_or_fuzzing_activity.toml
    notes: "Web access logs from nginx, Apache, Tomcat, IIS, or Traefik. A burst of GETs from one source that return 404 or 403, which the rule text associates with wordlist probes of paths such as .env and .git. Matches the discovery and credential-file hunting. It will also match benign scanners."
  - name: Cisco IOS XE Implant Access
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/web/cisco_ios_xe_implant_access.yml
    notes: "Web logs. A POST to /webui/logoutconfirm.html?logon_hash=*, which Splunk ties to implant access after CVE-2023-20198. Shadowserver says some addresses sent exploits for that CVE. This rule is the implant path, not every exploit request."
  - name: No public rule for the other named exploits or the relay traffic
    format: guidance
    notes: "security-detections-mcp searches on 26 November 2026, and a search of the indexed Sigma, Splunk, and Elastic repositories, found no rule that names Metabase CVE-2023-38646, PHPUnit CVE-2017-9841, or GeoServer CVE-2024-36401. No rule encodes Jenkins admin/admin, the relay destinations, or the framework fingerprints. A Sigma path-traversal rule matches a fixed set of ../etc and similar strings, not the .env requests Shadowserver describes, so it is not cited. Shadowserver publishes no addresses on the public page."
