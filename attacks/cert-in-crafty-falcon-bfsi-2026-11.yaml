ai_role_detail: Financially motivated threat actors chaining public agentic offensive
  AI frameworks (ARTEX, PentAGI, Cairn, CyberStrikeAI) with on-the-fly AI script generation
  for intrusion automation against Indian BFSI sector
technique_summary: "CERT-In Advisory CIAD-2026-0058 (Nov 4, 2026) warns of CRAFTY
  FALCON campaign targeting Indian non-banking financial companies (NBFCs), fintechs,
  payment aggregators, and cryptocurrency exchanges. Attackers chain multiple open-source
  agentic offensive AI frameworks: ARTEX (autonomous penetration testing), PentAGI
  (multi-agent security testing), Cairn (AI-driven web exploitation), and CyberStrikeAI
  (LLM-powered C2). Campaign features cloud/AWS Lambda pivots for staging-to-production
  access, AI-driven app reverse-engineering to invoke payment and merchant-settlement
  APIs from allow-listed infrastructure, Rs. 1 test transfers followed by large mule
  payouts, cryptocurrency wallet-key theft, comprehensive log deletion, and deliberate
  retargeting during festive windows when transaction volumes are high and security
  teams are reduced. CERT-In notes campaign exploits trust in cloud infrastructure
  and leverages AI agent autonomy to accelerate intrusion timelines from weeks to
  hours. On 20 November 2026, CERT-In advisory CIAD-2026-0062 widened the unauthorized-payment
  activity beyond banking, financial services, and insurance. Technology service providers that
  run government-linked payment workflows, and platforms that pay vendors or partners, were also
  affected. Attackers altered business records or approval relationships that determine payments,
  then the normal payment process paid out. The advisory says a transaction can pass ordinary
  approval checks when the records behind it were changed. Separate threat hunting found AI-driven
  agentic offensive frameworks used against enterprises, technology and other service providers,
  government organisations, and academic and research institutions. The advisory does not publish
  indicators and does not name additional frameworks. MediaNama (23 November 2026) quotes CERT-In
  Director General Sanjay Bahl that the frameworks were not only misused but also rebranded, with
  deployments on infrastructure in multiple countries. That rebranding statement is Bahl's comment
  to MediaNama, not a sentence in the advisory."
initial_access: Cloud service exploitation, exposed APIs, compromised AWS Lambda functions,
  credential stuffing against fintech portals
ai_tooling_and_models:
  - ARTEX (https://github.com/RuoJi6/ARTEX)
  - PentAGI (https://github.com/vxcontrol/pentagi)
  - CyberStrikeAI (https://github.com/Ed1s0nZ/CyberStrikeAI, https://github.com/aipentest/cyberstrikeai)
  - Cairn (AI web exploitation harness)
  - On-the-fly AI script generation
frameworks:
  - artex
  - cairn
  - cyberstrikeai
  - pentagi
other_tooling:
  - AWS Lambda for staging-to-production pivots
  - Custom payment API invocation scripts
  - Log deletion tools
victims_and_sectors: Indian non-banking financial companies (NBFCs), fintechs, payment
  aggregators, and cryptocurrency exchanges, with festive-season targeting. CIAD-2026-0062
  also names technology service providers that run government-linked payment workflows,
  platforms that pay vendors or partners, and, for the agentic-framework hunting, enterprises,
  technology and other service providers, government organisations, and academic and research
  institutions.
regions:
  - India
attribution_or_cluster: "CERT-In: CRAFTY FALCON financially motivated campaign; Indian
  press notes Chinese-linked offensive AI frameworks; no confirmed state nexus in
  CERT-In advisory"
scale_and_metrics: Active since at least Oct 2026; Rs. 1 test transfers followed by
  large payouts; multiple NBFCs and fintechs compromised; festive-window retargeting
  pattern
prevention_angle: Monitor for agentic AI framework execution patterns (ARTEX, PentAGI,
  Cairn, CyberStrikeAI); implement API rate limiting and anomaly detection; enforce
  least-privilege for Lambda and cloud functions; enable comprehensive CloudTrail
  and application logging with tamper protection; segregate staging from production
  environments; implement transaction velocity checks and behavioral analytics; strengthen
  multi-factor authentication; monitor for unusual payment API invocations from non-standard
  infrastructure; review allow-lists for payment endpoints. For CIAD-2026-0062, identify
  provider accounts that can change payment records or approvals and restrict them; reconcile
  provider-held records against an independent source the same environment cannot change;
  require independent verification for beneficiary, instruction, and approval changes; separate
  client environments at technology and payout providers; alert on unusual sequences of record
  change, approval, and payout even when each step uses an authorised account; report applicable
  incidents to CERT-In within six hours and unauthorised payments through the National Cyber
  Crime Reporting Portal or helpline 1930
related_magicsword_projects: []
source_notes: CERT-In Advisory CIAD-2026-0058 (Nov 4, 2026) is the CRAFTY FALCON warning.
  CIAD-2026-0062 (Nov 20, 2026) widens the payment activity and reports agentic offensive
  frameworks in other sectors. It publishes no indicators. The word rebranded is Sanjay Bahl's
  comment to MediaNama on 23 November 2026, not advisory text. Indian Express coverage is of
  the 4 November advisory. No new framework is added from the 20 November advisory because it
  does not name one.
