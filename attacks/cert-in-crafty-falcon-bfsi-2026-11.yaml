detections:
  - name: AWS Lambda Event Source Mapping Creation
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/persistence_lambda_event_source_mapping_created.toml
    notes: Detects Lambda event source mapping creation; relevant for detecting Lambda-based
      persistence in CRAFTY FALCON cloud pivots
  - name: AWS New Lambda Layer Attached
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_new_lambda_layer_attached.yml
    notes: Detects Lambda layer attachment; applicable to CRAFTY FALCON staging-to-production
      pivots via Lambda
  - name: Agentic AI framework detection
    format: guidance
    notes: Monitor for ARTEX, PentAGI, Cairn, CyberStrikeAI process execution (Python
      agent frameworks); alert on autonomous API enumeration patterns; detect rapid
      payment API invocations from non-standard infrastructure; flag Rs. 1 test transfers
      followed by large transactions; monitor CloudTrail for Lambda configuration changes
      and log deletion attempts
  - name: Business-record tampering before a legitimate payout
    format: guidance
    notes: "security-detections-mcp searches for beneficiary, business record, and payment
      returned no Sigma, Splunk, or Elastic rule for changing a business record or an approval
      relationship and then letting the normal payment process pay out. Payment hits were a
      GitHub payment-method removal, billing-themed phishing mail, and unrelated prompt-filter
      events. CIAD-2026-0062 publishes no indicators. Compare record changes, approvals, and
      payouts as a sequence, including steps that each look authorised."
