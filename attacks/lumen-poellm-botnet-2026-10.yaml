borderline: false
borderline_note: null
ai_role: ai_agent_or_mcp_as_target
ai_role_secondary: ai_infra_as_c2
ai_role_detail: "Malware targets exposed AI/LLM services (LiteLLM, Ollama) for cryptocurrency mining; uses GitHub-hosted poem to derive C2 address; turns victims into scanners"
technique_summary: "PoeLLM malware exploits vulnerable internet-facing AI/LLM deployments (LiteLLM, Ollama, Gotenberg, Gitea, possibly Ivanti Sentry CVE-2026-10520). Derives C2 from keywords in poem 'On the Nature of Connection' hosted in GitHub repo ejejejdfbbebe/nodejs.org fork (dash.css file). Malware parses poem to extract 4 words/phrases via pattern matching ('In the silent hum of X,', 'each pulse of X threading', 'Beyond the wall of X,', 'the X servers'), converts words to numbers via hardcoded dictionary, combines to form IPv4 C2 address. Deploys XMRig and Iron crypto miners connecting to Kryptex (5.180.174.162). Converts victims into HTTP/S scanners and exploit servers for expansion. Poem updated 11 times since Apr 13, 2026 to rotate C2. Italian-speaking actor. 3,400+ victims, peak 800 active/day, predominantly US/Western Europe."
initial_access: "Exploitation of publicly exposed vulnerable services: LiteLLM, Ollama, Gotenberg, Gitea, possibly Ivanti Sentry CVE-2026-10520; first activity April 2026"
ai_tooling_and_models:
  - LiteLLM
  - Ollama
other_tooling:
  - PoeLLM malware (libgcrypt)
  - XMRig crypto miner
  - Iron crypto miner
  - Kryptex mining service
  - GitHub for C2 poem hosting
  - Gotenberg (PDF converter)
  - Gitea (software development toolkit)
  - Ivanti Sentry (possibly CVE-2026-10520)
victims_and_sectors: "3,400+ victim servers; enterprise AI infrastructure; development toolkits; predominantly US and Western Europe; peak activity 800 active servers per day"
regions:
  - United States
  - Europe
attribution_or_cluster: "Canto Incognito campaign; Italian-speaking threat actor (assessment); financially motivated cryptocurrency mining operation"
scale_and_metrics: "Active since April 2026; 3,400+ impacted servers; peak ~2,200 affected servers mid-June, ~800 active per day; first C2 commit Apr 13, 2026; poem updated 11 times; broader scanning/exploitation began May 2026; recent traffic suggests distributed brute-force experiments"
prevention_angle: "Do not expose AI/LLM services to internet (Gotenberg guidance explicit); vulnerability patching for LiteLLM/Ollama/Gitea/Ivanti Sentry; monitor for crypto mining (Kryptex 5.180.174.162); GitHub repository monitoring; C2 poem pattern detection; HTTP scanning from AI servers; GPU utilization anomalies"
related_magicsword_projects: []
source_notes: "Black Lotus Labs discovered via Ivanti Sentry CVE-2026-10520 investigation; disrupted campaign, blocked C2 traffic; Lumen Defender customers protected; malware includes remote shell, miners, HTTP/S scanning, exploit deployment; Gotenberg installation guide warns not to expose to internet"
