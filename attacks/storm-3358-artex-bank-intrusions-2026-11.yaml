ai_role_detail: "Storm-3358 deploys ARTEX autonomous AI agents to automate intrusion lifecycle against Southeast Asian financial institutions, from initial reconnaissance through lateral movement and RAT deployment"
technique_summary: "Microsoft Threat Intelligence (Nov 6, 2026) reports Storm-3358, Cambodia-based financially motivated actor, targeting Southeast Asian financial sector using ARTEX autonomous offensive agents. Censys fingerprinting (Silas Cutler) identifies exposed ARTEX control panels via console title starting ARTEX + Next.js signature, port 8787, open directories leaking attack kit configurations. Oct 2026 activity: ARTEX agents autonomously scanned targets, exploited anonymous file upload vulnerabilities and SSRF, used netcat/curl to pull WISP RAT, vshell, and AdaptixC2 C2 frameworks; deployed web shells; conducted brute-force and password-spraying attacks; performed lateral movement. C2 infrastructure: WISP C2 199.19.95.66-68, AdaptixC2 85.11.167.52. ARTEX control panel servers: 91.92.240.238, 85.11.168.45, 31.77.229.35, 178.16.54.129 (Microsoft post hunting query lists 178.15.54.129 - note IP discrepancy). Storm-3358 attributed by Microsoft; vendor-asserted AI involvement. Tools: AdaptixC2 (github.com/Adaptix-Framework/AdaptixC2), ARTEX fork (github.com/RuoJi6/ARTEX; original Autumn-27/ARTEX repository down)."
initial_access: "Anonymous file upload exploitation, SSRF vulnerabilities"
ai_tooling_and_models:
  - ARTEX autonomous offensive agent (https://github.com/RuoJi6/ARTEX)
  - DeepSeek and other LLM backends
frameworks:
  - artex
other_tooling:
  - WISP RAT
  - vshell
  - AdaptixC2 C2 framework (https://github.com/Adaptix-Framework/AdaptixC2)
  - netcat
  - curl
  - Web shells
victims_and_sectors: "Southeast Asian financial institutions; Oct 2026 active campaign"
regions:
  - Asia
attribution_or_cluster: "Storm-3358, Cambodia-based, financially motivated; attributed by Microsoft Threat Intelligence"
scale_and_metrics: "Active Oct 2026; multiple financial institutions compromised; Censys identified exposed ARTEX panels on port 8787 with leaked attack kit configurations"
prevention_angle: "Implement file upload restrictions and validation; patch SSRF vulnerabilities; monitor for ARTEX console fingerprints (title ARTEX + Next.js, port 8787); block known C2 IPs (199.19.95.66-68, 85.11.167.52, 91.92.240.238, 85.11.168.45, 31.77.229.35); detect anomalous autonomous scanning patterns; monitor netcat/curl downloading RATs; implement web application firewalls; enable brute-force protection; segment networks to limit lateral movement"
related_magicsword_projects: []
source_notes: "Microsoft Threat Intelligence blog (Nov 6, 2026) primary source; Censys Agentic Asbestos analysis (Silas Cutler) provides ARTEX fingerprinting methodology; all IOCs verified from sources; note IP discrepancy between main text (178.16.54.129) and hunting query (178.15.54.129) in Microsoft post. FBI FLASH-20261113-001, citing that Microsoft post, lists WISP C2 199.19.95.66-68, ARTEX servers 91.92.240.238, 85.11.168.45, 178.16.54.129, and 31.77.229.35, and C2 85.11.167.52 as active as of 6 November 2026. The FLASH table does not include 178.15.54.129. The same published addresses appear in the FLASH CSV. The FLASH asks defenders to hunt web shells, BLOODALCHEMY components, and the open-source RATs WISP, vshell, and AdaptixC2. It describes BLOODALCHEMY as ARTEX-related C2 in the general TTP section. It does not say Microsoft found BLOODALCHEMY on these bank intrusions. A security-detections-mcp search for BLOODALCHEMY returned no Sigma, Splunk, or Elastic rule."
