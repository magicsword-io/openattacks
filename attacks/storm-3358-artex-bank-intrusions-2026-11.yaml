detections:
  - name: Linux Webshell Indicators
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_webshell_detection.yml"
    notes: "Detects webshell process indicators on Linux; directly applicable to Storm-3358 web shell deployment"
  - name: Suspicious Reverse Shell Command Line
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/builtin/lnx_shell_susp_rev_shells.yml"
    notes: "Detects netcat reverse shells and RAT download patterns used by ARTEX agents"
  - name: Suspicious C2 Activities
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/lnx_auditd_susp_c2_commands.yml"
    notes: "Detects curl/wget downloading payloads and C2 command execution patterns"
  - name: ARTEX console fingerprinting
    format: guidance
    notes: "Monitor for ARTEX control panel fingerprints: console title starting with ARTEX, Next.js framework signature, port 8787; scan for open directories exposing attack kit configurations; block known ARTEX IPs (91.92.240.238, 85.11.168.45, 31.77.229.35, 178.16.54.129); detect autonomous scanning patterns"
  - name: Password spraying and brute force
    format: guidance
    notes: "Block known C2 IPs: WISP RAT 199.19.95.66-68, AdaptixC2 85.11.167.52; detect anomalous brute-force and password-spraying patterns; monitor lateral movement indicators"
  - name: FBI FLASH hunt for WISP, vshell, AdaptixC2, and BLOODALCHEMY
    format: guidance
    notes: "security-detections-mcp search for BLOODALCHEMY returned no Sigma, Splunk, or Elastic rule. FLASH-20261113-001 tells recipients to hunt web shells, BLOODALCHEMY components, and the RATs WISP, vshell, and AdaptixC2. Microsoft had already tied WISP, vshell, and AdaptixC2 to this campaign. The FLASH does not say BLOODALCHEMY was observed on these intrusions. Citing Microsoft, the FLASH lists 199.19.95.66-68, 91.92.240.238, 85.11.168.45, 178.16.54.129, 31.77.229.35, and 85.11.167.52 as active as of 6 November 2026."
