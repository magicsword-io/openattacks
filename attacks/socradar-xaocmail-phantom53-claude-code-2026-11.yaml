attack_flow:
  nodes:
    - id: phish
      title: XaocMail sends the lure
      description: "A self-hosted panel writes a per-victim landing page to Cloudflare KV and emails a workers.dev link."
      kind: access
      source_urls: &a1
        - https://socradar.io/blog/xaocmail-clickfix-phantom53-havox-america-asia-europe/
    - id: clickfix
      title: ClickFix runs the MSI
      description: "The page asks the user to run msiexec /i against /m?id=, or an older mshta or PowerShell path."
      kind: execution
      source_urls: *a1
    - id: beacon
      title: pythonw beacon over DoH
      description: "Python 3.11 in AppData runs cv2.pyd every 12 minutes and a watcher every 3 minutes. Commands return inside DNS AAAA answers."
      kind: execution
      source_urls: *a1
    - id: claude
      title: Claude Code built the implant
      description: "The operator tree has .claude/settings.json, 143 numbered task files, a 117 KB arch.md, and a Russian authorized-red-team test prompt."
      kind: ai
      source_urls: *a1
    - id: havoc
      title: HavoX in memory and AI-secret theft
      description: "CMD_WAKE loads the Havoc Demon reflectively. Aliases include Level RMM and a stealer for Claude Code, Codex, Gemini CLI, Cursor, and Windsurf."
      kind: impact
      source_urls: *a1
    - id: grab
      title: Four scripts read AI sessions
      description: "On 145.63.138[.]67, prec_ai.ps1, prec_ai2.ps1, prec_ai3.ps1, and ai_grab.ps1 read Claude, Codex, and Gemini credential and session files from 603 hosts. The same server queued Level and ScreenConnect."
      kind: impact
      source_urls:
        - https://hunt.io/blog/us-bank-irs-ssa-logins-stolen-russian-speaking-operator
  edges:
    - source: phish
      target: clickfix
    - source: clickfix
      target: beacon
    - source: beacon
      target: havoc
    - source: beacon
      target: grab
    - source: claude
      target: beacon
