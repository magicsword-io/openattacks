ai_role_detail: "SOCRadar found Claude Code project files, 143 numbered task markdown files, a 117 KB architecture note, and a Russian prompt that frames implant testing as an authorized red-team job. The secondary role is credential theft from AI tools. Hunt.io found four PowerShell scripts on the same server reading Claude, Codex, and Gemini credential and session files from 603 hosts."
technique_summary: "SOCRadar Threat Research Unit (published Nov 13, 2026) describes a Russian-speaking operator chaining XaocMail, Phantom53, and HavoX (Havoc Demon). Preparation began in October 2025. Phishing tests and framework development continued in early 2026. The operation launched in August 2026 and was still active at publication. XaocMail, on 185.224.132.148:8585, builds per-victim document-sharing lures (Google Docs, Adobe Acrobat, Office365, SecuredDocs) and stores landing JSON in Cloudflare KV. Emails point at hxxps://securedoc.[subdomain].workers.dev/?id={linkId}. The ClickFix page offers three Win+R paths: a PowerShell DownloadString cradle, mshta against /h?id=X (an earlier ZIP of GUP.exe sideloading libcurl.dll), and msiexec /i .../m?id=X /qn, which SOCRadar calls the active path. The MSI impersonates names such as Visual Studio Tools, Python, or Node.js and drops Python 3.11 under a random directory in AppData or LocalAppData. A pythonw scheduled task runs the beacon every 12 minutes. A second task runs the watcher every 3 minutes. The beacon is a .pyd named like a real package (cv2.pyd, with PyInit_cv2, and the same pattern for numpy, PIL, and lxml). It beacons over DNS-over-HTTPS to Cloudflare, Google, and ControlD, encoding commands in AAAA records, with UDP/53 as a fallback, and a week-keyed SHA256 DGA on .xyz. CMD_WAKE writes an IPC file so the watcher reflectively loads an AES-GCM HavoX blob in memory. If the MSI is not elevated it can show a UAC prompt for a product-named task, and a separate payload uses fodhelper.exe registry hijacking. Payload aliases include a Level RMM drop from downloads.level.io and an AI-secret stealer covering Claude Code, Codex, Gemini CLI, Cursor, Windsurf, and other AI tools, plus password-manager, browser, SSH, git, wallet, and messaging collection. SOCRadar's AI evidence is on the operator side: .claude/settings.json, 143 numbered NNN-task-name.md files across adminka (25), implant_v3 (31), and implant_v4 (87), a 117 KB implant_v4/arch.md, and implant_v4/.tasks/prompts/noav-beacon-test.md, a Russian prompt for a claudeg5f-tmux Claude wrapper that tells the agent to install a test MSI on a VM named NoAV under an authorized red-team framing. HavoX's login panel and an exfiltration path are on 145.63.138.67. Almost a thousand personalized pages were identified. Named target countries are Brazil, Peru, India, Indonesia, and Spain, across technology, finance, education, government, logistics, and manufacturing. SOCRadar did not confirm attacker intent beyond the footholds. Hunt.io (18 November 2026) found the same server, 145.63.138[.]67, running four PowerShell scripts, prec_ai.ps1, prec_ai2.ps1, prec_ai3.ps1, and ai_grab.ps1, that steal Claude, Codex, and Gemini credentials and sessions. Hunt.io counts 603 implants, 469 hostnames, and activity from 12 October to 8 November 2026. The operator login in hv.log is 188.137.236[.]209. The same server enrolled hosts in ConnectWise ScreenConnect through sc_api.py and queued a Level MSI from downloads.level.io through add_rmm1.py. LOLRMM tracks both tools. Stolen sessions include US bank, ID.me, Login.gov, IRS, and SSA logins. Hunt.io does not report a breach of those institutions. The schema has one category, so this stays adversary use of AI. The AI-tool credential theft is the secondary role."
