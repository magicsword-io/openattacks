attribution_or_cluster: "Unnamed Russian-speaking operator. SOCRadar does not name a country or a tracked cluster. Hunt.io's operator login is 188.137.236[.]209."
scale_and_metrics: "Almost a thousand personalized XaocMail pages. 143 Claude Code task files. implant_v4/arch.md is 117 KB. Hunt.io counts 603 implants and 469 hostnames on 145.63.138[.]67 from 12 October to 8 November 2026, and at least 57 hosts with a US bank or government login."
prevention_angle: "Block ClickFix paste-and-run. Alert when explorer.exe starts msiexec.exe with a workers.dev URL, when mshta.exe fetches an HTTP URL, and when pythonw.exe runs a .pyw from AppData and loads a .pyd outside a normal Python install. Hunt scheduled tasks named like MicrosoftEdgeUpdateTask, OneDriveSyncTask, WindowsDefenderScheduledScan, OfficeBackgroundTaskHandler, or AdobeAcrobatUpdateTask with a short random suffix. Treat DoH from pythonw.exe to 1.1.1.1, 8.8.8.8, or 76.76.2.11 as suspicious when paired with those tasks."
