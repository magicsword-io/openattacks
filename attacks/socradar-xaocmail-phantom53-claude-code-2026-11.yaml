detections:
  - name: Suspicious Msiexec Quiet Install From Remote Location
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_msiexec_install_remote.yml"
    notes: "Windows process creation. msiexec /i against a remote URL with a quiet flag. Matches the active ClickFix path msiexec /i .../m?id= /qn."
  - name: Windows MSIExec Remote Download
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_msiexec_remote_download.yml"
    notes: "Windows endpoint. msiexec retrieving a remote package. Same active delivery path."
  - name: Remotely Hosted HTA File Executed Via Mshta.EXE
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mshta_http.yml"
    notes: "Windows process creation. mshta.exe with an http URL. Matches the earlier /h?id= path that fetched GUP.exe and libcurl.dll."
  - name: Potential DLL Sideloading Of Libcurl.DLL Via GUP.EXE
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/image_load/image_load_side_load_gup_libcurl.yml"
    notes: "Windows image load. GUP.exe loading libcurl.dll. SOCRadar assigns this to the previous HTA ZIP, not the current MSI."
  - name: Suspicious Execution of Powershell with Base64
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_encode.yml"
    notes: "Windows process creation. Encoded PowerShell. Phantom53 CMD_EXEC runs powershell -EncodedCommand."
  - name: Bypass UAC via Fodhelper.exe
    format: sigma
    url: "https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_uac_bypass_fodhelper.yml"
    notes: "Windows process creation. fodhelper.exe UAC bypass, which SOCRadar lists as a payload alias."
  - name: Local Scheduled Task Creation
    format: elastic
    url: "https://github.com/elastic/detection-rules/blob/main/rules/windows/persistence_local_scheduled_task_creation.toml"
    notes: "Windows. New scheduled task. The MSI registers beacon and watcher tasks. Elevated installs use COM ITaskFolder::RegisterTask and do not spawn schtasks.exe."
  - name: Windows Scheduled Task Created Via XML
    format: splunk
    url: "https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_scheduled_task_created_via_xml.yml"
    notes: "Windows. Task registration from XML. SOCRadar says the non-elevated path writes p53_task_a.xml and p53_task_b.xml."
  - name: Windows Level RMM Watchdog Task Created
    format: splunk
    url: https://github.com/splunk/security_content/blob/develop/detections/endpoint/windows_level_rmm_watchdog_task_created.yml
    notes: "Selected from a security-detections-mcp search for remote monitoring management. Event 4698 for the task \\Level\\Level Watchdog, which a Level install creates. Hunt.io queued a Level MSI from downloads.level.io. The companion Splunk rule Windows Level RMM PowerShell Script Installer requires install_windows.ps1 or LEVEL_API_KEY in a script block, which this MSI alias does not show, so that rule is not cited."
  - name: RMM Software Installation from an Internet-Originated MSI
    format: elastic
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/command_and_control_rmm_software_installation_from_internet_originated_msi.toml
    notes: "Selected from the same search. It follows an internet-originated MSI to an RMM process and includes level.exe. Hunt.io's path is an MSI from downloads.level.io. The rule also names many other RMM products."
  - name: Remote Access Tool - ScreenConnect Remote Command Execution
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_remote_access_tools_screenconnect_remote_execution.yml
    notes: "Selected from a security-detections-mcp search for ScreenConnect. It matches ScreenConnect.ClientService.exe spawning a command. Hunt.io shows API enrollment through x.screenconnect.com, not this child process, so treat it as the later session rather than the enrollment. The ScreenConnect installation CLI rule requires e=Access& and y=Guest& and is not cited."
  - name: Potential Browser Data Stealing
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_copy_browser_data.yml
    notes: "Selected from a security-detections-mcp search for browser profile copy. It requires a copy or xcopy of a browser user-data path. Hunt.io's w_grab.ps1 copies Chrome, Edge, and Firefox profiles. It does not match the AI credential paths."
  - name: pythonw, DoH, and the AI session files have no matching rule
    format: guidance
    notes: "security-detections-mcp searches for pythonw.exe and for the AI credential paths returned no Sigma, Splunk, or Elastic rule that names pythonw.exe launching a .pyw file, DoH to 1.1.1.1, 8.8.8.8, or 76.76.2.11, or .claude/.credentials.json, .codex/auth.json, and .gemini/oauth_creds.json. The schtasks.exe creation rule is not cited because the elevated path does not spawn schtasks.exe. Also hunt 145.63.138.67, 185.224.132.148, and the operator login 188.137.236.209."
