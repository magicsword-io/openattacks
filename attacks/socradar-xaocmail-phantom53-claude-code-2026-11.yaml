source_notes: "Chain, timings, Claude Code artifacts, and the original IOCs are from the SOCRadar article. Operator mailbox addresses in that IOC table are omitted. Victim names and stolen-file contents are not included. The article lists additional MSI and payload hashes beyond the set below. Havoc is the public framework; HavoX is SOCRadar's name for this operator's Demon build. The 18 November Hunt.io article is the source for the four AI scripts, the 603-host count, the operator login 188.137.236[.]209, ScreenConnect, the Level MSI, and the extra infrastructure addresses. Account names and credential contents in that article are omitted. Level and ScreenConnect are linked from LOLRMM."
last_reviewed: 2026-11-23
region_notes: "Brazil, Peru, India, Indonesia, and Spain are the countries SOCRadar names. Hunt.io infers United States victims from stolen bank and federal-identity accounts. Callback geography is behind Cloudflare. Operator language and the login address are not victim regions."
