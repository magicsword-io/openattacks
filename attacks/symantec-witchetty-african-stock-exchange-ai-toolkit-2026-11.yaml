detections:
  - name: Suspicious Process By Web Server Process
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_webshell_susp_process_spawned_from_webserver.yml
    notes: "Windows process creation. A web-server parent, including w3wp.exe, spawning PowerShell or another listed child. Matches the 41 modules running under the IIS worker. It does not identify the module contents or the AI-authorship scaffold."
  - name: DNS Query to External Service Interaction Domains
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/network/dns/net_dns_external_service_interaction_domains.yml
    notes: "DNS queries whose name ends in a listed out-of-band domain, including .oast.pro, which the rule labels as ProjectDiscovery interactsh. Symantec's modules resolved names under danoam334iqjo0ap2scg6ofosjxfgqhsa.oast.pro. The rule needs DNS query logs. It does not require the PowerShell [Net.Dns]::GetHostAddresses call, and a lookup that never reaches a resolver will not match."
  - name: Findstr GPP Passwords
    format: sigma
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_findstr_gpp_passwords.yml
    notes: "Windows process creation for find.exe or findstr.exe with cpassword, \\sysvol\\, and .xml on the command line. Symantec's gpp1 module searched SYSVOL for cpassword, but it was PowerShell, not findstr.exe. A PowerShell-only search does not match this rule. No reviewed rule names the 50-character [Net.Dns]::GetHostAddresses loop."
