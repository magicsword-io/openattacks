ai_role_detail: "Symantec says the 41 modules were AI-written or AI-assisted and does not identify a model. No single authorship signal is conclusive. The modules were launched under an existing webshell. Symantec does not describe an AI agent choosing the intrusion steps, so this entry does not add attacker_uses_ai_as_operator."
technique_summary: "Thibaut Passilly and Brigid O Gorman (Symantec Threat Hunter Team, Broadcom; SECURITY.COM, created 19 November 2026) describe a likely AI-written or AI-assisted PowerShell toolkit on a stock exchange in an unnamed African country. Forty-one modules ran under a webshell in the IIS worker process for 3 minutes 12 seconds on 20 September 2026, from 08:44 to 08:47 UTC, a new module every few seconds. Host and process modules (spid1, proc2, proc3, smbctx1, smbsc1) enumerated the machine, user, drives, SMB connections, and process trees via WMI. awslocal1 hunted AWS CLI config, environment variables, and Docker, Kubernetes, Terraform, Jenkins, and GitLab processes. iis1, iisa1, and iisp2 profiled IIS through the WebAdministration module. Secret scraping (cfg1, sites1, xpjs1, dep1, sysm1, sysh1, sysv2, gpp1, awsa1) searched web roots, C:\\Deployer, and SYSVOL for web.config, .xml, .json, and .env files, Group Policy cpassword values, AWS keys, and database connection strings. rdsnet1 opened TCP 5432 to an AWS RDS PostgreSQL instance. scq1 queried Microsoft SQL Server with integrated authentication. SharePoint and TFS modules (spf1, spl1, spd1, spd2, sps1, tfs1, tfs2) searched sites for the keywords aws, credential, and password and queried TFS project APIs. API modules (api1, api2, map1, dbg1, adm1, admt1, adm2, keys1, key4, xtok1, cscs1, ipo1) probed internal debug endpoints, attempted an admin login with hardcoded credentials to obtain JWTs, and queried profile and banking data. cas1 and wmi1 queried the SCCM AdminService and WMI class SMS_R_System for LastLogonUserName. Harvested x-api-key values and a bearer token were cycled against the exchange investment API and a securities depository gateway. Those requests connected by IP, set the Host header manually, disabled certificate validation, and sent a blank key as a control. cscs1 and ipo1 queried capital-markets endpoints, including one specific investor number that Symantec does not publish. Authorship signals, which Symantec says are not conclusive one by one, are an identical opening line setting ErrorActionPreference to SilentlyContinue, the same outer try/catch, the same hex encoding, the empty-output sentinel 454d505459 (the hex of EMPTY), a DNS exfiltration loop copied into all 41 modules, generic variable names, one module with a unique progress variable, and one deliberate invalid-credential test. Each module split hex output into 50-character chunks and resolved them with [Net.Dns]::GetHostAddresses as a name under the token danoam334iqjo0ap2scg6ofosjxfgqhsa.oast.pro. Symantec calls oast.pro a public out-of-band testing service. The collector was not visible. Symantec does not say whether any credential or key worked. Six persistence implants on the server are attributed to Witchetty (LookingFrog) with high confidence. ESET's April 2022 TA410 profile names LookingFrog as one of three TA410 sub-groups and does not use the name Witchetty. Symantec says one implant was first seen in 2020, that the implants were present on this server in April 2026, and that Symantec's September 2022 reporting had already described Witchetty hitting this same exchange with ProxyShell and ProxyLogon webshells. The toolkit itself is not attributed. Symantec leaves open Witchetty with new tooling, a second operator using the access, or an unrelated actor. No privilege escalation or data theft was seen. The earliest malicious activity Symantec dates on the server is April 2026, and Symantec says the attackers may have been present longer."
initial_access: "Unknown for the 2026 activity. The 41 modules ran under a webshell in the IIS worker process, which Symantec says suggests a vulnerability may have been exploited. Symantec does not name that vulnerability. The 2022 Witchetty access to this exchange used ProxyShell and ProxyLogon. This report does not say those bugs were used again in 2026."
ai_tooling_and_models:
  - "Unidentified model. Symantec assesses the 41 PowerShell modules as AI-written or AI-assisted."
other_tooling:
  - "PowerShell under an IIS webshell"
  - "Witchetty persistence implants on the same server, not attributed to the toolkit: Avast wsc_proxy hijack, ShellcodeLoader, svchost XOR loader for WindowsUpdate.xml, VSPerfCmd loader, Nim DLL impersonating VSPMsg.dll, mfeann.exe, setting.dat XOR loaders, Cobalt Strike beacons, Mimikatz"
victims_and_sectors: "One stock exchange in an unnamed African country. The toolkit ran on an IIS server and queried the exchange investment API, a securities depository gateway, SharePoint, TFS, SCCM, Microsoft SQL Server, and an AWS RDS PostgreSQL endpoint. Symantec does not name the exchange."
regions:
  - Africa
region_notes: "Symantec says the victim is a stock exchange in an African country and does not name the country. China, in the Witchetty attribution, is not a victim region. The 2022 activity against two Middle East governments is a different incident and is not given countries in this write-up."
attribution_or_cluster: "Toolkit unattributed. Six persistence implants on the same server are Witchetty (LookingFrog, a TA410 sub-group in ESET's 2022 profile) with high confidence from Symantec. Symantec does not attribute the PowerShell toolkit to Witchetty."
scale_and_metrics: "41 modules in 3 minutes 12 seconds on 20 September 2026, 08:44-08:47 UTC. Earliest malicious activity Symantec dates on the server is April 2026. Six persistence implants, one first seen in 2020. No privilege escalation or data theft observed. Whether any tested credential or key worked is unknown."
prevention_angle: "Alert when the IIS worker spawns PowerShell. Hunt DNS queries for oast.pro and for the published token. Hunt PowerShell that calls [Net.Dns]::GetHostAddresses in a loop, and searches of SYSVOL or web roots for cpassword, web.config, and cloud keys, from the IIS worker. The published file hashes are for the Witchetty implants and related files, not for the 41 modules, which Symantec does not hash. HijackLibs documents the Avast wsc.dll / wsc_proxy.exe pair and the McAfee LockDown.dll / mfeann.exe pair. A Witchetty implant on the host does not by itself identify the author of the PowerShell modules."
related_magicsword_projects:
  - HijackLibs
source_notes: "Module names, the 20 September 2026 window, authorship signals, the oast.pro token, the Witchetty split, and the file hashes are from the Symantec article at https://www.security.com/threat-intelligence/african-stock-exchange-ai-assisted-attack. The page's created timestamp is 19 November 2026 11:00 UTC. The blog-post URL serves the same article. Authors are printed as Thibaut Passilly and Brigid O Gorman. Symantec calls oast.pro a public out-of-band testing service and does not name ProjectDiscovery or interactsh in the article text reviewed here. The Sigma DNS rule cited below lists .oast.pro among ProjectDiscovery interactsh domains. ESET's 2022 post names LookingFrog as a TA410 sub-group and does not use the name Witchetty. HijackLibs lists Avast wsc.dll loaded by wsc_proxy.exe and McAfee LockDown.dll loaded by mfeann.exe. No HijackLibs page for VSPerfCmd.exe or VSPMsg.dll was found, and a guessed path for that pair returned HTTP 404, so that pair is not linked. PowerShell is not a LOLBAS entry. The hash list below is the named artifacts from Symantec's table that this entry describes, not every hash on the page. Hashes marked not available for analysis, and unnamed similar svchost loaders, are omitted. The domain is defanged. No victim IP addresses were published."
